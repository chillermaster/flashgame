<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>로웬 : 황혼의 가면</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140c1f;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;color:#f3e6cc}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
button:disabled{opacity:.38;cursor:default}
#app{position:relative;width:100%;max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(130% 70% at 50% 0%,#5a2f62 0%,#331a44 42%,#170c24 100%)}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 30% at 50% 100%,rgba(255,140,60,.18),transparent 70%)}
#top{position:relative;height:40px;flex:none;display:flex;align-items:center;gap:5px;padding:0 6px;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.15));border-bottom:1px solid rgba(242,196,107,.25);z-index:6}
#tTitle{font-weight:900;font-size:13.5px;color:#f2c46b;white-space:nowrap;letter-spacing:-.3px}
#tInfo{flex:1;font-size:11.5px;font-weight:700;color:#d9c7a8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:31px;height:29px;border:0;border-radius:9px;background:rgba(255,255,255,.1);font-size:14px}
#table{position:relative;flex:1;min-height:0}
#board{position:absolute;left:7%;right:7%;top:15%;bottom:9%;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#7a432c 0%,#55291b 52%,#311710 100%);box-shadow:0 0 0 6px #2a140c,0 0 0 8px rgba(242,196,107,.32),0 22px 60px rgba(0,0,0,.65),inset 0 0 50px rgba(0,0,0,.55)}
#board::after{content:'';position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(242,196,107,.22)}
.candle{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd27a;box-shadow:0 0 14px 6px rgba(255,170,70,.55),0 0 40px 18px rgba(255,140,50,.18);animation:flick 1.6s infinite alternate}
.candle:nth-child(2){animation-delay:.5s}.candle:nth-child(3){animation-delay:1s}
@keyframes flick{0%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}100%{opacity:.8;transform:scale(.95)}}
#center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:2}
#piles{display:flex;gap:9px;align-items:center}
.pile{width:44px;height:62px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.5)}
#deckP{background:repeating-linear-gradient(45deg,#432659 0 6px,#2e1840 6px 12px);border:2px solid #f2c46b;font-size:12px;color:#f2c46b;flex-direction:column;line-height:1.1}
#deckP small{font-size:9px;opacity:.8}
#discP{border:2px dashed rgba(242,196,107,.35);font-size:22px;flex-direction:column}
#discP small{font-size:9px}
#evt{font-size:11.5px;font-weight:800;color:#ffe9b8;text-shadow:0 1px 4px #000;text-align:center;max-width:210px;min-height:15px;line-height:1.3}
.seat{position:absolute;width:80px;transform:translate(-50%,-50%);z-index:3;transition:filter .3s}
.sBody{position:relative;background:linear-gradient(180deg,rgba(46,24,62,.96),rgba(24,12,34,.96));border:2px solid rgba(242,196,107,.32);border-radius:12px;padding:4px 3px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.5);cursor:pointer}
.seat.cur .sBody{border-color:#ffd36b;box-shadow:0 0 0 2px rgba(255,211,107,.45),0 0 20px rgba(255,190,80,.75)}
.seat.tgt .sBody{border-color:#ff7b7b;box-shadow:0 0 0 3px rgba(255,107,107,.55),0 0 18px rgba(255,80,80,.8);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.seat.dead{filter:grayscale(.85) brightness(.62)}
.av{position:relative;width:36px;height:36px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6c4a86,#2b1a3b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #8f6bb0}
.king .av,#meAv.king{border-color:#f2c46b;background:radial-gradient(circle at 40% 35%,#a07c2e,#3d2a0e)}
.rb{position:absolute;right:-8px;top:-7px;font-size:14px;filter:drop-shadow(0 1px 2px #000)}
.nm{font-size:11px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn{font-size:9px;color:#c4ad8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.hp{display:flex;justify-content:center;gap:2px;margin-top:2px;min-height:8px}
.pp{width:7px;height:7px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 4px rgba(255,90,100,.7)}
.pp.off{background:#3a2a40;box-shadow:none}
.st{font-size:10px;margin-top:2px;display:flex;justify-content:center;align-items:center;gap:1px;flex-wrap:wrap;min-height:13px;line-height:1}
.hc{font-size:9.5px;font-weight:900;color:#e9d9bb;background:rgba(255,255,255,.1);border-radius:6px;padding:1px 4px;margin-right:2px}
.dist{position:absolute;left:-7px;top:-7px;background:#1d2a44;border:1px solid #7fb8ff;color:#cfe6ff;font-size:9px;font-weight:900;border-radius:8px;padding:1px 4px;z-index:2}
.dist.in{background:#5a1d26;border-color:#ff8a8a;color:#ffd6d6}
.mk{position:absolute;right:-7px;bottom:-7px;font-size:14px;filter:drop-shadow(0 1px 2px #000)}
.bub{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px) scale(.85);background:#fff6e2;color:#2a1a10;font-size:11px;font-weight:800;padding:5px 8px;border-radius:10px;width:max-content;max-width:150px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.45);white-space:normal;word-break:keep-all}
.bub::after{content:'';position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff6e2}
.bub.on{opacity:1;transform:translate(-50%,-4px) scale(1)}
.bub.dn{bottom:auto;top:100%;transform:translate(-50%,4px) scale(.85)}
.bub.dn.on{transform:translate(-50%,4px) scale(1)}
.bub.dn::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff6e2}
.bub.lf{left:0;transform:translate(0,-4px) scale(.85)}.bub.lf.on{transform:translate(0,-4px) scale(1)}.bub.lf::after{left:20px}
.bub.rt{left:auto;right:0;transform:translate(0,-4px) scale(.85)}.bub.rt.on{transform:translate(0,-4px) scale(1)}.bub.rt::after{left:auto;right:15px}
.bub.dn.lf,.bub.dn.rt{transform:translate(0,4px) scale(.85)}.bub.dn.lf.on,.bub.dn.rt.on{transform:translate(0,4px) scale(1)}
.seat.hit .sBody,#meTop.hit{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#me{position:relative;flex:none;background:linear-gradient(180deg,rgba(26,13,36,.75),rgba(10,5,16,.97));border-top:1px solid rgba(242,196,107,.3);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
#meTop{position:relative;display:flex;align-items:center;gap:8px}
#meAv{position:relative;width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6c4a86,#2b1a3b);border:2px solid #8f6bb0;display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer}
#meTop.cur #meAv{box-shadow:0 0 0 3px rgba(255,211,107,.5),0 0 18px rgba(255,190,80,.8)}
#meTop.dead{filter:grayscale(.8) brightness(.7)}
#meTxt{flex:1;min-width:0;font-size:11.5px;line-height:1.45}
#meL1{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
#meName{font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis}
#meRole{flex:none;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:900;color:#1a0f08}
#meL2{display:flex;align-items:center;gap:6px;color:#d6c3a2;white-space:nowrap;overflow:hidden}
#meEq span{font-size:14px;cursor:pointer}
#meBub{left:4px}
#hint{min-height:34px;margin:6px 0 2px;font-size:11.5px;color:#eedfc2;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:10px;padding:4px 8px;line-height:1.35}
#hint .ht{flex:1;min-width:0}
#hint button{flex:none;padding:6px 10px;border:0;border-radius:9px;font-size:12px;font-weight:900;background:rgba(255,255,255,.14)}
#hint button.pri{background:linear-gradient(135deg,#f2c46b,#d8913a);color:#2a1608}
#hand{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:10px 2px 4px;min-height:104px;touch-action:pan-x;scrollbar-width:thin}
#hand::-webkit-scrollbar{height:4px}#hand::-webkit-scrollbar-thumb{background:rgba(242,196,107,.35);border-radius:4px}
#hand .empty{margin:auto;font-size:12px;color:#8f7d66}
.card{flex:none;width:60px;height:88px;border-radius:9px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s,filter .15s;box-shadow:0 3px 8px rgba(0,0,0,.45);cursor:pointer}
.card.b{background:linear-gradient(160deg,#f8eacb,#e2c693);color:#3a2412;border:2px solid #a8834a}
.card.w,.card.e{background:linear-gradient(160deg,#d5e7f7,#8fb2d4);color:#14283e;border:2px solid #4f7aa6}
.card.j,.card.r{background:linear-gradient(160deg,#e6d3f7,#a98bd0);color:#2a1440;border:2px solid #7650a8}
.card .cs{position:absolute;left:4px;top:2px;font-size:10px;font-weight:900}
.card .ct{position:absolute;right:4px;top:3px;font-size:8px;font-weight:900;opacity:.6}
.card .ci{font-size:25px;line-height:1}
.card .cn{font-size:10.5px;font-weight:900;margin-top:6px;letter-spacing:-.4px;white-space:nowrap}
.card.sel{transform:translateY(-9px);box-shadow:0 0 0 3px #ffd36b,0 8px 16px rgba(0,0,0,.55)}
.card.dim{filter:brightness(.62) saturate(.55)}
.card.mark{transform:translateY(-6px);box-shadow:0 0 0 3px #ff6b6b,0 8px 16px rgba(0,0,0,.5)}
.card.mark::after{content:'🗑';position:absolute;right:-6px;bottom:-6px;font-size:14px}
#acts{display:flex;gap:6px;margin-top:3px}
#acts button{flex:1;padding:10px 4px;border:0;border-radius:11px;font-size:13px;font-weight:900;background:rgba(255,255,255,.11)}
#acts #endBtn{flex:1.4;background:linear-gradient(135deg,#f2c46b,#d8913a);color:#2a1608;box-shadow:0 4px 12px rgba(216,145,58,.35)}
#acts #abilBtn{display:none}
.fly{position:absolute;width:36px;height:50px;border-radius:7px;z-index:50;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.6);transition:transform .42s cubic-bezier(.3,.7,.3,1),opacity .25s}
.fly.b{background:#f2e1bb;border:2px solid #a8834a}.fly.w,.fly.e{background:#bcd5ee;border:2px solid #4f7aa6}.fly.j,.fly.r{background:#d6c0ef;border:2px solid #7650a8}
.flt{position:absolute;z-index:60;font-weight:900;font-size:15px;pointer-events:none;text-shadow:0 2px 4px #000,0 0 8px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%);animation:up 1s forwards}
@keyframes up{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-38px}}
#banner{position:absolute;left:50%;top:9%;transform:translate(-50%,-50%) scale(.9);z-index:45;background:linear-gradient(90deg,transparent,rgba(30,14,40,.92) 15%,rgba(30,14,40,.92) 85%,transparent);color:#ffe2a2;font-weight:900;font-size:14px;padding:6px 40px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#judge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);z-index:46;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .2s,transform .25s;pointer-events:none}
#judge.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#judge .card{width:70px;height:100px;cursor:default}
#judge .jl{background:rgba(20,10,28,.92);border:1px solid rgba(242,196,107,.5);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:900;text-align:center;white-space:nowrap}
#reveal{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.6);z-index:47;background:radial-gradient(circle,rgba(30,10,30,.97),rgba(14,6,20,.97));border:2px solid #f2c46b;border-radius:18px;padding:14px 22px;text-align:center;opacity:0;transition:opacity .25s,transform .3s;pointer-events:none;box-shadow:0 0 60px rgba(0,0,0,.8)}
#reveal.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#reveal .rv1{font-size:13px;font-weight:800;color:#d6c3a2}
#reveal .rv2{font-size:34px;margin:4px 0}
#reveal .rv3{font-size:18px;font-weight:900}
#pWrap{position:absolute;inset:0;z-index:70;background:rgba(8,4,12,.35);display:none}
#pWrap.on{display:block}
#prompt{position:absolute;left:8px;right:8px;bottom:8px;background:linear-gradient(180deg,#3d2052,#22112e);border:2px solid #f2c46b;border-radius:16px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.75);animation:pop .2s;max-height:80%;overflow-y:auto;touch-action:pan-y}
@keyframes pop{0%{transform:translateY(20px);opacity:0}100%{transform:none;opacity:1}}
#prompt .pt{font-size:16px;font-weight:900;color:#ffe2a2;text-align:center}
#prompt .px{font-size:12.5px;color:#e6d6b8;text-align:center;margin-top:6px;line-height:1.5}
#prompt .pb{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
#prompt .pb button{flex:1 1 40%;padding:11px 6px;border:0;border-radius:11px;font-size:13.5px;font-weight:900;background:rgba(255,255,255,.12)}
#prompt .pb button.pri{background:linear-gradient(135deg,#f2c46b,#d8913a);color:#2a1608}
#prompt .pb button.red{background:linear-gradient(135deg,#ff7a8c,#d94a5c);color:#fff}
.ov{position:absolute;inset:0;z-index:80;display:none;background:rgba(10,5,16,.78);overflow-y:auto;touch-action:pan-y;padding:14px}
.ov.on{display:flex}
.box{margin:auto;width:100%;max-width:440px;background:linear-gradient(180deg,#2f1940,#1a0d24);border:2px solid rgba(242,196,107,.55);border-radius:20px;padding:18px 16px;box-shadow:0 14px 50px rgba(0,0,0,.7)}
.box h1{font-size:22px;font-weight:900;text-align:center;color:#ffd98a;letter-spacing:-.5px}
.box h2{font-size:18px;font-weight:900;text-align:center;color:#ffd98a}
.box h3{font-size:13.5px;font-weight:900;color:#ffd98a;margin:12px 0 5px}
.logo{font-size:46px;text-align:center;filter:drop-shadow(0 4px 12px rgba(255,170,70,.5))}
.sub{text-align:center;font-size:12.5px;color:#cdb896;margin:6px 0 4px;line-height:1.55}
.lb{display:block;font-size:12px;font-weight:900;color:#e9d5ad;margin:12px 0 5px}
#nameIn{width:100%;padding:10px 12px;font-size:16px;border:2px solid rgba(242,196,107,.4);border-radius:12px;font-family:inherit;background:#1a0e24;color:#fff;touch-action:manipulation;-webkit-user-select:text;user-select:text;outline:none}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts button{padding:9px 4px;border-radius:11px;border:2px solid rgba(242,196,107,.25);background:rgba(255,255,255,.06);font-size:13.5px;font-weight:900;color:#e7d6b8}
.opts button.on{border-color:#f2c46b;background:rgba(242,196,107,.2);color:#ffe2a2}
.dd{font-size:11.5px;color:#bba584;margin-top:5px;text-align:center;min-height:16px;line-height:1.45}
.big{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#f2c46b,#d8913a);color:#2a1608;font-size:18px;font-weight:900;box-shadow:0 6px 18px rgba(216,145,58,.4)}
.row2{display:flex;gap:8px;margin-top:10px}
.row2>*{flex:1;padding:10px;border:0;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;font-weight:900;text-align:center;text-decoration:none;color:#f3e6cc}
.rcard{margin:12px auto 0;width:170px;padding:14px 10px;border-radius:16px;text-align:center;border:3px solid;background:rgba(0,0,0,.3)}
.rcard .ri{font-size:44px}.rcard .rn{font-size:20px;font-weight:900;margin-top:2px}
.rgoal{font-size:12.5px;color:#e6d6b8;text-align:center;margin-top:10px;line-height:1.6}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.heroes button{padding:10px 8px;border-radius:14px;border:2px solid rgba(242,196,107,.3);background:rgba(255,255,255,.06);text-align:center}
.heroes button:active{border-color:#f2c46b}
.heroes .hi{font-size:30px}.heroes .hnm{font-size:13.5px;font-weight:900;color:#ffe2a2;margin-top:2px}.heroes .hhp{font-size:11px;color:#ff8f9a;margin-top:2px}.heroes .ha{font-size:11.5px;font-weight:900;color:#bfe0ff;margin-top:5px}.heroes .hd{font-size:11px;color:#d6c3a2;margin-top:2px;line-height:1.4}
.rbig{text-align:center;font-size:42px;margin-top:4px}
.rside{text-align:center;font-size:13px;color:#e6d6b8;margin-top:6px;line-height:1.55}
.plist{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.plist div{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 9px;font-size:12px}
.plist .pr{font-size:17px}.plist .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist .ps{font-size:11px;color:#c4ad8c;white-space:nowrap}
.plist .meRow{background:rgba(242,196,107,.15);border:1px solid rgba(242,196,107,.4)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.sgrid div{background:rgba(255,255,255,.07);border-radius:10px;padding:7px 9px;font-size:11px;color:#c4ad8c;font-weight:700}
.sgrid b{display:block;font-size:15px;color:#ffe9c2;margin-top:1px}
.sgrid .wide{grid-column:1/3;text-align:center}.sgrid .wide b{font-size:24px;color:#ffd36b}
#recBox{width:100%;margin-top:10px;height:150px;padding:9px;border-radius:12px;border:2px solid rgba(242,196,107,.35);font-size:12px;font-family:inherit;resize:none;background:#140a1c;color:#f3e6cc;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#copyMsg{text-align:center;font-size:12px;font-weight:800;color:#8ff0c4;min-height:16px;margin-top:5px}
.vl{display:block;text-align:center;margin-top:10px;font-size:13px;font-weight:900;color:#9fd0ff;text-decoration:none}
.help{font-size:12.5px;line-height:1.65;color:#e6d6b8}
.help b{color:#ffe2a2}
.help .ci2{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed rgba(242,196,107,.15)}
.help .ci2 span:first-child{font-size:18px;width:24px;text-align:center;flex:none}
#logList{max-height:60vh;overflow-y:auto;margin-top:8px;font-size:12px;line-height:1.55;touch-action:pan-y}
#logList div{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
#logList .say{color:#ffe2a2}
#logList .rh{color:#9fd0ff;font-weight:900;margin-top:6px}
.info .ih{display:flex;gap:10px;align-items:center}
.info .iav{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6c4a86,#2b1a3b);border:2px solid #8f6bb0;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.info .inm{font-size:17px;font-weight:900;color:#ffe2a2}
.info .ihero{font-size:12px;color:#d6c3a2}
.info .iab{margin-top:10px;background:rgba(127,184,255,.1);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5}
.info .ieq{margin-top:8px;font-size:12px;line-height:1.6}

function nextAliveIdx(i){const n=G.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(G.players[j].alive)return j;}return i;}

function dist(a,b){let d=baseDist(a,b);if(hasEq(b,'horse'))d++;if(b.hero.id==='cloak')d++;if(hasEq(a,'feather'))d--;if(a.hero.id==='hawk')d--;return Math.max(1,d);}

// ================= BELIEF MODEL (공개된 행동만 사용) =================
const LRU=['L','R','U'];
const HM={L:{K:0.02,L:0.25,R:1.0,U:0.6},R:{K:1.0,L:0.75,R:0.3,U:0.45},U:{K:0.3,L:0.55,R:0.85,U:0.5}};
const CLAIM={L:1.0,R:0.72,U:0.82};
function hot(r){return {K:r==='K'?1:0,L:r==='L'?1:0,R:r==='R'?1:0,U:r==='U'?1:0};}
function normLP(lp){const mx=Math.max(lp.L,lp.R,lp.U);if(!isFinite(mx))return {K:0,L:1/3,R:1/3,U:1/3};const e={L:Math.exp(lp.L-mx),R:Math.exp(lp.R-mx),U:Math.exp(lp.U-mx)};const s=e.L+e.R+e.U;return {K:0,L:e.L/s,R:e.R/s,U:e.U/s};}
function addEv(a,t,k,w){G.events.push({a:a.idx,t:t?t.idx:-1,k,w,r:G.round});G.ver++;}
function beliefs(o){
 const c=G.bc[o.idx];if(c&&c.v===G.ver)return c.B;
 const ps=G.players;const beta=o.ai?o.ai.beta:1;
 const known=ps.map(x=>(x===o||x.role==='K'||!x.alive)?x.role:null);
 const cnt={L:0,R:0,U:0};G.roleset.forEach(r=>{if(r!=='K')cnt[r]++;});
 known.forEach(r=>{if(r&&r!=='K')cnt[r]--;});
 const unk=[];known.forEach((r,i)=>{if(!r)unk.push(i);});
 const m=unk.length||1;
 const pri={L:Math.max(0,cnt.L)/m,R:Math.max(0,cnt.R)/m,U:Math.max(0,cnt.U)/m};
 let B=ps.map((x,i)=>known[i]?hot(known[i]):{K:0,L:pri.L,R:pri.R,U:pri.U});
 for(let pass=0;pass<2;pass++){
  const NB=B.slice();
  for(const i of unk){
   const lp={L:Math.log(pri.L+1e-9),R:Math.log(pri.R+1e-9),U:Math.log(pri.U+1e-9)};
   for(const e of G.events){
    if(e.a===i){
     if(e.k==='claim'){for(const r of LRU)lp[r]+=beta*0.35*Math.log(CLAIM[r]);continue;}
     const td=B[e.t];if(!td)continue;
     for(const r of LRU){const h=HM[r];lp[r]+=beta*e.w*Math.log(td.K*h.K+td.L*h.L+td.R*h.R+td.U*h.U+0.03);}
    }else if(e.k==='accuse'&&e.t===i&&e.a!==o.idx){
     const ab=B[e.a];const cr=(ab.K+ab.L)-ab.R*0.6;
     lp.R+=beta*0.5*cr;lp.U+=beta*0.25*cr;lp.L-=beta*0.35*cr;
    }
   }
   for(const r of LRU)if(cnt[r]<=0)lp[r]=-Infinity;
   NB[i]=normLP(lp);
  }
  B=NB;
 }
 G.bc[o.idx]={v:G.ver,B};
 return B;
}

function hostile(a,t,B,ctx){

 if(t.role==='K'){

 v*=a.ai.agg;
 if(v>0){if(t.hp===1)v+=0.45;else if(t.hp===2)v+=0.12;}
 if(a.ai.gut[t.idx]===undefined)a.ai.gut[t.idx]=(R()-0.5)*0.2;
 v+=a.ai.gut[t.idx]*a.ai.pers.chaos;
 return v;
}
function aiThreshold(p){const m=p.ai.mode;let t=0.12;if(p.role==='K')t=m==='paranoid'?0.12:0.26;else if(p.role==='L')t=m==='zealot'?0.1:0.28;if(G.round===1&&(p.role==='K'||p.role==='L'))t+=0.08;return t;}
function cardVal(p,c){
 switch(c.k){
  case 'shield':return 1.4+(p.hp<=2?0.6:0);case 'potion':return 1.7;
  case 'strike':return 1.0;case 'vault':return 2.2;case 'letter':return 2.0;
  case 'duel':return 1.1;case 'jail':return 1.0;case 'steal':return 1.15;case 'gust':return 0.9;
  case 'volley':return 1.2;case 'wolves':return 1.0;case 'feast':return 0.8;case 'rune':return 0.1;
  default:{const K=CARD[c.k];if(K.t==='w'){return K.rng>rangeOf(p)?1.0:0.25;}return hasEq(p,c.k)?0.2:1.1;}
 }

function lowCards(p,n,excl){const arr=p.hand.filter(c=>!excl||!excl.includes(c));const strikes=arr.filter(c=>c.k==='strike').length;return arr.map(c=>({c,v:cardVal(p,c)-(c.k==='strike'&&strikes>2?0.4:0)+R()*0.05})).sort((a,b)=>a.v-b.v).slice(0,n).map(o=>o.c);}
function aiChoose(p){
 const B=beliefs(p);
 const ctx={kingB:(p.role==='R'&&p.ai.mode==='cover')?beliefs(G.king):null,uFinal:uFinal(p)};
 const others=G.players.filter(x=>x.alive&&x!==p);
 const H={};for(const x of others)H[x.idx]=hostile(p,x,B,ctx)+(R()-0.5)*0.12*p.ai.pers.chaos;
 const strikes=p.hand.filter(c=>isStrikeCard(p,c));
 const C=[];const seen=new Set();
 const bestOut=others.filter(x=>H[x.idx]>0.3).sort((a,b)=>H[b.idx]-H[a.idx])[0];
 for(const c of p.hand){
  if(seen.has(c.k))continue;seen.add(c.k);
  const K=CARD[c.k];
  switch(c.k){
   case 'letter':case 'vault':C.push({c,v:3});break;
   case 'horse':case 'feather':case 'amulet':if(!hasEq(p,c.k))C.push({c,v:1.6});break;
   case 'twin':case 'axe':case 'bow':case 'lance':case 'longbow':{
    const cur=rangeOf(p),w=weaponOf(p),nr=K.rng;let v=-1;
    if(c.k==='twin'){if(p.hero.id!=='blade'&&strikes.length>=2&&cur<=2)v=0.9;else if(!w)v=0.35;}
    else if(nr>cur)v=1.0+0.1*(nr-cur);

    if(v>0&&bestOut&&dist(p,bestOut)>cur&&dist(p,bestOut)<=nr)v+=0.6;
    if(p.role==='R'&&p.ai.mode==='assault'&&G.king.alive){const dk=dist(p,G.king);if(dk>cur&&dk<=nr)v+=0.9;}
    if(v>0)C.push({c,v});break;}
   case 'rune':if(!hasEq(p,'rune')){const v=-0.3+R()*0.55*p.ai.pers.chaos+(p.role==='R'||p.role==='U'?0.1:0)+(p.hp>=3?0.05:-0.4);C.push({c,v});}break;
   case 'potion':if(p.hp<p.maxHp&&aliveList().length>2){let v=0;if(p.hp<=p.maxHp-2)v+=1.2;if(p.hand.length>p.hp)v+=1.0;if(v>0)C.push({c,v});}break;
   case 'feast':{let v=0;for(const x of aliveList()){if(x.hp<x.maxHp)v+=x===p?1.0:-clamp(H[x.idx],-1,1)*0.6;}if(v>0.3)C.push({c,v:v-0.1});break;}
   case 'volley':case 'wolves':{let v=0;for(const x of others)v+=clamp(H[x.idx],-2,1.2)*(c.k==='volley'?0.55:0.5);C.push({c,v:v-0.1});break;}
   case 'duel':{const ms=strikes.length;for(const x of others){const h=H[x.idx];if(h<=0)continue;C.push({c,t:x,v:h*0.85+(ms-x.hand.length*0.35)*0.15-(ms===0?0.45:0)});}break;}
   case 'jail':for(const x of others){if(x.role==='K'||hasEq(x,'jail'))continue;const h=H[x.idx];if(h>0)C.push({c,t:x,v:h*0.85+0.08});}break;
   case 'steal':for(const x of others){if(dist(p,x)>1||x.hand.length+x.eq.length===0)continue;const h=H[x.idx];if(h<-0.4)continue;C.push({c,t:x,v:0.3+Math.max(0,h)*0.5});}break;
   case 'gust':for(const x of others){if(x.hand.length+x.eq.length===0)continue;const h=H[x.idx];if(h>0)C.push({c,t:x,v:h*0.6+0.05});}break;
  }
 }
 if(strikes.length&&canStrikeNow(p)){
  const sc=strikes.find(c=>c.k==='strike')||strikes[0];const asS=sc.k==='shield';
  for(const x of others){if(dist(p,x)>rangeOf(p))continue;let v=H[x.idx];if(strikes.length===1)v-=p.ai.cau*0.12;if(asS)v-=0.15;if(p.hero.id==='bolt')v+=0.1;C.push({c:sc,t:x,v,as:asS});}
 }
 if(p.hero.id==='nun'&&p.hp<p.maxHp&&p.hand.length>=2){const v=(p.hp<=p.maxHp-2?0.8:0)+(p.hand.length>p.hp+1?0.7:0)-0.15;if(v>0)C.push({pray:true,v});}

 return ok[ok.length-1];
}

}

 }

async function gameLoop(){

function askDefend(t,src,rem,kind,has){
 const title=kind==='volley'?'🌧️ '+esc(src.name)+'의 화살비!':'⚔️ '+esc(src.name)+'의 검격!';
 const txt=(rem>1?'⚡ 연쇄 번개 — 방패 <b>'+rem+'장</b>이 있어야 막을 수 있어요.':'방패 1장으로 막을 수 있어요.')+'<br>막을 카드 '+has+'장 보유'+(t.hero.id==='choir'?' (성가의 박자: 검격도 방패로)':'')+' · 현재 체력 '+t.hp;
 return askHuman({title,text:txt,btns:[{l:'🛡 막는다',v:true,cls:'pri'},{l:'💥 그냥 맞는다',v:false}]});
}
function askStrike(x,vs,kind,has){
 const title=kind==='duel'?'🤺 '+esc(vs.name)+'와(과)의 결투!':'🐺 '+esc(vs.name)+'의 늑대 습격!';
 const txt=(kind==='duel'?'검격을 내면 결투가 이어지고, 포기하면 체력 1을 잃어요.':'검격 1장을 버리면 버티고, 아니면 체력 1을 잃어요.')+'<br>검격 '+has+'장 보유 · 현재 체력 '+x.hp;
 return askHuman({title,text:txt,btns:[{l:'⚔️ 검격 내기',v:true,cls:'pri'},{l:'💥 포기',v:false}]});
}
function askPick(t,mode){
 const btns=t.eq.map(c=>({l:CARD[c.k].i+' '+CARD[c.k].n,v:{from:'eq',card:c}}));
 if(t.hand.length)btns.push({l:'🂠 손패에서 무작위 ('+t.hand.length+'장)',v:{from:'hand'},cls:'pri'});
 return askHuman({title:(mode==='steal'?'🫳 무엇을 빼앗을까요?':'🌪️ 무엇을 버리게 할까요?'),text:esc(t.name)+'의 카드',btns});
}
function humanPhase(p){
 return new Promise(res=>{G.phase='play';G.sel=null;G.endTurn=()=>{G.phase='idle';G.sel=null;G.endTurn=null;render();res();};render();});
}
function humanDiscard(p,n){
 return new Promise(res=>{G.phase='discard';G.need=n;G.marks=new Set();G.sel=null;G.discDone=()=>{const cs=p.hand.filter(c=>G.marks.has(c.id));cs.forEach(c=>{takeFromHand(p,c);toDisc(c);});log('🗑 '+p.name+' 카드 '+cs.length+'장 버림');G.phase='idle';G.discDone=null;checkDragons();render();res();};render();});
}
async function humanDied(){
 const Rr=ROLES[ME.role];
 const v=await askHuman({title:'💀 당신은 쓰러졌습니다',text:'정체: '+Rr.i+' '+Rr.n+'<br>쓰러져도 내 진영이 이기면 <b>승리</b>로 기록돼요.',btns:[{l:'👀 지켜보기',v:'watch',cls:'pri'},{l:'⏭ 결말 바로 보기',v:'skip'}]});
 if(v==='skip')G.instant=true;
}
function selCard(){return G.sel==null?null:ME.hand.find(c=>c.id===G.sel)||null;}
function validTargets(p,c,asS){
 const k=asS?'strike':c.k;const others=G.players.filter(x=>x.alive&&x!==p);
 switch(k){
  case 'strike':return canStrikeNow(p)?others.filter(x=>dist(p,x)<=rangeOf(p)):[];
  case 'duel':return others;
  case 'gust':return others.filter(x=>x.hand.length+x.eq.length>0);
  case 'steal':return others.filter(x=>dist(p,x)<=1&&x.hand.length+x.eq.length>0);
  case 'jail':return others.filter(x=>x.role!=='K'&&!hasEq(x,'jail'));
 }
 return null;
}
function usableSelf(p,c){
 switch(c.k){case 'potion':return p.hp<p.maxHp&&aliveList().length>2;case 'shield':return false;case 'rune':return !hasEq(p,'rune');default:return true;}
}
function asStrikeSel(c){return c.k==='shield'&&ME.hero.id==='choir';}
function cardPlayable(c){
 if(G.phase!=='play'||G.busy)return false;
 const asS=asStrikeSel(c);const tg=validTargets(ME,c,asS);
 if(tg!==null)return tg.length>0;
 return usableSelf(ME,c);
}
function onCardTap(c){
 if(G.busy)return;
 if(G.phase==='discard'||G.phase==='pray'){if(G.marks.has(c.id))G.marks.delete(c.id);else{const lim=G.phase==='pray'?2:G.need;if(G.marks.size<lim)G.marks.add(c.id);}renderHand();renderHint();return;}
 G.sel=G.sel===c.id?null:c.id;render();
}
async function humanUse(c,t){
 if(G.busy||G.phase!=='play')return;
 const asS=asStrikeSel(c);
 G.busy=true;G.sel=null;render();
 await playCard(ME,c,t,asS);
 G.busy=false;
 if((!ME.alive||G.over)&&G.endTurn){G.endTurn();return;}
 render();
}
function onSeatTap(p){
 if(G.busy)return;
 const c=selCard();
 if(G.phase==='play'&&c){const tg=validTargets(ME,c,asStrikeSel(c));if(tg&&tg.includes(p)){ac();humanUse(c,p);return;}}
 showInfo(p);
}
async function humanTalk(){
 if(G.phase!=='play'||G.busy||G.talked)return;
 G.busy=true;
 const btns=[];
 if(ME.role!=='K')btns.push({l:'⚜️ “나는 폐하의 충신이다”',v:'claim',cls:'pri'});
 btns.push({l:'👉 누군가를 고발한다',v:'acc',cls:'red'},{l:'취소',v:null});
 const v=await askHuman({title:'🗣 연회장에 한마디',text:'차례마다 한 번 말할 수 있어요. AI는 말을 듣고 의심을 고칩니다… 그들도 거짓말을 하지만요.',btns});
 if(v==='claim'){G.talked=true;addEv(ME,null,'claim',1);say(ME,'나는 폐하의 충신이다. 내 칼을 믿어라!',true);reactClaim();}
 else if(v==='acc'){
  const list=G.players.filter(x=>x.alive&&!x.human&&x.role!=='K');
  const t=await askHuman({title:'👉 누구를 고발할까요?',btns:list.map(x=>({l:x.hero.i+' '+esc(x.name),v:x.idx})).concat([{l:'취소',v:null}])});
  if(t!=null){const tg=G.players[t];G.talked=true;addEv(ME,tg,'accuse',0.3);say(ME,fill('{t:가} 수상하다! 모두 {t:를} 경계하라!',{t:tg.name}),true);
   setTimeout(()=>{if(tg.alive)say(tg,pick(L.accReply),true);},1000/G.speed);
   const others=G.players.filter(x=>x.alive&&!x.human&&x!==tg);if(others.length&&R()<0.6){const o=pick(others);setTimeout(()=>{const b=beliefs(o)[ME.idx];const trust=o.role==='R'?R()<0.5:(b.L+b.K>0.45);say(o,pick(trust?L.trust:L.doubt));},2000/G.speed);}
  }
 }
 G.busy=false;render();
}
function reactClaim(){
 const os=G.players.filter(x=>x.alive&&!x.human);if(!os.length)return;
 const o=pick(os);
 setTimeout(()=>{const b=beliefs(o)[ME.idx];let trust;if(o.role==='R')trust=R()<0.6;else trust=b.L>0.4;say(o,pick(trust?L.trust:L.doubt));},1100/G.speed);
}
function startPray(){
 if(G.phase!=='play'||G.busy||ME.hero.id!=='nun'||ME.hp>=ME.maxHp||ME.hand.length<2)return;
 G.phase='pray';G.marks=new Set();G.sel=null;render();
}

// ================= RENDER =================
function hpPips(p){let s='';for(let i=0;i<p.maxHp;i++)s+='<i class="pp'+(i<p.hp?'':' off')+'"></i>';return s;}
function buildSeats(){
 document.querySelectorAll('.seat').forEach(e=>e.remove());
 for(const p of G.players){if(p.human)continue;const s=document.createElement('div');s.className='seat';s.id='seat'+p.idx;s.innerHTML='<div class="sBody"></div><div class="bub"></div>';s.querySelector('.sBody').addEventListener('click',()=>onSeatTap(p));$('table').appendChild(s);}
 layoutSeats();
}
function layoutSeats(){
 if(!G.players.length)return;
 const ais=G.players.filter(p=>!p.human);const m=ais.length;
 const tb=$('table').getBoundingClientRect();const W=tb.width,H=tb.height;
 const cx=W/2,cy=H*0.56,rx=Math.min(W/2-46,330),ry=Math.max(60,Math.min(H*0.56-60,H*0.44-14));
 const a0=m<=3?205:215,a1=180-a0;
 ais.forEach((p,k)=>{
  const deg=m===1?90:a0-(a0-a1)*k/(m-1);const a=deg*Math.PI/180;
  const x=cx+rx*Math.cos(a),y=cy-ry*Math.sin(a);
  const el=$('seat'+p.idx);if(!el)return;el.style.left=x+'px';el.style.top=y+'px';
  const b=el.querySelector('.bub');b.className='bub'+(y<H*0.42?' dn':'')+(x<72?' lf':x>W-72?' rt':'')+(b.classList.contains('on')?' on':'');
 });
 const bd=$('board');bd.style.left=(cx-rx+10)+'px';bd.style.right=(W-cx-rx+10)+'px';bd.style.top=(cy-ry+20)+'px';bd.style.bottom=Math.max(8,H-cy-ry*0.62)+'px';
 $('center').style.top=cy+'px';$('banner').style.top=(tb.top-appRect().top+cy-62)+'px';
}
function render(){if(G.sim||G.instant||!ME)return;renderSeats();renderMe();renderHand();renderHint();renderPiles();renderTop();}
function renderTop(){const al=aliveList().length;$('tInfo').textContent='라운드 '+G.round+' · 생존 '+al+'/'+G.players.length+(G.cur?' · ▶ '+G.cur.name:'');}
function renderPiles(){if(G.sim||G.instant)return;$('deckP').innerHTML='🂠<small>'+G.deck.length+'</small>';const top=G.disc[G.disc.length-1];$('discP').innerHTML=top?CARD[top.k].i+'<small style="color:'+SUITS[top.suit].c+'">'+SUITS[top.suit].s+RANKS[top.rank]+'</small>':'';}
function renderSeats(){
 const c=selCard();let tg=null;
 if(G.phase==='play'&&c&&!G.busy)tg=validTargets(ME,c,asStrikeSel(c));
 for(const p of G.players){
  if(p.human)continue;const el=$('seat'+p.idx);if(!el)continue;
  el.className='seat'+(p.alive?'':' dead')+(G.cur===p&&p.alive?' cur':'')+(p.role==='K'?' king':'')+(tg&&tg.includes(p)?' tgt':'')+(el.classList.contains('hit')?' hit':'');
  const badge=p.role==='K'?'👑':(!p.alive?ROLES[p.role].i:'');
  let d='';if(ME.alive&&p.alive){const dd=dist(ME,p);d='<span class="dist'+(dd<=rangeOf(ME)?' in':'')+'">↔'+dd+'</span>';}
  const eq=p.eq.map(c=>CARD[c.k].i).join('');
  el.querySelector('.sBody').innerHTML=d+'<div class="av">'+p.hero.i+(badge?'<span class="rb">'+badge+'</span>':'')+'</div><div class="nm">'+esc(p.name)+'</div>'+
   (p.alive?'<div class="hn">'+p.hero.n+'</div><div class="hp">'+hpPips(p)+'</div><div class="st"><span class="hc">🂠'+p.hand.length+'</span>'+eq+'</div>':'<div class="hn" style="color:'+ROLES[p.role].c+';font-weight:900">💀 '+ROLES[p.role].n+'</div><div class="hn">'+p.hero.n+'</div>')+
   (p.mark?'<span class="mk">'+p.mark+'</span>':'');
 }
}
function renderMe(){
 const Rr=ROLES[ME.role];
 $('meAv').innerHTML=ME.hero.i+(ME.role==='K'?'<span class="rb">👑</span>':'');
 $('meAv').className=ME.role==='K'?'king':'';
 $('meTop').classList.toggle('cur',G.cur===ME&&ME.alive);$('meTop').classList.toggle('dead',!ME.alive);
 $('meName').textContent=ME.name+' · '+ME.hero.n;
 $('meRole').textContent=Rr.i+' '+Rr.n;$('meRole').style.background=Rr.c;
 $('meHp').innerHTML=ME.alive?hpPips(ME):'💀';
 $('meRng').textContent='🎯 사거리 '+rangeOf(ME);
 $('meEq').innerHTML=ME.eq.map(c=>'<span data-k="'+c.k+'">'+CARD[c.k].i+'</span>').join('');
}
function renderHand(){
 const h=$('hand');
 if(!ME.hand.length){h.innerHTML='<div class="empty">'+(ME.alive?'손패가 없어요':'관전 중…')+'</div>';return;}
 const marking=G.phase==='discard'||G.phase==='pray';
 h.innerHTML=ME.hand.map(c=>{let cls='';if(marking){if(G.marks.has(c.id))cls='mark';}else{if(G.sel===c.id)cls='sel';else if(G.phase==='play'&&!cardPlayable(c))cls='dim';}return cardHTML(c,cls);}).join('');
}
function renderHint(){
 const h=$('hint');const c=selCard();let txt='',btn='';
 if(!ME.alive){txt='💀 당신은 쓰러졌습니다. 진영의 승패를 지켜보세요.';btn='<button id="hSkip" class="pri">⏭ 결말 보기</button>';}
 else if(G.phase==='discard'){txt='🗑 손패가 체력보다 많아요. 버릴 카드 <b>'+G.need+'장</b>을 고르세요 ('+G.marks.size+'/'+G.need+')';btn='<button id="hDisc" class="pri"'+(G.marks.size===G.need?'':' disabled')+'>버리기</button>';}
 else if(G.phase==='pray'){txt='🙏 새벽 기도: 버릴 카드 2장을 고르세요 ('+G.marks.size+'/2)';btn='<button id="hPray" class="pri"'+(G.marks.size===2?'':' disabled')+'>기도</button><button id="hCancel">취소</button>';}
 else if(c){
  const K=CARD[c.k];const asS=asStrikeSel(c);
  if(G.phase==='play'&&!G.busy){
   const tg=validTargets(ME,c,asS);
   if(tg!==null){txt=(asS?'🎵 방패를 검격으로! ':'')+K.i+' <b>'+K.n+'</b> — '+(tg.length?'<b style="color:#ff9a9a">빛나는 좌석</b>을 눌러 대상을 고르세요.':((asS||c.k==='strike')&&!canStrikeNow(ME)?'검격은 차례당 1번만 쓸 수 있어요.':'지금 고를 수 있는 대상이 없어요.'));btn='<button id="hCancel">취소</button>';}
   else if(usableSelf(ME,c)){txt=K.i+' <b>'+K.n+'</b> — '+K.d;btn='<button id="hUse" class="pri">사용</button><button id="hCancel">취소</button>';}
   else{txt=K.i+' <b>'+K.n+'</b> — '+K.d+(c.k==='potion'?' (지금은 효과 없음)':'');btn='<button id="hCancel">닫기</button>';}
  }else{txt=K.i+' <b>'+K.n+'</b> — '+K.d;btn='<button id="hCancel">닫기</button>';}
 }
 else if(G.phase==='play'){txt='🕯 당신의 차례 — 카드를 눌러 쓰세요. 검격: '+(unlimited(ME)?'무제한':(G.strikesUsed<1?'1회 가능':'사용함'))+' · 손패 한도 '+ME.hp+'장';}
 else if(G.cur&&!G.over){txt='⏳ '+esc(G.cur.name)+'의 차례… (좌석을 눌러 의심 표시 🏷)';}
 else txt='🎭 연회가 진행 중입니다.';
 h.innerHTML='<div class="ht">'+txt+'</div>'+btn;
 const b=(id,fn)=>{const e=$(id);if(e)e.addEventListener('click',()=>{ac();fn();});};
 b('hCancel',()=>{if(G.phase==='pray'){G.phase='play';G.marks=new Set();}G.sel=null;render();});
 b('hUse',()=>{const cc=selCard();if(cc)humanUse(cc,null);});
 b('hDisc',()=>{if(G.discDone&&G.marks.size===G.need)G.discDone();});
 b('hPray',async()=>{if(G.marks.size!==2)return;const cs=ME.hand.filter(x=>G.marks.has(x.id));G.phase='play';G.marks=new Set();G.busy=true;await doPray(ME,cs);G.busy=false;render();});
 b('hSkip',()=>{G.instant=true;});
 updateActs();
}
function updateActs(){
 const my=G.phase==='play'&&!G.busy&&ME.alive;
 $('endBtn').disabled=!my;
 $('talkBtn').disabled=!my||G.talked;
 const ab=$('abilBtn');ab.style.display=ME.hero.id==='nun'?'block':'none';ab.disabled=!my||ME.hp>=ME.maxHp||ME.hand.length<2;
}
function showInfo(p){
 const isMe=p===ME;const Rr=ROLES[p.role];
 const roleTxt=(isMe||p.role==='K'||!p.alive)?'<b style="color:'+Rr.c+'">'+Rr.i+' '+Rr.n+'</b>':'❔ 정체 불명';
 let distTxt='';if(!isMe&&ME.alive&&p.alive){const d=dist(ME,p);distTxt='<br>📏 나와의 거리 <b>'+d+'</b> · '+(d<=rangeOf(ME)?'<b style="color:#ff9a9a">내 검격이 닿음</b>':'내 검격 사거리('+rangeOf(ME)+') 밖')+(p.alive?' · '+esc(p.name)+'의 사거리 '+rangeOf(p):'');}
 const eq=p.eq.length?p.eq.map(c=>CARD[c.k].i+' <b>'+CARD[c.k].n+'</b> — '+CARD[c.k].d).join('<br>'):'장비 없음';
 const marks=[['','표시 없음'],['⚜️','근위?'],['🌑','사도?'],['🎭','찬탈자?'],['❓','모름']];
 $('infoBox').innerHTML='<div class="ih"><div class="iav">'+p.hero.i+'</div><div><div class="inm">'+esc(p.name)+'</div><div class="ihero">'+p.hero.n+' · 체력 '+p.hp+'/'+p.maxHp+' · 손패 '+p.hand.length+'장</div><div style="margin-top:3px;font-size:12.5px">'+roleTxt+'</div></div></div>'+
  '<div class="iab">✨ <b>'+p.hero.a+'</b> — '+p.hero.d+distTxt+'</div><div class="ieq">🧰 '+eq+'</div>'+
  ((!isMe&&p.alive&&p.role!=='K')?'<h3>🏷 의심 표시 (나만 보임)</h3><div class="marks">'+marks.map(m=>'<button data-m="'+m[0]+'" class="'+(p.mark===m[0]?'on':'')+'">'+(m[0]||'✖')+'<br>'+m[1]+'</button>').join('')+'</div>':'')+
  '<button class="close" id="infoClose">닫기</button>';
 $('infoBox').querySelectorAll('.marks button').forEach(b=>b.addEventListener('click',()=>{p.mark=b.dataset.m;$('infoOv').classList.remove('on');render();}));
 $('infoClose').addEventListener('click',()=>$('infoOv').classList.remove('on'));
 $('infoOv').classList.add('on');
}
function showLog(){
 let html='',lr=-1;
 for(let i=G.logs.length-1;i>=0;i--){const l=G.logs[i];if(l.r!==lr){html+='<div class="rh">— 라운드 '+l.r+' —</div>';lr=l.r;}html+='<div class="'+(l.s?'say':'')+'">'+esc(l.t)+'</div>';}
 $('logList').innerHTML=html||'<div>아직 기록이 없어요.</div>';$('logOv').classList.add('on');
}

// ================= SETUP / RESULT =================
function setupGame(){
 Object.assign(G,{players:[],deck:buildDeck(),disc:[],events:[],logs:[],ver:0,bc:{},over:false,winner:null,round:1,strikesUsed:0,talked:false,instant:false,phase:'idle',sel:null,busy:false,capped:false,cur:null,endTurn:null});
 G.roleset=ROLESET[G.nP];
 const roles=shuffle(G.roleset.slice()),names=shuffle(AINAMES.slice()),hs=shuffle(HEROES.slice());
 for(let i=0;i<G.nP;i++){const human=i===0&&!G.sim;G.players.push({idx:i,human,name:human?G.name:names[i],role:roles[i],hero:null,maxHp:0,hp:0,hand:[],eq:[],alive:true,kills:{e:0,f:0},mark:'',lastSay:0,ai:null});}
 ME=G.players[0];
 G.heroChoices=[hs.pop(),hs.pop()];
 for(const p of G.players)if(!p.human){p.hero=hs.pop();p.ai=mkAI(p);}
 G.king=G.players.find(p=>p.role==='K');G.kingIdx=G.king.idx;
}
function finishSetup(){
 for(const p of G.players){p.maxHp=p.hero.hp+(p.role==='K'?1:0);p.hp=p.maxHp;drawTo(p,p.hp);}
 G.turn=G.kingIdx;
}
function showRole(){
 const Rr=ROLES[ME.role];
 $('rCard').style.borderColor=Rr.c;$('rCard').innerHTML='<div class="ri">'+Rr.i+'</div><div class="rn" style="color:'+Rr.c+'">'+Rr.n+'</div>';
 const comp=G.roleset.map(r=>ROLES[r].i).join(' ');
 $('rGoal').innerHTML=Rr.goal+'<br><span style="color:#bba584;font-size:11.5px">이번 연회의 가면: '+comp+'</span>';
 $('heroPick').innerHTML=G.heroChoices.map((h,i)=>'<button data-i="'+i+'"><div class="hi">'+h.i+'</div><div class="hnm">'+h.n+'</div><div class="hhp">❤ 체력 '+(h.hp+(ME.role==='K'?1:0))+'</div><div class="ha">✨ '+h.a+'</div><div class="hd">'+h.d+'</div></button>').join('');
 $('heroPick').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ac();ME.hero=G.heroChoices[+b.dataset.i];$('roleOv').classList.remove('on');beginPlay();},{once:true}));
 $('roleOv').classList.add('on');
}
async function beginPlay(){
 finishSetup();buildSeats();G.t0=Date.now();render();
 log('🕯 연회가 시작됩니다. 국왕은 '+G.king.name+'.');
 await sleep(400);
 if(!G.king.human)say(G.king,pick(L.openKing),true);
 setEvt('👑 국왕: '+G.king.name);
 await sleep(1300);
 gameLoop();
}
function calcScore(role,win,alive,e,f,rounds,n,diff){const raw=(win?BASE[role]:0)+(alive?400:0)+e*350-f*400+(win?Math.max(0,25-rounds)*40:0);return Math.max(0,Math.round(raw*PM[n]*DIFFS[diff].mult));}
function cyrb(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return [h1>>>0,h2>>>0];}
function makeCode(r){const s=['RM1',r.name,DIFFS[r.diff].n,r.n,ROLES[r.role].n,r.hero,r.win,SIDE[r.side].n,r.alive,r.e,r.f,r.rounds,r.time,r.score].join('|');const [a,b]=cyrb(SALT+s,91);const hex=(a.toString(16).padStart(8,'0')+b.toString(16).padStart(8,'0')).toUpperCase();return hex.slice(0,4)+'-'+hex.slice(4,8)+'-'+hex.slice(8,12);}
function recordText(r){return ['🎭 로웬 : 황혼의 가면',
 '👤 이름: '+r.name,'🎚 난이도: '+DIFFS[r.diff].n,'👥 인원: '+r.n+'인','🃏 역할: '+ROLES[r.role].n,'🦸 영웅: '+r.hero,
 '🏁 결과: '+(r.win?'승리':'패배')+' ('+SIDE[r.side].n+' 승리)','❤️ 생존: '+(r.alive?'생존':'탈락'),
 '⚔️ 처치: 적 '+r.e+' · 아군 '+r.f,'🔄 라운드: '+r.rounds,'⏱ 시간: '+fmtT(r.time),'🏆 점수: '+r.score.toLocaleString('ko-KR'),
 '🔐 검증코드: '+r.code,'🔎 점수검증기: '+VERIFY_URL].join('\n');}
function showResult(){
 G.instant=false;G.phase='idle';G.cur=null;render();
 const me=ME,side=G.winner;
 const win=(side==='K'&&(me.role==='K'||me.role==='L'))||(side==='R'&&me.role==='R')||(side==='U'&&me.role==='U');
 const time=Math.max(1,Math.round((Date.now()-G.t0)/1000));
 const score=calcScore(me.role,win,me.alive,me.kills.e,me.kills.f,G.round,G.nP,G.diff);
 const rec={name:me.name,diff:G.diff,n:G.nP,role:me.role,hero:me.hero.n,win:win?1:0,side,alive:me.alive?1:0,e:me.kills.e,f:me.kills.f,rounds:G.round,time,score};
 rec.code=makeCode(rec);
 $('resIcon').textContent=win?'🏆':'🕯️';
 $('resTitle').textContent=win?'승리!':'패배…';
 $('resSide').innerHTML='<b style="color:#ffe2a2">'+SIDE[side].i+' '+SIDE[side].n+' 승리</b><br>'+SIDE[side].t+(G.capped?'<br>(60라운드가 지나 새벽이 밝았습니다)':'');
 $('resList').innerHTML=G.players.map(p=>{const Rr=ROLES[p.role];return '<div class="'+(p.human?'meRow':'')+'"><span class="pr">'+Rr.i+'</span><span class="pn"><b style="color:'+Rr.c+'">'+Rr.n+'</b> '+esc(p.name)+(p.human?' (나)':'')+'</span><span class="ps">'+p.hero.i+' '+(p.alive?'❤ 생존':'💀')+' · 처치 '+(p.kills.e+p.kills.f)+'</span></div>';}).join('');
 $('resStats').innerHTML='<div>🃏 내 역할<b>'+ROLES[me.role].i+' '+ROLES[me.role].n+'</b></div><div>🦸 영웅<b style="font-size:13px">'+me.hero.n+'</b></div><div>❤️ 생존<b>'+(me.alive?'생존':'탈락')+'</b></div><div>⚔️ 처치<b>적 '+me.kills.e+' · 아군 '+me.kills.f+'</b></div><div>🔄 라운드<b>'+G.round+'</b></div><div>⏱ 시간<b>'+fmtT(time)+'</b></div><div class="wide">🏆 점수 ('+DIFFS[G.diff].n+' ×'+DIFFS[G.diff].mult+' · '+G.nP+'인 ×'+PM[G.nP]+')<b>'+score.toLocaleString('ko-KR')+'</b></div>';
 $('recBox').value=recordText(rec);$('copyMsg').textContent='';
 $('resOv').classList.add('on');
 if(win)SFX.win();else SFX.lose();
}
async function copyText(txt){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}}

// ================= UI WIRING =================
function initUI(){
 let nm='';try{nm=localStorage.getItem('rowenMaskName')||'';}catch(e){}
 $('nameIn').value=nm;
 try{const d=+localStorage.getItem('rowenMaskDiff');if(d>=0&&d<4)G.diff=d;const n=+localStorage.getItem('rowenMaskN');if(n>=4&&n<=7)G.nP=n;}catch(e){}
 const dEl=$('diffs');dEl.innerHTML=DIFFS.map((d,i)=>'<button data-i="'+i+'">'+d.n+'</button>').join('');
 const cEl=$('cnts');cEl.innerHTML=[4,5,6,7].map(n=>'<button data-n="'+n+'">'+n+'인</button>').join('');
 const upd=()=>{dEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===G.diff));cEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.n===G.nP));
  $('dDesc').textContent=DIFFS[G.diff].d+' (점수 ×'+DIFFS[G.diff].mult+')';
  $('cDesc').textContent='가면 구성: '+ROLESET[G.nP].map(r=>ROLES[r].i+ROLES[r].n).join(' · ')+' (점수 ×'+PM[G.nP]+')';};
 dEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{G.diff=+b.dataset.i;upd();}));
 cEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{G.nP=+b.dataset.n;upd();}));
 upd();
 $('vlink1').href=VERIFY_URL;$('vlink2').href=VERIFY_URL;
 $('helpBody').innerHTML=helpHTML();
 $('startBtn').addEventListener('click',()=>{
  ac();const n=$('nameIn').value.trim().replace(/[\r\n|]/g,'').slice(0,12);
  if(!n){$('nameIn').focus();$('nameIn').style.borderColor='#ff7b7b';return;}
  G.name=n;try{localStorage.setItem('rowenMaskName',n);localStorage.setItem('rowenMaskDiff',G.diff);localStorage.setItem('rowenMaskN',G.nP);}catch(e){}
  $('startOv').classList.remove('on');setupGame();showRole();
 });
 $('rulesBtn').addEventListener('click',()=>$('helpOv').classList.add('on'));
 $('helpBtn').addEventListener('click',()=>$('helpOv').classList.add('on'));
 $('logBtn').addEventListener('click',showLog);
 document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.remove('on')));

 $('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';});

 $('talkBtn').addEventListener('click',()=>{ac();humanTalk();});
 $('abilBtn').addEventListener('click',()=>{ac();startPray();});

 $('meAv').addEventListener('click',()=>{if(ME&&ME.hero)showInfo(ME);});

 document.addEventListener('gesturestart',e=>e.preventDefault());
}

// 테스트용 AI 자동 대전 (?sim=1 일 때만)
if(/[?&]sim=1/.test(location.search)){
 window.__rmSim=async function(N,nP,diff){
  const st={K:0,R:0,U:0,rounds:0,cap:0,err:0};
  for(let g=0;g<N;g++){
   G.sim=true;G.instant=true;G.nP=nP;G.diff=diff;
   try{setupGame();G.players.forEach(p=>{if(!p.hero){p.hero=G.heroChoices[0];}if(!p.ai)p.ai=mkAI(p);p.human=false;});finishSetup();G.t0=Date.now();await gameLoop();st[G.winner]++;st.rounds+=G.round;if(G.capped)st.cap++;}
   catch(e){st.err++;st.lastErr=String(e&&e.stack||e);}
  }
  st.rounds=+(st.rounds/N).toFixed(1);G.sim=false;G.instant=false;return st;
 };
}
})();
