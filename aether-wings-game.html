<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>창공의 기사단 · Aether Wings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e2f0;--panel:#f6f3fb;--ink:#1d1838;--muted:#5d5878;--gold:#9a6a12;--lapis:#2b3a8c;--line:rgba(29,24,56,.16);
  --ok:#22744a;--bad:#a8302f;--warn:#94600c;
  color-scheme:light;box-sizing:border-box;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100d22;--panel:#1a1633;--ink:#efe8d6;--muted:#a49dbf;--gold:#e6bb5c;--lapis:#8ea0ff;--line:rgba(239,232,214,.14);
  --ok:#5fd18b;--bad:#ff7c78;--warn:#f2b54e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100d22;--panel:#1a1633;--ink:#efe8d6;--muted:#a49dbf;--gold:#e6bb5c;--lapis:#8ea0ff;--line:rgba(239,232,214,.14);
  --ok:#5fd18b;--bad:#ff7c78;--warn:#f2b54e;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-family:'Gowun Batang',serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:Cinzel,serif;font-weight:600;color:var(--gold);font-size:11px;letter-spacing:.12em;margin-left:6px}
.tabs{display:flex;gap:4px;flex:0 0 auto}
.tabs button{font:500 13px 'Noto Sans KR',sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible,.gbtn:focus-visible,.vbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{flex:1 1 auto;min-height:0;position:relative}
.view{display:none;height:100%}
.view.on{display:flex}
#view-game{align-items:center;justify-content:center;padding:6px}
#view-game,#view-game *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view-game textarea,#view-game input{-webkit-user-select:text;user-select:text}
#stage{position:relative;background:#07050c;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(10,6,30,.45),0 0 0 1px rgba(230,187,92,.25);touch-action:none}
#cv{display:block;touch-action:none}
.hudbtn{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,226,160,.5);background:rgba(18,12,36,.6);color:#ffe7ae;font:800 13px Cinzel,serif;display:none;align-items:center;justify-content:center;z-index:3;touch-action:none;cursor:pointer;padding:0}
.hudbtn.on{display:flex}
.bombbtn{position:absolute;right:14px;bottom:16px;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,220,140,.85);
  background:radial-gradient(circle at 34% 28%,#fff1c2 0,#f0a542 30%,#b8401c 66%,#4e130c 100%);color:#fff;font:800 14px Cinzel,serif;letter-spacing:.06em;
  text-shadow:0 1px 2px rgba(0,0,0,.7);box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 -5px 10px rgba(0,0,0,.4);display:none;z-index:3;touch-action:none;opacity:.82;padding:0}
.bombbtn.on{display:block}
.bombbtn.empty{filter:grayscale(1);opacity:.35}
.bombbtn:active{transform:scale(.94)}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:5;color:#f3ead6;overflow:auto;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,22,70,.55),rgba(6,4,16,.9))}
.ov.on{display:flex}
.panel{width:100%;max-width:400px;text-align:center;margin:auto}
.logo{margin:4px 0 6px}
.logo .k{display:block;font-family:'Gowun Batang',serif;font-weight:700;font-size:42px;line-height:1.15;
  background:linear-gradient(180deg,#fffaf0 0%,#f1cf7a 45%,#b4771c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(50,20,0,.65)) drop-shadow(0 0 18px rgba(255,200,90,.25))}
.logo .e{display:block;font-family:Cinzel,serif;font-weight:800;letter-spacing:.42em;font-size:13px;color:#c9b8ff;margin-top:6px;padding-left:.42em}
.tag{font-family:'Gowun Batang',serif;color:#d8cdea;font-size:14px;line-height:1.7;margin:10px 0 18px}
.gbtn{display:block;width:100%;margin:9px 0;padding:12px 14px;font:700 15px 'Noto Sans KR',sans-serif;color:#2a1606;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(180deg,#fff0c4,#e6ac45 58%,#b2711c);border:1px solid #fff2cc;border-radius:11px;box-shadow:0 3px 0 #6b3d0d,0 10px 22px rgba(0,0,0,.45)}
.gbtn.sub{background:linear-gradient(180deg,#3a3166,#211a40);color:#ece4ff;border-color:rgba(201,184,255,.35);box-shadow:0 3px 0 #0f0b22,0 10px 22px rgba(0,0,0,.45)}
.gbtn:active{transform:translateY(2px)}
.row2{display:flex;gap:8px}.row2 .gbtn{flex:1}
.foot{font-size:11.5px;color:#a99fc4;line-height:1.7;margin-top:14px}
h2.ttl{font-family:'Gowun Batang',serif;font-size:26px;margin:0 0 4px;color:#ffe3a0}
.sub2{font-family:Cinzel,serif;letter-spacing:.3em;font-size:11px;color:#bba8ff;margin-bottom:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.card{position:relative;border-radius:12px;padding:10px 8px 10px;background:linear-gradient(180deg,rgba(60,48,110,.75),rgba(24,18,48,.85));border:1px solid rgba(220,200,255,.22);cursor:pointer;text-align:center;touch-action:manipulation;color:inherit;font:inherit}
.card:hover,.card:focus-visible{border-color:#f1cf7a;outline:none;box-shadow:0 0 0 1px #f1cf7a,0 0 22px rgba(241,207,122,.25)}
.card canvas{width:84px;height:84px;display:block;margin:0 auto 2px}
.card b{display:block;font-family:'Gowun Batang',serif;font-size:17px;color:#ffe8b0}
.card i{display:block;font-style:normal;font-size:11px;color:#c9bfe6;margin:2px 0 6px}
.card p{font-size:11.5px;line-height:1.5;margin:0 0 6px;color:#e6def5;min-height:34px}
.card .bm{font-size:11px;color:#ffd38a;line-height:1.45}
.stats{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:10.5px;color:#b9aedb;margin-top:6px;text-align:left}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);align-self:center;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#f1cf7a,#ff8a4c)}
.big{font-family:Cinzel,serif;font-weight:800;font-size:30px;color:#fff3cc;letter-spacing:.04em;margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:14px;margin:12px auto;max-width:300px}
.kv dt{color:#b9aedb}.kv dd{margin:0;color:#fff;font-weight:700;text-align:right}
.field{display:block;text-align:left;font-size:12px;color:#c9bfe6;margin:12px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(220,200,255,.35);background:rgba(10,6,24,.6);color:#fff;font:600 16px 'Noto Sans KR',sans-serif}
.share{width:100%;height:150px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid rgba(220,200,255,.3);background:rgba(8,5,20,.7);color:#efe6ff;font:12px/1.55 'Noto Sans KR',monospace;resize:none}
.msg{min-height:20px;font-size:13px;color:#9ff0bd;margin-top:6px}
.rec{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:13px}
.rec li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid rgba(220,200,255,.14)}
.rec .n{font-family:Cinzel,serif;color:#f1cf7a;font-weight:800}
.rec .who{line-height:1.35}.rec .who small{display:block;color:#a99fc4;font-size:11px}
.rec button{font:600 12px 'Noto Sans KR',sans-serif;padding:6px 10px;border-radius:8px;border:1px solid rgba(241,207,122,.5);background:rgba(241,207,122,.12);color:#ffe3a0;cursor:pointer;touch-action:manipulation}
.help{text-align:left;font-size:13px;line-height:1.75;color:#e9e1f7}
.help h3{font-family:'Gowun Batang',serif;color:#ffe3a0;font-size:16px;margin:14px 0 4px}
.help kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);font:600 12px 'Noto Sans KR',sans-serif;text-align:center}
.etab{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;line-height:1.45}.etab th,.etab td{padding:5px 4px;border-bottom:1px solid rgba(220,200,255,.14);text-align:left;vertical-align:top}.etab th{color:#c9bfe6;font-weight:600}.etab .up{color:#8dffa8}.etab .dn{color:#ff9a8a}
.seg{display:flex;gap:6px;margin:6px 0 12px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(220,200,255,.3);background:rgba(20,14,44,.7);color:#d9cff2;font:600 13px 'Noto Sans KR',sans-serif;cursor:pointer;touch-action:manipulation}
.seg button.on{background:linear-gradient(180deg,#fff0c4,#e6ac45);color:#2a1606;border-color:#fff2cc}
@media (max-width:520px){.brand small{display:none}}
@media (prefers-reduced-motion:reduce){.gbtn:active,.bombbtn:active{transform:none}}
</style>

<body>
<div id="app">
  <header>
    <div class="brand">창공의 기사단<small>AETHER WINGS</small></div>
  </header>
  <main>
    <section id="view-game" class="view on" aria-label="게임">
      <div id="stage">
        <canvas id="cv" aria-label="게임 화면"></canvas>
        <button type="button" id="btnPause" class="hudbtn" aria-label="일시정지">II</button>
        <button type="button" id="btnBomb" class="bombbtn" aria-label="폭탄 사용">BOMB</button>
        <div id="ov" class="ov" role="dialog" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>
<script>
(()=>{
'use strict';
/* ============ 기본 상수 · 유틸 ============ */
const W=480,H=720,TAU=Math.PI*2,SCROLL=1.1;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
let seed=1;const srand=s=>{seed=(s>>>0)||1};
const sr=()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const settings=Object.assign({ctrl:'drag',sound:true,sens:1.25,name:''},store.get('aw.settings',{}));
const saveSettings=()=>store.set('aw.settings',settings);
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 사운드 (Web Audio 합성) ============ */
let AC=null,NB=null;const lastS={};
function ac(){if(!settings.sound)return null;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const n=Math.floor(AC.sampleRate*.7);NB=AC.createBuffer(1,n,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function sfx(k){
  const a=ac();if(!a)return;const now=a.currentTime;if(lastS[k]&&now-lastS[k]<.06)return;lastS[k]=now;
  const out=a.createGain();out.gain.value=.55;out.connect(a.destination);
  const tone=(type,f0,f1,dur,vol)=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),now+dur);const g=a.createGain();g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(out);o.start(now);o.stop(now+dur+.02)};
  const noise=(dur,vol,fq)=>{const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;const g=a.createGain();g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);s.connect(f);f.connect(g);g.connect(out);s.start(now);s.stop(now+dur)};
  switch(k){
    case 'pop':noise(.16,.16,1800);tone('square',300,90,.1,.03);break;
    case 'boom':noise(.5,.32,700);tone('sine',130,30,.5,.22);break;
    case 'big':noise(.7,.5,480);tone('sine',90,24,.8,.32);break;
    case 'item':tone('triangle',660,1320,.15,.12);break;
    case 'power':tone('square',440,880,.22,.05);tone('triangle',660,1760,.3,.08);break;
    case 'bomb':noise(.9,.4,1300);tone('sawtooth',220,40,.9,.1);break;
    case 'die':noise(.8,.45,900);tone('sawtooth',420,40,.8,.13);break;
    case 'warn':tone('square',220,215,.4,.06);break;
    case 'laser':tone('sawtooth',900,180,.45,.04);break;
    case 'dash':tone('triangle',520,140,.2,.05);break;
    case 'shield':tone('sine',1300,420,.18,.05);break;
    case '1up':tone('triangle',523,1046,.12,.1);tone('triangle',784,1568,.35,.08);break;
  }
}

/* ============ 캔버스 · 스케일 ============ */
const cv=$('cv'),ctx=cv.getContext('2d');
let SCALE=1,DPR=1;
function fit(){
  const host=$('view-game');if(!host.classList.contains('on'))return;
  const r=host.getBoundingClientRect();
  const s=Math.max(.2,Math.min((r.width-12)/W,(r.height-12)/H));
  SCALE=s;const cw=Math.floor(W*s),ch=Math.floor(H*s);
  const st=$('stage');st.style.width=cw+'px';st.style.height=ch+'px';cv.style.width=cw+'px';cv.style.height=ch+'px';
  DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(cw*DPR));cv.height=Math.max(1,Math.round(ch*DPR));
}
function baseTransform(){ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}

/* ============ 스프라이트 시스템 ============ */
const SS=2,cache={};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function sprite(key,w,h,fn){let c=cache[key];if(c)return c;c=mkCanvas(Math.ceil(w*SS),Math.ceil(h*SS));const g=c.getContext('2d');g.scale(SS,SS);g.translate(w/2,h/2);fn(g);c.w=w;c.h=h;c.key=key;cache[key]=c;return c}
function tinted(c,key,col){let t=cache[key];if(t)return t;t=mkCanvas(c.width,c.height);const g=t.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,t.width,t.height);t.w=c.w;t.h=c.h;t.key=key;cache[key]=t;return t}
function dimg(c,x,y,rot,sc){sc=sc||1;if(!rot&&sc===1){ctx.drawImage(c,x-c.w/2,y-c.h/2,c.w,c.h);return}ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.drawImage(c,-c.w/2*sc,-c.h/2*sc,c.w*sc,c.h*sc);ctx.restore()}
function lg(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(const s of st)gr.addColorStop(s[0],s[1]);return gr}
function ball(g,x,y,rx,ry,l,m,d){g.save();g.translate(x,y);g.scale(1,ry/rx);const gr=g.createRadialGradient(-rx*.35,-rx*.42,rx*.06,0,0,rx);gr.addColorStop(0,l);gr.addColorStop(.55,m);gr.addColorStop(1,d);g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,TAU);g.fill();g.restore()}
function glow(g,x,y,r,col,core){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,core||'#fff');gr.addColorStop(.35,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rock(g,x,y,r,c,seedN){g.save();g.translate(x,y);g.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU+(seedN||0);const rr=r*(.8+(((i+1)*37+(seedN||0)*13)%10)/38);i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();const gr=g.createRadialGradient(-r*.35,-r*.45,r*.05,0,0,r*1.05);gr.addColorStop(0,c[0]);gr.addColorStop(.55,c[1]);gr.addColorStop(1,c[2]);g.fillStyle=gr;g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.stroke();g.restore()}

/* 깃털 날개 (위로 향한 유닛 기준) */
function wings(g,fl,len,cols,stroke,n){
  for(const s of[-1,1]){g.save();g.scale(s,1);g.translate(4,-3);g.rotate(-.38+fl);
    for(let i=n-1;i>=0;i--){const l=len*(1-i*.11);g.save();g.rotate(i*.19);
      g.fillStyle=lg(g,0,0,l,0,[[0,cols[0]],[1,cols[1]]]);
      g.beginPath();g.moveTo(0,-3);g.quadraticCurveTo(l*.55,-8.5,l,-1.5);g.quadraticCurveTo(l*.6,5,0,4.2);g.closePath();g.fill();
      g.strokeStyle=stroke;g.lineWidth=.7;g.stroke();
      g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=.5;g.beginPath();g.moveTo(1,0);g.lineTo(l*.85,-1.5);g.stroke();
      g.restore()}
    g.restore()}
}
/* 박쥐형 막날개 */
function batWing(g,s,len,span,flap,mem,bone){
  g.save();g.scale(s,1);g.rotate(flap);
  const tips=[[len,-span*.55],[len*.95,-span*.02],[len*.72,span*.36],[len*.42,span*.5]];
  g.beginPath();g.moveTo(0,-4);g.lineTo(tips[0][0],tips[0][1]);
  for(let i=1;i<tips.length;i++){const p=tips[i-1],q=tips[i];g.quadraticCurveTo((p[0]+q[0])/2-len*.08,(p[1]+q[1])/2-span*.02,q[0],q[1])}
  g.quadraticCurveTo(len*.18,span*.42,0,6);g.closePath();
  g.fillStyle=lg(g,0,-span*.3,len,span*.3,[[0,mem[0]],[1,mem[1]]]);g.fill();
  g.strokeStyle=bone;g.lineWidth=Math.max(1.2,len/45);g.lineCap='round';g.beginPath();for(const t of tips){g.moveTo(0,0);g.lineTo(t[0],t[1])}g.stroke();
  g.restore();
}

/* ============ 플레이어 캐릭터 ============ */
function drawKnight(g,f){
  const fl=Math.sin(f/4*TAU)*.2;
  wings(g,fl,30,['#ffffff','#a8bde8'],'rgba(60,80,130,.5)',5);
  g.fillStyle=lg(g,0,-6,0,25,[[0,'#4a78e0'],[1,'#132660']]);
  g.beginPath();g.moveTo(-8,-5);g.quadraticCurveTo(-14,12,-9,24);g.lineTo(-3,20);g.lineTo(0,25);g.lineTo(3,20);g.lineTo(9,24);g.quadraticCurveTo(14,12,8,-5);g.closePath();g.fill();
  g.strokeStyle='#efc860';g.lineWidth=1;g.stroke();

const CLOUDCOL=['255,255,255','245,250,240','255,236,220','230,240,255','255,255,255','90,70,70','200,195,240','120,140,130','235,240,255','90,40,50'];

/* ============ 게임 상태 ============ */
let state='title',G=null,touchMode=false;
const P={x:W/2,y:H-100,c:0,power:1,bombs:3,lives:3,inv:0,cd:0,mcd:0,hcd:0,dead:0,n:0,fx:0,slow:false};
let BG={c:null,si:0,y:0},clouds=[];
let attractT=0;
const GIM=()=>G?STAGES[G.si].g:{};
const bspd=()=>(2.25+G.si*.15)*(STAGE_EL[G.si].bsp||1);

function initClouds(si){clouds=[];srand(si*91+3);const n=(STAGES[si].ter==='storm'||STAGES[si].ter==='fortress')?9:6;for(let i=0;i<n;i++)clouds.push({x:sr()*W,y:sr()*H*1.4-H*.2,s:.7+sr()*.8,v:1.6+sr()*1.6,i:i%4,hi:i%3===0})}
function setBG(si){BG.c=genBG(si);BG.si=si;BG.y=0;initClouds(si)}

function newGame(ci){
  G={si:0,score:0,kills:0,cont:0,playF:0,eid:0,next1up:[300000,800000,1500000],shake:0,lastLife:0};
  Object.assign(P,{c:ci,power:1,bombs:3,lives:3,inv:120,dead:0,cd:0,mcd:0,hcd:0,n:0,x:W/2,y:H-100});
  startStage(0);state='play';
}
function startStage(si){
  Object.assign(G,{si,clock:0,wall:0,waves:buildWaves(si),wi:0,mid:null,midSpawned:false,boss:null,bossSpawned:false,warnT:0,clearT:0,bonus:0,
    enemies:[],bullets:[],shots:[],items:[],parts:[],lasers:[],haz:[],bomb:null,wind:0,flash:0,bannerT:0,bossName:''});
  setBG(si);
}
function buildWaves(si){
  srand(9000+si*131);const pool=STAGES[si].pool,out=[];const gap=Math.max(108,168-si*7)/(STAGE_EL[si].spawn||1);let n=0;
  const add=(a,b)=>{let t=a*60;while(t<b*60){const e=pool[Math.floor(sr()*pool.length)];out.push({t:Math.round(t),form:e[0],type:e[1],n:n++});t+=gap*(.75+sr()*.5)}};
  add(2,38);add(42,74);
  const carry={3:'P',11:'B',20:'P'};for(const w of out)if(carry[w.n])w.carry=carry[w.n];
  return out;
}

/* ============ 적 생성 ============ */
function addE(type,x,y,o){const d=ET[type];const se=STAGE_EL[G.si];const hm=(1+G.si*.14)*(se.ehp||1)*(d.ground?(se.ghp||1):1);
  const e={type,x,y,vx:0,vy:0,hp:d.hp*hm,max:d.hp*hm,r:d.r,t:0,ai:d.ai,fireT:d.fire*(.5+Math.random()*.6),score:d.score,ground:!!d.ground,flash:0,ph:Math.random()*TAU,id:++G.eid,rot:0,aim:Math.PI/2,amp:.6};
  if(o)Object.assign(e,o);G.enemies.push(e);return e}
function spawnWave(w){
  const T=w.type,si=G.si,L=[],sp=1+si*.05;
  switch(w.form){
    case 'line':{const n=5;for(let i=0;i<n;i++)L.push(addE(T,60+i*(W-120)/(n-1),-20-(i%2)*30,{vy:1.5*sp}));break}
    case 'vee':{const cx=rnd(140,W-140);for(let i=0;i<5;i++){const k=i-2;L.push(addE(T,cx+k*38,-20-Math.abs(k)*32,{vy:1.7*sp}))}break}
    case 'sine':{const cx=rnd(120,W-120);for(let i=0;i<6;i++)L.push(addE(T,cx,-20-i*36,{vy:1.6*sp,amp:2.2,ai:'sine'}));break}
    case 'swarm':{for(let i=0;i<8;i++)L.push(addE(T,rnd(40,W-40),-20-i*26,{vy:2*sp,amp:1.5,ai:'sine'}));break}
    case 'sideL':case 'sideR':{const s=w.form==='sideL'?1:-1;for(let i=0;i<5;i++)L.push(addE(T,s>0?-20-i*34:W+20+i*34,70+i*6,{vx:2.6*s*sp,vy:.3,ai:'arc'}));break}
    case 'heavy':{const e=addE(T,rnd(110,W-110),-40,{ai:'stop',ty:rnd(110,190)});if(GIM().shield)e.shield=1;L.push(e);break}
    case 'turrets':{const n=si>=7?3:2;for(let i=0;i<n;i++)L.push(addE('turret',80+i*(W-160)/(n-1)+rnd(-20,20),-30-i*50));break}
    case 'divers':{for(let i=0;i<3;i++)L.push(addE(T,90+i*150+rnd(-20,20),-30-i*40,{ai:'dive'}));break}
    case 'casters':{const n=si>=8?2:1;for(let i=0;i<n;i++)L.push(addE('caster',n===1?rnd(120,W-120):(i?W-110:110),-30,{ai:'stop',ty:rnd(90,140)}));break}
    case 'shielded':{const n=T==='harpy'?3:1;for(let i=0;i<n;i++)L.push(addE(T,n>1?100+i*140:rnd(120,W-120),-30-i*20,{ai:'stop',ty:rnd(100,180),shield:1}));break}
  }
  for(const e of L)if(e.shield){e.sh=e.max*.7;e.shMax=e.sh}
  if(w.carry&&L.length)L[0].carry=w.carry;
}

/* ============ 탄 발사 유틸 ============ */
const angTo=(x,y)=>Math.atan2(P.y-y,P.x-x);
function eb(x,y,a,sp,k,o){if(G.bullets.length>650)return null;const b={x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,k,r:BK[k].r,t:0};if(o)Object.assign(b,o);G.bullets.push(b);return b}
function fan(x,y,a,n,spread,sp,k,o){for(let i=0;i<n;i++){const aa=n===1?a:a-spread/2+spread*i/(n-1);eb(x,y,aa,sp,k,o)}}
function ring(x,y,n,sp,k,off,o){for(let i=0;i<n;i++)eb(x,y,(off||0)+TAU*i/n,sp,k,o)}
function addLaser(x,y,a,own,o){G.lasers.push(Object.assign({x,y,a,own,t:0,warn:62,on:36,w:16},o||{}));sfx('laser')}

function eFire(e){
  const S=bspd(),si=G.si,a=angTo(e.x,e.y),split=GIM().split;
  switch(e.type){
    case 'imp':if(split&&Math.random()<.25)eb(e.x,e.y,a,S*.8,'bSp',{split:50});else fan(e.x,e.y,a,si>=6?2:1,.22,S,'bS');break;
    case 'wisp':if(si>=3||e.ef)eb(e.x,e.y,a,S*.75,'bC');break;
    case 'harpy':fan(e.x,e.y,a,3,.4,S,'bS');break;
    case 'gargoyle':fan(e.x,e.y+10,a,5,.7,S*.95,'bM');e.n2=(e.n2||0)+1;if(si>=3&&e.n2%2===0)ring(e.x,e.y,12+si,S*.7,'bS',e.t*.1);break;
    case 'turret':e.burst=3;break;
    case 'golem':ring(e.x,e.y,14+si,S*.72,'bM',e.t*.05);if(split)eb(e.x,e.y,a,S*.6,'bSp',{split:55});break;
    case 'fist':fan(e.x,e.y+10,a,3,.35,S*.9,'bM');break;
    case 'cannon':e.burst=2;break;
    case 'clone':fan(e.x,e.y+20,a,3,.3,S*.9,'bM');break;
    case 'caster':addLaser(e.x,e.y+6,a,e);break;
  }
}

/* ============ 보스 패턴 ============ */
const PAT={
  aim(b,o){fan(b.x,b.y+30,angTo(b.x,b.y+30),o.n||1,o.s||.5,bspd()*(o.v||1),o.k||'bM')},
  burst(b,o){fan(b.x,b.y+30,angTo(b.x,b.y+30),o.n,.12,bspd()*(o.v||1.2),o.k||'bN')},
  ring(b,o){ring(b.x,b.y+10,o.n,bspd()*o.v,o.k,b.pt*.02*(o.rot||1))},
  spiral(b,o){b.spin=(b.spin||0)+o.rot;for(let i=0;i<o.arms;i++)eb(b.x,b.y+10,b.spin+TAU*i/o.arms,bspd()*o.v,o.k)},
  spiral2(b,o){b.spin2=(b.spin2||0)+o.rot;for(let i=0;i<o.arms;i++)eb(b.x,b.y+10,b.spin2+TAU*i/o.arms,bspd()*o.v,o.k)},
  rain(b,o){for(let i=0;i<o.n;i++)eb(rnd(10,W-10),-8,Math.PI/2+rnd(-.12,.12),bspd()*o.v*rnd(.8,1.2),o.k)},
  wave(b,o){const off=Math.random()*TAU;for(let i=0;i<o.n;i++)eb(b.x,b.y+10,off+TAU*i/o.n,bspd()*o.v*(1+.35*Math.sin(i*TAU*3/o.n)),o.k)},

const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const owned=(b,type)=>G.enemies.filter(e=>e.own===b&&!e.dead&&(!type||e.type===type));
function arcHit(b,s,c,half,r0,r1){const dx=s.x-b.x,dy=s.y-b.y,d=Math.hypot(dx,dy);return d>r0&&d<r1&&Math.abs(angDiff(Math.atan2(dy,dx),c))<half}
function sparkAt(x,y){if(Math.random()<.6)part(x,y,{k:'spark',life:8,vx:rnd(-2,2),vy:rnd(0,2)})}
function spawnHelper(b,type,o){const e=addE(type,b.x,b.y,Object.assign({own:b},o));e.score=Math.floor(e.score*.5);return e}
function killOwned(b){for(const e of G.enemies)if(e.own===b&&!e.dead){e.dead=true;explode(e.x,e.y,e.r*2)}}
function gmStart(b,list){b.gms=list||[];b.g={t:0,ghost:false,lock:false,hold:false,alpha:1,sh:0,shCd:0,sa:Math.PI/2,c1:0,c2:0,mode:null,ref:0};for(const k of b.gms)if(GM[k].init)GM[k].init(b)}
function gmReset(b){const g=b.g;g.mode=null;g.c1=0;g.c2=0;g.lock=g.hold=g.ghost=false;g.alpha=1;b.rot=0;if(b.x<-40||b.x>W+40||b.y>H-60||b.y<-60){b.x=b.hx;b.y=b.dying?b.ty:-120}}
function gmMul(b){if(b.g&&b.g.ghost)return 0;let m=1;for(const k of b.gms||[])if(GM[k].mul)m*=GM[k].mul(b);return m}
function gmBlock(b,s){for(const k of b.gms)if(GM[k].block&&GM[k].block(b,s))return true;return false}
function gmUpd(b){b.g.t++;for(const k of b.gms)if(GM[k].upd)GM[k].upd(b)}
function gmDraw(b,u){if(!b.gms)return;for(const k of b.gms)if(GM[k].draw)GM[k].draw(b,u)}
function homeMove(b){if(b.g.lock)return;const tx=clamp(b.hx+Math.sin(b.t*.008)*b.amp,50,W-50),ty=b.ty+Math.sin(b.t*.013)*14;b.x+=(tx-b.x)*.04;b.y+=(ty-b.y)*.05}
const SHC={stone:['#fff4dc','#a8977a','#3a3020'],steel:['#ffffff','#a0aabe','#262c38'],hell:['#ffc0b0','#a8242a','#2a0406']};
const shCols=b=>b.def.arch==='demon'?SHC.hell:G.si>=8?SHC.steel:SHC.stone;
function arcShield(x,y,r,c,half,cols,k){ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=17;ctx.beginPath();ctx.arc(x+3,y+5,r,c-half,c+half);ctx.stroke();
  ctx.strokeStyle=cols[2];ctx.lineWidth=15;ctx.beginPath();ctx.arc(x,y,r,c-half,c+half);ctx.stroke();
  ctx.strokeStyle=cols[1];ctx.lineWidth=11;ctx.stroke();
  ctx.strokeStyle=cols[0];ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r-3,c-half*.9,c+half*.9);ctx.stroke();
  ctx.fillStyle=cols[0];for(let i=-2;i<=2;i++){const a=c+i*half*.42;ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,1.6,0,TAU);ctx.fill()}
  if(k!==undefined&&k<.6){ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=1.3;for(let i=0;i<3;i++){const a=c+(i-1)*half*.5;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(r-6),y+Math.sin(a)*(r-6));ctx.lineTo(x+Math.cos(a+.07)*r,y+Math.sin(a+.07)*r);ctx.lineTo(x+Math.cos(a-.03)*(r+6),y+Math.sin(a-.03)*(r+6));ctx.stroke()}}
  ctx.restore()}
function warnText(t,x,y){ctx.fillStyle='rgba(255,230,120,.9)';ctx.font='800 16px Cinzel,serif';ctx.textAlign='center';ctx.fillText(t,x,y)}

      if(g.sh<=0){sfx('shield');const x=b.x+Math.cos(g.sa)*(b.r+18),y=b.y+Math.sin(g.sa)*(b.r+18);explode(x,y,30);part(x,y-10,{k:'txt',life:50,txt:'방패 파괴!',vy:-.6,col:'#ffe0a0',big:1})}return true},
    draw(b,u){if(u)return;const g=b.g;if(g.sh>0)arcShield(b.x,b.y,b.r+18,g.sa,.8,shCols(b),g.sh/g.shMax);else if(g.shCd>320&&(g.shCd>>2)%2){ctx.globalAlpha=.35;arcShield(b.x,b.y,b.r+18,g.sa,.8,shCols(b));ctx.globalAlpha=1}}},

  escort:{upd(b){const t=b.def.escT||'wisp';if(b.g.t%100===1&&owned(b,t).length<5)spawnHelper(b,t,{ai:'orbit',oa:b.g.t*.7,or:b.r+36,os:.022,ef:1})}},

  blink:{upd(b){const g=b.g;g.c1++;const c=g.c1;

      else if(g.mode==='go'){b.x+=g.vx;b.y+=g.vy;if(d2(b.x,b.y,g.tx,g.tyy)<120||g.c2>70){g.mode='back';g.c2=0;ring(b.x,b.y,12,bspd()*.6,'bM',0)}}

    draw(b,u){const g=b.g;if(!u||g.mode!=='tele')return;ctx.strokeStyle='rgba(255,70,60,.75)';ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(g.tx,g.tyy);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(g.tx,g.tyy,30,0,TAU);ctx.stroke()}},

  showOv(`<div class="panel" style="max-width:440px"><h2 class="ttl">영웅 선택</h2><div class="sub2">CHOOSE YOUR HERO</div><div class="cards">${CHARS.map((c,i)=>`<button class="card" data-act="pick" data-c="${i}"><canvas data-pc="${i}" width="168" height="168"></canvas><b>${c.name}</b><i>${c.hero}</i><i style="color:#ffd38a">속성 · ${c.el}</i><p>${c.desc}</p><div class="bm">폭탄 · ${c.bomb}<br><span style="color:#d9cff2">${c.btype}</span></div><div class="stats">${['화력','범위','속도'].map((s,k)=>`<span>${s}</span><span class="bar"><span style="width:${c.st[k]*20}%"></span></span>`).join('')}</div></button>`).join('')}</div><button class="gbtn sub" data-act="title">돌아가기</button></div>`);
  ov.querySelectorAll('canvas[data-pc]').forEach(c=>{const i=+c.dataset.pc;const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);const s=pSpr(i,1);g.drawImage(s,0,0,s.width,s.height,4,4,160,160)})}
function showPause(){showOv(`<div class="panel"><h2 class="ttl">일시정지</h2><div class="sub2">PAUSED</div>
  <div class="kv"><dt>스테이지</dt><dd>${G.si+1} · ${STAGES[G.si].name}</dd><dt>점수</dt><dd>${fmt(G.score)}</dd><dt>누적 플레이</dt><dd>${fmtTime(Math.floor(G.playF/60))}</dd><dt>스테이지 속성</dt><dd>${STAGE_EL[G.si].icon} ${STAGE_EL[G.si].el}</dd><dt>내 공격력</dt><dd>${mulParts().map(p=>ELN[p.el]+' ×'+p.m).join(' · ')}</dd></div>
  <button class="gbtn" data-act="resume">계속하기</button><div class="row2"><button class="gbtn sub" data-act="help">조작법</button><button class="gbtn sub" data-act="settings">설정</button></div><button class="gbtn sub" data-act="quit">포기하고 기록 남기기</button></div>`)}
function showOver(){showOv(`<div class="panel"><h2 class="ttl" style="color:#ff9a8a">추락했습니다</h2><div class="sub2">GAME OVER</div>
  <div class="big">${fmt(G.score)}</div><div class="kv"><dt>도달</dt><dd>STAGE ${G.si+1}</dd><dt>이어하기</dt><dd>${G.cont}회</dd></div>
  <button class="gbtn" data-act="continue">이어하기 (점수 0부터 다시)</button><button class="gbtn sub" data-act="quit">여기까지 — 기록 남기기</button>
  <div class="foot">이어하면 지금 스테이지에서 다시 날지만 점수는 초기화되고 이어하기 횟수가 기록에 남습니다.</div></div>`)}
function showResult(clear){
  showOv(`<div class="panel"><h2 class="ttl">${clear?'마왕을 쓰러뜨렸다!':'비행 기록'}</h2><div class="sub2">${clear?'ALL CLEAR':'RESULT'}</div>
  <div class="big">${fmt(G.score)}</div>
  <div class="kv"><dt>영웅</dt><dd>${CHARS[P.c].name}</dd><dt>도달</dt><dd>STAGE ${G.si+1}${clear?' 클리어':''}</dd>${clear?`<dt>잔기 보너스</dt><dd>${fmt(G.lifeBonus||0)}</dd>`:''}<dt>격파</dt><dd>${fmt(G.kills)}</dd><dt>플레이 시간</dt><dd>${fmtTime(Math.floor(G.playF/60))}</dd></div>
  <label class="field" for="nm">기록에 남길 이름 (최대 12자)</label><input id="nm" class="inp" maxlength="12" value="${esc(settings.name||'')}" placeholder="이름을 적어 주세요" autofocus>
  <button class="gbtn" data-act="save">기록 저장하고 공유 문구 만들기</button><button class="gbtn sub" data-act="title">저장하지 않고 타이틀로</button></div>`)}
function showShare(r){
  const txt=shareText(r);
  showOv(`<div class="panel"><h2 class="ttl">기록 저장 완료</h2><div class="sub2">SHARE YOUR SCORE</div>
  <p class="tag" style="margin:4px 0 0">아래 문구를 블로그에 붙여넣으세요. 검증코드가 함께 들어 있어요.</p>
  <textarea class="share" id="shtxt" readonly>${esc(txt)}</textarea><div class="msg" id="shmsg"></div>
  <button class="gbtn" data-act="copy">점수 복사하기</button><div class="row2"><button class="gbtn sub" data-act="records">명예의 전당</button><button class="gbtn sub" data-act="title">타이틀로</button></div></div>`)}
function showRecords(){const list=records();
  showOv(`<div class="panel"><h2 class="ttl">명예의 전당</h2><div class="sub2">HALL OF FAME</div>
  ${list.length?`<ol class="rec">${list.map((r,i)=>`<li><span class="n">${i+1}</span><span class="who">${esc(r.name)} · ${CHARS[r.c].name}<small>${fmt(r.score)}점 · STAGE ${r.stage}${r.clear?' 클리어':''} · ${fmtDate(r.date)}</small></span><button data-act="copyrec" data-i="${i}">복사</button></li>`).join('')}</ol>`:'<p class="tag">아직 기록이 없어요. 첫 비행을 남겨 보세요.</p>'}
  <div class="msg" id="shmsg"></div><button class="gbtn sub" data-act="back">돌아가기</button></div>`)}
function showHelp(){
  showOv(`<div class="panel help"><h2 class="ttl" style="text-align:center">조작법</h2>
  <h3>PC</h3><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Z</kbd>/<kbd>Space</kbd> 누르고 있으면 공격 · <kbd>X</kbd> 폭탄 · <kbd>Shift</kbd> 정밀 이동(판정점 표시) · <kbd>P</kbd>/<kbd>Esc</kbd> 일시정지
  <h3>모바일</h3>화면 아무 곳이나 대고 끌면 그만큼 이동합니다(손가락이 기체를 가리지 않아요). 공격은 자동, 폭탄은 오른쪽 아래 버튼. 설정에서 “좌우 터치” 방식으로 바꾸면 화면 왼쪽·오른쪽을 누르는 동안 그쪽으로 움직입니다.
  <h3>아이템</h3><b style="color:#ff8a8a">P</b> 공격 단계 상승(최대 4) · <b style="color:#8ab0ff">B</b> 폭탄 +1(최대 6) · 금화는 점수. 금빛으로 빛나는 적은 아이템을 반드시 떨어뜨립니다. 격추되면 공격 단계가 1로, 폭탄이 0으로 돌아가고 가지고 있던 P와 B가 허공에 흩어집니다. 흩어진 아이템은 약 13초 동안 떠다니니 다시 주워 담으세요(부활 시 폭탄 1개 지급).
  <h3>속성과 상성</h3>영웅마다 속성이 있습니다 — 기사 빛, 법사 불·얼음·번개(번갈아 발사), 드워프 대지, 궁수 바람. 스테이지 속성에 따라 공격력이 오르내리고, 스테이지마다 환경 효과도 걸립니다.${elemTable()}
  <h3>판정</h3>기체 중앙의 작은 점만 피격 판정이 있습니다. 스테이지마다 약 40초에 중간보스, 1분 30초 무렵 보스가 나타나며, 보스마다 고유한 기믹이 있습니다. 경고 화면 아래 줄에 공략 힌트가 뜹니다.
  <button class="gbtn sub" data-act="back" style="margin-top:16px">돌아가기</button></div>`)}
function elemTable(){return `<table class="etab"><tr><th>스테이지</th><th>환경 효과</th><th>강해짐</th><th>약해짐</th></tr>${STAGE_EL.map((s,i)=>{const up=Object.entries(s.aff).filter(e=>e[1]>1).map(e=>ELN[e[0]]+' ×'+e[1]).join('<br>')||'—',dn=Object.entries(s.aff).filter(e=>e[1]<1).map(e=>ELN[e[0]]+' ×'+e[1]).join('<br>')||'—';return `<tr><td>${i+1}. ${s.icon} ${s.el}</td><td>${s.env}</td><td class="up">${up}</td><td class="dn">${dn}</td></tr>`}).join('')}</table>`}
function showSettings(){
  showOv(`<div class="panel help"><h2 class="ttl" style="text-align:center">설정</h2>
  <h3>모바일 이동 방식</h3><div class="seg"><button data-act="ctrl" data-v="drag" class="${settings.ctrl==='drag'?'on':''}">드래그</button><button data-act="ctrl" data-v="lr" class="${settings.ctrl==='lr'?'on':''}">좌우 터치</button></div>
  <h3>드래그 감도</h3><div class="seg">${[1,1.25,1.6].map(v=>`<button data-act="sens" data-v="${v}" class="${settings.sens===v?'on':''}">${v===1?'보통':v===1.25?'조금 빠르게':'빠르게'}</button>`).join('')}</div>
  <h3>효과음</h3><div class="seg"><button data-act="snd" data-v="1" class="${settings.sound?'on':''}">켜기</button><button data-act="snd" data-v="0" class="${!settings.sound?'on':''}">끄기</button></div>
  <button class="gbtn sub" data-act="back">돌아가기</button></div>`)}
let backTo='title';
function goBack(){if(backTo==='pause'){showPause()}else if(backTo==='share'&&lastRec){showShare(lastRec)}else showTitle()}
let lastRec=null;
ov.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
  switch(a){
    case 'select':showSelect();break;
    case 'title':showTitle();break;
    case 'pick':hideOv();newGame(+b.dataset.c);break;
    case 'records':backTo=state==='end'?'share':'title';showRecords();break;
    case 'help':backTo=state==='pause'?'pause':'title';showHelp();break;
    case 'settings':backTo=state==='pause'?'pause':'title';showSettings();break;
    case 'back':goBack();break;
    case 'resume':resume();break;
    case 'quit':state='end';showResult(false);break;
    case 'continue':G.cont++;G.score=0;G.next1up=[300000,800000,1500000];P.lives=3;P.bombs=3;P.dead=0;P.x=W/2;P.y=H+40;P.inv=200;state='play';hideOv();break;
    case 'save':{const nm=$('nm')?$('nm').value:'';lastRec=saveRecord(nm);showShare(lastRec);break}
    case 'copy':{const ok=await copyText($('shtxt').value);$('shmsg').textContent=ok?'복사했어요. 블로그에 붙여넣으세요.':'자동 복사가 막혀 있어요. 위 칸을 길게 눌러 직접 복사해 주세요.';if(!ok){$('shtxt').focus();$('shtxt').select()}break}
    case 'copyrec':{const r=records()[+b.dataset.i];if(r){const ok=await copyText(shareText(r));$('shmsg').textContent=ok?'복사했어요.':'자동 복사가 막혀 있어요.'}break}
    case 'ctrl':settings.ctrl=b.dataset.v;saveSettings();showSettings();break;
    case 'sens':settings.sens=+b.dataset.v;saveSettings();showSettings();break;
    case 'snd':settings.sound=b.dataset.v==='1';saveSettings();showSettings();break;
  }
});

/* ============ 입력 ============ */
function setTouch(v){if(touchMode===v)return;touchMode=v}
function syncButtons(){
  const playing=state==='play'||state==='pause';
  $('btnPause').classList.toggle('on',playing&&state==='play');
  const bb=$('btnBomb');bb.classList.toggle('on',touchMode&&state==='play');bb.classList.toggle('empty',!!G&&P.bombs<=0);
}
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  const k=e.key.toLowerCase();
  if(state==='play'&&['arrowup','arrowdown','arrowleft','arrowright',' ','z','x'].includes(k))e.preventDefault();
  if(!e.repeat){if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','z',' '].includes(k))setTouch(false)}
  keys[k]=true;if(k==='shift')keys.shift=true;
  if((k==='x'||k==='k')&&!e.repeat&&state==='play')wantBomb=true;
  if((k==='p'||k==='escape')&&!e.repeat){if(state==='play'||state==='pause')togglePause()}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='shift')keys.shift=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.pointerType==='pen')setTouch(true);
  if(state!=='play')return;e.preventDefault();ac();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(touchMode&&settings.ctrl==='lr'){const r=cv.getBoundingClientRect();lrDir=e.clientX<r.left+r.width/2?-1:1;drag={id:e.pointerId,lr:1};return}
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;e.preventDefault();
  if(drag.lr){const r=cv.getBoundingClientRect();lrDir=e.clientX<r.left+r.width/2?-1:1;return}
  const k=settings.sens/SCALE;pend.x+=(e.clientX-drag.x)*k;pend.y+=(e.clientY-drag.y)*k;drag.x=e.clientX;drag.y=e.clientY;
});
const endDrag=e=>{if(drag&&drag.id===e.pointerId){drag=null;lrDir=0}};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('btnBomb').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setTouch(true);if(state==='play')wantBomb=true});
$('btnPause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();togglePause()});
const stageEl=$('stage');
['contextmenu','dblclick','selectstart','dragstart'].forEach(ev=>stageEl.addEventListener(ev,e=>{if(!(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))e.preventDefault()}));
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTouchEnd=0;
stageEl.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=320&&!(e.target.closest&&e.target.closest('.ov')))e.preventDefault();lastTouchEnd=now},{passive:false});
stageEl.addEventListener('touchmove',e=>{if(state==='play')e.preventDefault()},{passive:false});

/* ============ 시작 ============ */
touchMode=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
addEventListener('resize',fit);
window.__AW={update,newGame,startStage,P,get G(){return G},set state(v){state=v},get state(){return state},render,triggerBomb,BOSSES,makeCode,readCode};
fit();showTitle();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
