<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아발론 스트라이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0e22;--lapis:#23306b;--lapis2:#33449a;--gold:#e6b84a;--gold-d:#9c6f1f;--rubric:#c23a2b;--vellum:#eadfba;--moss:#6cc35e;--px:'Press Start 2P',monospace;--ko:'Song Myung','Nanum Myeongjo','Batang',serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--vellum);font-family:var(--ko);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 0%,#1a2050 0,var(--ink) 70%)}
#bar{width:100%;height:30px;flex:0 0 30px;display:flex;align-items:center;gap:6px;padding:0 6px;background:#070818;border-bottom:2px solid var(--gold-d);overflow:hidden}
#stgLbl{font-family:var(--px);font-size:9px;color:var(--gold);white-space:nowrap}
#stgName{font-size:14px;white-space:nowrap;color:var(--vellum)}
#fx{display:flex;gap:4px;flex:1;overflow:hidden;min-width:0}
.chip{font-size:12px;padding:1px 6px;white-space:nowrap;border:1px solid}
.chip.g{color:#bff0b5;border-color:#3d7a35;background:#12281180}
.chip.b{color:#ffc0b5;border-color:#8a2c22;background:#2c0f0c80}
.ib{width:26px;height:22px;border:0;background:var(--lapis);font-family:var(--px);font-size:9px;box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;flex:0 0 auto}
.ib:active{background:var(--lapis2)}
#main{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;min-height:0}
#stage{position:relative;flex:0 0 auto;background:#000}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{position:relative;width:100%;flex:0 0 auto;display:none;z-index:3}
#ovTitle.dim{background:linear-gradient(#0c0e2255,#0c0e22dd)}
body.touch #pad{display:block}
body.land #pad{position:absolute;left:0;right:0;bottom:0;height:100%!important;pointer-events:none}
#joy{position:absolute;left:0;top:0;bottom:0;width:50%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid #e6b84a66;background:#23306b44;display:none;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#e6b84acc;box-shadow:0 0 0 3px #000}
#joyHint{position:absolute;left:25%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#eadfba88;pointer-events:none;text-align:center}
body.land #joyHint{display:none}
#btns{position:absolute;right:8px;bottom:10px;width:min(48%,230px);height:min(92%,200px);pointer-events:none}
.tb{position:absolute;border:0;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.1;color:#fff;box-shadow:0 4px 0 #000,inset 0 -4px 0 #0005}
.tb small{font-family:var(--px);font-size:8px;opacity:.8;margin-top:2px}
.tb.on{transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 -2px 0 #0005;filter:brightness(1.25)}
#bShot{right:0;bottom:0;width:86px;height:86px;background:#b23326}
#bChg{right:94px;bottom:6px;width:66px;height:66px;background:#2f5bb8}
#bBomb{right:18px;bottom:96px;width:62px;height:62px;background:#7a4bb0}
#bAuto{right:104px;bottom:86px;width:46px;height:46px;background:#3a3f55;font-size:11px}
#bAuto.act{background:#3d7a35}
body.land #btns{opacity:.78}
.cdmask{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000a var(--cd,0turn),transparent 0);pointer-events:none}
/* overlays */
.ov{position:absolute;inset:0;display:none;touch-action:pan-y;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto;z-index:5}
.ov.show{display:flex;justify-content:flex-start}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.dim{background:linear-gradient(#0c0e22cc,#0c0e22ee)}
#banner{position:absolute;inset:0;display:none;pointer-events:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;text-align:center}
#banner.show{display:flex}
.bn-box{background:#070818dd;padding:.6em 1.1em;box-shadow:0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold);max-width:92%}
.bn-en{font-family:var(--px);color:var(--gold);font-size:calc(var(--u,1)*9px)}
.bn-ko{font-size:calc(var(--u,1)*17px);margin:.15em 0 .3em}
.bn-fx{font-size:calc(var(--u,1)*8px);line-height:1.45}
.bn-fx .g{color:#bff0b5}.bn-fx .b{color:#ffb0a2}
.bn-tally{font-size:calc(var(--u,1)*8.5px);line-height:1.6;text-align:left}
.bn-tally b{font-family:var(--px);font-weight:400;color:var(--gold);font-size:.8em;float:right;margin-left:1.5em}
/* title */
.ttl{font-size:clamp(34px,9vw,72px);line-height:1;color:var(--gold);text-shadow:3px 3px 0 var(--rubric),6px 6px 0 #000;letter-spacing:.02em}
.ttl-en{font-family:var(--px);font-size:clamp(10px,2.2vw,16px);color:var(--vellum);margin:.9em 0 .4em;letter-spacing:.2em}
.lead{font-size:clamp(14px,2.6vw,18px);max-width:34em;line-height:1.6;color:#d8cfae;margin:.4em auto}
.blink{animation:bl 1s steps(2) infinite;font-family:var(--px);font-size:clamp(10px,2vw,14px);color:#fff;margin-top:1.2em}
@keyframes bl{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.btn{border:0;background:var(--lapis);padding:.55em 1.1em;margin:.3em;font-size:15px;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 0 -3px 0 #0006}
.btn.pri{background:var(--rubric);color:#fff}
.btn:focus-visible,.card:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.keys{font-size:13px;color:#b9b08f;margin-top:1em;line-height:1.7}
.keys kbd{font-family:var(--px);font-size:9px;background:#23306b;padding:2px 5px;color:#fff;margin:0 2px}
/* select */
.sel-h{font-size:clamp(18px,4vw,26px);color:var(--gold);margin:0 0 .5em}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,560px)}
@media (min-aspect-ratio:3/2){#cards{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,760px)}}
.card{border:0;background:#141a3c;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.card canvas{width:100%;max-width:96px;aspect-ratio:4/3;image-rendering:pixelated;background:linear-gradient(#2a3a7a,#141a3c)}
.card span{font-size:15px;margin-top:3px}
.card.sel{background:#3b2a12;box-shadow:0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold)}
#info{width:min(100%,560px);margin-top:12px;text-align:left;background:#0a0d24;padding:10px 12px;box-shadow:0 -3px 0 0 var(--gold-d),0 3px 0 0 var(--gold-d),-3px 0 0 0 var(--gold-d),3px 0 0 0 var(--gold-d);font-size:14px;line-height:1.55;min-height:9.5em}
#info h3{margin:0 0 .3em;font-weight:400;font-size:17px;color:var(--gold)}
.st{display:flex;align-items:center;gap:8px;font-size:12px}
.st i{display:inline-block;width:10px;height:8px;background:#2b2f4a;margin-right:2px}
.st i.f{background:var(--gold)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin-top:.35em}
.dl dt{color:#b9b08f}.dl dd{margin:0}
/* result */
#rs{width:min(100%,520px)}
#rs h2{font-family:var(--px);font-weight:400;font-size:clamp(16px,4vw,24px);color:var(--gold);margin:0 0 .5em}
.rg{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;text-align:left;font-size:15px;background:#0a0d24;padding:10px 14px;box-shadow:0 -3px 0 0 var(--gold-d),0 3px 0 0 var(--gold-d),-3px 0 0 0 var(--gold-d),3px 0 0 0 var(--gold-d)}
.rg dt{color:#b9b08f}.rg dd{margin:0;text-align:right}
.nm{display:flex;gap:6px;margin:12px 0 6px}
.nm input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border:0;background:#eadfba;color:#111;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shtxt{width:100%;height:9.5em;font-size:12px;line-height:1.45;background:#05061299;color:#eadfba;border:1px solid #9c6f1f;padding:8px;resize:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shmsg{font-size:13px;min-height:1.4em;color:#bff0b5}
.recs{width:min(100%,520px);font-size:13px;text-align:left;margin-top:8px}
.recs li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted #33406b}
.recs li b{font-family:var(--px);font-weight:400;font-size:9px;color:var(--gold)}
.cnt{font-family:var(--px);font-size:clamp(40px,12vw,80px);color:var(--gold);text-shadow:4px 4px 0 var(--rubric)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="stgLbl">AVALON</span><span id="stgName">아발론 스트라이커</span>
    <div id="fx"></div>
    <button class="ib" id="bSnd" aria-label="효과음 켜기/끄기">♪</button>
    <button class="ib" id="bFs" aria-label="전체 화면">⛶</button>
    <button class="ib" id="bPause" aria-label="일시정지">II</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv" width="320" height="180"></canvas>
      <div id="banner"></div>
    </div>
    <div id="pad">
      <div id="joy"><div id="joyHint">이 영역에서<br>조이스틱 이동</div><div id="joyBase"><div id="joyKnob"></div></div></div>
      <div id="btns">
        <button class="tb" id="bShot">공격<small>Z</small></button>
        <button class="tb" id="bChg">기<small>X</small><span class="cdmask" id="cdm"></span></button>
        <button class="tb" id="bBomb">폭탄<small>C</small></button>
        <button class="tb" id="bAuto">자동</button>
      </div>
    </div>

    <div class="ov show dim" id="ovTitle">
      <div class="ttl">아발론 스트라이커</div>
      <div class="ttl-en">AVALON STRIKER</div>
      <p class="lead">성배를 빼앗은 마왕 벨제리온을 쫓아 열 개의 땅을 날아간다. 영웅을 고르고, 하늘을 가르는 원정을 시작하라.</p>
      <div class="blink" id="pressStart">PRESS SPACE</div>
      <div>
        <button class="btn pri" id="bStart">원정 시작</button>
        <button class="btn" id="bRecs">내 기록</button>
      </div>
      <div class="keys" id="keyHelp"><kbd>←↑↓→</kbd>이동 <kbd>Z</kbd>공격 <kbd>X</kbd>기 모아 쏘기 <kbd>C</kbd>폭탄 <kbd>SPACE</kbd>시작 <kbd>P</kbd>일시정지</div>
    </div>

    <div class="ov dim" id="ovSel">
      <h2 class="sel-h" id="selH">출격할 영웅을 고르세요</h2>
      <div id="cards"></div>
      <div id="info"></div>
      <div style="margin-top:10px">
        <button class="btn" id="bSelBack">뒤로</button>
        <button class="btn pri" id="bGo">출격</button>
      </div>
    </div>

    <div class="ov dim" id="ovCont">
      <div class="ttl-en" style="margin-top:0">CONTINUE?</div>
      <div class="cnt" id="cntN">9</div>
      <p class="lead">이어하면 지금 스테이지부터 다시 시작하고 점수는 0이 됩니다.</p>
      <div><button class="btn pri" id="bCont">이어하기</button><button class="btn" id="bQuit">그만하기</button></div>
    </div>

    <div class="ov dim" id="ovPause">
      <div class="ttl-en" style="margin-top:0">PAUSE</div>
      <div><button class="btn pri" id="bResume">계속하기</button><button class="btn" id="bToTitle">타이틀로</button></div>
    </div>

    <div class="ov dim" id="ovRes">
      <div id="rs">
        <h2 id="rsH">GAME OVER</h2>
        <dl class="rg" id="rsG"></dl>
        <div class="nm"><input id="nmIn" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="off"><button class="btn pri" id="bMake" style="margin:0">기록 복사</button></div>
        <textarea id="shtxt" readonly></textarea>
        <div id="shmsg"></div>
        <div><button class="btn" id="bAgain">같은 영웅으로 다시</button><button class="btn" id="bSel2">영웅 다시 고르기</button></div>
      </div>
    </div>

    <div class="ov dim" id="ovRecs">
      <h2 class="sel-h">내 기록</h2>
      <ul class="recs" id="recList" style="list-style:none;padding:0"></ul>
      <div id="recMsg" style="font-size:13px;color:#bff0b5;min-height:1.3em"></div>
      <button class="btn" id="bRecBack">닫기</button>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const W=320,H=180,TAU=Math.PI*2;
const cv=$('cv');let g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const VERIFY_URL='https://claude.ai/artifact/JQ3UFTEPe6v14D3iPgEzdS';
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 도트 그리기 ---------- */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function C(x,y,r,c){x=Math.round(x);y=Math.round(y);r=Math.max(0,Math.round(r));g.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r*.8));g.fillRect(x-w,y+dy,w*2+1,1)}}
function ring(x,y,r,c){x=Math.round(x);y=Math.round(y);g.fillStyle=c;const n=Math.max(12,r*6);for(let i=0;i<n;i++){const a=i/n*TAU;g.fillRect(Math.round(x+Math.cos(a)*r),Math.round(y+Math.sin(a)*r),1,1)}}
function T(s,x,y,c,al,sz){g.font=(sz||8)+'px "Press Start 2P",monospace';g.textAlign=al||'left';g.textBaseline='top';g.fillStyle='#000';g.fillText(s,Math.round(x)+1,Math.round(y)+1);g.fillStyle=c;g.fillText(s,Math.round(x),Math.round(y))}
const bulletCache={};
function bulletSpr(r,col){const k=r+col;if(bulletCache[k])return bulletCache[k];const s=r*2+5,c=document.createElement('canvas');c.width=c.height=s;const p=g;g=c.getContext('2d');const m=s/2-.5;C(m,m,r+1,'#1a0610');C(m,m,r,col);C(m-r*.25,m-r*.25,Math.max(0,r-2),'#fff');g=p;bulletCache[k]=c;return c}

/* ---------- 영웅 ---------- */
const HEROES=[
 {id:'knight',name:'기사',en:'KNIGHT',title:'은빛 맹세의 기사 레오릭',spd:1.55,ccd:6,armor:0,bomb:2,coin:1,stats:[3,4,3],
  pal:{cape:'#2b4fa8',body:'#9aa7bd',trim:'#3a3f55',skin:'#f0c39a',hat:'#c9d2e0',acc:'#d8343a',weap:'#eef3ff'},
  shot:'곧게 뻗는 랜스 투척',charge:'성창 돌격 — 화면을 꿰뚫는 빛의 창, 닿은 적탄 소거',bmb:'성검의 빛',trait:'균형 잡힌 정면 화력'},
 {id:'mage',name:'마법사',en:'MAGE',title:'별을 읽는 마법사 엘드윈',spd:1.3,ccd:7,armor:0,bomb:2,coin:1,stats:[2,3,5],
  pal:{cape:'#5b2a8a',body:'#7a3fb0',trim:'#e6b84a',skin:'#f0c39a',hat:'#4a2275',acc:'#ffd76a',weap:'#8a5a2b'},
  shot:'적을 쫓아가는 유도 마력탄',charge:'화염구 — 닿으면 넓게 폭발',bmb:'운석 낙하',trait:'조준이 필요 없는 유도탄'},
 {id:'archer',name:'궁수',en:'ARCHER',title:'숲의 명사수 로웨나',spd:1.9,ccd:5,armor:0,bomb:2,coin:1,stats:[5,3,3],
  pal:{cape:'#2f6b34',body:'#4f8a3c',trim:'#6b4a2a',skin:'#f0c39a',hat:'#3c7a3a',acc:'#e6b84a',weap:'#a0703a'},
  shot:'부채꼴로 퍼지는 화살',charge:'관통 화살 일제 사격',bmb:'화살비',trait:'빠른 이동, 넓은 사격 범위'},
 {id:'smith',name:'대장장이',en:'SMITH',title:'강철 손 대장장이 브론',spd:1.2,ccd:7,armor:1,bomb:2,coin:1,stats:[1,5,4],
  pal:{cape:'#7a3d1c',body:'#8a5a34',trim:'#3a2a20',skin:'#e0a77e',hat:'#e0a77e',acc:'#c9792b',weap:'#8d96a8'},
  shot:'가까울수록 강한 쇳조각 산탄',charge:'모루 낙하 — 앞쪽에 모루 다섯 개',bmb:'용광로 폭발',trait:'갑옷이 피격을 1회 막아 줌'},
 {id:'rogue',name:'도적',en:'ROGUE',title:'그림자 도적 니아',spd:2.15,ccd:10,armor:0,bomb:2,coin:1.25,stats:[5,2,4],
  pal:{cape:'#262a3a',body:'#3a3f55',trim:'#8a2c22',skin:'#f0c39a',hat:'#1c1f2c',acc:'#c23a2b',weap:'#d8dde8'},
  shot:'빠른 단검 연사',charge:'그림자 분신 — 6초 동안 분신 둘이 함께 공격',bmb:'연막 습격',trait:'가장 빠름, 코인 점수 +25%'},
 {id:'saint',name:'성녀',en:'SAINT',title:'성배의 성녀 이졸데',spd:1.5,ccd:9,armor:0,bomb:3,coin:1,stats:[3,4,5],hidden:true,
  pal:{cape:'#f2f0ff',body:'#e8e4f8',trim:'#e6b84a',skin:'#f6d1b0',hat:'#ffffff',acc:'#ffe680',weap:'#e6b84a'},
  shot:'앞뒤로 쏘는 성광 구슬',charge:'성역 결계 — 다가오는 적탄을 지움',bmb:'성배의 심판',trait:'숨겨진 영웅, 폭탄 3개로 시작'}
];

function drawHero(id,x,y,f,ghost){
 const h=HEROES[id],P=h.pal;x=Math.round(x);y=Math.round(y);const fl=(f>>3)&1;

function update(){
 t++;run.frames++;scroll+=1;if(shake>0)shake--;if(flashT>0)flashT--;

 // 환경

 if(st.env==='storm'&&bossState<3&&t>=env.nextBolt){env.nextBolt=t+ri(6,9)*60;hz({type:'col',x:clamp(P.x+rnd(-30,30),10,W-20)-5,w:10,warn:44,life:12,sty:'bolt'})}

   if(b.tg&&!b.tg.dead){const a=Math.atan2(b.tg.y-b.y,b.tg.x-b.x),c=Math.atan2(b.vy,b.vx);let da=a-c;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;const na=c+clamp(da,-.13,.13);b.vx=Math.cos(na)*4.4;b.vy=Math.sin(na)*4.4}}

 }

 }
 // 적탄
 for(const b of EB){if(b.dead)continue;b.t++;
  if(b.wait>0){if(--b.wait===0&&b.fall)b.vy=3*ebsp();continue}
  if(b.rev){if(b.t<b.rev){b.vx*=.95;b.vy*=.95}else if(b.t===b.rev){const a=aimA(b.x,b.y);b.vx=Math.cos(a)*b.rs;b.vy=Math.sin(a)*b.rs}}

  if(d<10&&P.dead<=0){it.dead=1;

let lastHero=0;

/* ---------- 이어하기 · 결과 ---------- */
function contTick(){const n=Math.ceil(contT/60)-1;$('cntN').textContent=String(Math.max(0,n));if(--contT<=0)endRun()}
function doContinue(){if(state!=='cont')return;run.cont++;run.score=0;run.chain=0;run.lives=2;const h=HEROES[run.hero];run.bombs=Math.max(run.bombs,h.bomb);showOv(null);state='play';
 Object.assign(P,{x:-10,y:H/2,inv:160,enter:36,armor:h.armor+mods.armor})}
function endRun(){state='result';hideBanner();run.nonce=run.nonce||(Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36));showResult()}
function clearTick(){scroll+=1;for(const p of PT){p.x+=p.vx;p.y+=p.vy;if(--p.life<=0)p.dead=1}for(const it of IT){it.x+=(P.x-it.x)*.15;it.y+=(P.y-it.y)*.15}sweep();
 if(P.dead<=0)P.x+=(P.x<W*.4?.5:0);if(--clearT<=0){hideBanner();if(stN<10)startStage(stN+1);else{run.clear=true;endRun()}}}

/* ---------- 기록 · 검증코드 ---------- */
const SALT='avalon-striker/luca/v1#3d8e-51ac';
function h53(str,s){let h1=0xdeadbeef^s,h2=0x41c6ce57^s;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function sign(p){const s=SALT+'|'+p+'|'+SALT.length;const a=h53(s,7),b=h53(s+a,131);return(a.toString(36).padStart(11,'0')+b.toString(36).padStart(11,'0')).toUpperCase()}
function b64e(s){const b=new TextEncoder().encode(s);let bin='';for(const x of b)bin+=String.fromCharCode(x);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const RK='avalon-striker-v1';
function records(){try{return JSON.parse(localStorage.getItem(RK)||'[]')}catch(e){return[]}}
function saveRecs(a){try{localStorage.setItem(RK,JSON.stringify(a))}catch(e){}}
const cleanName=s=>(s||'').replace(/[~\n\r\t]/g,'').trim().slice(0,12)||'무명 용사';
const fmtTime=s=>Math.floor(s/60)+'분 '+(s%60)+'초';
const fmtDate=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
function makeRec(name){const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 const r={name:cleanName(name),h:run.hero,score:run.score,stage:run.stage,clear:run.clear,cont:run.cont,secs:Math.floor(run.frames/60),kills:run.kills,miss:run.misses,bombs:run.bombsUsed,chain:run.maxChain,date:run._date||ds,nonce:run.nonce};run._date=r.date;
 const p=['1',r.name,r.h,r.score,r.stage,r.clear?1:0,r.cont,r.secs,r.kills,r.miss,r.bombs,r.chain,r.date,r.nonce].join('~');r.code='AS1.'+b64e(p)+'.'+sign(p);return r}
function shareText(r){const h=HEROES[r.h];return['🏰 아발론 스트라이커 점수 인증','👤 플레이어: '+r.name,'⚔️ 영웅: '+h.name+' ('+h.title+')','🏆 점수: '+fmt(r.score),'🗺️ 도달: STAGE '+r.stage+' / 10'+(r.clear?' · ALL CLEAR':' · '+STAGES[r.stage-1].name),'💀 미스: '+r.miss+'회 · 💣 폭탄 사용: '+r.bombs+'회','💰 최대 코인 체인: '+r.chain,'💥 격파: '+fmt(r.kills),'⏱️ 플레이 시간: '+fmtTime(r.secs),'📅 날짜: '+fmtDate(r.date),'🔐 검증코드: '+r.code,VERIFY_URL.startsWith('http')?'🔎 검증하기: '+VERIFY_URL:'(이 글을 “아발론 스트라이커 점수 검증기”에 붙여넣으면 진위를 확인할 수 있어요)'].join('\n')}
function storeRec(r){const a=records().filter(x=>x.nonce!==r.nonce);a.push(r);a.sort((x,y)=>y.score-x.score);saveRecs(a.slice(0,20))}
let curRec=null;
function showResult(){
 showOv('ovRes');$('rsH').textContent=run.clear?'ALL CLEAR':'GAME OVER';const h=HEROES[run.hero],secs=Math.floor(run.frames/60);
 $('rsG').innerHTML=[['영웅',h.name],['점수',fmt(run.score)],['도달',run.clear?'STAGE 10 · ALL CLEAR':'STAGE '+run.stage+' · '+STAGES[run.stage-1].name],['미스 / 폭탄 사용',run.misses+'회 / '+run.bombsUsed+'회'],['최대 코인 체인',run.maxChain],['격파',fmt(run.kills)],['플레이 시간',fmtTime(secs)]].map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('');
 let nm='';try{nm=localStorage.getItem('avalon-name')||''}catch(e){}$('nmIn').value=nm;
 curRec=makeRec(nm);storeRec(curRec);$('shtxt').value=shareText(curRec);$('shmsg').textContent=nm?'':'이름을 적고 “기록 복사”를 누르세요.';
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
$('bMake').addEventListener('click',async()=>{const nm=cleanName($('nmIn').value);$('nmIn').value=nm;try{localStorage.setItem('avalon-name',nm)}catch(e){}
 curRec=makeRec(nm);storeRec(curRec);const tx=shareText(curRec);$('shtxt').value=tx;const ok=await copyText(tx);
 $('shmsg').textContent=ok?'복사했어요. 블로그 댓글에 붙여넣으세요.':'자동 복사가 막혀 있어요. 위 칸을 길게 눌러 직접 복사해 주세요.';if(!ok){$('shtxt').focus();$('shtxt').select()}});
$('nmIn').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')$('bMake').click()});
function showRecs(){const a=records();$('recList').innerHTML=a.length?a.slice(0,10).map((r,i)=>`<li><span>${i+1}. ${esc(r.name)} · ${HEROES[r.h]?HEROES[r.h].name:'?'} · ${r.clear?'ALL CLEAR':'ST'+r.stage}</span><span><b>${fmt(r.score)}</b> <button class="btn" data-i="${i}" style="font-size:12px;padding:.2em .6em;margin:0 0 0 6px">복사</button></span></li>`).join(''):'<li>아직 기록이 없습니다. 첫 원정을 떠나 보세요.</li>';$('recMsg').textContent='';showOv('ovRecs')}
$('recList').addEventListener('click',async e=>{const b=e.target.closest('button[data-i]');if(!b)return;const r=records()[+b.dataset.i];if(r){const ok=await copyText(shareText(r));$('recMsg').textContent=ok?'복사했어요.':'자동 복사가 막혀 있어요.'}});

/* ---------- 버튼 ---------- */
$('bStart').addEventListener('click',()=>{au();openSelect()});
$('bRecs').addEventListener('click',showRecs);$('bRecBack').addEventListener('click',()=>showOv('ovTitle'));
$('bSelBack').addEventListener('click',()=>{roul=null;$('bGo').textContent='출격';toTitle()});
$('bGo').addEventListener('click',()=>{au();if(roul)stopRoul();else confirmSel()});
$('ovSel').addEventListener('pointerdown',e=>{if(roul&&!e.target.closest('#bSelBack'))stopRoul()});
$('bCont').addEventListener('click',doContinue);$('bQuit').addEventListener('click',()=>{if(state==='cont')endRun()});
$('bAgain').addEventListener('click',()=>startGame(lastHero));$('bSel2').addEventListener('click',openSelect);
$('bResume').addEventListener('click',resume);$('bToTitle').addEventListener('click',toTitle);
$('bPause').addEventListener('click',()=>{if(state==='play')pause();else if(state==='pause')resume()});
$('bSnd').addEventListener('click',()=>{SND=!SND;try{localStorage.setItem('avalon-snd',SND?'1':'0')}catch(e){}$('bSnd').style.opacity=SND?1:.4;if(SND){au();sfx('sel')}});$('bSnd').style.opacity=SND?1:.4;
$('bFs').addEventListener('click',()=>{const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}}});
let pstate='play';
function pause(){if(state!=='play'&&state!=='clear')return;pstate=state;state='pause';showOv('ovPause')}
function resume(){if(state!=='pause')return;state=pstate;showOv(null)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- 키보드 ---------- */
const K={},KP={};
const GAMEKEYS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyP','Escape','Enter'];
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(GAMEKEYS.includes(e.code))e.preventDefault();au();
 if(!K[e.code])KP[e.code]=true;K[e.code]=true;if(!e.repeat)menuKey(e.code)});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false});
function menuKey(c){
 const ok=c==='Space'||c==='Enter'||c==='KeyZ';
 switch(state){
  case 'title':if(ok&&!$('ovRecs').classList.contains('show'))openSelect();break;
  case 'select':if(roul){if(ok)stopRoul();break}
   if(c==='ArrowRight'){selIdx=(selIdx+1)%6;renderSel();sfx('sel')}else if(c==='ArrowLeft'){selIdx=(selIdx+5)%6;renderSel();sfx('sel')}
   else if(c==='ArrowDown'||c==='ArrowUp'){selIdx=(selIdx+3)%6;renderSel();sfx('sel')}else if(ok)confirmSel();else if(c==='Escape'||c==='KeyX')toTitle();break;
  case 'play':if(c==='KeyP'||c==='Escape')pause();break;
  case 'clear':if(c==='KeyP'||c==='Escape')pause();break;
  case 'pause':if(c==='KeyP'||c==='Escape'||c==='Space')resume();break;
  case 'cont':if(ok)doContinue();else if(c==='Escape'||c==='KeyX'||c==='KeyC')endRun();break;
  case 'result':if(c==='Space')startGame(lastHero);break;
 }
}

/* ---------- 터치 ---------- */
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
if(isTouch){document.body.classList.add('touch');$('keyHelp').textContent='왼쪽 조이스틱으로 이동, 오른쪽 버튼으로 공격·기 모으기·폭탄';$('pressStart').textContent='TAP TO START'}
const joy={id:null,x:0,y:0,bx:0,by:0};const jz=$('joy'),jb=$('joyBase'),jk=$('joyKnob');const JR=44;
jz.addEventListener('pointerdown',e=>{e.preventDefault();au();if(joy.id!==null)return;joy.id=e.pointerId;jz.setPointerCapture(e.pointerId);const r=jz.getBoundingClientRect();
 joy.bx=clamp(e.clientX-r.left,58,r.width-20);joy.by=clamp(e.clientY-r.top,58,r.height-58);jb.style.left=joy.bx+'px';jb.style.top=joy.by+'px';jb.style.display='block';jk.style.transform='';$('joyHint').style.opacity=0;joyMove(e)});
function joyMove(e){if(e.pointerId!==joy.id)return;const r=jz.getBoundingClientRect();let dx=e.clientX-r.left-joy.bx,dy=e.clientY-r.top-joy.by;const d=Math.hypot(dx,dy);if(d>JR){dx=dx/d*JR;dy=dy/d*JR}
 jk.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.min(1,d/JR);if(m<.15){joy.x=joy.y=0}else{const a=Math.atan2(dy,dx),mm=Math.min(1,(m-.15)/.7);joy.x=Math.cos(a)*mm;joy.y=Math.sin(a)*mm}}
jz.addEventListener('pointermove',e=>{e.preventDefault();joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;jb.style.display='none'};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
const TB={shot:false,chg:false,bomb:false};
function holdBtn(id,key){const b=$(id);const on=e=>{e.preventDefault();au();b.setPointerCapture?.(e.pointerId);if(key==='bomb')TB.bombP=true;TB[key]=true;b.classList.add('on')};const off=e=>{TB[key]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault())}
holdBtn('bShot','shot');holdBtn('bChg','chg');holdBtn('bBomb','bomb');
$('bAuto').addEventListener('pointerdown',e=>{e.preventDefault();auto=!auto;$('bAuto').classList.toggle('act',auto)});
// 더블탭 확대 · 핀치 막기
let lastTap=0;document.addEventListener('touchend',e=>{if(e.target.closest('input,textarea,button,.ov'))return;const n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
for(const ev of['gesturestart','gesturechange'])document.addEventListener(ev,e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

function pollInput(){
 let kx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0),ky=(K.ArrowDown?1:0)-(K.ArrowUp?1:0);if(kx&&ky){kx*=.7071;ky*=.7071}
 if(joy.x||joy.y){inp.ax=joy.x;inp.ay=joy.y}else{inp.ax=kx;inp.ay=ky}
 inp.shot=!!(K.KeyZ||TB.shot);inp.chg=!!(K.KeyX||TB.chg);inp.bombP=!!(KP.KeyC||TB.bombP);
 TB.bombP=false;for(const k in KP)KP[k]=false;
}

/* ---------- 화면 맞춤 ---------- */
function layout(){
 const vw=innerWidth,vh=innerHeight,land=vw>vh*1.15;document.body.classList.toggle('land',isTouch&&land);
 const avail=vh-30;let padH=0;
 if(isTouch&&!land)padH=clamp(avail-vw*9/16,150,300);
 const s=Math.min(vw/W,(avail-padH)/H);const cw=Math.floor(W*s),ch=Math.floor(H*s);
 const stg=$('stage');stg.style.width=cw+'px';stg.style.height=ch+'px';stg.style.setProperty('--u',s);
 if(isTouch&&!land)$('pad').style.height=Math.min(padH,avail-ch)+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));layout();

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0,cdTick=0;
function tick(){
 pollInput();if(bannerT>0&&bannerT<9000&&--bannerT===0)hideBanner();
 switch(state){case 'title':scroll+=.6;break;case 'select':scroll+=.6;roulTick();break;case 'play':update();break;case 'clear':clearTick();break;case 'cont':contTick();break}
 if(isTouch&&run&&++cdTick%6===0){const tot=Math.round(HEROES[run.hero].ccd*60*mods.ccd);$('cdm').style.setProperty('--cd',(P.ccd>0?P.ccd/tot:0)+'turn')}
}
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){tick();acc-=1000/60;n++}if(n>=4)acc=0;render();requestAnimationFrame(loop)}
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
updateBar();requestAnimationFrame(loop);
})();
</script>
</body>
