<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아발론 브레이커 점수 검증기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2246;--gold:#f2c14e;--crim:#b8324a;--parch:#f4e7c5;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2c3566 0,#10163a 70%) fixed;color:var(--parch);font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif}
.w{max-width:600px;margin:0 auto;padding:24px 16px 40px}
h1{font-family:'Song Myung',serif;font-weight:400;font-size:clamp(26px,7vw,36px);color:var(--gold);margin:0 0 6px;text-shadow:0 3px 0 var(--crim),0 5px 0 #0008}
p{line-height:1.65;font-size:15px;color:#e1d6b4}
textarea{width:100%;height:13em;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--parch);color:var(--ink);border:0;border-radius:10px;padding:10px;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:10px;margin:14px 0}
button{font:inherit;font-size:17px;border:0;border-radius:10px;padding:.6em 1.3em;color:#fff;background:#2c3566;cursor:pointer;touch-action:manipulation}
button.pri{background:var(--crim);font-family:'Song Myung',serif;box-shadow:0 3px 0 #6e1a2c}
.vres{margin-top:10px;padding:14px 16px;border-radius:12px;background:#0d1230;border:3px solid var(--c)}
.vres.ok{--c:#6cc35e}.vres.bad{--c:#d04a5a}
.verdict{font-family:'Song Myung',serif;font-size:22px;margin-bottom:10px}.ok .verdict{color:#bff0b5}.bad .verdict{color:#ffb0a2}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0;font-size:15px}dt{color:#bfb593}dd{margin:0}
ul{margin:12px 0 0;padding-left:1.2em;font-size:14px;line-height:1.6}li.x{color:#ffb0a2}li.w{color:#ffe08a}li.o{color:#bff0b5}
details{margin-top:22px;font-size:14px;color:#bfb593;line-height:1.6}summary{cursor:pointer;color:var(--parch)}
</style>
</head>
<body>
<div class="w">
 <h1>아발론 브레이커 점수 검증기</h1>
 <p>블로그 댓글에 올라온 기록을 통째로 붙여넣으세요. 검증코드의 서명과 본문 내용을 함께 대조합니다.</p>
 <textarea id="vin" placeholder="🏰 아발론 브레이커 기록&#10;👤 플레이어: …&#10;🔐 검증코드: AB1.…"></textarea>
 <div class="row"><button class="pri" id="vgo">검증하기</button><button id="vclr">지우기</button></div>
 <div id="vout" aria-live="polite"></div>
 <details><summary>무엇을 확인하나요?</summary>
 검증코드 속 기록(이름, 영웅, 점수, 도달 관문, 탈환 수, 완전 정복 여부, 플레이 시간, 처치 수, 대장 처치, 최대 콤보, 남은 시간 보너스 합계, 잃은 생명, 아이템, 스킬 사용, 날짜)이 게임이 만든 서명과 일치하는지 봅니다. 한 글자라도 바뀌면 서명이 깨집니다. 본문에 적힌 이름·점수·관문이 코드와 다른지, 플레이 시간에 비해 진행이나 점수가 비정상적인지도 알려 줍니다.
 </details>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEROES=['기사','마법사','궁수','대장장이','도적'];
const SALT='AVALON-BREAKER::rune-of-thirty-gates::v1';
function h53(str,s){let h1=0xdeadbeef^s,h2=0x41c6ce57^s;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function sign(p){const s=SALT+'|'+p+'|'+SALT.length;const a=h53(s,7),b=h53(s+a,131);return(a.toString(36).padStart(11,'0')+b.toString(36).padStart(11,'0')).toUpperCase();}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
function verify(text){
 const m=/AB1\.([A-Za-z0-9_-]+)\.([0-9A-Z]{22})/.exec(text);
 if(!m)return{bad:1,msg:'검증코드를 찾지 못했습니다. AB1. 로 시작하는 코드가 들어 있는지 확인하세요.'};
 let js,p;try{js=b64d(m[1]);p=JSON.parse(js);}catch(e){return{bad:1,msg:'검증코드가 손상되어 읽을 수 없습니다.'};}
 const sigOk=sign(js)===m[2];const notes=[];
 const tn=/플레이어:\s*(.+)/.exec(text),ts=/점수:\s*([\d,]+)/.exec(text),tst=/도달 관문:\s*(\d+)/.exec(text),th=/영웅:\s*(\S+)/.exec(text);
 if(tn&&tn[1].trim()!==p.n)notes.push(['x',`본문 이름 "${tn[1].trim()}"이(가) 코드 속 이름 "${p.n}"과 다릅니다.`]);
 if(ts&&+ts[1].replace(/,/g,'')!==p.s)notes.push(['x',`본문 점수 ${ts[1]}이(가) 코드 속 점수 ${fmt(p.s)}와 다릅니다.`]);
 if(tst&&+tst[1]!==p.st)notes.push(['x',`본문 관문 ${tst[1]}이(가) 코드 속 관문 ${p.st}와 다릅니다.`]);
 if(th&&th[1]!==HEROES[p.h])notes.push(['x',`본문 영웅 "${th[1]}"이(가) 코드 속 영웅 "${HEROES[p.h]}"과 다릅니다.`]);
 if(p.c===1&&(p.st!==30||p.cl!==30||p.b<30))notes.push(['x','완전 정복으로 표시됐지만 관문·대장 처치 수가 맞지 않습니다.']);
 if(p.b>p.st)notes.push(['x','대장 처치 수가 도달 관문보다 많습니다.']);
 if(p.cl>0&&p.t<p.cl*12)notes.push(['w',`관문 ${p.cl}개를 ${p.t}초 만에 탈환했습니다. 관문당 12초 미만은 비정상적으로 빠릅니다.`]);
 if(p.t>0&&p.s/p.t>2600)notes.push(['w',`초당 ${fmt(p.s/p.t)}점은 정상 범위(약 2,600점 이하)를 넘습니다.`]);
 if(p.k>p.st*90)notes.push(['w','처치 수가 도달 관문에 비해 지나치게 많습니다.']);
 if(p.tb>p.cl*190*40*2.5)notes.push(['w','남은 시간 보너스 합계가 가능한 최대치를 넘습니다.']);
 if(sigOk&&!notes.some(n=>n[0]!=='o'))notes.push(['o','이상한 점이 발견되지 않았습니다.']);
 return{sigOk,p,notes};
}
$('vgo').onclick=()=>{
 const r=verify($('vin').value);const o=$('vout');
 if(r.msg){o.innerHTML=`<div class="vres bad"><div class="verdict">확인 불가</div>${esc(r.msg)}</div>`;return;}
 const p=r.p,hard=r.notes.some(n=>n[0]==='x');const ok=r.sigOk&&!hard;
 const tm=Math.floor(p.t/60)+'분 '+String(p.t%60).padStart(2,'0')+'초';
 o.innerHTML=`<div class="vres ${ok?'ok':'bad'}"><div class="verdict">${!r.sigOk?'위조 또는 변조된 기록':hard?'코드는 진짜지만 본문이 다릅니다':'진짜 기록입니다'}</div>
 <dl><dt>플레이어</dt><dd>${esc(p.n)}</dd><dt>영웅</dt><dd>${esc(HEROES[p.h]||'?')}</dd><dt>점수</dt><dd>${fmt(p.s)}</dd>
 <dt>도달 관문</dt><dd>${p.st} / 30 (${p.cl}개 탈환${p.c?', 완전 정복':''})</dd><dt>플레이 시간</dt><dd>${tm}</dd>
 <dt>처치</dt><dd>${fmt(p.k)} (대장 ${p.b})</dd><dt>최대 콤보</dt><dd>${p.mc}</dd><dt>시간 보너스</dt><dd>${fmt(p.tb)}</dd>
 <dt>잃은 생명</dt><dd>${p.l}</dd><dt>아이템 / 스킬</dt><dd>${p.it} / ${p.sk}</dd><dt>날짜</dt><dd>${esc(p.d)}</dd></dl>
 <ul>${!r.sigOk?'<li class="x">서명이 일치하지 않습니다. 코드가 게임에서 만들어진 그대로가 아닙니다.</li>':''}${r.notes.map(n=>`<li class="${n[0]}">${esc(n[1])}</li>`).join('')}</ul></div>`;
};
$('vclr').onclick=()=>{$('vin').value='';$('vout').innerHTML='';};
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&e.target.tagName!=='TEXTAREA')e.preventDefault();lt=n;},{passive:false});
})();
</script>
</body>
</html>
