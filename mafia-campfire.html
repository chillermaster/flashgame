<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마피아 : 모닥불 재판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070a1a;color:#efe6d2;font-family:'Gowun Dodum',sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;color:inherit}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:flex}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.5px}
/* ---------- title ---------- */
#scrTitle{flex-direction:column;align-items:center;overflow-y:auto;background:radial-gradient(ellipse 90% 55% at 50% 78%,rgba(255,140,50,.30),transparent 60%),linear-gradient(#0a0f2c,#05070f)}
#tcv{width:min(560px,100%);height:clamp(170px,32vh,280px);display:block;flex:none}
.tbox{width:min(520px,94%);padding:0 0 26px;text-align:center}
.tt{font-size:clamp(46px,13vw,78px);line-height:1;background:linear-gradient(#fff4d6,#ffb04a 55%,#c2441c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(255,120,40,.45));margin-top:6px}
.ts{font-size:15px;letter-spacing:6px;color:#ffcf8a;margin-top:6px}
.tsub{font-size:12.5px;color:#a9a2c4;margin-top:6px}
.card{background:rgba(18,20,44,.82);border:1px solid rgba(255,190,110,.28);border-radius:14px;padding:12px 14px;margin-top:12px;text-align:left}
.card h4{font-size:13px;color:#ffcf8a;margin-bottom:8px;font-weight:700}
.nm{width:100%;height:42px;border-radius:10px;border:1px solid #5b4a7a;background:#0b0d22;color:#fff;padding:0 12px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:76px;height:38px;border-radius:10px;border:1px solid #4b4370;background:#14152f;font-size:13.5px;padding:0 8px}
.seg button.on{background:linear-gradient(#ffb85c,#e0742c);color:#2a1205;border-color:#ffd59a;font-weight:700}
.hint{font-size:11.5px;color:#9893b4;margin-top:6px;line-height:1.5}
.bigb{display:block;width:100%;height:52px;border-radius:14px;border:1px solid #ffd59a;background:linear-gradient(#ffc56b,#e0702a);color:#2a1205;font-size:20px;margin-top:14px;box-shadow:0 4px 18px rgba(255,120,40,.35)}
.subb{display:flex;gap:8px;margin-top:8px}
.subb button{flex:1;height:42px;border-radius:12px;border:1px solid #4b4370;background:#14152f;font-size:14px}
/* ---------- game ---------- */
#scrGame{flex-direction:column;background:#070a1a}
#hud{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(#141838,#0c0f26);border-bottom:1px solid rgba(255,190,110,.25)}
#phase{font-size:15px;color:#ffd79a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer{min-width:44px;height:26px;border-radius:13px;background:#22204a;text-align:center;line-height:26px;font-size:14px;color:#fff;font-weight:700}
#timer.warn{background:#8a2a2a}
.hsp{flex:1}
.hb{display:flex;gap:4px}
.hb button{width:36px;height:32px;border-radius:9px;border:1px solid #3d3a66;background:#181a3a;font-size:16px;line-height:1}
.hb button.wide{width:auto;padding:0 8px;font-size:13px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{position:relative;flex:none;height:45%;min-height:230px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);padding:10px 22px;border-radius:14px;background:rgba(10,8,24,.82);border:1px solid rgba(255,200,120,.5);font-size:clamp(17px,4.6vw,26px);color:#ffe2a8;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center;white-space:nowrap;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#myrole{position:absolute;left:8px;bottom:8px;padding:4px 10px 4px 6px;border-radius:12px;background:rgba(8,8,24,.72);border:1px solid rgba(255,200,120,.35);font-size:12.5px;display:flex;align-items:center;gap:4px;cursor:pointer}
#side{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid rgba(255,190,110,.18)}
#chat{flex:1;overflow-y:auto;padding:6px 8px;font-size:13.5px;line-height:1.45;-webkit-overflow-scrolling:touch;background:linear-gradient(#0b0e24,#080a1c)}
.ln{margin:3px 0;word-break:keep-all;overflow-wrap:anywhere}
.ln .who{display:inline-block;min-width:22px;padding:0 5px;margin-right:4px;border-radius:7px;font-size:11.5px;font-weight:700;color:#14101e;text-align:center}
.ln .wn{font-weight:700;margin-right:4px}
.ln.sys{text-align:center;color:#ffd79a;font-size:12.5px;margin:6px 0;background:rgba(255,200,120,.07);border-radius:8px;padding:3px 6px}
.ln.big{font-size:14px;color:#ffe9c0}
.ln.priv{background:rgba(255,196,80,.12);border-left:3px solid #ffc24a;padding:3px 7px;border-radius:5px;color:#ffe6b0}
.ln.mch{background:rgba(220,50,50,.13);border-left:3px solid #e24a4a;padding:2px 7px;border-radius:5px}
.ln.dch{background:rgba(80,200,160,.12);border-left:3px solid #4ac8a0;padding:2px 7px;border-radius:5px}
.ln.me .wn{color:#ffd36b}
.ln.ghost{opacity:.55}
.ln.vote{font-size:12px;color:#c9c3e6}
.ln .to{display:inline-block;font-size:11px;color:#9fd8ff;margin-right:5px;font-weight:700}
.ln.tome{background:rgba(255,211,107,.1);border-left:3px solid #ffd36b;padding:2px 6px;border-radius:5px}
.ln.parsed{font-size:11px;color:#8fa8c8;margin:-2px 0 4px 30px}
.qbox{background:rgba(110,170,255,.1);border:1px solid #6aa8e8;border-radius:10px;padding:6px;margin-bottom:6px}
#act{flex:none;padding:6px 8px 8px;background:#0f1230;border-top:1px solid rgba(255,190,110,.2);max-height:52%;overflow-y:auto}
.qrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.qrow button,.chip,.abtn{height:32px;border-radius:9px;border:1px solid #45407a;background:#1a1c40;font-size:13px;padding:0 9px;white-space:nowrap}
.qrow button{flex:1 1 auto}
.inrow{display:flex;gap:5px}
.inrow input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid #4b4370;background:#080a1c;color:#fff;padding:0 10px;font-size:16px}
.inrow button{height:38px;border-radius:10px;border:1px solid #ffd59a;background:linear-gradient(#ffc56b,#e0702a);color:#2a1205;font-weight:700;padding:0 14px;font-size:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chip{height:34px;display:inline-flex;align-items:center;gap:3px}
.chip.sel{background:linear-gradient(#ffb85c,#e0742c);color:#2a1205;border-color:#ffd59a;font-weight:700}
.chip.dead{opacity:.45}
.chip.red{border-color:#c94040}
.atl{font-size:13px;color:#ffd79a;margin:2px 0 4px}
.arow{display:flex;gap:6px;margin-top:6px}
.abtn{flex:1;height:40px;font-size:14px}
.abtn.go{background:linear-gradient(#ffc56b,#e0702a);color:#2a1205;border-color:#ffd59a;font-weight:700}
.abtn.red{background:linear-gradient(#e2574a,#9c2a22);border-color:#ff9a8a;color:#fff;font-weight:700}
.abtn.grn{background:linear-gradient(#5fd39a,#2a8c5c);border-color:#a8f0c8;color:#062414;font-weight:700}
.abtn.on{outline:2px solid #ffd59a}
.pick{background:#15173a;border:1px solid #3d3a6e;border-radius:10px;padding:6px;margin-bottom:6px}
.muted{color:#8f8aab;font-size:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,3,12,.74);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal.on{display:flex}
.mbox{width:min(560px,100%);max-height:94%;overflow-y:auto;background:linear-gradient(#171a3c,#0d0f26);border:1px solid rgba(255,200,120,.4);border-radius:16px;padding:14px;box-shadow:0 10px 50px rgba(0,0,0,.7)}
.mbox h3{font-size:20px;color:#ffd79a;text-align:center;margin-bottom:8px}
.mclose{display:block;margin:12px auto 0;height:40px;padding:0 26px;border-radius:12px;border:1px solid #ffd59a;background:linear-gradient(#ffc56b,#e0702a);color:#2a1205;font-weight:700;font-size:15px}
.rc{display:flex;flex-direction:column;align-items:center;text-align:center}
.rc canvas{width:150px;height:170px}
.rc .rn{font-size:30px;margin-top:2px}
.rc .rf{font-size:13px;padding:2px 10px;border-radius:9px;margin-top:4px;font-weight:700;color:#120d1c}
.rc .rd{font-size:13.5px;line-height:1.6;margin-top:10px;color:#e6dcc4;text-align:left;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px}
.rc .rx{font-size:13px;line-height:1.6;margin-top:8px;color:#ffe2a6;text-align:left;width:100%}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bk{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px;text-align:center}
.bk canvas{width:90px;height:100px}
.bk b{display:block;font-size:15px}
.bk i{display:inline-block;font-style:normal;font-size:11px;padding:1px 7px;border-radius:7px;color:#120d1c;font-weight:700;margin:2px 0}
.bk p{font-size:11.5px;line-height:1.45;color:#cfc6b2;text-align:left;margin-top:3px}
.rules{font-size:13px;line-height:1.65;color:#e3dac6;background:rgba(0,0,0,.25);border-radius:10px;padding:10px;margin-bottom:10px}
.rules b{color:#ffd79a}
.mt{width:100%;border-collapse:collapse;font-size:12.5px}
.mt td,.mt th{padding:5px 4px;border-bottom:1px solid rgba(255,200,120,.13);text-align:left;vertical-align:top}
.mt th{color:#ffcf8a;font-weight:700;font-size:12px}
.mk{display:inline-block;min-width:48px;height:26px;border-radius:8px;border:1px solid #4b4370;background:#14152f;font-size:12px}
.notes{font-size:12.5px;line-height:1.6;max-height:170px;overflow-y:auto;background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px;margin-top:8px}
.endb{font-size:clamp(24px,7vw,34px);text-align:center}
.score{text-align:center;font-size:15px;margin:6px 0}
.score b{font-size:30px;color:#ffd36b}
.rec{width:100%;min-height:150px;margin-top:8px;background:#080a1c;color:#efe6d2;border:1px solid #4b4370;border-radius:10px;padding:8px;font-size:12.5px;line-height:1.5;resize:none}
.erow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.erow a,.erow button{flex:1 1 120px;height:42px;border-radius:12px;border:1px solid #4b4370;background:#14152f;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#efe6d2}
.erow .go{background:linear-gradient(#ffc56b,#e0702a);color:#2a1205;border-color:#ffd59a;font-weight:700}
#toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(10,8,24,.92);border:1px solid #ffd59a;color:#ffe9c0;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:80;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (min-width:880px){
 #main{flex-direction:row}
 #stage{height:auto;flex:1.3}
 #side{flex:none;width:400px;border-top:none;border-left:1px solid rgba(255,190,110,.18)}
 #act{max-height:58%}
}
</style>
</head>
<body>
<section id="scrTitle" class="scr on">
 <canvas id="tcv"></canvas>
 <div class="tbox">
  <div class="tt bh">마피아</div>
  <div class="ts bh">모닥불 재판</div>
  <div class="tsub">11명이 모닥불에 둘러앉았다. 이 안에 마피아가 있다.</div>
  <div class="card"><h4>👤 플레이어 이름</h4><input id="inName" class="nm" maxlength="10" placeholder="이름을 입력하세요"></div>
  <div class="card"><h4>💀 사망자 공개 방식</h4>
   <div class="seg" id="optReveal"><button data-v="job" class="on">직업 공개</button><button data-v="fac">세력만 공개</button></div>
   <div class="hint" id="revHint">예) "경찰이 죽었습니다" — 죽은 사람의 직업을 모두에게 공개합니다.</div></div>
  <div class="card"><h4>🔊 밤 능력 효과음 (테스트용)</h4>
   <div class="seg" id="optSfx"><button data-v="result">결과음만</button><button data-v="mine" class="on">내 능력음</button><button data-v="all">전체 순차</button><button data-v="mute">무음</button></div>
   <div class="hint" id="sfxHint"></div></div>
  <div class="card"><h4>⏳ 낮 토론 시간</h4>
   <div class="seg" id="optTalk"><button data-v="60">60초</button><button data-v="90" class="on">90초</button><button data-v="120">120초</button></div></div>
  <button class="bigb bh" id="bStart">🔥 모닥불에 앉기</button>
  <div class="subb"><button id="bBookT">📖 규칙 · 직업 도감</button></div>
 </div>
</section>

<section id="scrGame" class="scr">
 <div id="hud">
  <div id="phase">1일차</div><div id="timer">-</div><div class="hsp"></div>
  <div class="hb"><button id="bMemo" title="수첩">📒</button><button id="bBook" title="도감">📖</button><button id="bSpd" class="wide" title="진행 속도">⏩1×</button><button id="bSnd" title="소리">🔊</button></div>
 </div>
 <div id="main">
  <div id="stage"><canvas id="cv"></canvas><div id="banner"></div><div id="myrole"></div></div>
  <div id="side"><div id="chat"></div><div id="act"></div></div>
 </div>
</section>

<div class="modal" id="mRole"><div class="mbox" id="mRoleBox"></div></div>
<div class="modal" id="mMemo"><div class="mbox" id="mMemoBox"></div></div>
<div class="modal" id="mBook"><div class="mbox" id="mBookBox"></div></div>
<div class="modal" id="mEnd"><div class="mbox" id="mEndBox"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wpick(items,wf){let t=0;const w=items.map(x=>{const v=Math.max(0,wf(x));t+=v;return v;});if(t<=0)return null;let r=R()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i];}return items[items.length-1];}
/* 한국어 조사 */
function hasB(w){w=String(w);const c=w.charCodeAt(w.length-1);if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28!==0;if(/[0-9]$/.test(w))return '013678'.includes(w.slice(-1));return false;}
const J={
 ig:w=>w+(hasB(w)?'이':'가'), eun:w=>w+(hasB(w)?'은':'는'), eul:w=>w+(hasB(w)?'을':'를'),
 ida:w=>w+(hasB(w)?'이에요':'예요'), ya:w=>w+(hasB(w)?'이야':'야'), im:w=>w+'임', ip:w=>w+'입니다',
 wa:w=>w+(hasB(w)?'과':'와'), ro:w=>{const c=String(w).charCodeAt(String(w).length-1);const b=c>=0xAC00&&c<=0xD7A3?(c-0xAC00)%28:(hasB(w)?1:0);return w+(b&&b!==8?'으로':'로');}, was:w=>w+(hasB(w)?'이었습니다':'였습니다')
};

/* ================= 직업 ================= */
const FAC={M:{n:'마피아 세력',s:'마피아',c:'#ff6464'},C:{n:'시민 세력',s:'시민',c:'#6fdc96'},N:{n:'중립 세력',s:'중립',c:'#c49bff'}};
const ROLE={
 mafia:{n:'마피아',f:'M',ic:'🔫',act:'kill',d:'밤마다 한 명을 습격합니다. 외계인·퇴역군인(1회)은 회피하고, 의사나 좀비가 찾아온 대상은 치유됩니다(수첩에 "치유" 기록). <b>특수공격</b>(게임 중 1인 1회): 치료·방어를 무시하고 죽이며 죽인 대상의 직업을 알아냅니다. 외계인은 특수공격으로도 죽지 않습니다. 살아있는 스파이가 있으면 피해자로 <b>변장</b>시킵니다.'},
 spy:{n:'스파이',f:'M',ic:'🕶️',act:'scanFac',d:'죽은 사람의 직업이 모두 보이고, 밤마다 한 명의 세력을 알아냅니다. 경찰에겐 시민으로, 기자에겐 스파이로 보입니다. 마피아가 죽으면 마피아 직을 물려받습니다(1순위, 특수공격도 새로 생김). 마피아가 특수공격으로 누군가를 죽이면 그 사람으로 변장해 자리를 바꿉니다.'},
 thief:{n:'도둑',f:'M',ic:'🦹',act:'once',d:'게임 중 단 한 번 대상의 직업을 알아냅니다. 경찰에게 걸리지 않습니다. 마피아가 죽으면 마피아로 승급될 수 있습니다(3순위).'},
 gisaeng:{n:'기생',f:'M',ic:'🪭',act:'block',d:'첫날 마피아 세력이 아닌 한 명의 직업을 봅니다. 밤마다 한 명을 찾아가 그날 밤 능력을 봉인합니다(대상에게 "의문의 여인이 당신을 찾아왔습니다"). 경찰에게 걸리며, 혼자 남아도 마피아로 승급되지 않습니다.'},

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function ln(c,pts,w,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.lineWidth=w;c.strokeStyle=col;c.stroke();}

const SC={cv:null,c:null,w:0,h:0,dpr:1,t:0,night:0,nightTarget:0,sparks:[],stars:[],sel:-1,selectable:null,onPick:null,vc:null,acc:-1,shake:0,flash:0,pos:[]};
function initStage(){SC.cv=$('#cv');SC.c=SC.cv.getContext('2d');for(let i=0;i<70;i++)SC.stars.push({x:R(),y:R()*.32,r:R()*1.3+.3,p:R()*6});const rs=()=>resizeStage();window.addEventListener('resize',rs);setTimeout(rs,50);SC.cv.addEventListener('pointerdown',e=>{const b=SC.cv.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;const s=hitSeat(x,y);if(s>=0&&SC.selectable&&SC.selectable.has(s)&&SC.onPick){SFX.click();SC.onPick(s);}else if(s>=0&&G&&!SC.selectable){showSeatInfo(s);}});requestAnimationFrame(loop);}
function resizeStage(){if(!SC.cv)return;const b=SC.cv.getBoundingClientRect();SC.dpr=Math.min(2.5,window.devicePixelRatio||1);SC.w=b.width;SC.h=b.height;SC.cv.width=Math.round(b.width*SC.dpr);SC.cv.height=Math.round(b.height*SC.dpr);}
function seatGeom(w,h,n){const cx=w/2,cy=h*.57;const rx=Math.min(w*.43,h*1.1),ry=Math.min(h*.33,rx*.72);const sc=clamp(Math.min(h/25,w/31.5),7,17);const out=[];for(let i=0;i<n;i++){const a=Math.PI/2+i*PI2/n;const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;const d=(Math.sin(a)+1)/2;out.push({x,y,s:sc*(.78+.24*d),d});}return {cx,cy,rx,ry,sc,pos:out};}
function hitSeat(x,y){const P=SC.pos;let best=-1,bd=1e9;for(let i=0;i<P.length;i++){const p=P[i];if(!p)continue;if(x>p.x-1.6*p.s&&x<p.x+1.6*p.s&&y>p.y-4.6*p.s&&y<p.y+1.6*p.s){const dd=Math.abs(y-(p.y-2*p.s))-p.d*50;if(dd<bd){bd=dd;best=i;}}}return best;}
function drawBG(c,w,h,nt,t,cx,cy,sc){
 const sky=c.createLinearGradient(0,0,0,h*.4);sky.addColorStop(0,mixc('#8fc7ff','#070b26',nt));sky.addColorStop(1,mixc('#ffe6c4','#1a1f4a',nt));c.fillStyle=sky;c.fillRect(0,0,w,h);
 if(nt>.05){c.globalAlpha=nt;SC.stars.forEach(s=>{c.fillStyle='rgba(255,255,240,'+(.5+.5*Math.sin(t*2+s.p))+')';c.fillRect(s.x*w,s.y*h,s.r,s.r);});c.fillStyle='#fff8dc';c.beginPath();c.arc(w*.82,h*.1,Math.max(10,h*.045),0,PI2);c.fill();c.fillStyle=mixc('#8fc7ff','#0a0f2e',nt);c.beginPath();c.arc(w*.82+h*.018,h*.1-h*.012,Math.max(10,h*.045),0,PI2);c.fill();c.globalAlpha=1;}
 if(nt<.95){c.globalAlpha=1-nt;c.fillStyle='#fff2b0';c.beginPath();c.arc(w*.16,h*.1,Math.max(10,h*.05),0,PI2);c.fill();c.globalAlpha=1;}
 /* 먼 산·집 */
 c.fillStyle=mixc('#7fa98a','#121a33',nt);c.beginPath();c.moveTo(0,h*.33);for(let i=0;i<=10;i++)c.lineTo(i*w/10,h*(.25+.05*Math.sin(i*1.7)));c.lineTo(w,h*.36);c.lineTo(0,h*.36);c.fill();
 const hx=[.08,.2,.7,.86,.95];hx.forEach((p,i)=>{const x=p*w,y=h*.31,s=Math.max(14,h*.06);c.fillStyle=mixc('#b98a5e','#1c2038',nt);c.fillRect(x-s*.6,y-s*.5,s*1.2,s*.7);c.fillStyle=mixc('#a2483a','#141830',nt);c.beginPath();c.moveTo(x-s*.8,y-s*.5);c.lineTo(x,y-s*1.1);c.lineTo(x+s*.8,y-s*.5);c.fill();if(nt>.5){c.fillStyle='rgba(255,200,90,'+(nt*.8)+')';c.fillRect(x-s*.18,y-s*.35,s*.28,s*.25);}});
 const gr=c.createLinearGradient(0,h*.34,0,h);gr.addColorStop(0,mixc('#8cc06a','#14223a',nt));gr.addColorStop(1,mixc('#6aa04e','#0c1428',nt));c.fillStyle=gr;c.fillRect(0,h*.34,w,h);
 c.fillStyle=mixc('#d8b27a','#2a2638',nt);c.beginPath();c.ellipse(cx,cy,Math.min(w*.47,h*1.2),Math.min(h*.37,w*.32),0,0,PI2);c.fill();
 /* 불빛 */
 const fl=1+.06*Math.sin(t*9)+.04*Math.sin(t*23);const gl=c.createRadialGradient(cx,cy-sc*1.5,sc,cx,cy-sc*1.5,sc*(14+nt*10)*fl);gl.addColorStop(0,'rgba(255,170,70,'+(.35+nt*.4)+')');gl.addColorStop(1,'rgba(255,120,40,0)');c.fillStyle=gl;c.fillRect(0,0,w,h);
}
function drawFire(c,cx,cy,sc,t,nt){
 c.save();c.translate(cx,cy);const u=sc*1.05;
 c.fillStyle='#7a7470';for(let i=0;i<9;i++){const a=i/9*PI2;el(c,Math.cos(a)*u*1.9,Math.sin(a)*u*.75,u*.45,u*.3,'#6e6862');}
 c.fillStyle='#5a3a1e';c.save();c.rotate(.35);rr(c,-u*1.7,-u*.25,u*3.4,u*.5,u*.2);c.fill();c.restore();c.save();c.rotate(-.35);rr(c,-u*1.7,-u*.25,u*3.4,u*.5,u*.2);c.fill();c.restore();
 const layers=[['#ff4a1a',1.0],['#ff9a2a',.72],['#ffe27a',.42]];
 layers.forEach(([col,k],li)=>{c.fillStyle=col;c.beginPath();const hh=u*(3.6+Math.sin(t*7+li)*.35)*k,ww=u*1.25*k;c.moveTo(-ww,0);c.quadraticCurveTo(-ww*1.1,-hh*.45,-ww*.2+Math.sin(t*5+li)*u*.25,-hh);c.quadraticCurveTo(ww*.1,-hh*.55,ww*.35,-hh*.72+Math.sin(t*6)*u*.2);c.quadraticCurveTo(ww*1.15,-hh*.35,ww,0);c.closePath();c.fill();});
 c.restore();
 if(R()<.35)SC.sparks.push({x:cx+rnd(-1,1)*sc,y:cy-sc*2,vx:rnd(-.3,.3)*sc,vy:-rnd(1.2,2.6)*sc,l:1});
 SC.sparks=SC.sparks.filter(p=>{p.x+=p.vx*.03;p.y+=p.vy*.03;p.l-=.02;if(p.l<=0)return false;c.fillStyle='rgba(255,'+(160+Math.floor(p.l*80))+',80,'+p.l+')';c.fillRect(p.x,p.y,Math.max(1.5,sc*.14),Math.max(1.5,sc*.14));return true;});
}
function mixc(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)&255)*(1-t)+((pb>>16)&255)*t,g=((pa>>8)&255)*(1-t)+((pb>>8)&255)*t,bl=(pa&255)*(1-t)+(pb&255)*t;return 'rgb('+(r|0)+','+(g|0)+','+(bl|0)+')';}
function wrapText(c,txt,maxW,maxL){const out=[];let line='';for(const ch of txt){const tst=line+ch;if(c.measureText(tst).width>maxW&&line){out.push(line);line=ch;if(out.length>=maxL)break;}else line=tst;}if(out.length<maxL&&line)out.push(line);else if(out.length>=maxL){out[maxL-1]=out[maxL-1].slice(0,-1)+'…';}return out.slice(0,maxL);}
function drawBubble(c,x,y,txt,s,cls){c.save();const fs=Math.max(10.5,Math.min(13.5,s*.85));c.font=fs+'px "Gowun Dodum",sans-serif';const lines=wrapText(c,txt,Math.max(90,s*9.5),3);const lw=Math.max(...lines.map(l=>c.measureText(l).width));const bw=lw+12,bh=lines.length*(fs+3)+8;let bx=x-bw/2,by=y-bh-8;bx=clamp(bx,3,SC.w-bw-3);by=Math.max(3,by);c.fillStyle=cls==='mch'?'rgba(70,12,16,.94)':cls==='dch'?'rgba(10,50,40,.94)':'rgba(255,250,238,.96)';c.strokeStyle=cls==='mch'?'#ff7a7a':cls==='dch'?'#6ae0b8':'rgba(80,50,30,.6)';c.lineWidth=1.2;rr(c,bx,by,bw,bh,8);c.fill();c.stroke();c.beginPath();const tx=clamp(x,bx+10,bx+bw-10);c.moveTo(tx-5,by+bh);c.lineTo(tx,by+bh+7);c.lineTo(tx+5,by+bh);c.fill();c.fillStyle=cls==='mch'?'#ffe0e0':cls==='dch'?'#d8fff2':'#2a1c14';c.textAlign='left';c.textBaseline='top';lines.forEach((l,i)=>c.fillText(l,bx+6,by+4+i*(fs+3)));c.restore();}
function loop(ts){SC.t=ts/1000;try{drawStage();}catch(e){console.error(e);}requestAnimationFrame(loop);}
function drawStage(){
 if(!SC.c||!G||!$('#scrGame').classList.contains('on'))return;
 const c=SC.c,w=SC.w,h=SC.h,t=SC.t;if(!w||!h)return;
 c.setTransform(SC.dpr,0,0,SC.dpr,0,0);
 SC.night+=(SC.nightTarget-SC.night)*.04;const nt=SC.night;
 const g=seatGeom(w,h,11);SC.pos=g.pos;
 let ox=0,oy=0;if(SC.shake>0){SC.shake*=.9;ox=rnd(-1,1)*SC.shake;oy=rnd(-1,1)*SC.shake;}c.save();c.translate(ox,oy);
 drawBG(c,w,h,nt,t,g.cx,g.cy,g.sc);
 const order=g.pos.map((p,i)=>i).sort((a,b)=>g.pos[a].y-g.pos[b].y);
 let fireDrawn=false;
 for(const i of order){
  if(!fireDrawn&&g.pos[i].y>g.cy){drawFire(c,g.cx,g.cy,g.sc,t,nt);fireDrawn=true;}
  drawSeat(c,i,g.pos[i],t,nt);
 }
 if(!fireDrawn)drawFire(c,g.cx,g.cy,g.sc,t,nt);
 if(nt>.02){const dk=c.createRadialGradient(g.cx,g.cy-g.sc,g.sc*3,g.cx,g.cy,Math.max(w,h)*.75);dk.addColorStop(0,'rgba(4,6,24,0)');dk.addColorStop(1,'rgba(4,6,24,'+(.55*nt)+')');c.fillStyle=dk;c.fillRect(0,0,w,h);}
 const hm=humanMind();for(let i=0;i<11;i++){const b=G.P[i].bub;if(!b||b.to==null||b.until<=t||!g.pos[b.to])continue;const a=g.pos[i],z=g.pos[b.to];c.save();c.globalAlpha=Math.min(1,(b.until-t)/1.2)*.85;const col=hm&&b.to===hm.seat?'#ffd36b':'#9fd8ff';c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.2;c.setLineDash([7,5]);c.lineDashOffset=-t*28;const x1=a.x,y1=a.y-a.s*2.3,x2=z.x,y2=z.y-z.s*2.3;const mx=(x1+x2)/2+(g.cx-(x1+x2)/2)*.4,my=(y1+y2)/2+(g.cy-a.s*2-(y1+y2)/2)*.4;const ang=Math.atan2(y2-my,x2-mx);const ex=x2-Math.cos(ang)*z.s*1.3,ey=y2-Math.sin(ang)*z.s*1.3;c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(mx,my,ex,ey);c.stroke();c.setLineDash([]);c.beginPath();c.moveTo(ex,ey);c.lineTo(ex-11*Math.cos(ang-.45),ey-11*Math.sin(ang-.45));c.lineTo(ex-11*Math.cos(ang+.45),ey-11*Math.sin(ang+.45));c.closePath();c.fill();c.restore();}
 for(const i of order)drawSeatUI(c,i,g.pos[i],t,nt);
 if(SC.flash>0){c.fillStyle='rgba(255,40,40,'+SC.flash+')';c.fillRect(0,0,w,h);SC.flash*=.9;if(SC.flash<.01)SC.flash=0;}

const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};

 $('#bSpd').onclick=()=>{if(!G)return;G.speed=G.speed===1?2:G.speed===2?4:1;$('#bSpd').textContent='⏩'+G.speed+'×';};
 $('#bSnd').onclick=()=>{AU.on=!AU.on;$('#bSnd').textContent=AU.on?'🔊':'🔇';if(!AU.on&&window.speechSynthesis)speechSynthesis.cancel();};
 document.querySelectorAll('.modal').forEach(md=>md.addEventListener('pointerdown',e=>{if(e.target===md&&md.id!=='mRole')closeM(md.id);}));
 let lastTouch=0;document.addEventListener('touchend',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='A'))return;const n=Date.now();if(n-lastTouch<380)e.preventDefault();lastTouch=n;},{passive:false});
 document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
 if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
 initStage();initChatPin();requestAnimationFrame(titleLoop);
}
/* 자동 시뮬레이션 (테스트용) */
window.__simRun=async function(n,opts,logOne){const st={C:0,M:0,N:0,alien:0,draw:0,days:0,err:0,errs:[],lines:0,claims:0,reports:0,execs:0,execEvil:0};let log=null;
 for(let i=0;i<n;i++){try{newGame(Object.assign({name:'SIM',reveal:'job',sfx:'mute',talk:90},opts||{}),true);if(logOne&&i===0){G.logOn=true;G.simLog=[];}await runGame();st[G.res.w]++;st.days+=G.day;st.lines+=G.lines;st.claims+=G.claimLog.length;st.reports+=G.reports.length;for(const t of G.trials)if(t.exec){st.execs++;if(G.P[t.acc].trueFac!=='C')st.execEvil++;}if(G.logOn){log=G.simLog.concat(['RESULT '+G.res.w,'ROLES '+G.P.map(p=>(p.seat+1)+':'+p.mind.history.join('>')).join(' ')]);}}catch(e){st.err++;if(st.errs.length<5)st.errs.push(String(e.stack||e));}}
 st.days=+(st.days/n).toFixed(2);st.lines=Math.round(st.lines/n);st.claims=+(st.claims/n).toFixed(1);st.reports=+(st.reports/n).toFixed(1);st.execAcc=st.execs?+(st.execEvil/st.execs).toFixed(2):0;G=null;return {st,log};};
initUI();
</script>
