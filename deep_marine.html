   const i0=Math.max(0,Math.floor((cx-w)/4)),i1=Math.min(NX-1,Math.ceil((cx+w)/4));for(let i=i0;i<=i1;i++){const d=Math.abs(i*4-cx)/w;if(d<1)hc[i]+=h*Math.pow(1-d,1.5)*.9}}}

  wd.vents=xs.map(x=>({x,w:42,acc:520}))}
 // 부유물: 중앙 해역에 많이, 양 팀 진영에 엄폐물 조금

 else if(k==='q'||k==='Q')a.sel=(a.sel+2)%3;else if(k==='e'||k==='E')a.sel=(a.sel+1)%3;else if(k==='1'||k==='2'||k==='3')a.sel=+k-1;
 else if(k==='f'||k==='F')$('dirBtn').click();else if(k==='r'||k==='R')$('wSp').click();else if(k===' '||k==='Enter')playerFire();else u=false;
 if(u){e.preventDefault();aimChanged()}});
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||!G||S.state!=='battle'||S.paused)return;const k=e.key.toLowerCase();
 if(k==='z')zoomToggle();else if(k==='x')camFollow();else if(k==='v')ffToggle()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')MV.x=0;if(e.key==='ArrowUp'||e.key==='ArrowDown')MV.y=0});
addEventListener('blur',()=>{MV.x=MV.y=0});
let lastTouch=0;document.addEventListener('touchend',e=>{if(e.target.closest('button,input,textarea,select,a,canvas,#pwBar'))return;const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ----- 루프 ----- */
let lastT=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;
 if(WD){if(!S.paused){const ff=S.ff&&S.state==='battle'&&!WD.demo&&!(WD.phase==='aim'&&WD.active&&WD.active.isPlayer)?2.5:1,sd=dt*ff;VT+=sd;
   if(S.state==='battle'){acc+=sd;let n=0;while(acc>=DT&&n<30){fixedStep();acc-=DT;n++}if(n>=30)acc=0;G.playMs+=dt*1000;
    const s=me();if(s&&s.mods.sonar&&WD.active===s&&WD.phase==='aim'){WD.sonarT-=dt;if(WD.sonarT<=0){WD.sonarT=.15;const a=G.aim,w=a.weapon==='sp'&&s.sp>=100?s.T.sp:s.T.w;WD.sonar=simShot(s,a.n,a.pw,a.dir,w,WD.tick,{rec:true,anchor:s.mods.anchor,pierce:s.mods.pierce},null)}}}
   else WD.tick+=Math.round(dt/DT);
   updVis(sd)}
  updCam(dt);draw();updHud();if(G&&inGame())syncPanel()}
 requestAnimationFrame(frame)}
try{S.name=localStorage.getItem('dm_name')||'';S.mode=clamp(+localStorage.getItem('dm_mode')||1,1,4);S.ff=!!localStorage.getItem('dm_ff')}catch(e){}
showTitle();requestAnimationFrame(frame);
})();
