<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마녀솥 회합 — 스프 속 첩자</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd479;--mint:#7fffd0;--bad:#ff7a9a;--vio:#b89cff;--panel:rgba(24,17,44,.9);--line:#6d55a8;--txt:#f3ecff}
html,body{height:100%;overflow:hidden;background:#141028;color:var(--txt)}
body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
.bh{font-family:'Black Han Sans',system-ui,sans-serif;font-weight:400}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;transition:opacity .2s}
.lb .nm{display:inline-block;font-size:12px;font-weight:800;padding:2px 7px;border-radius:9px;background:rgba(15,10,30,.72);border:1.5px solid var(--c);color:#fff;text-shadow:0 1px 0 #000}
.lb.act .nm{background:var(--c);box-shadow:0 0 12px var(--c);transform:scale(1.12)}
.lb.dead .nm{filter:grayscale(1);opacity:.55;text-decoration:line-through}
.lb .ic{font-size:12px;margin-left:2px}
.lb .sb{width:46px;height:4px;margin:2px auto 0;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.lb .sb i{display:block;height:100%;background:linear-gradient(90deg,#ffb36b,#ff4f6d);width:0}
.lb .bub{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(62vw,250px);white-space:normal;font-size:12.5px;line-height:1.4;font-weight:700;background:#fffaf0;color:#2a1a40;padding:7px 10px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:bub .25s ease-out}
.lb .bub:after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fffaf0}
@keyframes bub{from{transform:translateX(-50%) scale(.6);opacity:0}}
.pop{position:fixed;pointer-events:none;font-family:'Black Han Sans',system-ui,sans-serif;font-size:26px;transform:translate(-50%,-50%);animation:pop 1.3s ease-out forwards;text-shadow:0 2px 0 #000,0 0 12px currentColor;z-index:5}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui>*{pointer-events:auto}
#top{padding:6px 8px 0;display:flex;flex-direction:column;gap:5px}
#hud{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800}
#hud .chip{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:5px 7px;white-space:nowrap}
#hud .sp{flex:1}
#hud button{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:4px 0;width:32px;font-size:14px;font-weight:900}
#roleChip{cursor:pointer}
#meter{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px 8px}
#meter .row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:800}
#meter .row .pc{font-family:'Black Han Sans',system-ui,sans-serif;font-size:22px;font-weight:400;color:var(--mint);margin-left:auto;transition:color .3s}
#meter .row .fill{color:#cbb8ea}
#bar{position:relative;height:14px;border-radius:8px;background:#0e0a1c;margin-top:4px;overflow:visible;border:1px solid #2d2350}
#bar .fg{position:absolute;left:0;top:0;bottom:0;border-radius:7px;width:0;background:linear-gradient(90deg,#4a2f4f,#7b6a3a 40%,#3fbf7f 75%,#9fffe0);background-size:100vw 100%;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#bar .th{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold);border-radius:2px;box-shadow:0 0 6px var(--gold)}
#bar .thl{position:absolute;top:-17px;transform:translateX(-50%);font-size:10px;color:var(--gold);font-weight:800;white-space:nowrap}
#potList{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-height:34px;padding:1px 0}
#potList::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:9px;background:var(--panel);border:1.5px solid var(--c,#6d55a8);font-size:15px;line-height:1;position:relative;padding:0 3px}
.pchip b{font-size:10px;font-weight:900;margin-top:1px}
.pchip.pos b{color:#9dffc8}.pchip.neg b{color:#ff9ab0}
.pchip.inert{opacity:.55}
.pchip.win{outline:2px dashed var(--gold);outline-offset:1px}
.pchip.anom{border-color:#9b6cff;background:#2b1848}
.pchip.mine:after{content:'🕷️';position:absolute;top:-6px;right:-5px;font-size:10px}
#mid{flex:1;position:relative;pointer-events:none}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Black Han Sans',system-ui,sans-serif;font-size:clamp(24px,7vw,40px);color:#fff;text-shadow:0 3px 0 #3b1a6a,0 0 24px rgba(184,156,255,.9);white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#banner small{display:block;font-family:system-ui,sans-serif;font-size:14px;font-weight:800;margin-top:6px;color:var(--gold);text-shadow:0 1px 0 #000}
#logBox{margin:0 8px 4px;max-height:84px;overflow:hidden;font-size:12.5px;line-height:1.45;background:linear-gradient(rgba(14,10,28,.55),rgba(14,10,28,.82));border-radius:10px;padding:5px 9px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#logBox div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logBox .sub{color:#cbb8ea;font-size:11.5px;padding-left:10px}
#logBox .an{color:#d6b8ff;font-weight:800}
#logBox .good{color:#9dffc8}#logBox .badl{color:#ff9ab0}#logBox .sys{color:var(--gold);font-weight:800}
#detail{margin:0 8px 4px;background:rgba(30,21,56,.96);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;display:none;font-size:13px;line-height:1.5}
#detail.on{display:block;animation:bub .18s ease-out}
#detail .hd{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
#detail .hd .e{font-size:26px}
#detail .tg{font-size:12px;color:#cbb8ea;font-weight:700}
#detail .tx{margin-top:3px;color:#efe6ff}
#detail .pv{margin-top:3px;color:var(--gold);font-weight:800}
#detail .acts{display:flex;gap:6px;margin-top:7px}
.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;font-size:14px;background:linear-gradient(#8a6be0,#5a3fb0);box-shadow:0 3px 0 #2e1f66;color:#fff}
.btn.go{background:linear-gradient(#6fd06a,#2f8f3a);box-shadow:0 3px 0 #1b5a22}
.btn.warn{background:linear-gradient(#e07a6b,#b03f4a);box-shadow:0 3px 0 #66201f}
.btn.ghost{background:#2a1d45;border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.btn.f{flex:1}
#handWrap{padding:0 6px 6px;position:relative}
#handInfo{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#cbb8ea;padding:0 4px 3px;white-space:nowrap;overflow:hidden}
#handInfo .me{color:var(--gold)}
#hand{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;min-height:128px}
#hand::-webkit-scrollbar{display:none}
.card{flex:none;width:84px;height:118px;border-radius:12px;background:linear-gradient(#3a2b63,#241a45);border:2px solid #7a63b8;position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 4px 4px;transition:transform .15s,box-shadow .15s;cursor:pointer;overflow:hidden}
.card.ing{background:linear-gradient(#35503a,#1f3424);border-color:#7fbf6a}
.card.fn{background:linear-gradient(#2f3d70,#1b2347);border-color:#7fa0ff}
.card.spy{background:linear-gradient(#5a2340,#2c0f22);border-color:#ff6b9a}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 2px #fff,0 8px 20px rgba(0,0,0,.5)}
.card.can{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 14px 2px rgba(255,212,121,.55)}}
.card .e{font-size:34px;line-height:1.1}
.card .n{font-size:11.5px;font-weight:900;text-align:center;line-height:1.2;margin-top:2px;word-break:keep-all}
.card .t{font-size:10.5px;margin-top:2px}
.card .v{position:absolute;top:3px;left:4px;font-size:11px;font-weight:900;color:#fff;background:rgba(0,0,0,.4);border-radius:6px;padding:0 4px}
.card .k{position:absolute;top:3px;right:4px;font-size:10px}
.card .d{font-size:9.5px;color:#ffb8cf;font-weight:800;margin-top:auto}
#hand .empty{font-size:13px;color:#a99bc8;align-self:center;padding:0 10px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,5,18,.62);padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.ov.on{display:flex}
.box{width:100%;max-width:460px;max-height:100%;overflow:auto;background:rgba(28,19,50,.97);border:2px solid #8f6cc4;border-radius:16px;padding:16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:bub .2s ease-out}
.box h2{font-family:'Black Han Sans',system-ui,sans-serif;font-weight:400;font-size:24px;text-align:center;color:#e9d4ff;text-shadow:0 3px 0 #3b1a6a}
.box p{font-size:13.5px;line-height:1.6;color:#e3d8f7;margin-top:8px}
.box .acts{display:flex;gap:8px;margin-top:14px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tbtn{display:flex;align-items:center;gap:6px;background:#2a1d45;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:13.5px;font-weight:800;text-align:left}
.tbtn i{width:12px;height:12px;border-radius:50%;flex:none}
.tbtn small{margin-left:auto;font-size:11px;color:#cbb8ea}
.tbtn:disabled{opacity:.35}
.tbtn.vote{position:relative}
.tbtn .vc{position:absolute;top:-7px;right:-5px;background:#ff4f6d;color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;display:none}
.cgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.cmini{width:64px;border-radius:10px;padding:5px 3px;text-align:center;background:#2a1d45;border:1.5px solid var(--line);font-size:10.5px;font-weight:800}
.cmini .e{font-size:24px}
.cmini.spy{border-color:#ff6b9a;background:#4a1a33}
/* council */
#council{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;padding:0 8px max(8px,env(safe-area-inset-bottom))}
#council.on{display:block}
#council .pan{max-width:560px;margin:0 auto;background:rgba(24,17,44,.95);border:2px solid #8f6cc4;border-radius:16px;padding:10px}
#council .ttl{font-family:'Black Han Sans',system-ui,sans-serif;font-size:19px;text-align:center;color:var(--gold)}
#chat{max-height:30vh;overflow:auto;font-size:13px;line-height:1.5;margin-top:6px;display:flex;flex-direction:column;gap:4px}
#chat .ln{background:#2a1d45;border-radius:9px;padding:5px 8px;border-left:4px solid var(--c)}
#chat .ln b{color:var(--c);filter:brightness(1.35)}
#chat .ln.me{background:#3a2d16;border-left-color:var(--gold)}
#chat .ln.sys{background:none;border:0;color:var(--gold);font-weight:800;text-align:center}
#cActs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#cActs .btn{font-size:13px;padding:8px 6px}
/* screens */
.scr{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(ellipse at 50% 0%,rgba(58,38,96,.85),rgba(14,10,28,.95) 70%);padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.scr.on{display:block}
.scr .in{max-width:520px;margin:0 auto}
.logo{text-align:center;margin-top:4px}
.logo .a{font-size:52px;filter:drop-shadow(0 4px 10px rgba(127,255,208,.4))}
.logo h1{font-family:'Black Han Sans',system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9vw,44px);color:#e9d4ff;text-shadow:0 4px 0 #3b1a6a,0 0 26px rgba(170,110,255,.6);line-height:1.15}
.logo .s{color:var(--mint);font-weight:900;letter-spacing:.14em;font-size:13px;margin-top:4px}
.fs{background:rgba(28,19,50,.92);border:2px solid #8f6cc4;border-radius:16px;padding:12px;margin-top:12px}
.fs label{display:block;font-size:13px;font-weight:900;color:#c9a8ff;margin:8px 0 5px}
.fs input{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#f6efff;color:#2a1a40;font-weight:800;-webkit-user-select:text;user-select:text}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;border:1.5px solid var(--line);background:#2a1d45;border-radius:10px;padding:9px 4px;font-size:13.5px;font-weight:900}
.seg button.on{background:linear-gradient(#8a6be0,#5a3fb0);border-color:#d6c4ff;box-shadow:0 0 10px rgba(184,156,255,.5)}
.hint{font-size:12px;color:#cbb8ea;margin-top:6px;line-height:1.5}
.big{display:block;width:100%;margin-top:14px;font-family:'Black Han Sans',system-ui,sans-serif;font-size:22px;padding:13px;border:0;border-radius:14px;background:linear-gradient(#6fd06a,#2f8f3a);box-shadow:0 5px 0 #1b5a22;color:#fff}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 .btn{flex:1}
/* rules */
.tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tabs button{flex:1;border:1.5px solid var(--line);background:#2a1d45;border-radius:9px;padding:7px 3px;font-size:12.5px;font-weight:900}
.tabs button.on{background:#5a3fb0;border-color:#d6c4ff}
.rul{font-size:13px;line-height:1.65;color:#e3d8f7;margin-top:8px}
.rul h3{font-size:14.5px;color:var(--gold);margin:12px 0 4px}
.rul li{margin-left:18px}
.ent{display:flex;gap:8px;align-items:flex-start;background:#2a1d45;border-radius:10px;padding:7px 9px;margin-top:5px}
.ent .e{font-size:24px;line-height:1}
.ent b{font-size:13.5px}
.ent .tg{font-size:11.5px;color:#cbb8ea;font-weight:800;margin-left:4px}
.ent div{font-size:12.5px;line-height:1.5}
/* result */
.res h2{font-size:34px}
.score{text-align:center;font-family:'Black Han Sans',system-ui,sans-serif;font-size:44px;color:var(--gold);text-shadow:0 0 16px rgba(255,212,121,.45);margin-top:8px}
.calc{font-size:12px;color:#cbb8ea;text-align:center;line-height:1.6}
dl.st{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:10px;background:#1f1533;border-radius:10px;padding:10px 12px}
dl.st dt{color:#c9a8ff;font-weight:800}dl.st dd{text-align:right}
.roles{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}
.roles span{font-size:12px;font-weight:800;padding:4px 8px;border-radius:9px;background:#2a1d45;border:1.5px solid var(--c)}
.roles span.s{background:#4a1a33}
textarea#rec{width:100%;height:12.5em;margin-top:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f6efff;color:#2a1a40;border:2px solid #8f6cc4;border-radius:10px;padding:9px;resize:none;-webkit-user-select:text;user-select:text}
a.vlink{display:block;text-align:center;margin-top:10px;color:var(--mint);font-weight:900;text-decoration:none;font-size:14px}
.notes .sec{margin-top:10px}
.notes .sec h3{font-size:14px;color:var(--gold)}
.notes .it{font-size:12.5px;line-height:1.55;background:#2a1d45;border-radius:8px;padding:5px 8px;margin-top:4px}

@media (min-width:760px){
 #top{max-width:760px;width:100%;margin:0 auto}
 #logBox,#detail{max-width:744px;width:calc(100% - 16px);margin-left:auto;margin-right:auto}
 #handWrap{max-width:760px;width:100%;margin:0 auto}
 .card{width:96px;height:132px}.card .e{font-size:38px}
 #hand{min-height:142px;justify-content:center}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="ui">
 <div id="top">
  <div id="hud">
   <span class="chip" id="hRound">1솥</span>
   <span class="chip" id="hScore">🍲0/3 ☠️0/3</span>
   <span class="chip" id="hDir">⟳</span>
   <span class="sp"></span>
   <span class="chip" id="roleChip">🎭</span>
   <button id="bNotes" title="수첩">📓</button>
   <button id="bRules" title="규칙">📖</button>
   <button id="spd" title="속도">1×</button>
   <button id="bMute" title="소리">🔊</button>
  </div>
  <div id="meter"><div class="row"><span>🧪 스프 완성도</span><span class="fill" id="mFill">재료 0/12</span><span class="pc" id="mPct">0%</span></div>
   <div id="bar"><div class="fg" id="barFg"></div><div class="th" id="barTh"></div><div class="thl" id="barThl">성공 70%</div></div></div>
  <div id="potList"></div>
 </div>
 <div id="mid"><div id="banner"></div></div>
 <div id="logBox"></div>
 <div id="detail"></div>
 <div id="handWrap"><div id="handInfo"><span class="me" id="hiMe">내 손패</span><span id="hiTurn"></span></div><div id="hand"></div></div>
</div>

<div id="council"><div class="pan"><div class="ttl" id="cTtl">🔥 모닥불 재판</div><div id="chat"></div><div id="cActs"></div></div></div>
<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>

<div class="scr on" id="sTitle"><div class="in">
 <div class="logo"><div class="a">🧙‍♀️🥘🧙</div><h1>마녀솥 회합<br>스프 속 첩자</h1><div class="s">WITCHES' CAULDRON · SPY HUNT</div></div>
 <div class="fs">
  <label>🧙 마녀 이름</label><input id="iName" maxlength="12" placeholder="이름을 입력하세요">
  <label>🪑 회합 인원</label><div class="seg" id="segN"></div>
  <label>🎚️ 난이도</label><div class="seg" id="segD"></div>
  <label>🎭 내 역할</label><div class="seg" id="segR"></div>
  <div class="hint" id="tHint"></div>
  <button class="big" id="bStart">🥘 솥에 불 지피기</button>
  <div class="row2"><button class="btn ghost" id="bRules2">📖 규칙 · 재료 도감</button></div>
 </div>
</div></div>

<div class="scr" id="sRes"><div class="in res"><div class="fs" id="resBox"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const VERIFY_URL='https://chillermaster.github.io/flashgame/witch-cauldron-verify.html';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
const fmt=n=>Number(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
//#ENGINE
/* ===== 카드 정의 ===== */
const TAGE={fire:'🔥',water:'💧',herb:'🌿',beast:'🦴',light:'✨',dark:'🌑',shroom:'🍄'};

const rnd=Math.random;
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v)};
let UID=1;
function mk(c){const o={u:UID++,c};if(ING[c])o.k='ing';else if(FN[c])o.k='fn';else{o.k='spy';o.disg=pick(DISG);o.off=c==='bomb'?2+Math.floor(rnd()*3):1+Math.floor(rnd()*3)}return o}
function cardInfo(c){return ING[c.c]||FN[c.c]||SPY[c.c]}
function pubName(c){return c.k==='spy'?ING[c.disg].n:cardInfo(c).n}
function pubEmo(c){return c.k==='spy'?ING[c.disg].e:cardInfo(c).e}

/* ===== 반응 엔진 (솥 순서 전체를 다시 재생) ===== */
function hasTag(e,t){return !e.inert&&e.tags.indexOf(t)>=0}
function replay(seq,C,pub){
 const ents=[];let pot=0;const ev=[];let fx=[];const W=[];
 const cnt=t=>{let c=0;for(const x of ents)if(hasTag(x,t))c++;return c};
 for(let k=0;k<seq.length;k++){
  const s=seq[k];const isSpy=!!SPY[s.c];const t=isSpy?s.disg:s.c;const I=ING[t];
  const e={k,t,by:s.by,val:I.b,inert:false,tags:I.tags,sp:(isSpy&&!pub)?s.c:null};
  const here=fx.filter(f=>f.at===k);fx=fx.filter(f=>f.at!==k);
  if(here.some(f=>f.kind==='inert'))e.inert=true;
  const mir=!e.inert&&here.some(f=>f.kind==='mir');const sg=mir?-1:1;
  const R=(tg,d,kind,src,spy)=>{if(!d)return;d*=sg;if(tg)tg.val+=d;else pot+=d;ev.push({k,kind,d,tg:tg?tg.k:-1,src:src==null?k:src,spy:!!spy||mir})};
  if(!e.inert){
   const prev=ents[k-1];
   switch(t){
    case 'salamander':R(e,-3*cnt('water'),'steam');break;
    case 'dew':R(e,-3*cnt('fire'),'evap');break;
    case 'tear':R(e,2*cnt('water'),'tears');break;
    case 'dragon':if(cnt('water')>=2)R(e,-3,'douse');else{let lo=null;for(const x of ents)if(!x.inert&&x.val<0&&(!lo||x.val<lo.val))lo=x;if(lo)R(lo,-lo.val,'revive')}break;
    case 'mandrake':if(prev&&hasTag(prev,'beast')&&prev.val!==0)R(prev,-prev.val,'scream',k);break;
    case 'toad':fx.push({kind:'toad',at:k+1,src:k});break;
    case 'bat':if(cnt('light')>0)R(e,-10,'burn');break;
    case 'star':R(e,2*cnt('dark'),'dusk');break;
    case 'nightflower':if(cnt('light')>0)R(e,4,'twilight');break;
    case 'lily':W.push({kind:'lily',src:k,left:1});break;
    case 'honey':if(prev)R(e,prev.val,'honey');break;
    case 'web':fx.push({kind:'inert',at:k+1,src:k});break;
    case 'skull':R(e,4*cnt('beast'),'broth');break;
    case 'shroom':R(e,3*cnt('shroom'),'spore');if(cnt('water')>=3)R(e,-8,'mold');break;
    case 'apple':if(cnt('dark')>=2)R(e,-6,'appleRot');if(k===C-1)R(e,10,'golden');break;
    case 'garlic':{let d=null;for(let i=ents.length-1;i>=0;i--)if(hasTag(ents[i],'dark')){d=ents[i];break}if(d&&d.val!==0)R(d,-d.val,'garlic')}break;
    case 'chili':W.push({kind:'chili',src:k});break;
   }
   if(hasTag(e,'fire'))for(const w of W){if(w.src>=k)continue;
    if(w.kind==='chili')R(e,3,'chili',w.src);
    else if(w.kind==='lily'&&w.left>0){w.left=0;R(ents[w.src],-8,'wilt',k)}}
   if(hasTag(e,'light'))for(const x of ents)if(x.t==='bat'&&!x.inert)R(x,-6,'burn2',k);
   for(const f of here)if(f.kind==='toad'&&hasTag(e,'herb'))R(e,4,'toad',f.src);
   if(hasTag(e,'herb'))for(const w of W)if(w.kind==='rot'&&w.left>0&&w.src<k){w.left--;R(e,-6,'rot',w.src,true)}
   if(hasTag(e,'shroom'))for(const w of W)if(w.kind==='rot'&&w.left>0&&w.src<k){w.left=0;R(e,3,'rotEat',w.src,true)}
   if(hasTag(e,'fire'))for(const w of W)if(w.kind==='leak'&&w.left>0&&w.src<k){w.left=0;R(e,2,'leakBurn',w.src,true)}
   if(hasTag(e,'fire')&&cnt('fire')===3)R(null,-12,'overflow');
   if(hasTag(e,'water')&&cnt('water')===3){for(const x of ents)if(hasTag(x,'water'))R(x,-3,'dilute',k);R(e,-3,'dilute')}
   if(e.sp){const off=s.off||1;
    if(e.sp==='shadow')fx.push({kind:'inv',at:k+off,src:k});
    else if(e.sp==='mirror')fx.push({kind:'mir',at:k+off,src:k});
    else if(e.sp==='rot')W.push({kind:'rot',src:k,left:2});
    else if(e.sp==='bomb')W.push({kind:'bomb',src:k,at:k+off});
    else if(e.sp==='leak')W.push({kind:'leak',src:k,left:6});}
  }
  for(const w of W){if(w.src>=k)continue;
   if(w.kind==='bomb'&&w.at===k){if(hasTag(e,'water'))R(null,4,'saltMelt',w.src,true);else R(null,-10,'bomb',w.src,true)}
   else if(w.kind==='leak'&&w.left>0){w.left--;R(null,-1,'leak',w.src,true)}}
  const inv=!e.inert&&here.find(f=>f.kind==='inv');
  if(inv){if(hasTag(e,'light')){e.val+=3;ev.push({k,kind:'dispel',d:3,tg:k,src:inv.src,spy:true})}else if(e.val!==0){const d=-2*e.val;e.val+=d;ev.push({k,kind:'invert',d,tg:k,src:inv.src,spy:true})}}
  ents.push(e);
 }
 let tot=pot;for(const x of ents)tot+=x.val;
 return{ents,pot,tot,ev};
}

function newGame(o){
 const n=o.n,G={n,diff:o.diff|0,C:n+BAL.capAdd,round:0,ok:0,fail:0,dir:1,seq:[],deck:[],disc:[],spyDeck:[],
  over:null,turn:0,extra:0,fnUsed:false,log:[],hist:[],claims:[],votesHist:[],agit:[],anomRound:0,headless:!!o.headless,t0:Date.now()};
 G.target=G.C*BAL.per;G.th=BAL.thOf(n,G.diff);
 const names=shuffle(NAMES.slice());const cols=shuffle(COLORS.slice());
 G.P=[];for(let i=0;i<n;i++)G.P.push({id:i,name:(i===0&&!o.headless)?(o.name||'나'):names[i],human:i===0&&!o.headless,spy:false,alive:true,hand:[],spyHand:[],bound:0,col:cols[i%cols.length],ins:0,contrib:0,neg:0,hits:0,miss:0,played:0,fake:0});
 const sc=BAL.spy(n);let pool=[];for(let i=0;i<n;i++)pool.push(i);
 if(!o.headless){if(o.role==='spy'){G.P[0].spy=true;pool=pool.filter(x=>x!==0);shuffle(pool);for(let i=0;i<sc-1;i++)G.P[pool[i]].spy=true}
  else if(o.role==='witch'){pool=pool.filter(x=>x!==0);shuffle(pool);for(let i=0;i<sc;i++)G.P[pool[i]].spy=true}
  else{shuffle(pool);for(let i=0;i<sc;i++)G.P[pool[i]].spy=true}}
 else{shuffle(pool);for(let i=0;i<sc;i++)G.P[pool[i]].spy=true}
 const D=DIFFS[G.diff];for(const p of G.P)p.ins=clamp(D.ins+gauss()*.1,.25,.97);
 for(const k in ING_DECK)for(let i=0;i<ING_DECK[k];i++)G.deck.push(mk(k));
 for(const k in FN_DECK)for(let i=0;i<FN_DECK[k];i++)G.deck.push(mk(k));
 shuffle(G.deck);refillSpy(G);
 G.susp=G.P.map(()=>G.P.map(()=>0));G.known=G.P.map(()=>G.P.map(()=>null));G.ksrc=G.P.map(()=>G.P.map(()=>null));
 for(const p of G.P){G.known[p.id][p.id]=p.spy?'spy':'witch';if(p.spy)for(const q of G.P)if(q.spy)G.known[p.id][q.id]='spy'}
 for(const p of G.P){for(let i=0;i<BAL.hand;i++)p.hand.push(draw(G));if(p.spy)for(let i=0;i<BAL.spyStart;i++)p.spyHand.push(G.spyDeck.pop())}
 G.evid=G.P.map(()=>[]);
 G.T=replay([],G.C,false);G.Pu=replay([],G.C,true);
 return G;
}
function refillSpy(G){const a=[];for(const k in SPY_DECK)for(let i=0;i<SPY_DECK[k];i++)a.push(mk(k));G.spyDeck=shuffle(a).concat(G.spyDeck)}
function draw(G){if(!G.deck.length){G.deck=shuffle(G.disc.filter(c=>c.k!=='spy'&&c.c!=='plain'));G.disc=[];if(!G.deck.length)return mk('plain')}return G.deck.pop()}
const alive=G=>G.P.filter(p=>p.alive);
function nextSeat(G,i,dir){const n=G.n;let j=i;for(let s=0;s<n;s++){j=(j+(dir||G.dir)+n)%n;if(G.P[j].alive)return j}return i}
function pct(G,tot){return clamp(Math.round((tot==null?G.T.tot:tot)/G.target*100),0,100)}
function rawPct(G,tot){return Math.round((tot==null?G.T.tot:tot)/G.target*100)}
function spyAliveCount(G){return G.P.filter(p=>p.alive&&p.spy).length}

function startRound(G){
 G.round++;G.seq=[];G.T=replay([],G.C,false);G.Pu=replay([],G.C,true);G.anomRound=0;G.agit=[];G.roundEv=[];
 if(G.round>1)for(const p of G.P)if(p.alive&&p.spy&&p.spyHand.length<BAL.spyMax){if(!G.spyDeck.length)refillSpy(G);p.spyHand.push(G.spyDeck.pop())}
 if(G.round===1){const a=alive(G);G.turn=pick(a).id}
 else if(!G.P[G.turn].alive)G.turn=nextSeat(G,G.turn);
}
function potFull(G){return G.seq.length>=G.C}
function ingCards(p){return p.hand.filter(c=>c.k==='ing').concat(p.spyHand)}
function fnCards(p){return p.hand.filter(c=>c.k==='fn')}

/* 재료 투입 */
function evalAdd(G,card){const s=G.seq.concat([{c:card.c,by:-1,disg:card.disg,off:card.off}]);const T=replay(s,G.C,false),P=replay(s,G.C,true);return{td:T.tot-G.T.tot,pd:P.tot-G.Pu.tot}}
function playIng(G,p,card){
 let i=p.hand.indexOf(card);if(i>=0)p.hand.splice(i,1);else{i=p.spyHand.indexOf(card);if(i>=0)p.spyHand.splice(i,1)}
 if(G.seq.length>=G.C)return null;
 const tB=G.T.tot,pB=G.Pu.tot;card.by=p.id;G.seq.push(card);
 G.T=replay(G.seq,G.C,false);G.Pu=replay(G.seq,G.C,true);
 const k=G.seq.length-1,td=G.T.tot-tB,pd=G.Pu.tot-pB,an=td-pd;
 const evP=G.Pu.ev.filter(x=>x.k===k),evS=G.T.ev.filter(x=>x.k===k&&x.spy);
 const kinds=[...new Set(evS.map(x=>SPYK.includes(x.kind)?x.kind:'mir'))];
 if(an!==0)G.anomRound++;
 p.played++;
 const R={type:'ing',k,td,pd,an,evP,kinds,card,by:p.id};
 observe(G,p,R);G.roundEv.push(R);

}

/* ===== 기능 카드 ===== */
function canTarget(G,p,fn,q){if(!q.alive)return false;const t=FN[fn].tg;if(t==='other')return q.id!==p.id;if(t==='bound')return q.bound>0;return false}
function useFn(G,p,card,tid){
 const i=p.hand.indexOf(card);if(i>=0)p.hand.splice(i,1);G.disc.push(card);G.fnUsed=true;
 const q=tid!=null?G.P[tid]:null;const R={type:'fn',fn:card.c,by:p.id,t:tid};
 switch(card.c){
  case 'peek':R.cards=q.hand.concat(q.spyHand).map(c=>({c:c.c,k:c.k,disg:c.disg}));R.found=q.spyHand.length>0;
   if(!p.human){if(R.found){G.known[p.id][q.id]='spy';G.ksrc[p.id][q.id]='peek'}else if(!p.spy)G.susp[p.id][q.id]-=.35}break;
  case 'reverse':G.dir*=-1;break;

  case 'ladle':{const tB=G.T.tot,pB=G.Pu.tot;const rem=G.seq.splice(Math.max(0,G.seq.length-2));
   R.removed=rem.map(c=>({c:c.c,k:c.k,disg:c.disg,by:c.by}));
   R.remPub=G.Pu.ents.slice(G.seq.length).reduce((a,e)=>a+e.val,0);
   for(const c of rem)G.disc.push(c);
   G.T=replay(G.seq,G.C,false);G.Pu=replay(G.seq,G.C,true);R.td=G.T.tot-tB;R.pd=G.Pu.tot-pB;R.an=R.td-R.pd;if(R.an)G.anomRound++;break}
  case 'orb':R.role=q.spy?'spy':'witch';if(!p.human){G.known[p.id][q.id]=R.role;G.ksrc[p.id][q.id]='orb'}break;
  case 'agitate':G.agit.push({by:p.id,t:q.id});break;
  case 'stir':{if(G.seq.length<2){R.none=true;break}const tB=G.T.tot,pB=G.Pu.tot;const n=Math.min(3,G.seq.length);const last=G.seq.splice(G.seq.length-n);
   const before=last.map(c=>c.u).join();let tries=0;do{shuffle(last);tries++}while(last.map(c=>c.u).join()===before&&tries<6);G.seq.push(...last);
   G.T=replay(G.seq,G.C,false);G.Pu=replay(G.seq,G.C,true);R.td=G.T.tot-tB;R.pd=G.Pu.tot-pB;R.an=R.td-R.pd;if(R.an)G.anomRound++;break}

 }
 observe(G,p,R);if(G.roundEv)G.roundEv.push(R);

}

/* ===== 관찰·의심 ===== */
function addEvid(G,j,w,txt){G.evid[j].push({r:G.round,w,txt})}
function consensus(G,j){let s=0,c=0;for(const p of G.P)if(p.alive&&!p.human&&!p.spy&&p.id!==j){s+=G.susp[p.id][j];c++}return c?s/c:0}

function candWindow(G,k,kinds,precise){

 const add=(a,b)=>{for(let i=a;i<=b;i++)if(i>=0&&i<k&&ents[i])set.add(i)};

 for(const kd of kinds){if(kd==='invert'||kd==='mir'||kd==='dispel')add(k-3,k-1);else if(kd==='bomb'||kd==='saltMelt')add(k-4,k-2);else add(0,k-1)}
 if(!set.size)add(0,k-1);return[...set];
}
function observe(G,a,R){
 const D=DIFFS[G.diff];const A=a.id;
 if(R.type==='ing'){
  if(R.pd<0){let why=null;for(const e of R.evP)if(e.d<0){why=e;break}
   const nm=pubName(R.card);let txt=`${nm}을(를) 넣자 완성도가 떨어졌어`;
   if(why){if(why.kind==='overflow')txt=`4번째 🔥(${nm})를 넣어서 솥을 끓어넘치게 했어`;else if(why.kind==='dilute')txt=`4번째 💧(${nm})를 부어서 스프를 묽게 만들었어`;else if(why.kind==='wilt')txt=`${nm}을(를) 넣어 은방울꽃을 시들게 했어`;else if(why.kind==='burn')txt=`빛이 있는 솥에 박쥐 날개를 넣어 태워버렸어`;else if(why.kind==='burn2')txt=`${nm}을(를) 넣어 박쥐 날개를 태워버렸어`;else if(why.kind==='honey')txt=`나쁜 재료 뒤에 꿀벌집을 넣어 피해를 키웠어`;else if(why.kind==='scream')txt=`맨드레이크 비명으로 앞 재료를 날려버렸어`;else if(why.kind==='garlic')txt=`마늘로 멀쩡한 재료를 쫓아냈어`;else if(why.kind==='mold')txt=`물 많은 솥에 버섯을 넣어 곰팡이를 피웠어`;else if(why.kind==='evap'||why.kind==='steam')txt=`불과 물을 섞어 ${nm}을(를) 날려버렸어`;else if(why.kind==='appleRot')txt=`어둠 가득한 솥에 황금 사과를 썩혔어`;else if(R.card.c==='skull')txt=`짐승도 없는 솥에 해골 가루를 넣었어`}
   if(-R.pd>=3)addEvid(G,A,-R.pd,txt)}
  if(R.an!==0){const mag=Math.abs(R.an)*(R.an<0?BAL.anomW:BAL.anomW*.5);
   for(const o of G.P){if(!o.alive||o.human||o.spy)continue;const precise=rnd()<D.ded;let c=candWindow(G,R.k,R.kinds,precise).filter(i=>G.Pu.ents[i].by!==o.id&&G.known[o.id][G.Pu.ents[i].by]!=='witch');
    const own=new Map();for(const i of c){const b=G.Pu.ents[i].by;own.set(b,(own.get(b)||0)+1)}
    if(!precise&&A!==o.id)own.set(A,(own.get(A)||0)+Math.max(1,c.length*.5));
    let tot=0;for(const v of own.values())tot+=v;if(!tot)continue;for(const [b,v] of own)G.susp[o.id][b]+=mag*v/tot*(own.size<=1?1.4:1)}
   if(R.an<0){const c=candWindow(G,R.k,R.kinds,true);const names=[...new Set(c.map(i=>G.Pu.ents[i].by))];for(const b of names)addEvid(G,b,-R.an/Math.max(1,names.length),'정체불명의 반응이 일어나기 직전에 재료를 넣었어')}}
  for(const o of G.P){if(!o.alive||o.human||o.id===A||o.spy)continue;const S=G.susp[o.id];
   if(R.pd<0)S[A]+=-R.pd*BAL.pdW*(.7+o.ins*.5);else if(R.pd>=4)S[A]-=R.pd*.025}
  return}
 // 기능 카드
 for(const o of G.P){if(!o.alive||o.human||o.id===A||o.spy)continue;const S=G.susp[o.id];
  switch(R.fn){
   case 'ladle':if(R.remPub>2)S[A]+=R.remPub*.07;else if(R.remPub<0)S[A]-=(-R.remPub)*.06;
    if(R.an>0){for(const rm of R.removed)if(rm.by!==o.id&&G.known[o.id][rm.by]!=='witch')S[rm.by]+=R.an*.22}break;
   case 'stir':if(R.pd<0)S[A]+=-R.pd*.08;else if(R.pd>3)S[A]-=R.pd*.02;if(R.an<0)S[A]+=-R.an*.05;break;
   case 'bind':if(R.t===o.id)S[A]+=.3;else if(consensus(G,R.t)<.4)S[A]+=.12;else S[A]-=.05;break;
   case 'free':S[A]+=.12*clamp(S[R.t],0,3);break;
   case 'agitate':S[R.t]+=.35*trust(G,o.id,A);break;
   case 'spoon':if(R.count&&R.win){const set=new Set();for(let i=R.win[0];i<=R.win[1];i++){const b=G.seq[i]&&G.seq[i].by;if(b!=null&&b!==o.id&&G.known[o.id][b]!=='witch')set.add(b)}for(const b of set)S[b]+=(G.P[A].spy?.15:.45)*trust(G,o.id,A)/Math.max(1,set.size)*1.6}break;
  }}
 if(R.fn==='ladle'&&R.remPub>4)addEvid(G,A,R.remPub*.6,'좋은 재료를 국자로 걷어냈어');
 if(R.fn==='stir'&&R.pd<-3)addEvid(G,A,-R.pd,'솥을 휘저어 맛을 망쳤어');
 if(R.fn==='bind'&&consensus(G,R.t)<.3)addEvid(G,A,1.5,`잘하고 있던 ${G.P[R.t].name}을(를) 속박했어`);

/* ===== AI 결정 ===== */
function topSuspect(G,o){let b=-1,bv=-1e9;for(const q of G.P){if(!q.alive||q.id===o.id)continue;const k=G.known[o.id][q.id];if(k==='witch')continue;const v=k==='spy'?99:G.susp[o.id][q.id];if(v>bv){bv=v;b=q.id}}return{id:b,v:bv}}
function topInnocentCons(G,o){let b=-1,bv=-1e9;for(const q of G.P){if(!q.alive||q.id===o.id||q.spy)continue;const v=consensus(G,q.id)+rnd()*.15;if(v>bv){bv=v;b=q.id}}return{id:b,v:bv}}
function spyLatent(G,card){const r=G.C-G.seq.length-1;switch(card.c){case'shadow':return card.off<=r?-6.5:0;case'mirror':return card.off<=r?-3:0;case'rot':return -6*Math.min(2,r*.22);case'bomb':return card.off<=r?-7.5:0;case'leak':return -Math.min(6,r)*.6}return 0}
function aiChooseIng(G,p){
 let cs=ingCards(p);if(!cs.length)return null;const D=DIFFS[G.diff];
 const left=G.C-G.seq.length;let best=null,bv=-1e9;
 if(!p.spy){for(const c of cs){let v;if(rnd()<p.ins){v=evalAdd(G,c).pd;if(c.c==='apple'&&left>1&&rnd()<p.ins)v-=4;if(c.c==='lily'&&left>3)v-=1.5*p.ins}else v=ING[c.c].b;v+=gauss()*1.1;if(v>bv){bv=v;best=c}}return best}
 const my=consensus(G,p.id);const proj=rawPct(G,G.T.tot+left*4.6);
 const hopeless=proj<G.th-22,safe=proj>G.th+45;
 const careful=my>1.6;
 for(const c of cs){const e=evalAdd(G,c);const lat=c.k==='spy'?spyLatent(G,c):0;let v;
  if(hopeless)v=e.pd+(c.k==='spy'?-1:0);
  else if(careful)v=e.pd*.9-(e.td+lat)*.35-(c.k==='spy'?1.5:0);
  else v=-(e.td+lat)-D.lam*Math.max(0,-e.pd)*(1+my)+(c.k==='spy'?.5:0)+e.pd*.15;
  v+=gauss()*1.2;if(v>bv){bv=v;best=c}}
 return best;
}
function permEV(G,pub){const n=Math.min(3,G.seq.length);if(n<2)return 0;const base=G.seq.slice(0,G.seq.length-n),last=G.seq.slice(-n);const perms=n===3?[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]:[[0,1],[1,0]];const cur=(pub?G.Pu:G.T).tot;let s=0,c=0;
 for(const pm of perms){if(pm.every((v,i)=>v===i))continue;const sq=base.concat(pm.map(i=>last[i]));s+=replay(sq,G.C,pub).tot-cur;c++}return c?s/c:0}
function aiChooseFn(G,p){
 const fs=fnCards(p);if(!fs.length)return null;const D=DIFFS[G.diff];const opts=[];
 const fill=G.seq.length/G.C;const ts=topSuspect(G,p);
 for(const c of fs){const f=c.c;let t=null,pr=0;
  if(f==='free'){const b=G.P.filter(q=>q.alive&&q.bound>0&&q.id!==p.id);for(const q of b){if(p.spy?q.spy:(G.known[p.id][q.id]==='witch'||G.susp[p.id][q.id]<.3)){t=q.id;pr=p.spy?.7:.45;break}}}
  else if(f==='orb'){if(!p.spy){if(ts.id>=0&&ts.v>.25&&!G.known[p.id][ts.id]){t=ts.id;pr=.7}}else{const w=G.P.filter(q=>q.alive&&!q.spy&&q.id!==p.id);if(w.length){t=pick(w).id;pr=.3}}}
  else if(f==='peek'){if(!p.spy){if(ts.id>=0&&ts.v>.3&&!G.known[p.id][ts.id]){t=ts.id;pr=.5}}else{const w=G.P.filter(q=>q.alive&&q.id!==p.id);t=pick(w).id;pr=.15}}
  else if(f==='bind'){if(!p.spy){if(ts.id>=0&&G.P[ts.id].bound===0&&(ts.v>=99||ts.v>1.1)){t=ts.id;pr=ts.v>=99?.9:.5}}else{let bb=null,bv=-1e9;for(const q of G.P)if(q.alive&&!q.spy&&q.bound===0&&q.id!==p.id){const v=q.contrib+q.played*2+rnd()*4;if(v>bv){bv=v;bb=q}}if(bb){t=bb.id;pr=.3}}}
  else if(f==='agitate'){if(fill>=.45){if(!p.spy){if(ts.id>=0&&(ts.v>=99||ts.v>.8)){t=ts.id;pr=ts.v>=99?.95:.5}}else{const ti=topInnocentCons(G,p);if(ti.id>=0&&ti.v>.3){t=ti.id;pr=.5}}}}
  else if(f==='reverse'){const nx=nextSeat(G,p.id,G.dir),rv=nextSeat(G,p.id,-G.dir);
   if(!p.spy){const a=G.known[p.id][nx]==='spy'||G.susp[p.id][nx]>1.2,b=G.known[p.id][rv]==='spy'||G.susp[p.id][rv]>1.2;if(a&&!b)pr=.6;else pr=.03}
   else{if(G.P[rv].spy&&!G.P[nx].spy)pr=.5;else pr=.04}}
  else if(f==='double'){const ic=ingCards(p);if(ic.length>=2&&G.seq.length<=G.C-2){if(!p.spy){const vs=ic.map(c=>evalAdd(G,c).pd).sort((a,b)=>b-a);if(vs[1]>=4)pr=.55}else if(p.spyHand.length)pr=.45}}
  else if(f==='ladle'){if(G.seq.length>=2){const pe=G.Pu.ents.slice(-2),te=G.T.ents.slice(-2);const ps=pe.reduce((a,e)=>a+e.val,0),tsum=te.reduce((a,e)=>a+e.val,0);
   if(!p.spy){if(ps<-3)pr=.8;else if(G.anomRound&&pe.some(e=>e.by!==p.id&&G.susp[p.id][e.by]>.6))pr=.45}
   else{const mine=G.seq.slice(-2).some(c=>c.k==='spy');if(!mine&&tsum>=10)pr=.3/D.lam}}}
  else if(f==='stir'){if(G.seq.length>=3){if(!p.spy){if(permEV(G,true)>=3)pr=.7}else{if(permEV(G,false)<=-3&&permEV(G,true)>=-1.5)pr=.6}}}
  else if(f==='spoon'){if(!p.spy){if(G.anomRound>0)pr=.75;else pr=.06}else pr=.08}
  if(pr>0&&rnd()<pr)opts.push({card:c,t,pr});
 }
 if(!opts.length)return null;opts.sort((a,b)=>b.pr-a.pr);return opts[0];
}
/* AI 차례 전체 (headless/연출용 단계 분리) */
function turnStart(G){G.extra=0;G.fnUsed=false;const p=G.P[G.turn];
 if(p.bound>0){const fr=p.hand.find(c=>c.c==='free');if(fr&&!p.human&&rnd()<.9){const R=useFn(G,p,fr,p.id);return{p,freed:R}}if(p.human)return{p,bound:true};p.bound--;return{p,skip:true}}
 return{p}}
function skipBound(G,p){p.bound--}
function endTurn(G){const p=G.P[G.turn];while(p.hand.length<BAL.hand)p.hand.push(draw(G));G.extra=0;G.fnUsed=false;G.turn=nextSeat(G,G.turn)}

/* ===== 라운드 종료 ===== */
function finishRound(G){
 const pc=pct(G),ok=pc>=G.th;if(ok)G.ok++;else G.fail++;
 const T=G.T;const adj=T.ents.map(()=>0);
 for(const x of T.ev){if(x.tg>=0&&SPYK.includes(x.kind)){adj[x.tg]+=x.d;const s=T.ents[x.src];if(s){const p=G.P[s.by];p.contrib+=x.d;if(x.d<0)p.neg+=x.d}}}
 T.ents.forEach((e,i)=>{const p=G.P[e.by];const v=e.val-adj[i];p.contrib+=v;if(v<0)p.neg+=v});
 for(const x of T.ev)if(x.tg===-1){const s=T.ents[x.src];if(s){const p=G.P[s.by];p.contrib+=x.d;if(x.d<0)p.neg+=x.d}}
 for(const c of G.seq)G.disc.push(c);
 const res={round:G.round,pct:pc,ok,tot:T.tot,anom:G.anomRound};G.hist.push(res);
 checkWin(G);return res;
}
function checkWin(G){
 if(G.over)return G.over;const sa=spyAliveCount(G),wa=alive(G).length-sa;
 if(sa===0)G.over={team:'witch',why:'모든 첩자를 찾아냈다'};
 else if(sa>=wa)G.over={team:'spy',why:'첩자의 수가 마녀와 같아졌다'};
 else if(G.ok>=BAL.win)G.over={team:'witch',why:`스프 ${BAL.win}솥 완성`};
 else if(G.fail>=BAL.win)G.over={team:'spy',why:`스프 ${BAL.win}솥 실패`};
 return G.over;
}

/* ===== 재판 ===== */
function speakEffect(G,o,type,j,w){
 for(const l of G.P){if(!l.alive||l.human||l.spy||l.id===o)continue;const tr=trust(G,l.id,o);const S=G.susp[l.id];
  if(type==='claim'){if(G.known[l.id][j]==='witch')S[o]+=3;else if(G.known[l.id][j]==='spy')S[o]-=.5;else if(l.id===j)S[o]+=2.5;else S[j]+=1.5*tr*(w||1)}
  else if(type==='clear'){if(G.known[l.id][j]==='spy')S[o]+=2.5;else if(l.id!==j)S[j]-=.9*tr}
  else if(type==='accuse'){if(l.id===j)S[o]+=.25;else S[j]+=BAL.accW*tr*(w||1)}

}
function councilLines(G){

  if(!p.spy){
   let cl=null;for(const q of G.P)if(q.alive&&q.id!==o&&G.known[o][q.id]==='spy'&&!G.claims.some(c=>c.by===o&&c.t===q.id&&c.r===G.round)){cl=q;break}

  const n=1+(G.extra?1:0);for(let i=0;i<n;i++){if(potFull(G))break;const c=aiChooseIng(G,p)||mk('plain');await throwAnim(p.id,c);const R=playIng(G,p,c);if(R)await showIng(p.id,R);await wait(260)}}

 $('tHint').innerHTML=`🕷️ 첩자 ${sc}명 · 🥘 솥 ${SET.n+BAL.capAdd}칸 · 성공 기준 ${BAL.thOf(SET.n,SET.d)}% · 점수 배율 ×${((1+(SET.n-8)*.08)*D.M).toFixed(2)}${D.prev?'<br>🔮 견습 난이도에서는 재료의 예상 변화를 미리 볼 수 있어요':''}`;
 $('segN').querySelectorAll('button').forEach(b=>b.onclick=()=>{SET.n=+b.dataset.v;LS.set('wc_n',SET.n);segs()});
 $('segD').querySelectorAll('button').forEach(b=>b.onclick=()=>{SET.d=+b.dataset.v;LS.set('wc_d',SET.d);segs()});
 $('segR').querySelectorAll('button').forEach(b=>b.onclick=()=>{SET.r=b.dataset.v;LS.set('wc_r',SET.r);segs()});
}
async function startGame(o){OPT=o;auInit();$('labels').style.display='';G=newGame(o);resetHK();for(const p of G.P)if(p.spy&&G.P[0].spy)HK.role[p.id]='spy';LOG=[];FULLLOG=[];$('logBox').innerHTML='';SEL=null;HT=null;BUSY=false;
 buildWitches();refreshHUD();renderHand();$('sTitle').classList.remove('on');PHASE='intro';START=Date.now();lookPot();
 const me=G.P[0];const mates=G.P.filter(p=>p.spy&&p.id!==0).map(p=>p.name);
 await ask(me.spy?'🕷️ 당신은 첩자 마녀':'🧙 당신은 선량한 마녀',me.spy?`<p style="text-align:center">동료 첩자: <b style="color:#ff9ab0">${mates.map(esc).join(', ')}</b></p><p>위장 재료로 몰래 스프를 망치세요. 단, 너무 티 나면 재판에서 추방돼요! 스프 3솥을 망치면 승리.</p>`:`<p>마녀들 사이에 <b style="color:#ff9ab0">첩자 ${BAL.spy(G.n)}명</b>이 숨어 있어요. 재료 반응을 잘 읽어 스프를 완성하고, 정체불명의 반응을 추적해 첩자를 찾아내세요! 스프 3솥 성공이면 승리.</p>`,[['🥘 시작!','ok','go']]);
 runGame();
}
$('bStart').onclick=()=>{const nm=($('iName').value||'').trim().replace(/[~|]/g,'')||'이름없는 마녀';LS.set('wc_name',nm);startGame({n:SET.n,diff:SET.d,name:nm,role:SET.r})};
$('bRules').onclick=()=>openRules();$('bRules2').onclick=()=>openRules();$('bNotes').onclick=openNotes;$('logBox').onclick=openNotes;
$('roleChip').onclick=()=>{if(!G)return;const me=G.P[0];const mates=G.P.filter(p=>p.spy&&p.id!==0).map(p=>p.name);ask(me.spy?'🕷️ 첩자 마녀':'🧙 선량한 마녀',me.spy?`동료 첩자: ${mates.map(esc).join(', ')}`:`첩자 ${BAL.spy(G.n)}명이 숨어 있어요.`,[['확인','ok','go']])};
$('spd').onclick=()=>{SPD=SPD===1?2:SPD===2?3:1;$('spd').textContent=SPD+'×'};
$('bMute').onclick=()=>{MUTE=!MUTE;LS.set('wc_mute',MUTE?1:0);$('bMute').textContent=MUTE?'🔇':'🔊'};$('bMute').textContent=MUTE?'🔇':'🔊';
$('iName').value=LS.get('wc_name','');segs();
init3D();
/* 시작 화면 뒤 장식용 회합 */
G=newGame({n:10,diff:1,headless:true});resetHK();buildWitches();G.round=1;PHASE='title';$('labels').style.display='none';

/* 모바일 더블탭 확대 방지 */
let lt=0;document.addEventListener('touchend',e=>{if(e.target.closest('input,textarea'))return;const n=Date.now();if(n-lt<350){e.preventDefault();const b=e.target.closest('button,.card,.pchip,.tbtn');if(b&&!b.disabled)b.click()}lt=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(!e.target.closest('textarea'))e.preventDefault()});
</script>
</body>
