<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>운명패 방위전 · 로웬 포커 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--felt:#1c3532;--felt2:#244540;--felt3:#30574f;--parch:#f3e6c6;--parch2:#e3cfa2;--ink:#2a2531;--brass:#c9a44c;--brass2:#8a6a28;--wax:#a8343b;--wax2:#7a2329;--glow:#ffe08a;--serif:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#244540,#152a27);color:var(--parch);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
#hud{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:10px;border:2px solid var(--brass2);box-shadow:0 2px 0 #0005;flex:none}
#hud .c{text-align:center;padding:3px 1px 4px;border-left:1px solid #8a6a2833}
#hud .c:first-child{border-left:0}
#hud span{display:block;font-size:10px;letter-spacing:-.2px;color:#6a5a40}
#hud b{display:block;font-size:15px;font-variant-numeric:tabular-nums;font-family:var(--serif);font-weight:700;line-height:1.15}
#board{position:relative;flex:1;min-height:180px;border-radius:12px;overflow:hidden;border:2px solid var(--brass2);background:#9fc9e8}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gold{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;background:#1c3532d9;border:1px solid var(--brass);border-radius:20px;padding:3px 10px 3px 5px;font-weight:800;font-size:14px;color:var(--glow);pointer-events:none}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e2b84a 55%,#9a7020);box-shadow:0 0 0 1px #6a4a10;vertical-align:-2px}
#terr{position:absolute;right:8px;top:8px;font-family:var(--serif);font-size:12px;background:#1c3532b3;border-radius:20px;padding:3px 10px;color:var(--parch);pointer-events:none}
#bossBar{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:min(86%,380px);background:#2a1418e6;border:1px solid #e0705a;border-radius:10px;padding:5px 8px 6px;pointer-events:none}
#bossBar .bn{font-family:var(--serif);font-weight:700;font-size:13px;color:#ffd0b8;text-align:center;margin-bottom:3px}
#bossBar .bh{height:9px;background:#00000080;border-radius:5px;overflow:hidden}
#bossBar .bh i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e8443a,#ff9a5a);border-radius:5px}
#bossBar .bp{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px;color:#f0c0b0}
#bossBar .bp div{flex:1;height:4px;background:#00000080;border-radius:3px;overflow:hidden}
#bossBar .bp i{display:block;height:100%;width:0;background:#ffcf6a}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px)}
#banner.show{animation:ban 2.1s ease forwards}
#banner b{display:inline-block;font-family:var(--serif);font-size:24px;padding:6px 22px;background:linear-gradient(90deg,transparent,#1c3532e6 18%,#1c3532e6 82%,transparent);color:var(--glow);text-shadow:0 2px 0 #0008}
#banner small{display:block;font-size:13px;color:var(--parch);margin-top:2px;text-shadow:0 1px 2px #000}
@keyframes ban{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#1c3532eb;border:1px solid var(--brass);color:var(--parch);font-size:12.5px;padding:6px 12px;border-radius:16px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px #ff2a2a;opacity:0}
#vign.f{animation:vg .5s ease}
@keyframes vg{0%{opacity:.8}100%{opacity:0}}
#uinfo{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border:2px solid var(--brass2);border-radius:12px;padding:6px 9px;font-size:12px;box-shadow:0 3px 0 #0006}
#uinfo .h{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:14.5px;font-weight:700}#uinfo .h small{margin-left:auto;font-family:inherit;font-size:10.5px;font-weight:400;color:#6a5a40}
#uinfo .gr{font-family:inherit;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;font-weight:800}
#uinfo .s{color:#6a5a40;margin:3px 0 4px;font-size:11.5px;line-height:1.45}#uinfo .s b{color:var(--ink)}
#uinfo .g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
#uinfo .g span{background:#fff8e6;border-radius:6px;padding:3px 0;font-size:10px;color:#6a5a40}
#uinfo .g b{display:block;font-size:13px;color:var(--ink)}
#uinfo .bt{display:flex;gap:6px;margin-top:6px;align-items:center}
#uinfo .bt button{border:0;border-radius:8px;padding:5px 10px;font-weight:800;font-size:12px}
#uinfo .bt .dm{background:var(--wax);color:#fff}#uinfo .bt .cl{background:#d8c69a;color:var(--ink)}
#uinfo .bt em{flex:1;font-style:normal;font-size:11px;color:#6a5a40;text-align:right}
#handArea{position:relative;display:grid;grid-template-columns:32px 1fr 60px;grid-template-rows:auto auto;gap:5px 5px;flex:none}
.lbl{font-family:var(--serif);font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--parch);line-height:1.15;text-align:center}
.lbl small{font-family:inherit;font-size:9.5px;font-weight:400;color:#cbbd96;margin-top:2px}
.lbl.sm{font-size:10.5px;white-space:nowrap;letter-spacing:-.4px}
#handBox{position:relative;height:clamp(68px,12.5vh,98px)}
.slots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.slots .slot{margin:0 3px;border-radius:9px}
.slots.bg .slot{background:radial-gradient(90% 70% at 50% 75%,#3b6a61,#22413c);box-shadow:inset 0 2px 6px #0006}
.slots.fg{pointer-events:none}
.slots.fg .slot{border:1.5px solid #c9a44c66;transition:border-color .2s,box-shadow .2s}
.slots.fg .slot.on{border-color:var(--glow);box-shadow:0 0 10px #ffd86a99,inset 0 0 10px #ffd86a55}
#hcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#combo{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#16302cbf;border:1px solid #c9a44c55;border-radius:9px;text-align:center;padding:2px}
#combo span{font-size:9.5px;color:#cbbd96}
#combo b{font-family:var(--serif);font-size:12.5px;line-height:1.15;color:var(--parch);word-break:keep-all}
#combo i{font-style:normal;font-size:11px;font-weight:800;margin-top:2px}
#circles{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
.rc{width:36px;height:36px;border-radius:50%;border:2px solid var(--brass);background:radial-gradient(circle at 40% 35%,#fff7e0,var(--parch2));color:var(--ink);font-size:17px;font-weight:900;padding:0;box-shadow:0 2px 0 #0006;display:flex;align-items:center;justify-content:center}
.rc:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #0006}
.rc:disabled{opacity:.35;filter:grayscale(1)}
.rc.used{opacity:.4}
#finalBtn{border:2px solid var(--brass);border-radius:10px;background:radial-gradient(circle at 40% 30%,#c8484f,var(--wax2));color:#fff3dc;font-family:var(--serif);font-weight:700;font-size:13.5px;line-height:1.15;box-shadow:0 2px 0 #0007;padding:2px}
#finalBtn:disabled{opacity:.4;filter:grayscale(.6)}
#btns{display:grid;grid-template-columns:1.15fr 1fr 1.1fr .8fr 1.1fr;gap:5px;flex:none;align-items:end}
.b{border:2px solid var(--brass2);border-radius:10px;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);font-weight:800;font-size:12.5px;line-height:1.2;padding:6px 2px;min-height:46px;box-shadow:0 2px 0 #0007;word-break:keep-all}
.b small{font-size:10px;font-weight:600;color:#6a5a40}
.b:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #0007}
.b:disabled{opacity:.45}
.b.boss{background:linear-gradient(180deg,#e9b39a,#c97a62);border-color:#7a2a20}
.b.next{background:linear-gradient(180deg,#bfe0c4,#8fc29a);border-color:#3a6a44;width:100%}
.nextBox{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.tg{display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;white-space:nowrap;letter-spacing:-.3px;color:var(--parch);cursor:pointer;padding:1px 0}
.tg i{width:26px;height:14px;border-radius:8px;background:#0006;border:1px solid var(--brass);position:relative;transition:background .2s}
.tg i:after{content:'';position:absolute;left:1px;top:1px;width:10px;height:10px;border-radius:50%;background:var(--parch);transition:left .2s}
.tg.on i{background:#4f9a5c}.tg.on i:after{left:13px}
.ovl{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(120% 90% at 50% 30%,#2b5550f2,#122624f7)}
.ovl[hidden],#pop[hidden],#uinfo[hidden],#bossBar[hidden]{display:none}
.card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border:2px solid var(--brass2);border-radius:16px;padding:18px 16px;box-shadow:0 6px 0 #0007}
.card .sub{text-align:center;font-size:12px;color:#7a6440}
.card h1{font-family:var(--serif);text-align:center;font-size:30px;margin:2px 0 6px;color:var(--wax2);letter-spacing:1px}
.lore{font-family:var(--serif);font-size:13px;line-height:1.7;color:#4a3e30;text-align:center;margin:0 0 12px}
.fld{display:block;font-size:12px;color:#6a5a40;margin-bottom:10px}
.fld input{display:block;width:100%;margin-top:4px;padding:9px 10px;font-size:16px;border:2px solid #c8b080;border-radius:10px;background:#fffaf0;color:var(--ink);font-family:inherit;-webkit-user-select:text;user-select:text}
.dh{font-weight:800;font-size:13px;margin:6px 0 6px}.dh small{font-weight:400;color:#7a6440;font-size:11px}
#debList{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.db{border:1.5px solid #c8b080;background:#fff8e6;border-radius:10px;padding:6px 7px;text-align:left;color:var(--ink);font-size:12px;line-height:1.3}
.db small{display:block;color:#7a6440;font-size:10.5px}
.db.on{background:#f3d2c8;border-color:var(--wax);box-shadow:inset 0 0 0 1px var(--wax)}
.mult{text-align:center;margin:10px 0;font-size:13px}.mult b{font-size:18px;color:var(--wax2)}
.big{display:block;width:100%;border:2px solid var(--brass);border-radius:12px;background:radial-gradient(circle at 40% 30%,#c8484f,var(--wax2));color:#fff3dc;font-family:var(--serif);font-size:19px;font-weight:700;padding:11px;box-shadow:0 3px 0 #0007}
.ghost{display:block;width:100%;margin-top:8px;border:1.5px solid var(--brass2);border-radius:12px;background:transparent;color:var(--ink);font-size:14px;font-weight:700;padding:9px}
#pop{position:fixed;inset:0;z-index:40;background:#0b1614a8;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:100%;max-width:460px;max-height:86%;overflow:auto;background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border:2px solid var(--brass2);border-radius:14px;padding:14px 13px;box-shadow:0 6px 0 #0007;-webkit-overflow-scrolling:touch}
.sheet h2{font-family:var(--serif);margin:0;font-size:20px;color:var(--wax2)}
.sheet h3{font-family:var(--serif);font-size:15px;margin:14px 0 6px;color:var(--wax2);border-bottom:1px solid #8a6a2844;padding-bottom:3px}
.sheet p,.sheet li{font-size:12.5px;line-height:1.65;margin:4px 0}
.sheet ul{padding-left:18px;margin:4px 0}
.sheet table{width:100%;border-collapse:collapse;font-size:11.5px}
.sheet td,.sheet th{border-bottom:1px solid #8a6a2833;padding:4px 3px;vertical-align:top;text-align:left}
.sheet th{font-size:11px;color:#6a5a40}
.sheet a{color:var(--wax2);font-weight:800}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pg{font-weight:900;font-size:15px;display:flex;align-items:center;gap:5px}
.pn{color:#6a5a40;font-size:11.5px!important}
.row{display:grid;grid-template-columns:34px 1fr auto 62px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #8a6a2833}
.row .ic{font-size:22px;text-align:center}
.row b{display:block;font-size:13.5px}.row small{display:block;font-size:10.5px;color:#6a5a40;line-height:1.35}
.row .lv{text-align:right;font-weight:900;font-size:13px;white-space:nowrap}.row .lv small{font-weight:600}
.row button{border:0;border-radius:9px;background:var(--wax);color:#fff;font-weight:800;font-size:12px;padding:7px 2px;line-height:1.25}
.row button:disabled{background:#b8a888;color:#f4ecd8}
.warn{background:#f3d2c8;border:1px solid var(--wax);border-radius:8px;padding:6px 8px;font-size:11.5px!important;color:var(--wax2)}
.pclose{display:block;width:100%;margin-top:10px;border:1.5px solid var(--brass2);border-radius:10px;background:#d8c69a;font-weight:800;padding:8px;color:var(--ink)}
#rec{background:#fffaf0;border:1.5px dashed #b8a070;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;margin:10px 0;font-family:inherit;-webkit-user-select:text;user-select:text;color:var(--ink)}
.vlink{display:block;text-align:center;margin-top:9px;color:var(--wax2);font-weight:800;font-size:13px}
.tc{display:inline-block;padding:0 6px;border-radius:8px;color:#fff;font-size:10.5px;font-weight:800}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <div class="c"><span>스테이지</span><b id="hStage">0/50</b></div>
  <div class="c"><span>몬스터 수</span><b id="hMon">0</b></div>
  <div class="c"><span>라이프</span><b id="hLife">100</b></div>
  <div class="c"><span>경과 시간</span><b id="hTime">00:00</b></div>
  <div class="c"><span>최고 티어</span><b id="hTier">-</b></div>
 </div>
 <div id="board"><canvas id="cv"></canvas>
  <div id="gold"><i class="coin"></i><b id="goldV">0</b></div>
  <div id="terr"></div>
  <div id="bossBar" hidden><div class="bn" id="bossName"></div><div class="bh"><i id="bossHp"></i></div><div class="bp"><span>성문까지</span><div><i id="bossProg"></i></div></div></div>
  <div id="banner"></div><div id="toast"></div><div id="vign"></div>
</div>
 <div id="handArea">
  <div class="lbl">패<small id="tickets"></small></div>
  <div id="handBox">
   <div class="slots bg"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
   <canvas id="hcv"></canvas>
   <div class="slots fg" id="slotFg"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  </div>
  <div id="combo"><span>현재 조합</span><b id="comboN">-</b><i id="comboG"></i></div>
  <div class="lbl sm">패<br>돌리기<small>각 1회</small></div>
  <div id="circles"><button class="rc" data-a="rr" data-i="0">↻</button><button class="rc" data-a="rr" data-i="1">↻</button><button class="rc" data-a="rr" data-i="2">↻</button><button class="rc" data-a="rr" data-i="3">↻</button><button class="rc" data-a="rr" data-i="4">↻</button></div>
  <button id="finalBtn" data-a="final">최종<br>선택</button>
  <div id="uinfo" hidden></div>
 </div>
 <div id="btns">
  <button class="b" data-a="help">게임설명<br><small>티어 조합표</small></button>
  <button class="b boss" data-a="boss" id="bossBtn">보스<br>소환</button>
  <button class="b" data-a="upg">업그레이드<br><small id="upGold">금화 0</small></button>
  <button class="b" data-a="speed" id="spdBtn">배속<br>x1</button>
  <div class="nextBox"><div class="tg" data-a="auto" id="autoTg"><i></i>자동 넘기기</div><button class="b next" data-a="next" id="nextBtn">라운드<br>넘기기</button></div>
 </div>
</div>

<div id="start" class="ovl"><div class="card">
 <div class="sub">로웬 포커 디펜스</div>
 <h1>운명패 방위전</h1>
 <p class="lore">별탑 학회가 별의 운행을 새겨 만든 쉰두 장의 운명패.<br>다섯 장이 이루는 조합이 여섯 결사의 수호자를 깨운다.<br>균열에서 쏟아지는 마물이 성문에 닿기 전에 막아라.</p>
 <label class="fld">원정대장 이름<input id="nameIn" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off"></label>
 <div class="dh">디버프 선택 <small>고를수록 어려워지고 점수 배율이 오릅니다</small></div>
 <div id="debList"></div>
 <div class="mult">점수 배율 <b id="multV">x1.00</b></div>
 <button class="big" data-a="start">원정 시작</button>
 <button class="ghost" data-a="help">게임설명 · 티어 조합표</button>
</div></div>

<div id="end" class="ovl" hidden><div class="card">
 <div class="sub" id="endSub"></div>
 <h1 id="endT"></h1>
 <pre id="rec"></pre>
 <button class="big" data-a="copy" id="copyBtn">기록 복사</button>
 <a class="vlink" href="https://chillermaster.github.io/flashgame/rowen-poker-verify.html" target="_blank" rel="noopener">점수검증기 열기</a>
 <button class="ghost" data-a="again">다시 원정</button>
</div></div>

<div id="pop" hidden><div class="sheet" id="sheet"></div></div>

<script>
const GRID=12, MAX_STAGE=50, PER_STAGE=20;
const WAYPTS=[[3,-1.7],[3,10],[1,10],[1,8],[10,8],[10,10],[7,10],[7,1],[10,1],[10,4],[5,4],[5,6],[1,6],[1,-1.7]];
const SEGS=[];let PATH_LEN=0;
for(let i=0;i<WAYPTS.length-1;i++){const a=WAYPTS[i],b=WAYPTS[i+1],len=Math.hypot(b[0]-a[0],b[1]-a[1]);SEGS.push({a,b,s0:PATH_LEN,len});PATH_LEN+=len;}
function pathPos(s){
  if(s<=0)return{c:WAYPTS[0][0],r:WAYPTS[0][1],dc:0,dr:1};
  for(const g of SEGS){if(s<=g.s0+g.len){const t=(s-g.s0)/g.len;return{c:g.a[0]+(g.b[0]-g.a[0])*t,r:g.a[1]+(g.b[1]-g.a[1])*t,dc:(g.b[0]-g.a[0])/g.len,dr:(g.b[1]-g.a[1])/g.len};}}
  const L=WAYPTS[WAYPTS.length-1];return{c:L[0],r:L[1],dc:0,dr:-1};
}
const PATHCELL=new Set();

  else if(gr[0].idx.length===4){rank=7;used=gr[0].idx;}
  else if(gr[0].idx.length===3&&gr[1].idx.length===2){rank=6;used=all;}
  else if(flush){rank=5;used=all;}
  else if(straight){rank=4;used=all;}
  else if(gr[0].idx.length===3){rank=3;used=gr[0].idx;}
  else if(gr[0].idx.length===2&&gr[1].idx.length===2){rank=2;used=gr[0].idx.concat(gr[1].idx);}

  else{let hi=0;cs.forEach((c,i)=>{if(c.r>cs[hi].r)hi=i;});rank=0;used=[hi];}
  return{rank,used,grade:HAND_G[rank],name:HAND_N[rank]};
}

  $('endSub').textContent=win?'맹약의 성문을 지켜냈습니다':S.over==='boss'?'보스가 성문을 넘었습니다':'성문이 무너졌습니다';
  $('endT').textContent=res;$('rec').textContent=recText;$('copyBtn').textContent='기록 복사';$('end').hidden=false;}
function copyRec(){const done=()=>{$('copyBtn').textContent='복사되었습니다 ✓';};

// ---- input ----
let downEl=null;
document.addEventListener('pointerdown',e=>{downEl=e.target.closest('[data-a]');},true);
document.addEventListener('pointerup',e=>{const t=e.target.closest('[data-a]');if(!t||t!==downEl||t.disabled)return;downEl=null;act(t.dataset.a,t);});
let popDown=false;pop.addEventListener('pointerdown',e=>{popDown=e.target===pop;});pop.addEventListener('pointerup',e=>{if(popDown&&e.target===pop)closePop();popDown=false;});
function act(a,t){
  switch(a){
  case 'deb':{const id=t.dataset.id;debSel.has(id)?debSel.delete(id):debSel.add(id);t.classList.toggle('on',debSel.has(id));$('multV').textContent='x'+debuffMult([...debSel]).toFixed(2);break;}
  case 'start':{playerName=($('nameIn').value||'').replace(/[\r\n|]/g,' ').trim().slice(0,12)||'무명 원정대장';try{localStorage.setItem('rpk_name',playerName);}catch(e){}
    $('nameIn').blur();$('start').hidden=true;newGame();break;}
  case 'again':$('end').hidden=true;$('start').hidden=false;running=false;paused=true;break;
  case 'copy':copyRec();break;
  case 'help':openPop('help');break;
  case 'closePop':closePop();break;
  case 'upg':if(running)openPop('upg');break;
  case 'boss':if(running)openPop('boss');break;
  case 'buy':if(GM.buy(+t.dataset.i)){renderPop();uiTick();if(selU)renderInfo();}break;
  case 'summon':if(GM.summon(+t.dataset.i)){closePop();}break;
  case 'speed':speed=speed>=3?1:speed+1;uiTick();break;
  case 'auto':if(S){S.auto=!S.auto;autoOn=S.auto;uiTick();}else{autoOn=!autoOn;$('autoTg').classList.toggle('on',autoOn);}break;
  case 'next':if(running&&!paused&&GM.next())uiTick();break;
  case 'rr':if(running&&!paused&&GM.reroll(+t.dataset.i))uiTick();break;
  case 'final':if(running&&!paused&&GM.finalize()){dealAt=-1;uiTick();}break;
  case 'dismiss':if(selU){const u=selU;select(null);GM.dismiss(u);uiTick();}break;
  case 'unsel':select(null);break;}}
const ray=new THREE.Raycaster(),gplane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.13);let bDown=null,drag=null;
const dropM=new THREE.Mesh(new THREE.PlaneGeometry(0.94,0.94),new THREE.MeshBasicMaterial({color:0x6ad86a,transparent:true,opacity:0.55,depthWrite:false}));dropM.rotation.x=-Math.PI/2;dropM.visible=false;scene.add(dropM);
function setRay(x,y){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1),cam);}
function tileAt(x,y){setRay(x,y);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(gplane,p))return null;const c=Math.round(p.x+5.5),rw=Math.round(p.z+5.5);return{c,r:rw,p,in:c>=0&&rw>=0&&c<GRID&&rw<GRID};}
function pickUnit(x,y){setRay(x,y);const objs=[];for(const[,o]of uMesh)objs.push(o.g);const hit=ray.intersectObjects(objs,true)[0];
  if(hit){let ob=hit.object;while(ob&&!objs.includes(ob))ob=ob.parent;for(const[,o]of uMesh)if(o.g===ob)return o.u;}
  const t=tileAt(x,y);return t&&t.in?GM.unitAt(t.c,t.r)||null:null;}
function endDrag(){if(!drag)return;const o=uMesh.get(drag.u.id);if(o&&o.dragPos){o.fx=o.g.position.x;o.fz=o.g.position.z;o.dragPos=null;o.mt=0;}dropM.visible=false;drag=null;}
cv.addEventListener('pointerdown',e=>{if(!running||paused)return;bDown=[e.clientX,e.clientY];const u=pickUnit(e.clientX,e.clientY);drag=u?{u,on:false}:null;if(u){try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(!drag||!bDown)return;const dx=e.clientX-bDown[0],dy=e.clientY-bDown[1];
  if(!drag.on){if(dx*dx+dy*dy<90)return;drag.on=true;select(drag.u);}
  const t=tileAt(e.clientX,e.clientY),o=uMesh.get(drag.u.id);if(!t||!o)return;o.dragPos=[t.p.x,t.p.z];
  if(!t.in){dropM.visible=false;return;}const other=GM.unitAt(t.c,t.r);
  dropM.visible=true;dropM.position.set(WX(t.c),0.16,WZ(t.r));dropM.material.color.set(other===drag.u?0xffffff:other?0x5aa6f0:GM.free(t.c,t.r)?0x6ad86a:0xe8443a);});
cv.addEventListener('pointerup',e=>{if(!bDown)return;const x=e.clientX,y=e.clientY;bDown=null;
  if(drag&&drag.on){const u=drag.u,t=tileAt(x,y);endDrag();
    if(running&&!paused&&t&&t.in){const other=GM.unitAt(t.c,t.r);
      if(other&&other!==u){GM.swap(u,other);toast('위치를 맞바꿨습니다');}
      else if(GM.free(t.c,t.r))GM.place(u,t.c,t.r);
      else if(GM.isPath(t.c,t.r))toast('길 위에는 배치할 수 없습니다');}
    select(u);return;}
  const u=drag?drag.u:null;drag=null;if(!running||paused)return;
  if(u)select(selU===u?null:u);else select(null);});
cv.addEventListener('pointercancel',()=>{bDown=null;endDrag();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
let lastTE=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<350&&!e.target.closest('input'))e.preventDefault();lastTE=n;},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
// ---- layout ----
const camDir=new THREE.Vector3(0,Math.sin(0.94),Math.cos(0.94)),camTgt=new THREE.Vector3(0,0,0.3);
const FIT_PTS=[[-6.45,0.2,6.45],[6.45,0.2,6.45],[-6.45,0.2,-6.45],[6.45,0.2,-6.45],[-4.5,2.1,-7.3],[-2.5,1.6,-7.3]].map(a=>new THREE.Vector3(a[0],a[1],a[2]));
function fit(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  let d=24;camTgt.set(0,0,0.3);const top=1-2*Math.min(92,h*0.17)/h,bot=-0.96,mid=(top+bot)/2;
  for(let k=0;k<12;k++){cam.position.copy(camTgt).addScaledVector(camDir,d);cam.lookAt(camTgt);cam.updateMatrixWorld();let mx=0,y0=9,y1=-9;
    for(const p of FIT_PTS){const q=p.clone().project(cam);mx=Math.max(mx,Math.abs(q.x)/0.965);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y);}
    d*=Math.max(mx,(y1-y0)/(top-bot));camTgt.z-=((y0+y1)/2-mid)*4.5;}
  scene.fog.near=d*0.9;scene.fog.far=d*2.1;}
const ro=new ResizeObserver(()=>{fit();layoutHand();});ro.observe($('board'));ro.observe(hcv);
window.addEventListener('resize',()=>{fit();layoutHand();});

let last=performance.now(),uiT=0;

  if(GM&&running&&!paused&&!document.hidden){realSec+=dt;let gdt=dt*speed;
    while(gdt>1e-6&&!S.over&&!S.win){const st=Math.min(0.05,gdt);GM.update(st);gdt-=st;}
    if(!S.hand&&S.tickets>0&&!S.over&&!S.win){if(dealAt<0)dealAt=realSec+0.5;else if(realSec>=dealAt){GM.dealHand();dealAt=-1;}}}
  processEvents();
  const adt=(running&&!paused)?dt*speed:0;
  if(S){syncUnits(adt||dt*0.0001);syncMons(adt);syncProj();}
  updFx(adt);
  riftRing.rotation.z+=dt*1.2;riftDisc.rotation.z-=dt*2;
  if(gateFlash>0){gateFlash-=dt;gateDoor.material.emissive.setRGB(Math.max(0,gateFlash)*1.6,0,0);}
  const A=ambMode,pa=amb.geometry.attributes.position.array;for(let i=0;i<ambN;i++){pa[i*3]+=A.vx*dt;pa[i*3+1]+=A.vy*dt;if(pa[i*3+1]<0)pa[i*3+1]+=7;if(pa[i*3+1]>7)pa[i*3+1]-=7;if(pa[i*3]>9)pa[i*3]-=18;if(pa[i*3]<-9)pa[i*3]+=18;}amb.geometry.attributes.position.needsUpdate=true;
  if(curTheme===6){stormT-=dt;if(stormT<0){stormT=4+Math.random()*6;hemi.intensity=1.8;}hemi.intensity+=(0.56-hemi.intensity)*Math.min(1,dt*6);}
  syncHand(dt);

  R.render(scene,cam);HR.render(hScene,hCam);}
applyTheme(0);fit();layoutHand();requestAnimationFrame(frame);
