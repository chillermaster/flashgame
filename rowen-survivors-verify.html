<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>균열의 30분 · 점수 검증기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23180f;--gold:#e3b54a;--rift:#6b3fc4;--blood:#b23a2b;--ok:#2f7a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#3a2a6a 0%,#1c1630 60%);font-family:'Gowun Batang',serif;color:var(--ink);touch-action:manipulation}
main{max-width:640px;margin:0 auto;padding:16px 12px 40px}
h1{margin:6px 0 2px;text-align:center;color:#fff;font-size:30px;text-shadow:0 3px 0 #2a1650,0 0 18px #6b3fc4}
.sub{text-align:center;color:#e3d0ff;font-size:13px;margin-bottom:14px;line-height:1.6}
.panel{background:linear-gradient(#fbf1da,#efdcae);border:3px solid #4a2e14;border-radius:14px;box-shadow:0 0 0 2px var(--gold) inset,0 10px 30px #0007;padding:14px}
textarea{width:100%;min-height:170px;border:2px solid #4a2e14;border-radius:10px;padding:10px;font:inherit;font-size:13px;background:#fffaf0;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
button{font:inherit;font-weight:700;border:2px solid #4a2e14;border-radius:10px;padding:9px 18px;background:#fbf1da;box-shadow:0 3px 0 #4a2e14;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2e14}
button.go{background:linear-gradient(#8a5ae0,#5a2fb0);color:#fff}
#out{margin-top:14px}
.verdict{font-size:22px;font-weight:700;text-align:center;padding:10px;border-radius:10px;margin-bottom:10px}
.verdict.ok{background:#dff3d8;color:var(--ok);border:2px solid var(--ok)}.verdict.bad{background:#fde2dc;color:var(--blood);border:2px solid var(--blood)}.verdict.warn{background:#fff1c8;color:#8a5d16;border:2px solid #c89a2a}
.score{font-family:'Cinzel',serif;font-weight:900;font-size:38px;text-align:center;color:#7a2a1c;margin:4px 0 8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
dt{color:#6b4a26}dd{margin:0;font-weight:700;text-align:right}
ul{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6}
.note{font-size:12.5px;color:#4a3a2a;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>균열의 30분</h1>
<div class="sub">로웬 서바이버 점수 검증기<br>댓글에 붙여넣은 기록을 그대로 넣으면 진짜 기록인지 확인합니다.</div>
<div class="panel">
<textarea id="inp" placeholder="게임 결과 화면에서 복사한 기록 전체를 붙여넣으세요. (검증코드 RS1. 로 시작하는 줄이 꼭 들어 있어야 합니다)"></textarea>
<div class="row"><button class="go" id="goB">검증하기</button><button id="clrB">지우기</button></div>
<div id="out"></div>
<div class="note">검증코드에는 이름, 수호자, 지형, 시련, 생존 시간, 처치 수, 레벨, 골드, 진화, 보스·정예 처치, 점수가 서명과 함께 들어 있습니다. 숫자 하나라도 바꾸면 서명이 맞지 않습니다. 기록 본문의 점수나 이름을 고쳐 붙여넣은 경우도 따로 알려 드립니다.</div>
</div>
</main>
<script>
'use strict';
const VD={"chars":{"squire":"견습 기사","guard":"철벽 수호기사","slayer":"용살자","arden":"태양왕 아르덴","pick":"소매치기","ashblade":"잿빛 단검수","shadow":"그림자 칼날","hunter":"사냥꾼","sniper":"매의 눈 저격수","ranger":"바람 순찰대장","stormbow":"폭풍 궁신","pyro":"불꽃 마법사","cryo":"서리 마법사","volt":"번개 마법사","elsion":"별의 현자 엘시온","bogsham":"늪뿌리 주술사","crowsham":"까마귀 주술사","totemsham":"조상 토템 주술사","thornsham":"가시뿌리 주술사","priest":"새벽 사제","monk":"순례 수도사","iris":"새벽의 성녀 이리스","m_wolf":"들늑대","m_eagle":"바위 독수리","m_fish":"어인 창병","m_shroom":"포자 버섯","m_bandit":"산적","m_skel":"해골병","m_imp":"임프","m_whelp":"새끼 용","m_flame":"불꽃 정령","m_scorp":"사막 전갈"},"maps":{"plain":"하르딘 평원","forest":"엘름 고목숲","river":"실버린 강","dune":"붉은 사구","mount":"회색이빨 산맥","swamp":"검은물 늪","coast":"폭풍 해안","glacier":"서리왕관 빙하","volcano":"재의 산 이그니르","abyss":"검은 첨탑 심연"},"curses":[{"n":"강철 피부","w":0.25},{"n":"질주 본능","w":0.2},{"n":"끝없는 무리","w":0.2},{"n":"날카로운 이빨","w":0.15},{"n":"연약한 몸","w":0.15},{"n":"메마른 샘","w":0.15},{"n":"무거운 발","w":0.15},{"n":"둔한 손","w":0.2},{"n":"무딘 칼날","w":0.2},{"n":"흐린 정신","w":0.15},{"n":"짧은 손","w":0.05},{"n":"좁은 길","w":0.15},{"n":"운명의 굴레","w":0.05},{"n":"가벼운 짐","w":0.2},{"n":"빈 주머니","w":0.15},{"n":"정예의 행군","w":0.1},{"n":"군주의 분노","w":0.15},{"n":"영원한 밤","w":0.1},{"n":"좁은 시야","w":0.05},{"n":"원한의 폭발","w":0.2},{"n":"균열 사수","w":0.15},{"n":"저주받은 땅","w":0.1},{"n":"불운","w":0.1},{"n":"닫힌 상자","w":0.2},{"n":"굶주림","w":0.1},{"n":"가속하는 균열","w":0.3},{"n":"피의 대가","w":0.1},{"n":"필멸","w":0.05},{"n":"혼돈의 선택","w":0.3},{"n":"요동치는 하늘","w":0.1},{"n":"핏빛 월식","w":0.1},{"n":"마력 역류","w":0.1},{"n":"사자의 행진","w":0.2},{"n":"굳은 갑옷","w":0.15},{"n":"저주받은 피","w":0.1},{"n":"몰아치는 파도","w":0.15}]};
const FINAL_T=1800;
const SCORE={sec:3,kill:1,lvl:50,gold:2,evo:800,mid:3000,lord:6000,elite:150,final:30000,clearT:30};
function calcScore(o){let s=Math.min(o.secs,FINAL_T)*SCORE.sec+o.kills*SCORE.kill+o.lvl*SCORE.lvl+o.gold*SCORE.gold+o.evos*SCORE.evo+o.mid*SCORE.mid+o.lord*SCORE.lord+o.elites*SCORE.elite;
 if(o.win)s+=SCORE.final+Math.max(0,600-(o.clear-FINAL_T))*SCORE.clearT;return Math.round(s*o.mult)}
const SALT='rowen-survivors/luca/v1#9c41-e7b2';
function h53(str,s){let h1=0xdeadbeef^s,h2=0x41c6ce57^s;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function sign(p){const s=SALT+'|'+p+'|'+SALT.length;const a=h53(s,7),b=h53(s+a,131);return(a.toString(36).padStart(11,'0')+b.toString(36).padStart(11,'0')).toUpperCase()}

function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function maskParse(s){const cm=[];for(let i=0;i<VD.curses.length;i++){const v=parseInt(s[i>>2]||'0',16);cm.push(!!(v>>(i&3)&1))}return cm}
const fmt=n=>Math.round(n).toLocaleString('ko-KR'),fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function verify(text){const m=/RS1\.([A-Za-z0-9_-]+)\.([0-9A-Z]{22})/.exec(text);if(!m)return{bad:'검증코드를 찾지 못했습니다. RS1. 로 시작하는 코드가 들어 있는지 확인하세요.'};
 let p;try{p=b64d(m[1])}catch(e){return{bad:'코드가 깨져 있어 읽을 수 없습니다. 복사할 때 잘렸는지 확인하세요.'}}
 if(sign(p)!==m[2])return{bad:'서명이 맞지 않습니다. 검증코드가 바뀌었거나 일부가 잘렸습니다.'};
 const f=p.split('~');if(f.length!==19||f[0]!=='1')return{bad:'이 검증기가 읽을 수 없는 형식입니다.'};
 const [ver,name,ch,mp,mask,score,win,secs,clear,kills,lvl,gold,evos,mid,lord,elites,seed,ds,nonce]=f;
 const n=x=>+x;const cm=maskParse(mask),cs=VD.curses.filter((c,i)=>cm[i]);let mult=1;cs.forEach(c=>mult+=c.w);mult=Math.round(mult*100)/100;
 const o={secs:n(secs),win:n(win),clear:n(clear),kills:n(kills),lvl:n(lvl),gold:n(gold),evos:n(evos),mid:n(mid),lord:n(lord),elites:n(elites),mult};
 const re=calcScore(o),warn=[];if(re!==n(score))return{bad:'점수가 기록 내용과 맞지 않습니다.'};
 if(o.secs>2405)warn.push('생존 시간이 게임에서 가능한 최대치(40분)를 넘습니다.');
 if(o.win&&(o.clear<FINAL_T||o.clear>2405))warn.push('최종 보스 처치 시각이 맞지 않습니다.');
 if(o.kills>o.secs*90)warn.push('처치 수가 생존 시간에 비해 지나치게 많습니다.');
 if(o.lvl>420||o.evos>6||o.elites>o.secs/15+5)warn.push('레벨·진화·정예 수가 가능한 범위를 벗어났습니다.');
 const sm=/점수\s*[:：]\s*([\d,]+)/.exec(text);if(sm&&+sm[1].replace(/,/g,'')!==n(score))warn.push(`본문의 점수(${sm[1]})가 검증코드의 점수(${fmt(score)})와 다릅니다. 본문이 수정되었습니다.`);
 const nm=/이름\s*[:：]\s*(.+)/.exec(text);if(nm&&nm[1].trim()!==name)warn.push(`본문의 이름(${nm[1].trim()})이 검증코드의 이름(${name})과 다릅니다.`);
 return{ok:1,warn,name,ch:VD.chars[ch]||ch,mp:VD.maps[mp]||mp,cs,mult,o,score:n(score),ds}}
function show(r){const out=document.getElementById('out');if(r.bad){out.innerHTML=`<div class="verdict bad">✘ 확인되지 않은 기록</div><div>${esc(r.bad)}</div>`;return}
 const o=r.o;const rows=[['이름',r.name],['수호자',r.ch],['지형',r.mp],['결과',o.win?`말레크 처치 (클리어 ${fmtT(o.clear)})`:`${fmtT(o.secs)} 생존`],['생존 시간',fmtT(o.secs)],['처치',fmt(o.kills)],['레벨',o.lvl],['골드',fmt(o.gold)],['진화',o.evos],['정예 처치',o.elites],['중간 보스 · 군주',`${o.mid?'✔':'✘'} · ${o.lord?'✔':'✘'}`],['시련',`${r.cs.length}개 (×${r.mult.toFixed(2)})`],['날짜',`${r.ds.slice(0,4)}-${r.ds.slice(4,6)}-${r.ds.slice(6)}`]];
 out.innerHTML=(r.warn.length?`<div class="verdict warn">⚠ 코드는 진짜지만 확인할 점이 있습니다</div><ul>${r.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:`<div class="verdict ok">✔ 진짜 기록입니다</div>`)+
  `<div class="score">${fmt(r.score)}</div><dl>${rows.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`+(r.cs.length?`<div class="note">시련: ${esc(r.cs.map(c=>c.n).join(', '))}</div>`:'')}
document.getElementById('goB').onclick=()=>show(verify(document.getElementById('inp').value));
document.getElementById('clrB').onclick=()=>{document.getElementById('inp').value='';document.getElementById('out').innerHTML=''};
</script>
</body>
</html>
