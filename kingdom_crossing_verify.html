<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>왕국 횡단 · 기록 검증기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#3a2a1a radial-gradient(ellipse at top,#5a3f24,#24170c);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#3b2412;padding:16px;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto}
h1{text-align:center;color:#fff3d2;font-size:clamp(28px,7vw,40px);text-shadow:0 3px 0 #8a4416,0 6px 0 #4a2a12;margin:6px 0 14px}
.panel{background:linear-gradient(#f9edcf,#ecd5a3);border:3px solid #6b3f1d;border-radius:14px;box-shadow:0 5px 0 #4a2a12;padding:14px;margin-bottom:14px}
textarea{width:100%;height:200px;font-family:inherit;font-size:14px;line-height:1.45;border:2px solid #a07a48;border-radius:10px;padding:8px;background:#fffaf0;color:#3b2412;resize:vertical}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.btn{font-family:inherit;font-size:18px;border:3px solid #6b3f1d;background:linear-gradient(#f9d466,#d99e2c);color:#3b2412;border-radius:10px;padding:8px 20px;box-shadow:0 3px 0 #6b3f1d;cursor:pointer}
.btn.alt{background:linear-gradient(#efe3c6,#cfb98d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b3f1d}
.note{font-size:13px;color:#6b4a2a;margin-top:8px;line-height:1.5}
.rec{border-radius:10px;padding:10px;margin-bottom:10px;border:2px solid}
.ok{background:#e4f5dc;border-color:#3f8a3a}.bad{background:#fbe0dc;border-color:#b83a2c}.warn{background:#fff1c9;border-color:#c8941e}
.rec h3{font-size:18px;margin-bottom:4px}
.rec ul{list-style:none;font-size:14px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:6px 4px;border-bottom:1px dashed #b89a6a;text-align:center}
th{color:#7a2a1c}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>🏰 왕국 횡단 기록 검증기</h1>
<div class="panel">
 <textarea id="inp" placeholder="블로그 댓글에서 복사한 기록을 붙여넣으세요. 여러 개를 한꺼번에 붙여넣어도 됩니다."></textarea>
 <div class="row"><button class="btn" id="go">검증하기</button><button class="btn alt" id="clr">지우기</button></div>
 <div class="note">✅ 정상: 검증코드 일치 + 수치 정상 · ⚠️ 의심: 코드는 맞지만 수치가 비정상 · ❌ 위조: 코드 불일치 또는 항목 누락<br>순위: 점수 높은 순 → 같으면 시간 빠른 순 (정상 기록만)</div>
</div>
<div id="out"></div>
</div>
<script>
const GAME_ID='KC2',SALT='KingdomCrossing#chillermaster/flashgame~2026';
function cyrb53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function makeCode(d){const s=[GAME_ID,d.name,d.char,d.score,d.timeCs,d.rounds,d.lives,d.coins,d.gems,d.smash,d.deaths,d.date].join('|');const a=cyrb53(s+SALT,7).toString(36).toUpperCase().padStart(11,'0');const b=cyrb53(SALT+s,131).toString(36).toUpperCase().padStart(11,'0');const c=a+b;return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8,12)+'-'+c.slice(12,16);}
function fmtTime(cs){const m=Math.floor(cs/6000),s=Math.floor(cs/100)%60,c=cs%100;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');}
const rowsOf=r=>18+r*4,parOf=r=>rowsOf(r)*0.8+6+(r===10?40:0);
const LIVES={'기사':4,'도적':3,'전사':3,'마법사':3};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABELS=['이름:','캐릭터:','점수:','시간:','라운드:','남은 생명:','코인:','보석:','격파:','사망:','일시:','검증코드:'];

function parse(block){
 let t=block;LABELS.forEach(l=>{t=t.split(l).join('\n'+l);});
 const g=re=>{const m=t.match(re);return m?m[1].trim():null;};
 const tm=t.match(/시간:\s*(\d+):(\d{2})\.(\d{2})/);
 const d={name:(g(/이름:\s*([^\n]*)/)||'').replace(/[^\p{L}\p{N}_\-.]+$/u,'').trim(),
  char:(g(/캐릭터:\s*([^\n]*)/)||'').replace(/[^\p{L}]+$/u,'').trim(),
  score:g(/점수:\s*(\d+)/),timeCs:tm?(+tm[1])*6000+(+tm[2])*100+(+tm[3]):null,
  rounds:g(/라운드:\s*(\d+)\s*\/\s*10/),lives:g(/남은 생명:\s*(\d+)/),coins:g(/코인:\s*(\d+)/),gems:g(/보석:\s*(\d+)/),
  smash:g(/격파:\s*(\d+)/),deaths:g(/사망:\s*(\d+)/),date:g(/일시:\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})/),code:g(/검증코드:\s*([A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4})/)};
 ['score','rounds','lives','coins','gems','smash','deaths'].forEach(k=>{if(d[k]!==null)d[k]=+d[k];});
 return d;}

function check(d){
 const miss=Object.keys(d).filter(k=>d[k]===null||d[k]==='');
 if(miss.length)return{st:'bad',msg:['항목 누락/형식 오류: '+miss.join(', ')]};
 if(makeCode(d)!==d.code)return{st:'bad',msg:['검증코드 불일치 — 기록이 수정되었거나 위조되었습니다']};
 const w=[],R=d.rounds,L=LIVES[d.char];
 if(!L)w.push('알 수 없는 캐릭터');
 if(R<0||R>10)w.push('라운드 범위 오류');
 if(L&&d.lives>L)w.push('남은 생명이 최대치 초과');
 if(R<10&&d.lives!==0)w.push('미완주인데 생명이 남아 있음');
 if(R>=10&&d.lives<1)w.push('완주인데 생명 0');
 if(L&&d.deaths<L-d.lives)w.push('사망 횟수가 생명 감소량보다 적음');
 if(d.char!=='전사'&&d.smash>0)w.push('전사가 아닌데 격파 기록 있음');
 let max=d.coins*25+d.gems*100+d.smash*50;
 for(let r=1;r<=Math.min(10,R+1);r++)max+=rowsOf(r)*10;
 for(let r=1;r<=R;r++)max+=300*r+Math.ceil(parOf(r))*20;
 if(R>=10)max+=2000+d.lives*500+3000;
 if(d.score>max)w.push('점수가 이론상 최대치('+max+') 초과');
 let minT=0;for(let r=1;r<=R;r++)minT+=rowsOf(r)*0.08;
 if(d.timeCs/100<minT)w.push('클리어 시간이 비정상적으로 짧음');
 return w.length?{st:'warn',msg:w}:{st:'ok',msg:['검증코드 일치 · 수치 정상']};}

function run(){
 const txt=document.getElementById('inp').value;
 let blocks=txt.split(/(?=🏰\s*왕국 횡단)/).filter(b=>b.includes('검증코드'));
 if(!blocks.length&&txt.trim())blocks=[txt];
 const out=document.getElementById('out');
 if(!blocks.length){out.innerHTML='<div class="panel">검증할 기록을 붙여넣어 주세요.</div>';return;}
 const res=blocks.map(b=>{const d=parse(b);return{d,...check(d)};});
 const icon={ok:'✅ 정상 기록',warn:'⚠️ 의심 기록',bad:'❌ 위조/오류'};
 let h='';
 const good=res.filter(r=>r.st==='ok').sort((a,b)=>b.d.score-a.d.score||a.d.timeCs-b.d.timeCs);
 if(good.length>1){h+='<div class="panel"><h3 style="margin-bottom:6px">🏆 순위표</h3><div class="scroll"><table><tr><th>순위</th><th>이름</th><th>캐릭터</th><th>점수</th><th>시간</th><th>라운드</th></tr>'+
  good.map((r,i)=>'<tr><td>'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</td><td>'+esc(r.d.name)+'</td><td>'+esc(r.d.char)+'</td><td>'+r.d.score.toLocaleString()+'</td><td>'+fmtTime(r.d.timeCs)+'</td><td>'+r.d.rounds+'/10</td></tr>').join('')+'</table></div></div>';}
 h+='<div class="panel">'+res.map(r=>{const d=r.d;return '<div class="rec '+r.st+'"><h3>'+icon[r.st]+(d.name?' — '+esc(d.name):'')+'</h3><ul>'+
  (d.score!==null&&d.timeCs!==null?'<li>🛡️ '+esc(d.char)+' · 🏆 '+d.score+'점 · ⏱️ '+fmtTime(d.timeCs)+' · 🚩 '+d.rounds+'/10</li><li>❤️ '+d.lives+' · 🪙 '+d.coins+' · 💎 '+d.gems+' · 💥 '+d.smash+' · 💀 '+d.deaths+' · 📅 '+esc(d.date||'')+'</li>':'')+
  r.msg.map(m=>'<li>• '+esc(m)+'</li>').join('')+'</ul></div>';}).join('')+'</div>';
 out.innerHTML=h;}
document.getElementById('go').onclick=run;
document.getElementById('clr').onclick=()=>{document.getElementById('inp').value='';document.getElementById('out').innerHTML='';};
</script>
</body>
</html>
