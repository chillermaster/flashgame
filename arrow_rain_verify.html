<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>화살비 기록 진위검사기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#000; --paper:#fff; --line:#cfcfcf; --soft:#5a5a5a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); padding:24px 16px 48px;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:15px; line-height:1.5; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.3px; }
  .lead { color:var(--soft); margin:4px 0 18px; }
  textarea { width:100%; min-height:170px; padding:12px; font:inherit; font-size:14px; line-height:1.45;
    border:1px solid var(--ink); border-radius:6px; resize:vertical; }
  .bar { display:flex; gap:8px; margin:10px 0 18px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; padding:7px 18px; border:1px solid var(--ink); border-radius:6px;
    background:var(--paper); color:var(--ink); cursor:pointer; }
  button.main { background:var(--ink); color:var(--paper); }
  button:focus-visible, textarea:focus-visible { outline:2px dashed var(--ink); outline-offset:2px; }
  .summary { display:flex; gap:18px; flex-wrap:wrap; padding:10px 0 12px; border-top:1px solid var(--ink); }
  .summary b { font-size:20px; margin-left:4px; }
  h2 { font-size:17px; margin:22px 0 8px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; white-space:nowrap; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { border-bottom:1px solid var(--ink); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; min-width:44px; text-align:center; padding:1px 8px; border:1px solid var(--ink); border-radius:999px; font-size:13px; font-weight:600; }
  .tag.ok { background:var(--ink); color:var(--paper); }
  .tag.fake { text-decoration:line-through; }
  .tag.sus { border-style:dashed; }
  .tag.dup { color:var(--soft); border-color:var(--soft); }
  td.why { white-space:normal; color:var(--soft); min-width:200px; }
  .empty { color:var(--soft); padding:10px 0; }
  .note { margin-top:26px; font-size:13px; color:var(--soft); }
</style>
</head>
<body>
<main>
  <h1>화살비 기록 진위검사기</h1>
  <p class="lead">블로그 댓글을 통째로 붙여 넣고 검사를 누르세요. 기록 줄만 골라 인증코드와 기록의 앞뒤가 맞는지 확인합니다.</p>
  <textarea id="src" placeholder="🏹 [화살비] 이름: … | 등급: … | 점수: …점 | 버틴 시간: …초 | 금화: …개 (2026. 10. 21.) 🔐 AR1-XXXX-XXXX-XXXX"></textarea>
  <div class="bar">
    <button id="run" class="main">검사</button>
    <button id="clear">지우기</button>
    <button id="copyRank">진짜 기록 순위 복사</button>
  </div>
  <div id="out"></div>
  <p class="note">판정 기준. 진짜: 인증코드가 일치하고 기록도 게임 규칙과 맞음. 가짜: 인증코드 불일치나 형식 훼손. 의심: 코드는 맞지만 기록이 게임에서 나오기 어려운 값. 중복: 같은 인증코드가 이미 위에 있음.</p>
</main>
<script>
(function(){
'use strict';
// ---------- 점수 인증 (HMAC-SHA256, 순수 JS) ----------
const AR_SECRET='ar1-5186fda2597249e4cec25fabe51769e2';
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0xfc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x6ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n);
  m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer), bits=l*8;
  dv.setUint32(n-8,Math.floor(bits/4294967296)); dv.setUint32(n-4,bits>>>0);
  const w=new Uint32Array(64);
  for(let i=0;i<n;i+=64){
    for(let j=0;j<16;j++) w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){
      const a=w[j-15], b=w[j-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let j=0;j<64;j++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const t1=(h+S1+((e&f)^(~e&g))+SHA_K[j]+w[j])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const t2=(S0+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]+=a; H[1]+=b; H[2]+=c; H[3]+=d; H[4]+=e; H[5]+=f; H[6]+=g; H[7]+=h;
  }
  const out=new Uint8Array(32), od=new DataView(out.buffer);
  for(let i=0;i<8;i++) od.setUint32(i*4,H[i]);
  return out;
}
function hmacHex(keyStr,msgStr){
  const enc=new TextEncoder();
  let k=enc.encode(keyStr); if(k.length>64) k=sha256(k);
  const kp=new Uint8Array(64); kp.set(k);
  const msg=enc.encode(msgStr);
  const inner=new Uint8Array(64+msg.length), outer=new Uint8Array(96);
  for(let i=0;i<64;i++){ inner[i]=kp[i]^0x36; outer[i]=kp[i]^0x5c; }
  inner.set(msg,64); outer.set(sha256(inner),64);
  return Array.from(sha256(outer),x=>x.toString(16).padStart(2,'0')).join('');
}
function arCode(name,score,tenths,coins,rank,ymd){
  const h=hmacHex(AR_SECRET,['AR1',name,score,tenths,coins,rank,ymd].join('|')).slice(0,12).toUpperCase();
  return 'AR1-'+h.slice(0,4)+'-'+h.slice(4,8)+'-'+h.slice(8,12);
}

// ---------- 게임 규칙 (arrow_rain.html과 동일하게 유지) ----------
const V0=180, P0=240, V_UP=1.2, P_UP=1.12, PH=30, COLW=36;
const RANKS=[
  {t:15,n:'징집병'},{t:30,n:'견습병'},{t:45,n:'창병'},{t:60,n:'방패병'},
  {t:80,n:'종자'},{t:100,n:'기사'},{t:120,n:'기사대장'},{t:145,n:'기사단장'},
  {t:170,n:'남작'},{t:200,n:'백작'},{t:230,n:'공작'},{t:270,n:'성벽의 전설'}];
const rankOf=s=>{ let r=-1; RANKS.forEach((k,i)=>{ if(s>=k.t) r=i; }); return r; };
// 버틴 시간 동안 내려올 수 있는 최대 줄 수 (슬로모션 없이 최고 속도로 가정)
function maxRows(sec){
  let v=V0, sp=P0, rows=0, dt=0.05;
  for(let t=0;t<sec;t+=dt){
    const lvl=rankOf(t)+1;
    v+=(V0*Math.pow(V_UP,lvl)-v)*Math.min(1,dt*2.5);
    sp+=(P0*Math.pow(P_UP,lvl)-sp)*Math.min(1,dt*2.5);
    const D=Math.max(140-Math.min(lvl*3,24),(50+PH)+COLW*v/(0.8*sp));
    rows+=v*dt/D;
  }
  return Math.ceil(rows)+2;
}

const RE=/(?:🏹\s*)?\[화살비\]\s*이름:\s*(.+?)\s*\|\s*등급:\s*(.+?)\s*\|\s*점수:\s*([\d,]+)\s*점\s*\|\s*버틴 시간:\s*(\d+(?:\.\d)?)\s*초\s*\|\s*금화:\s*(\d+)\s*개\s*\(\s*(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.\s*\)\s*🔐\s*(AR1-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4})/g;

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let lastGood=[];
function check(text){
  const res=[], seen=new Set();
  let m; RE.lastIndex=0;
  while((m=RE.exec(text))){
    const [ , name, rank, scoreS, timeS, coinsS, y, mo, d, codeRaw ]=m;
    const score=parseInt(scoreS.replace(/,/g,''),10), tenths=Math.round(parseFloat(timeS)*10), coins=parseInt(coinsS,10);
    const code=codeRaw.toUpperCase(), ymd=+y+'-'+(+mo)+'-'+(+d);
    const r={name,rank,score,time:tenths/10,coins,date:y+'. '+(+mo)+'. '+(+d)+'.',code,verdict:'ok',why:[]};
    if(arCode(name,score,tenths,coins,rank,ymd)!==code){
      r.verdict='fake'; r.why.push('인증코드 불일치 (이름, 점수, 시간, 금화, 등급, 날짜 중 무언가 바뀜)'); res.push(r); continue;
    }
    if(seen.has(code)){ r.verdict='dup'; r.why.push('같은 기록이 앞에 이미 있음'); res.push(r); continue; }
    seen.add(code);
    const sec=tenths/10, ri=rankOf(sec), expRank=ri>=0?RANKS[ri].n:'없음';
    const bonus=score-tenths-coins*50, rows=maxRows(Math.min(sec,600));
    if(rank!==expRank) r.why.push('버틴 시간에 맞는 등급은 '+expRank);
    if(bonus<0) r.why.push('점수가 시간과 금화로 계산한 값보다 낮음');
    else if(bonus%5) r.why.push('아슬 보너스(5점 단위)로 설명되지 않는 끝자리');
    else if(bonus/5>rows*2) r.why.push('아슬 보너스가 가능한 최대치를 넘음');
    if(coins>Math.ceil(rows*0.054*3)+3) r.why.push('금화 개수가 지나치게 많음');
    if(sec>400) r.why.push('400초 초과, 사람 반응속도 한계를 넘는 구간');
    const when=new Date(+y,+mo-1,+d);
    if(when.getTime()>Date.now()+86400000) r.why.push('미래 날짜');
    if(r.why.length) r.verdict='sus';
    res.push(r);
  }
  const marks=(text.match(/\[화살비\]/g)||[]).length;
  return {res, broken:Math.max(0,marks-res.length)};
}

const LABEL={ok:'진짜',fake:'가짜',sus:'의심',dup:'중복'};
function render(){
  const {res,broken}=check(document.getElementById('src').value);
  const cnt={ok:0,fake:0,sus:0,dup:0}; res.forEach(r=>cnt[r.verdict]++);
  lastGood=res.filter(r=>r.verdict==='ok').sort((a,b)=>b.score-a.score);
  let h='<div class="summary"><span>진짜<b>'+cnt.ok+'</b></span><span>가짜<b>'+(cnt.fake+broken)+'</b></span><span>의심<b>'+cnt.sus+'</b></span><span>중복<b>'+cnt.dup+'</b></span></div>';
  if(broken) h+='<p class="empty">[화살비] 표시는 있지만 형식이 깨진 줄이 '+broken+'개 있어요. 손으로 고친 흔적일 수 있어 가짜로 셉니다.</p>';
  if(!res.length){ h+='<p class="empty">찾은 기록이 없어요. 댓글에 🔐 AR1- 로 시작하는 코드가 있는지 확인해 주세요.</p>'; }
  else {
    h+='<h2>판정 결과</h2><div class="scroll"><table><thead><tr><th>판정</th><th>이름</th><th>등급</th><th class="num">점수</th><th class="num">시간</th><th class="num">금화</th><th>날짜</th><th>사유</th></tr></thead><tbody>';
    res.forEach(r=>{ h+='<tr><td><span class="tag '+r.verdict+'">'+LABEL[r.verdict]+'</span></td><td>'+esc(r.name)+'</td><td>'+esc(r.rank)+'</td><td class="num">'+r.score.toLocaleString('en-US')+'</td><td class="num">'+r.time.toFixed(1)+'초</td><td class="num">'+r.coins+'</td><td>'+r.date+'</td><td class="why">'+esc(r.why.join(', '))+'</td></tr>'; });
    h+='</tbody></table></div>';
    h+='<h2>진짜 기록 순위</h2>';
    if(!lastGood.length) h+='<p class="empty">진짜로 판정된 기록이 아직 없어요.</p>';
    else { h+='<div class="scroll"><table><thead><tr><th class="num">순위</th><th>이름</th><th>등급</th><th class="num">점수</th><th class="num">시간</th><th>날짜</th></tr></thead><tbody>';
      lastGood.forEach((r,i)=>{ h+='<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.rank)+'</td><td class="num">'+r.score.toLocaleString('en-US')+'</td><td class="num">'+r.time.toFixed(1)+'초</td><td>'+r.date+'</td></tr>'; });
      h+='</tbody></table></div>'; }
  }
  document.getElementById('out').innerHTML=h;
}
document.getElementById('run').addEventListener('click',render);
document.getElementById('clear').addEventListener('click',()=>{ document.getElementById('src').value=''; document.getElementById('out').innerHTML=''; lastGood=[]; });
document.getElementById('copyRank').addEventListener('click',async e=>{
  if(!lastGood.length){ render(); }
  const txt=lastGood.map((r,i)=>(i+1)+'위 '+r.name+' | '+r.rank+' | '+r.score.toLocaleString('en-US')+'점 | '+r.time.toFixed(1)+'초').join('\n');
  if(!txt) return;
  try{ await navigator.clipboard.writeText(txt); e.target.textContent='복사했어요'; }
  catch(_){ e.target.textContent='복사 실패'; }
  setTimeout(()=>{ e.target.textContent='진짜 기록 순위 복사'; },1500);
});
if(typeof module!=='undefined') module.exports={check,arCode};
})();
</script>
</body>
</html>
