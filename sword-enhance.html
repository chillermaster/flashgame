<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>검 강화하기 : 어이쿠 손이 미끄러졌네</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d0a;--p1:#211813;--p2:#2b201a;--p3:#382a21;--line:#4d3a2b;--brass:#d2a75a;--brass2:#8c6a35;--ember:#ff7a2f;--tx:#f3e7d3;--mu:#b5a189;--good:#6fd38b;--bad:#ff5d5d;--warn:#ffb347;--blue:#6cb6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#3a2416 0,#120d0a 60%) fixed,#120d0a;color:var(--tx);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:14px;min-height:100vh;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}
#app{max-width:1180px;margin:0 auto;padding:8px 8px 24px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
#left,#right{min-width:0}
@media(max-width:380px){.tab{font-size:11.5px}.chip b{font-size:14px}.opt .tx b{font-size:12.5px}.btn{font-size:13px}}
@media(min-width:900px){#app{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}#right{position:sticky;top:8px}}
.card{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 #ffffff10 inset,0 8px 24px #0006}
/* top */
.top{padding:8px 10px}
.trow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.logo{font-family:'Black Han Sans',sans-serif;font-size:19px;letter-spacing:.5px;color:#ffd99a;text-shadow:0 2px 0 #6a3b12,0 0 14px #ff7a2f55;white-space:nowrap}
.logo small{display:block;font-family:'Gowun Batang',serif;font-size:11px;color:var(--mu);letter-spacing:0;text-shadow:none;margin-top:-2px}
.ibtn{background:var(--p3);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:17px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.chip{background:#0007;border:1px solid var(--line);border-radius:10px;padding:5px 6px;text-align:center;line-height:1.15}
.chip i{display:block;font-style:normal;font-size:10.5px;color:var(--mu)}
.chip b{font-size:15px;font-variant-numeric:tabular-nums}
.chip.gold b{color:#ffd66b}.chip.fuel b{color:#ff9a52}.chip.stk b{color:#b9a3ff}
.ev{margin-top:7px;padding:6px 9px;border-radius:9px;background:#00000055;border:1px dashed #6b5238;font-size:12.5px;color:#e9d6b8;display:flex;gap:6px;align-items:center}
.ev b{color:#ffd99a}
/* forge */
.forge{position:relative;overflow:hidden;border-radius:14px;padding:0}
#forge{display:block;width:100%;touch-action:manipulation;border-radius:14px}
.swinfo{padding:9px 12px 4px}
.sname{font-family:'Black Han Sans',sans-serif;font-size:22px;line-height:1.15;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sname .lv{font-size:26px}
.smeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#0006;border:1px solid var(--line);color:#e8d8bf}
.tag.t{font-weight:700}
.empty{padding:16px 12px;color:var(--mu);text-align:center;line-height:1.6}
/* rate */
.rate{padding:8px 12px 10px}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.rbig{font-family:'Black Han Sans',sans-serif;font-size:34px;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.rbig small{font-family:'Gowun Dodum';font-size:12px;color:var(--mu);margin-left:4px}
.rside{text-align:right;font-size:12px;color:var(--mu);line-height:1.45}
.rside b{color:var(--tx)}
.rbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:7px;background:#000;border:1px solid #000}
.rbar i{display:block;height:100%}
.rbar .s{background:linear-gradient(#8ff0a7,#3fae5f)}.rbar .k{background:#77706a}.rbar .d{background:linear-gradient(#ffc477,#e0832a)}.rbar .x{background:linear-gradient(#ff7b7b,#c42828)}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:11.5px;color:var(--mu)}
.rleg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0;background:var(--c)}
.rparts{margin-top:4px;font-size:11.5px;color:#cbb79b}
/* opts */
.opts{padding:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.opt{min-width:0;background:#0005;border:1px solid var(--line);border-radius:11px;padding:7px 8px;display:flex;align-items:center;gap:6px;min-height:46px;text-align:left;line-height:1.2}
.opt .ic{font-size:19px;width:24px;text-align:center;flex:none}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:13px}
.opt .tx small{display:block;font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.opt{width:100%}
button.opt.on{border-color:var(--brass);background:linear-gradient(180deg,#5a3f1d,#2e2014);box-shadow:0 0 0 1px #d2a75a55 inset}
button.opt.on .sw{background:var(--brass)}button.opt.on .sw::after{left:15px;background:#fff}
button.opt:disabled{opacity:.45}
.sw{width:30px;height:17px;border-radius:9px;background:#5a4a3d;position:relative;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#bba;transition:left .15s}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--p3);font-size:16px;line-height:1}
.stp span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.warn{color:var(--warn)!important}
/* actions */
.acts{padding:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#43332a,#2a1f19);border-radius:12px;padding:9px 6px;font-size:14px;font-weight:700;line-height:1.2;box-shadow:0 3px 0 #0008}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.btn small{display:block;font-size:11px;font-weight:400;color:var(--mu);margin-top:2px}
.btn:disabled{opacity:.42;transform:none}
.btn.main{grid-column:1/-1;font-family:'Black Han Sans',sans-serif;font-size:22px;letter-spacing:1px;padding:12px 8px;background:linear-gradient(180deg,#ff9a3c,#c2501a);border-color:#ffb46b;color:#fff;text-shadow:0 2px 0 #7a2a08;box-shadow:0 4px 0 #6b2a0c,0 0 22px #ff7a2f44}
.btn.main small{color:#ffe3c6;font-family:'Gowun Dodum';text-shadow:none;font-size:12px}
.btn.main.strike{background:linear-gradient(180deg,#ffe066,#e09a1a);border-color:#fff2a8;text-shadow:0 2px 0 #7a4a08;animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 4px 0 #6b4a0c,0 0 30px #ffd84d99}}
.btn.auto.on{background:linear-gradient(180deg,#3d6a3f,#22402a);border-color:#79c98a}
.autorow{display:flex;flex-wrap:wrap;text-align:center;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mu);grid-column:1/-1}
.autorow select{background:var(--p3);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:3px 4px;font:inherit}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px}
.tab{background:#0005;border:1px solid var(--line);border-radius:10px;padding:7px 2px;font-size:12.5px;position:relative}
.tab.on{background:linear-gradient(180deg,#5a3f1d,#2e2014);border-color:var(--brass);color:#ffe7b8}
.tab .dot{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px var(--ember)}
#panel{padding:4px 8px 10px}
.sec{margin:8px 2px 4px;font-family:'Gowun Batang',serif;font-weight:700;color:#ffd99a;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:'Gowun Dodum';font-weight:400;color:var(--mu);font-size:11.5px}
.list{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;background:#0005;border:1px solid var(--line);border-radius:11px;padding:7px 8px}
.row.act{border-color:var(--brass);box-shadow:0 0 0 1px #d2a75a44 inset}
.row img{width:86px;height:26px;flex:none;object-fit:contain}
.row .mid{flex:1;min-width:0;line-height:1.3}
.row .mid b{font-size:13.5px}
.row .mid small{display:block;color:var(--mu);font-size:11.5px}
.row .rt{display:flex;flex-direction:column;gap:4px;flex:none}
.sb{border:1px solid var(--line);background:var(--p3);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sb.pri{background:linear-gradient(180deg,#e9b35b,#a8722a);border-color:#ffd38a;color:#2a1608}
.sb:disabled{opacity:.4}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bcard{background:#0005;border:1px solid var(--line);border-radius:10px;padding:6px 3px;text-align:center;font-size:11.5px;line-height:1.3}
.bcard img{width:100%;height:20px;object-fit:contain}
.bcard b{display:block;font-size:12.5px}
.note{font-size:12px;color:var(--mu);line-height:1.55;margin:6px 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;background:#0005;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mk{display:flex;align-items:center;gap:8px}
.up{color:var(--good)}.dn{color:var(--bad)}
/* modal */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.mbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2e231c,#1b1410);border:1px solid var(--brass2);border-radius:16px;box-shadow:0 0 0 1px #000,0 20px 60px #000c;padding:16px 16px 14px;user-select:text;-webkit-user-select:text}
.mbox h2{margin:0 0 8px;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;color:#ffd99a}
.mbox h3{margin:14px 0 4px;font-family:'Gowun Batang',serif;color:#ffd99a;font-size:15px}
.mbox p,.mbox li{line-height:1.6;color:#e8d9c2;font-size:13.5px}
.mbox ul{padding-left:1.2em;margin:4px 0}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mbox table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
.mbox td,.mbox th{border:1px solid #4d3a2b;padding:3px 5px;text-align:center}
.mbox th{background:#3a2a20;color:#ffd99a}
textarea.rec{width:100%;height:12.5em;background:#0b0806;color:#ffe9c8;border:1px solid var(--brass2);border-radius:10px;padding:9px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.title{text-align:center}
.title .big{font-family:'Black Han Sans',sans-serif;font-size:clamp(30px,8vw,44px);line-height:1.05;color:#ffd99a;text-shadow:0 3px 0 #6a3b12,0 0 24px #ff7a2f66}
.title .sub{font-family:'Gowun Batang',serif;font-weight:700;color:#ff9a52;font-size:17px;margin:6px 0 12px}
.title input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--brass2);background:#0b0806;color:var(--tx);text-align:center;user-select:text}
.score{font-family:'Black Han Sans',sans-serif;font-size:40px;color:#ffd66b;text-align:center;line-height:1.1;text-shadow:0 0 18px #ffb34766}
.vlink{color:#ffcf7a}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(420px,92vw);pointer-events:none}
.tst{background:#1c140fee;border:1px solid var(--brass2);border-radius:11px;padding:8px 12px;font-size:13px;text-align:center;box-shadow:0 8px 20px #000a;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.dayc{text-align:center}
.dayc .dn{font-family:'Black Han Sans',sans-serif;font-size:34px;color:#ffd99a}
</style>
</head>
<body>
<div id="app">
 <div id="left">
  <div class="card top">
   <div class="trow">
    <div class="logo">⚒️ 검 강화하기<small>어이쿠 손이 미끄러졌네</small></div>
    <div style="display:flex;gap:6px"><button class="ibtn" id="sndBtn" aria-label="소리">🔊</button><button class="ibtn" id="helpBtn" aria-label="게임 방법">❔</button><button class="ibtn" id="menuBtn" aria-label="메뉴">☰</button></div>
   </div>
   <div class="chips">
    <div class="chip"><i>영업일</i><b id="dayTx">1</b><i id="dayLeft"></i></div>
    <div class="chip fuel"><i>🔥 장작</i><b id="fuelTx">30</b></div>
    <div class="chip gold"><i>💰 골드</i><b id="goldTx">0</b></div>
    <div class="chip stk"><i>✦ 기운</i><b id="stkTx">0</b></div>
   </div>
   <div class="ev" id="evBar"></div>
  </div>
  <div class="card forge" style="margin-top:8px"><canvas id="forge"></canvas></div>
  <div class="card" style="margin-top:8px">
   <div class="swinfo" id="swInfo"></div>
   <div class="rate" id="rateBox"></div>
  </div>
  <div class="card" style="margin-top:8px">
   <div class="opts" id="opts"></div>
   <div class="acts">
    <button class="btn main" id="enhBtn">🔨 강화하기<small id="enhCost"></small></button>
    <button class="btn auto" id="autoBtn">▶ 자동<small id="autoSub">목표까지</small></button>
    <button class="btn" id="polBtn">✨ 연마<small id="polSub"></small></button>
    <button class="btn" id="sellBtn">💰 판매<small id="sellSub"></small></button>
    <div class="autorow">자동 강화 목표 <select id="autoSel"></select> · 아이템 설정 그대로 · 정밀 단조 없이 · 파괴/부족 시 멈춤</div>
   </div>
  </div>
 </div>
 <div id="right">
  <div class="card">
   <div class="tabs" id="tabs">
    <button class="tab" data-tab="rack">거치대</button>
    <button class="tab" data-tab="shop">검 상점</button>
    <button class="tab" data-tab="item">잡화점</button>
    <button class="tab" data-tab="order">의뢰</button>
    <button class="tab" data-tab="market">시세</button>
    <button class="tab" data-tab="log">기록</button>
   </div>
   <div id="panel"></div>
  </div>
 </div>
</div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const SEASON=30,FUEL_DAY=30,MAX_STACK=50,MAX_POL=20,STK_V=.007,STONE_V=.02;
const VERIFY_URL='https://chillermaster.github.io/flashgame/sword-enhance-verify.html';
const LAST_KEY='swordEnhance.last.v1',SAVE_KEY='swordEnhance.save.v1',BEST_KEY='swordEnhance.best.v1',NAME_KEY='swordEnhance.name',PREF_KEY='swordEnhance.pref.v1';

/* ================= 데이터 ================= */
const FAMS=[
 {name:'직검',trait:'균형',desc:'장단점 없는 표준 계열. 어디서나 무난하다.',v0:100,sMul:1,dMul:1,drMul:1,cMul:1,gMul:1,polB:.05,stk:0,tmW:1,polT:[.78,.96,.995],
  names:['녹슨 철검','글라디우스','스파타','아밍 소드','롱소드','바스타드 소드','울프베르트','조와이외즈','뒤랑달','클라우 솔라스','엑스칼리버']},
 {name:'곡도',trait:'예리함',desc:'대성공 확률 2배, 연마가 잘 붙는다. 대신 파괴 확률 +15%.',v0:110,sMul:1,dMul:1.15,drMul:1,cMul:1,gMul:2,polB:.05,stk:0,tmW:1,polT:[.62,.91,.98],
  names:['무딘 곡도','팔시온','시미터','샴쉬르','킬리지','탈와르','사브르','카타나','타치','도우지기리','쿠사나기노츠루기']},
 {name:'세검',trait:'정밀',desc:'성공률 ×1.06, 정밀 단조 완벽 구간 1.5배. 대신 시세가 15% 낮다.',v0:85,sMul:1.06,dMul:1,drMul:1,cMul:1,gMul:1,polB:.05,stk:0,tmW:1.5,polT:[.78,.96,.995],

  names:['무거운 철대검','그레이트소드','클레이모어','츠바이핸더','에스파돈','플랑베르주','처형인의 검','흑철 대검','다인슬레이프','그람','티르핑']},
 {name:'동방검',trait:'기운',desc:'실패하면 기운 +1 추가. 연마 1당 판매가 +8% (다른 계열 +5%).',v0:100,sMul:1,dMul:1,drMul:1,cMul:1,gMul:1,polB:.08,stk:1,tmW:1,polT:[.78,.96,.995],
  names:['녹슨 환도','환도','운검','별운검','쌍수도','칠성검','사인검','용천검','어장검','간장막야','헌원검']}
];
const TIERS=[['평범','#a8a29a'],['쓸만한','#ece4d4'],['단단한','#80d98f'],['정교한','#62b6ff'],['숙련','#b890ff'],['명품','#ffab52'],['걸작','#ff6b6b'],['희대','#ffd84d'],['전설','#5ff3e0'],['신화','#ff8ae2'],['궁극','#ffffff']];
const EVENTS=[
 {id:'calm',ic:'☀️',n:'평온한 하루',d:'특별한 일 없이 화로가 잘 달아오른다.',w:20},
 {id:'artisan',ic:'⚒️',n:'장인의 날',d:'강화 비용 30% 할인.',w:9},
 {id:'lucky',ic:'🍀',n:'길일(吉日)',d:'대성공 확률 2배.',w:8},
 {id:'ominous',ic:'🌑',n:'흉일(凶日)',d:'파괴 확률 30% 증가. 오늘은 조심!',w:8},

const KN=[[0,.95],[10,.86],[20,.76],[30,.66],[40,.57],[50,.48],[55,.36],[60,.27],[70,.17],[80,.105],[90,.065],[99,.035]];
const DK=[[0,0],[24,0],[25,.01],[40,.04],[50,.08],[60,.14],[80,.22],[99,.30]];

function lt(t,L){for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1];if(L>=a[0]&&L<=b[0])return a[1]+(b[1]-a[1])*(L-a[0])/(b[0]-a[0])}return t[t.length-1][1]}
const VT=[1];for(let L=0;L<100;L++)VT.push(VT[L]*lt(RK,L));
const tier=L=>Math.min(10,Math.floor(L/10));
const V=(f,L)=>Math.round(FAMS[f].v0*VT[L]);
const baseRate=(f,L)=>lt(KN,Math.min(99,L))*FAMS[f].sMul;
const dropBase=L=>L<10?0:L<30?.2+.3*(L-10)/20:L<70?.5:.6;
const charmNeed=L=>L<25?0:L<50?1:L<75?2:3;

function rnd(){S.rng=(S.rng+0x6D2B79F5)|0;let t=S.rng;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

 const seed=(Math.random()*4294967296)>>>0;
 S={v:1,name,seed,rng:seed|0,nid:1,day:0,fuel:0,fuelBuys:0,gold:3000,stacks:0,shards:0,inv:{S:5,C:1,O:1},stock:{S:0,C:0,O:0},

function pickEvent(){let tot=EVENTS.reduce((t,e)=>t+e.w,0),r=rnd()*tot;for(const e of EVENTS){if((r-=e.w)<0)return e}return EVENTS[0]}
function startDay(first){
 S.day++;S.event=first?OPEN_EV:pickEvent();
 S.fuel=FUEL_DAY+(ev()==='wood'?10:0);S.fuelBuys=0;
 const m=ev()==='peddler'?2:1;S.stock={S:ITEMS.S.stock*m,C:ITEMS.C.stock*m,O:ITEMS.O.stock*m};
 S.market=FAMS.map(()=>+(0.9+rnd()*.22).toFixed(2));S.mkMsg='';
 if(!first){const r=rnd(),f=rint(0,4);
  if(r<.5){S.market[f]=+(1.25+rnd()*.2).toFixed(2);S.mkMsg='📈 '+MK_UP[f]}
  else if(r<.8){S.market[f]=+(.72+rnd()*.12).toFixed(2);S.mkMsg='📉 '+MK_DN[f]}}
 else S.market=[1,1,1,1,1];
 genShop();
 S.orders=S.orders.filter(o=>o.dl>=S.day);
 const cap=3+(ev()==='rush'?2:0);while(S.orders.length<cap)S.orders.push(genOrder());
}
function genShop(){
 const hi=Math.min(70,6+S.day*2),lo=Math.max(1,Math.floor(hi*.35));S.shop=[];
 for(let i=0;i<5;i++){const lv=i<4?rint(lo,Math.max(lo,hi-5)):rint(Math.max(lo,hi-5),hi);S.shop.push({id:S.nid++,f:rint(0,4),lv,pol:rint(0,Math.floor(lv/8)),sold:false,prem:i===4})}
 S.shop.sort((a,b)=>a.lv-b.lv);
}
function genOrder(){
 const lo=5+S.day*1.2,hi=Math.min(95,18+S.day*2.4);
 const lv=Math.min(95,Math.round(lo+(hi-lo)*Math.pow(rnd(),1.15)));
 const f=rnd()<.25?-1:rint(0,4),pol=rint(0,Math.min(8,Math.floor(lv/7))),dl=S.day+2+rint(0,3);
 const reward=Math.round(V(f<0?0:f,lv)*(1+.05*pol)*(1.9+.8*rnd()));
 let item=null;if(rnd()<.45){const k=['S','C','O'][rint(0,2)];item={k,n:k==='S'?rint(4,10):k==='C'?rint(1,3):rint(2,4)}}
 return{id:S.nid++,client:CLIENTS[rint(0,CLIENTS.length-1)],f,lv,pol,dl,reward,item,fame:300+lv*15+pol*20};
}

function rateInfo(sw,tm){
 const F=FAMS[sw.f],L=sw.lv,o=S.opt;
 const base=baseRate(sw.f,L);
 const nS=Math.max(0,Math.min(o.stones,stoneMax(L),S.inv.S));
 const stoneB=nS*STONE_V,stkB=o.stack?S.stacks*STK_V:0,tmB=tm?TM[tm].add:0;
 const p=Math.max(.005,Math.min(.97,base+stoneB+stkB+tmB));
 const dRaw=Math.min(.9,lt(DK,Math.min(99,L))*F.dMul*(ev()==='ominous'?1.3:1));
 const need=charmNeed(L),charmOn=o.charm&&dRaw>0&&need>0&&S.inv.C>=need;
 const drRaw=Math.min(1,dropBase(L)*F.drMul),oilOn=o.oil&&drRaw>0&&S.inv.O>=1;
 const g=L>=99?0:(L<50?.04:.02)*F.gMul*(ev()==='lucky'?2:1);
 return{p,base,nS,stoneB,stkB,tmB,dRaw,d:charmOn?0:dRaw,need,charmOn,drRaw,dr:oilOn?0:drRaw,oilOn,g,cost:cost(sw)};
}

function tone(f,d,type,vol,f2,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol,freq,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq||1800;fl.Q.value=.8;const g=a.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start(t)}

function hash(n){n=(n^61)^(n>>>16);n=Math.imul(n,9);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return(n>>>0)/4294967296}
function mats(sw){const t=tier(sw.lv);let b;
 if(t===0)b=['#6e5442','#b39a84','#8a6a52'];else if(t<=2)b=['#6f767e','#d0d5da','#949ba3'];else if(t<=4)b=['#7f8b98','#f2f6fa','#aab6c3'];
 else if(t<=6)b=['#8e9cae','#ffffff','#c2cfdf'];else if(t===7)b=['#5d86b8','#eaf6ff','#9cc4ec'];else if(t===8)b=['#2f9d96','#e6fffb','#76d9d0'];else if(t===9)b=['#8a4fb8','#fff0fd','#c99ae4'];else b=['#7a7f9a','#ffffff','#c8d0ff'];
 const metal=t<=1?['#3c3c3c','#7a7a7a']:t<=3?['#7a4f22','#d79a52']:t<=5?['#8e949c','#eef1f5']:['#a87a1c','#ffe08a'];
 const grip=sw.f===4?['#1f1a26','#b8262e']:t>=6?['#3b1626','#d8a64a']:['#4a2e1b','#7a5233'];
 return{b,metal,grip,gem:TIERS[t][1],t};}
function bladeGrad(g,x0,y0,x1,y1,b,t){const gr=g.createLinearGradient(x0,y0,x1,y1);
 if(t===10){gr.addColorStop(0,'#ffffff');gr.addColorStop(.25,'#ffd6f5');gr.addColorStop(.5,'#d6f3ff');gr.addColorStop(.75,'#fff3c4');gr.addColorStop(1,'#a7b0e8');return gr}
 gr.addColorStop(0,b[1]);gr.addColorStop(.45,b[2]);gr.addColorStop(.55,b[0]);gr.addColorStop(1,b[2]);return gr}
function metalGrad(g,x0,y0,x1,y1,m){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,m[1]);gr.addColorStop(.5,m[0]);gr.addColorStop(1,m[1]);return gr}
function gem(g,x,y,r,c){g.save();g.fillStyle=c;g.shadowColor=c;g.shadowBlur=r*1.5;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y);g.lineTo(x,y+r);g.lineTo(x-r,y);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#ffffffaa';g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r*.45,y-r*.1);g.lineTo(x,y);g.closePath();g.fill();g.restore()}
function gripWrap(g,x0,x1,y,h,c){g.fillStyle=c[0];g.fillRect(x0,y-h/2,x1-x0,h);g.strokeStyle=c[1];g.lineWidth=Math.max(1,h*.14);const n=Math.max(3,Math.round((x1-x0)/(h*.8)));for(let i=0;i<n;i++){const a=x0+(x1-x0)*i/n,b=x0+(x1-x0)*(i+1)/n;g.beginPath();g.moveTo(a,y-h/2);g.lineTo(b,y+h/2);g.moveTo(a,y+h/2);g.lineTo(b,y-h/2);g.stroke()}g.fillStyle='#0003';g.fillRect(x0,y+h*.15,x1-x0,h*.35)}
/* 칼날 경로: 위쪽(등)·아래쪽(날) 점 목록 */
function bladePath(sw,x0,y0,L){const f=sw.f,t=tier(sw.lv),top=[],bot=[];let xb,xe=x0+L,w,curve=0,tip;
 if(f===0){xb=x0+.205*L;w=.075*L;tip=.14}else if(f===1){xb=x0+.215*L;w=.056*L;curve=.075*L;tip=.07}else if(f===2){xb=x0+.2*L;w=.034*L;tip=.6}else if(f===3){xb=x0+.31*L;w=.11*L;tip=.16}else{xb=x0+.2*L;w=.06*L;curve=.03*L;tip=.1}
 const N=40,wavy=f===3&&(t===5);
 for(let i=0;i<=N;i++){const u=i/N,x=xb+(xe-xb)*u,c=y0-curve*u*u;let hw=w/2;
  if(f===2)hw=w/2*(1-u*.85);else if(f===0||f===3)hw=w/2*(1-u*.18);
  if(u>1-tip){const k=(u-(1-tip))/tip;hw*=f===1?Math.sqrt(1-k*k):1-k}
  let wv=wavy?Math.sin(u*Math.PI*9)*w*.09*(1-u):0;
  if(f===1||f===4){top.push([x,c-hw*(f===1?.85:1)+wv]);bot.push([x,c+hw*(f===1?1.15:1)-wv*(u>1-tip?1:0)])}
  else{top.push([x,c-hw+wv]);bot.push([x,c+hw-wv])}}
 if(f===1){const last=top[top.length-1];bot[bot.length-1]=[last[0],last[1]]}
 return{top,bot,xb,xe,w,curve}}
function traceBlade(g,bp){g.beginPath();g.moveTo(bp.top[0][0],bp.top[0][1]);for(const p of bp.top)g.lineTo(p[0],p[1]);for(let i=bp.bot.length-1;i>=0;i--)g.lineTo(bp.bot[i][0],bp.bot[i][1]);g.closePath()}
function drawSword(g,sw,x0,y0,L,maskOnly){const M=mats(sw),t=M.t,f=sw.f,bp=bladePath(sw,x0,y0,L);
 g.save();g.lineJoin='round';
 // 칼날
 traceBlade(g,bp);
 if(maskOnly){g.fillStyle='#fff';g.fill();g.restore();return bp}
 g.fillStyle=bladeGrad(g,0,y0-bp.w/2-bp.curve,0,y0+bp.w/2,M.b,t);g.fill();
 g.strokeStyle='#00000066';g.lineWidth=Math.max(1,L*.004);g.stroke();
 g.save();traceBlade(g,bp);g.clip();
 // 홈/하몬/문양
 if(f===0||f===3){g.strokeStyle='#00000040';g.lineWidth=bp.w*.16;g.beginPath();g.moveTo(bp.xb+L*.03,y0);g.lineTo(bp.xb+(bp.xe-bp.xb)*.72,y0);g.stroke();g.strokeStyle='#ffffff55';g.lineWidth=bp.w*.05;g.beginPath();g.moveTo(bp.xb+L*.03,y0-bp.w*.1);g.lineTo(bp.xb+(bp.xe-bp.xb)*.72,y0-bp.w*.1);g.stroke()}

function resolve(tm){const sw=act(),F=FAMS[sw.f],L=sw.lv,R=rateInfo(sw,tm),o=S.opt;
 S.gold-=R.cost;S.fuel--;S.st.att++;S.inv.S-=R.nS;if(R.charmOn)S.inv.C-=R.need;if(R.oilOn)S.inv.O--;
 if(tm==='perfect')S.st.perfect++;else if(tm==='good')S.st.good++;else if(tm==='slip')S.st.slip++;
 const res={from:L,sw,R,tm};
 if(rnd()<R.p){const gs=rnd()<R.g*(tm==='perfect'?2:1)&&L<=98,up=gs?2:1;sw.lv=Math.min(100,L+up);
  const pr=rnd(),T=F.polT;let pg=pr<T[0]?0:pr<T[1]?1:pr<T[2]?2:3;if(pg&&rnd()<sw.pol/20)pg=0;if(gs)pg++;const p0=sw.pol;sw.pol=Math.min(MAX_POL,sw.pol+pg);
  if(o.stack&&S.stacks>0){res.usedStk=S.stacks;S.stacks=0}
  S.st.suc++;if(gs)S.st.great++;
  if(sw.lv>S.st.maxLv){S.st.maxLv=sw.lv;S.st.maxFam=sw.f;S.st.maxDay=S.day;res.record=true}
  if(sw.lv>=100&&!S.st.legendDay){S.st.legendDay=S.day;res.legend=true}
  res.type=gs?'great':'ok';res.pg=sw.pol-p0;res.tierUp=tier(sw.lv)>tier(L);
 }else{S.st.fail++;const gain=Math.round((1+Math.floor(L/20)+F.stk)*(ev()==='moon'?2:1));S.stacks=Math.min(MAX_STACK,S.stacks+gain);res.gain=gain;
  if(rnd()<R.dRaw){if(R.charmOn){res.saved=true;S.st.saved++}else{res.type='boom';S.st.des++;const sh=2+Math.floor(L/5);S.shards+=sh;res.shards=sh;
    S.rack=S.rack.filter(s=>s.id!==sw.id);S.act=S.rack.length?S.rack[0].id:0;return res}}
  if(rnd()<R.drRaw){if(R.oilOn){res.type='keep';res.oil=true;S.st.oilSaved++}else{sw.lv=L-1;sw.pol=Math.max(0,sw.pol-1);res.type='drop'}}else res.type='keep'}
 return res}

function autoStep(){if(!auto)return;const sw=act();
 if(!sw||sw.id!==autoId){stopAuto('검이 파괴되어 자동 강화를 멈췄습니다.');return}
 if(sw.lv>=S.opt.target){stopAuto(`🎯 목표 +${S.opt.target} 달성! 자동 강화 종료`);return}
 if(S.ended){auto=false;return}
 const R=rateInfo(sw),o=S.opt;
 if(o.charm&&R.need>0&&R.dRaw>0&&S.inv.C<R.need){stopAuto('🛡 수호부적이 부족해 멈췄습니다.');return}
 if(o.oil&&R.drRaw>0&&S.inv.O<1){stopAuto('🫙 보존기름이 부족해 멈췄습니다.');return}
 if(o.stones>0&&S.inv.S<Math.min(o.stones,stoneMax(sw.lv))){stopAuto('💎 축복석이 부족해 멈췄습니다.');return}

/* ================= 검증 코드 ================= */
const SALT='swordenh/luca/v1#3e91-a7d0';
function h53(str,s){let h1=0xdeadbeef^s,h2=0x41c6ce57^s;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function sign(p){const s=SALT+'|'+p+'|'+SALT.length;const a=h53(s,7),b=h53(s+a,131);return(a.toString(36).padStart(11,'0')+b.toString(36).padStart(11,'0')).toUpperCase()}
function b64e(s){const b=new TextEncoder().encode(s);let bin='';for(const x of b)bin+=String.fromCharCode(x);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const fmtTime=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+'분 '+(s%60)+'초'};
function makeRecord(){const st=S.st,F=S.final;const secs=Math.floor(S.playMs/1000);
 const nonce=(h53(S.seed+':'+S.date,3)%1679616).toString(36);
 const p=['1',S.name.replace(/~/g,''),F.score,st.maxLv,st.maxFam,F.assets,st.orders,st.orderPts,st.att,st.suc,st.fail,st.des,st.great,st.perfect,S.day,st.legendDay,secs,S.seed,S.date,nonce].join('~');
 const code='SE1.'+b64e(p)+'.'+sign(p);
 const best=st.maxLv>0?`+${st.maxLv} ${FAMS[st.maxFam].names[tier(st.maxLv)]} (${FAMS[st.maxFam].name})`:'없음';
 return['⚒️ 검 강화하기 : 어이쿠 손이 미끄러졌네 — 영업 결산',`👤 대장장이: ${S.name}`,`🏆 점수: ${fmt(F.score)}`,`🗡️ 최고 강화: ${best}${st.legendDay?` · ${st.legendDay}일차 전설 달성!`:''}`,`💰 최종 자산: ${fmt(F.assets)} G`,`📜 의뢰 완수: ${st.orders}건 (명성 ${fmt(st.orderPts)})`,`🔨 망치질: ${fmt(st.att)}회 (성공 ${fmt(st.suc)} · 실패 ${fmt(st.fail)} · 파괴 ${st.des} · 대성공 ${st.great} · 완벽 타격 ${st.perfect})`,`📅 영업: ${S.day}일 (${S.endReason}) · 플레이 ${fmtTime(S.playMs)}`,`🔐 검증코드: ${code}`].join('\n')}

  const R=rateInfo(sw),q=1-R.p,xd=q*R.d,xdr=q*(1-R.d)*R.dr,xk=Math.max(0,q-xd-xdr);

function legendModal(){sfx('great');openModal(`<div class="dayc"><div class="dn" style="color:#fff;text-shadow:0 0 20px #ff8ae2">✦ 전설 완성 ✦</div><p style="font-size:16px">${S.st.legendDay}일차에 <b>+100</b>을 달성했습니다!<br>전설 보너스 ${fmt(20000+(SEASON-S.st.legendDay)*1000)}점이 점수에 더해집니다.</p><p class="note">남은 날 동안 계속 영업해 자산과 명성을 쌓을 수 있습니다. 빨리 결산할수록 전설 보너스는 같습니다(달성일 기준).</p><div class="mrow" style="justify-content:center"><button class="btn main" data-m="close" style="grid-column:auto;font-size:18px;padding:10px 26px">계속</button></div></div>`)}
function resultModal(){const st=S.st,F=S.final,rec=makeRecord();
 openModal(`<h2>🏁 영업 결산</h2><p style="text-align:center;margin:0">${esc(S.name)} · ${esc(S.endReason)}</p><div class="score">${fmt(F.score)}점</div>
 <table><tr><th>항목</th><th>내용</th><th>점수</th></tr>
 <tr><td>최고 강화</td><td style="color:${tColor(st.maxLv)}">+${st.maxLv}</td><td>${fmt(st.maxLv*st.maxLv*10)}</td></tr>
 <tr><td>최종 자산</td><td>${fmtK(F.assets)} G</td><td>${fmt(assetPts(F.assets))}</td></tr>
 <tr><td>의뢰 명성</td><td>${st.orders}건</td><td>${fmt(st.orderPts)}</td></tr>
 ${st.legendDay?`<tr><td>전설 보너스</td><td>${st.legendDay}일차</td><td>${fmt(20000+(SEASON-st.legendDay)*1000)}</td></tr>`:''}</table>
 <h3>블로그 댓글용 기록</h3><textarea class="rec" id="recTx" readonly>${esc(rec)}</textarea>
 <div class="mrow"><button class="sb pri" id="cpBtn">📋 기록 복사</button><button class="sb" data-m="close">닫기</button><button class="sb" data-a="new">새 영업</button></div>
 <p class="note">기록은 <a class="vlink" href="${VERIFY_URL}" target="_blank" rel="noopener">점수검증기</a>에서 위조 여부를 확인할 수 있습니다.</p>`);
 $('cpBtn').onclick=()=>copyText($('recTx'))}
function copyText(ta){const t=ta.value;const done=()=>toast('📋 복사했습니다! 블로그 댓글에 붙여넣으세요.');
 const fb=()=>{ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}ok?done():toast('복사가 막혀 있습니다. 글상자를 길게 눌러 직접 복사해 주세요.')};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function helpModal(){const rows=[0,10,20,30,40,50,55,60,70,80,90,99].map(L=>`<tr><td>+${L}→${L+1}</td><td>${pct(lt(KN,L))}</td><td>${pct(lt(DK,L))}</td><td>${pct(dropBase(L))}</td><td>${charmNeed(L)||'-'}</td></tr>`).join('');
 openModal(`<h2>📖 게임 방법</h2>
 <h3>목표</h3><p>30일 동안 대장간을 운영합니다. 하루에 장작 30개(망치질 30번)를 쓸 수 있습니다. 최고 강화 단계를 높이고, 자산과 명성을 쌓아 점수를 올리세요. <b>+100은 전설</b>입니다.</p>
 <h3>강화 규칙</h3><table><tr><th>단계</th><th>기본 성공</th><th>실패 시 파괴</th><th>실패 시 하락</th><th>필요 부적</th></tr>${rows}</table>
 <p>실패하면 "파괴 → 하락 → 유지" 순서로 판정합니다. 하락하면 연마도 1 줄어듭니다. 성공하면 대성공(+2)이 나올 수 있고, 가끔 <b>연마</b>가 1~3 붙습니다(연마가 높을수록 잘 안 붙음). 10단계마다 검이 다른 이름의 검으로 거듭납니다.</p>
 <h3>아이템</h3><ul><li>💎 <b>축복석</b>: 1개당 성공률 +2%p. 한 번에 3개(+0~29) / 5개(+30~59) / 7개(+60~)까지.</li><li>🛡️ <b>수호부적</b>: 파괴를 막습니다. 단계가 높을수록 여러 장 필요. 켜 두면 결과와 상관없이 소모됩니다.</li><li>🫙 <b>보존기름</b>: 실패해도 단계가 내려가지 않습니다.</li><li>잡화점 재고는 하루 한정입니다. 미리 사 모아 두세요. 파괴된 검의 <b>파편</b>으로도 교환할 수 있습니다.</li></ul>
 <h3>✦ 기운</h3><p>실패할 때마다 기운이 쌓입니다(단계가 높을수록 많이). 기운 1당 성공률 +0.7%p, 최대 50. 「기운 사용」을 켜고 성공하면 기운이 모두 소모되고, 끄고 하면 보너스도 없고 소모도 없습니다. 기운은 검을 바꿔도 유지됩니다 — 싼 검으로 기운을 모아 주력 검에 쏟아붓는 게 핵심 전략입니다.</p>
 <h3>🎯 정밀 단조</h3><p>켜면 망치질마다 타이밍 게이지가 나옵니다. 완벽(노랑) +4%p·대성공 2배, 좋음(초록) +1.5%p, 보통 0, 미끄러짐(빨강) −4%p. 단계가 높을수록 바늘이 빨라집니다.</p>
 <h3>✨ 연마</h3><p>연마 1당 판매가 +5%(동방검 +8%), 최대 20. 강화 성공 때 붙고, 「연마」 버튼(장작 1개)으로도 올릴 수 있습니다. 의뢰 조건에도 쓰입니다.</p>
 <h3>돈 버는 법</h3><ul><li><b>판매</b>: 시세(계열별로 매일 변동) × 연마 보너스.</li><li><b>의뢰</b>: 조건에 맞는 검을 시세의 2~3배에 사 갑니다. 명성은 점수에 더해집니다.</li><li><b>검 상점</b>: 시세 1.5배로 미리 강화된 검을 살 수 있습니다. 날이 갈수록 높은 단계 매물이 나옵니다(최대 +70). 돈으로 시간을 사는 셈입니다.</li><li><b>하루 사건</b>: 길일·흉일·검술 대회 등 그날의 사건을 보고 계획을 세우세요.</li></ul>
 <h3>계열 특성</h3><ul>${FAMS.map(F=>`<li><b>${F.name}(${F.trait})</b>: ${F.desc}</li>`).join('')}</ul>
 <h3>점수</h3><p>(최고 강화 단계)² × 10 + 자산 점수(자산이 2배가 될 때마다 +1,000) + 의뢰 명성 + 전설 보너스(+100 달성 시 20,000 + 남은 날 × 1,000). 최고 단계는 <b>직접 강화에 성공해야</b> 기록됩니다.</p>
 <p>결산하면 블로그 댓글에 붙여넣을 기록이 나오고, <a class="vlink" href="${VERIFY_URL}" target="_blank" rel="noopener">점수검증기</a>로 진위를 확인할 수 있습니다.</p>
 <h3>조작</h3><p>스페이스/엔터 = 강화(타이밍 때는 내려치기). 진행은 자동 저장되며 다시 열면 이어할 수 있습니다.</p>
 <div class="mrow"><button class="sb pri" data-m="${S?'close':'title'}">닫기</button></div>`)}
function menuModal(){openModal(`<h2>☰ 메뉴</h2><div class="list">
 <button class="sb" data-m="help" style="padding:10px">📖 게임 방법</button>
 <button class="sb" data-m="fast" style="padding:10px">⚡ 빠른 연출: ${pref.fast?'켜짐':'꺼짐'}</button>
 <button class="sb" data-m="snd" style="padding:10px">🔊 소리: ${pref.snd?'켜짐':'꺼짐'}</button>
 ${S&&!S.ended?'<button class="sb" data-a="endday" style="padding:10px">🌙 하루 마감</button><button class="sb" data-a="retire" style="padding:10px">🏁 영업 종료(결산)</button>':''}
 ${S&&S.ended?'<button class="sb" data-a="result" style="padding:10px">📋 결산 · 기록 복사</button>':''}
 <button class="sb" data-m="title" style="padding:10px">🏠 처음 화면</button></div><div class="mrow"><button class="sb pri" data-m="close">닫기</button></div>`)}

/* ================= 이벤트 ================= */
document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');
 if(m){const k=m.dataset.m;if(k==='close'){if(!S){titleModal();return}closeModal()}else if(k==='help')helpModal();else if(k==='title'){closeModal();auto=false;gauge=null;titleModal()}
  else if(k==='fast'){pref.fast=!pref.fast;savePref();menuModal()}else if(k==='snd'){pref.snd=!pref.snd;savePref();$('sndBtn').textContent=pref.snd?'🔊':'🔇';menuModal()}return}
 const b=e.target.closest('[data-a]');if(!b||!S)return;const a=b.dataset.a,id=+b.dataset.id;
 if(a!=='new'&&a!=='result'&&S.ended&&a!=='endday'){}
 switch(a){
  case'st-':S.opt.stones=Math.max(0,Math.min(S.opt.stones,stoneMax(act()?act().lv:0))-1);sfx('tick');break;
  case'st+':S.opt.stones=Math.min(stoneMax(act()?act().lv:0),S.opt.stones+1);sfx('tick');break;
  case'charm':S.opt.charm=!S.opt.charm;sfx('tick');break;
  case'oil':S.opt.oil=!S.opt.oil;sfx('tick');break;
  case'stack':S.opt.stack=!S.opt.stack;sfx('tick');break;
  case'timing':S.opt.timing=!S.opt.timing;gauge=null;sfx('tick');break;
  case'use':if(!busy&&!auto){S.act=id;gauge=null;sfx('tick')}break;
  case'sell':doSell(id);return;
  case'buy0':buySword(+b.dataset.f,0,0);return;
  case'buyL':{const it=S.shop.find(x=>x.id===id);if(it)buySword(it.f,it.lv,it.pol,id);return}
  case'item':buyItem(b.dataset.k,+b.dataset.n);return;
  case'ex':exShard(b.dataset.k);return;
  case'fuel':buyFuel();return;
  case'rack':buyRack();return;
  case'deliver':deliver(id);return;
  case'endday':closeModal();endDay();return;
  case'retire':closeModal();if(!busy&&!auto)confirmBox('<h2>영업 종료</h2><p>지금 결산하고 기록을 확정할까요? 이후에는 이어서 할 수 없습니다.</p>',()=>endSeason('조기 결산'),'결산');return;
  case'result':resultModal();return;
  case'new':closeModal();titleModal();return}
 save();render()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;sfx('tick');render()}));
$('enhBtn').addEventListener('click',onEnhance);
$('autoBtn').addEventListener('click',()=>{if(!S||S.ended)return;ac();if(auto)stopAuto('자동 강화를 멈췄습니다.');else startAuto()});
$('polBtn').addEventListener('click',doPolish);
$('sellBtn').addEventListener('click',()=>{const sw=act();if(sw)doSell(sw.id)});
$('autoSel').addEventListener('change',e=>{S.opt.target=+e.target.value;save();render()});
$('helpBtn').addEventListener('click',helpModal);$('menuBtn').addEventListener('click',menuModal);
$('sndBtn').textContent=pref.snd?'🔊':'🔇';$('sndBtn').addEventListener('click',()=>{pref.snd=!pref.snd;savePref();$('sndBtn').textContent=pref.snd?'🔊':'🔇';if(pref.snd)sfx('tick')});
cv.addEventListener('pointerdown',e=>{if(gauge&&!busy){e.preventDefault();strikeGauge()}});
document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('hidden'))return;if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();onEnhance()}});
let lastTouch=0;document.addEventListener('touchend',e=>{if(e.target.closest('button,input,textarea,select,a,canvas'))return;const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('resize',()=>{resize()});
setInterval(()=>{if(S&&!S.ended&&!document.hidden&&$('modal').classList.contains('hidden')){S.playMs+=1000;if(S.playMs%10000===0)save()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);
resize();requestAnimationFrame(frame);titleModal();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{spriteCache.clear()});
})();
</script>
</body>
</html>
