h2{font-size:26px;color:#7a2a1c;margin-bottom:8px}

.howto{font-size:14px;line-height:1.55;color:#5a3a1e;margin-top:12px;text-align:left;background:rgba(255,255,255,.35);border-radius:10px;padding:8px 12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.card{border:3px solid #a07a48;background:#fff7e2;border-radius:12px;padding:8px 4px;cursor:pointer;touch-action:manipulation}
.card .ic{font-size:28px}.card .nm{font-size:19px}
.card .rl{display:inline-block;font-size:12px;color:#fff;background:#7a5230;border-radius:20px;padding:1px 8px;margin-top:2px}

#selInfo{margin-top:10px;font-size:15px;line-height:1.5;color:#4a2a12;min-height:46px}

#selTitle{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:28px;color:#fff3d2;text-shadow:0 3px 0 #4a2a12;pointer-events:none}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}

.pill.s{font-size:15px}
#hl{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#hr{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#btnMute{pointer-events:auto;font-size:18px;background:rgba(40,24,10,.62);border:2px solid rgba(255,220,150,.35);border-radius:10px;padding:3px 8px;color:#fff;cursor:pointer}
#btnSkill{pointer-events:auto;position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:4px solid #6b3f1d;background:linear-gradient(#f9d466,#d99e2c);box-shadow:0 5px 0 #4a2a12,0 8px 18px rgba(0,0,0,.4);font-family:inherit;color:#3b2412;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:pointer;--p:0}

#btnSkill .i{font-size:30px;line-height:1;position:relative;z-index:1}
#btnSkill .n{font-size:12px;position:relative;z-index:1}
#btnSkill.ready{animation:rdy 1.2s infinite}
@keyframes rdy{50%{box-shadow:0 5px 0 #4a2a12,0 0 22px 6px rgba(255,214,90,.8)}}
#stage{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:14px;color:#ffe9b0;text-shadow:0 2px 0 #000;white-space:nowrap}
#warn{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:24px;color:#fff;text-shadow:0 0 10px #c00,0 3px 0 #500;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.4}}
#banner{position:absolute;top:28%;left:0;right:0;text-align:center;color:#fff3d2;text-shadow:0 3px 0 #4a2a12,0 0 14px rgba(0,0,0,.6);opacity:0}
#banner .b1{font-size:44px}#banner .b2{font-size:18px;margin-top:6px;padding:0 20px}
#banner.show{animation:bn 3.2s forwards}
@keyframes bn{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#bossBar{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 84px);left:50%;transform:translateX(-50%);width:min(78vw,420px);text-align:center}
#bossBar .bn{color:#ffd0c0;font-size:16px;text-shadow:0 2px 0 #000;margin-bottom:3px}
#bossBar .bb{height:16px;border:3px solid #2a0808;border-radius:10px;background:#3a1010;overflow:hidden;box-shadow:0 0 14px rgba(255,40,20,.5)}
#bossHp{height:100%;width:100%;background:linear-gradient(#ff6a4a,#b81a10);transition:width .15s}
#hint{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:12px;right:110px;text-align:center;color:#fff;font-size:15px;text-shadow:0 2px 0 #000;opacity:.9;transition:opacity 1s}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;transition:box-shadow .3s}
#vig.danger{box-shadow:inset 0 0 90px 30px rgba(200,0,0,.55)}
#vig.slow{box-shadow:inset 0 0 90px 30px rgba(120,60,220,.5)}
#vig.shield{box-shadow:inset 0 0 70px 20px rgba(255,210,80,.45)}
#pops{position:fixed;inset:0;pointer-events:none;z-index:11}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:22px;text-shadow:0 2px 0 #000;animation:pp .9s forwards;white-space:nowrap}
@keyframes pp{to{transform:translate(-50%,-160%);opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:16px}
.stats div{background:rgba(255,255,255,.45);border-radius:8px;padding:5px}
.stats b{display:block;font-size:20px;color:#7a2a1c}
textarea{width:100%;height:190px;font-family:inherit;font-size:14px;line-height:1.45;border:2px solid #a07a48;border-radius:10px;padding:8px;background:#fffaf0;color:#3b2412;resize:none;-webkit-user-select:text;user-select:text;touch-action:auto}

.clr .big{font-size:36px;color:#7a2a1c}.clr .sub{font-size:16px;color:#6b4a2a;margin-bottom:6px}
.clr .ln{display:flex;justify-content:space-between;font-size:18px;padding:4px 10px;border-bottom:1px dashed #b89a6a}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe2a0;font-size:22px;z-index:50;background:#20160e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="pops"></div>
<div id="hud" class="hidden">

<div id="scTitle" class="screen">

    <input type="text" id="nameIn" maxlength="12" placeholder="용사의 이름">
    <div class="row"><button class="btn" id="btnStart">출정하기</button></div>

  </div>
</div>
<div id="scSelect" class="screen hidden" style="justify-content:flex-end">
  <div id="selTitle">용사를 선택하라</div>

  </div>
</div>
<div id="scClear" class="screen dim hidden">
  <div class="panel clr">
    <div class="big" id="clT"></div><div class="sub" id="clS"></div>
    <div id="clBody"></div>
    <div class="row"><button class="btn" id="btnNext">다음 라운드</button></div>

<div id="scOver" class="screen dim hidden">

    <textarea id="recText" readonly></textarea>
    <div id="copyMsg"></div>

</div>

 else if(ln.type==='moat'){const s=ln.stones[c];if(!s||!s.up){die('drown');return;}P.x=c;}

 if(ln.type!=='river'&&ln.pick[c])collect(ln,c);

function updLanes(dt,ts){
 const d=dt*ts;
 for(const ln of lanes){
  const vis=ln.row>=P.row-8&&ln.row<=P.row+22;if(ln.group.visible!==vis)ln.group.visible=vis;
  switch(ln.type){

    v.x+=ln.dir*ln.speed*d;if(v.x>HALF)v.x-=SPAN;else if(v.x<-HALF)v.x+=SPAN;v.mesh.position.x=v.x;
    if(v.roll)v.roll.rotation.z-=ln.speed*d/.46;else v.mesh.position.y=-.02+Math.abs(Math.sin(T*9+v.x))*.03;}break;
  case 'river':for(const v of ln.items){v.x+=ln.dir*ln.speed*d;if(v.x>HALF)v.x-=SPAN;else if(v.x<-HALF)v.x+=SPAN;v.mesh.position.x=v.x;v.mesh.position.y=-.12+Math.sin(T*3+v.x)*.02;}break;
  case 'moat':ln.clock+=d;for(const c in ln.stones){const s=ln.stones[c],p=(ln.clock+s.off)%4.2,m=s.mesh;m.rotation.z=0;
    if(p<2.6){s.up=true;m.position.y=-.08;}else if(p<3.3){s.up=true;m.position.y=-.08-(p-2.6)*.05;m.rotation.z=Math.sin(T*40)*.07;}
    else if(p<3.6){s.up=false;m.position.y=lerp(-.115,-.6,(p-3.3)/.3);}else if(p<3.9){s.up=false;m.position.y=-.6;}
    else{m.position.y=lerp(-.6,-.08,(p-3.9)/.3);s.up=p>4.08;}}break;
  case 'spike':ln.clock+=d;for(const c in ln.spikes){const s=ln.spikes[c],p=(ln.clock+s.off)%ln.per;let y;
    if(p<.12){y=lerp(-.45,0,p/.12);s.up=p>.05;}else if(p<.9){y=0;s.up=true;}else if(p<1.05){y=lerp(0,-.45,(p-.9)/.15);s.up=false;}
    else if(p>ln.per-.45){y=-.3+Math.sin(T*50)*.02;s.up=false;}else{y=-.45;s.up=false;}s.mesh.position.y=y;}break;
  case 'arrow':ln.t-=d;
   if(ln.state==='idle'){if(ln.t<=0){ln.state='warn';ln.t=1.1;ln.strip.visible=true;}}
   else if(ln.state==='warn'){ln.strip.material.opacity=.28+.25*Math.sin(T*25);if(ln.t<=0){ln.state='fly';ln.strip.visible=false;ln.ax=-ln.dir*17;ln.volley.visible=true;if(Math.abs(ln.row-P.row)<5)sfx('whoosh');}}
   else{ln.ax+=ln.dir*22*d;ln.volley.position.x=ln.ax;if(ln.ax*ln.dir>17){ln.state='idle';ln.volley.visible=false;ln.t=Math.max(1.5,4-round*.2)+rnd()*2.2;}}break;
  case 'fire':ln.t-=d;
   if(ln.state==='idle'){if(ln.t<=0){ln.state='warn';ln.t=1.3;ln.strip.visible=true;}}
   else if(ln.state==='warn'){ln.strip.material.opacity=.3+.28*Math.sin(T*22);if(ln.t<=0){ln.state='burn';ln.t=1;ln.strip.visible=false;ln.flames.visible=true;if(Math.abs(ln.row-P.row)<5)sfx('burn');}}
   else{ln.flames.scale.y=.85+Math.sin(T*30)*.15;if(ln.t<=0){ln.state='idle';ln.flames.visible=false;ln.t=Math.max(2,4.5-round*.15)+rnd()*2;}}break;

 if(state==='title'||state==='select'){camera.fov=a<.9?50:36;scene.fog.near=18;scene.fog.far=36;camScale=1;}
 else{const D=CAM_OFF.length(),need=a<1?4.7:7.2,v=2*Math.atan(need/D/a)*180/Math.PI;
  if(v<=50){camera.fov=Math.max(34,v);camScale=1;}else{camera.fov=50;camScale=need/(Math.tan(25*Math.PI/180)*a*D);}
  scene.fog.near=20*camScale;scene.fog.far=(TT.indoor?34:40)*camScale;}
 camera.updateProjectionMatrix();}
function camFollow(dt,snap){
 const tx=clamp(P.mesh.position.x,-5,5)*.4,tz=P.mesh.position.z,ahead=(boss.active||boss.dead)?4.5:2.2;
 _w.set(tx+CAM_OFF.x*camScale,CAM_OFF.y*camScale,tz+CAM_OFF.z*camScale-(ahead-2.2));_l.set(tx,0,tz-ahead);
 const k=snap?1:1-Math.exp(-dt*5);camPos.lerp(_w,k);camLook.lerp(_l,k);camera.position.copy(camPos);
 if(shake>0){shake-=dt;camera.position.x+=(rnd()-.5)*shake;camera.position.y+=(rnd()-.5)*shake;}
 camera.lookAt(camLook);sun.position.set(camLook.x-6,14,camLook.z+6);sun.target.position.copy(camLook);}

/* HUD */
const hc={};
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v;}}
const idleLim=()=>Math.max(6.5,11-round*.4);
function updHUD(){
 setT('hScore','🏆 '+S.score.toLocaleString());setT('hTime','⏱ '+fmtTime(Math.floor(S.time*100)));setT('hRound','ROUND '+round+'/10');setT('stage',TT.n);
 setT('hLives','❤️'.repeat(Math.max(0,P.lives))+'🖤'.repeat(Math.max(0,CH.lives-P.lives)));
 const b=$('btnSkill');b.style.setProperty('--p',(Math.max(0,P.cd)/CH.cd).toFixed(3));b.classList.toggle('ready',P.cd<=0);
 const danger=!boss.active&&P.idle>idleLim()-3&&P.dying<=0;$('warn').classList.toggle('hidden',!danger);
 $('bossHp').style.width=(boss.hp/boss.max*100)+'%';
 $('vig').className=P.shieldT>0?'shield':slowT>0?'slow':danger?'danger':'';}
function banner(a,b){$('bn1').textContent=a;$('bn2').textContent=b;const e=$('banner');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}

/* 흐름 */
function show(id){['scTitle','scSelect','scClear','scOver'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}
function startGame(){
 Object.assign(S,{score:0,time:0,coins:0,gems:0,deaths:0,smash:0,cleared:0,roundTime:0});round=1;setupPlayer();P.lives=CH.lives;
 $('skIco').textContent=CH.ico;$('skName').textContent=CH.skill;startRound();$('hint').style.opacity=.9;setTimeout(()=>$('hint').style.opacity=0,7000);}
function startRound(){
 Object.assign(boss,{active:false,dead:false,hp:boss.max,warns:[],flash:0,atkAnim:0});projs.forEach(p=>scene.remove(p.m));projs.length=0;$('bossBar').classList.add('hidden');
 buildRound(round);Object.assign(P,{row:0,x:0,maxRow:0,hop:false,queue:null,log:false,idle:0,cd:0,invT:0,shieldT:0,dying:0,bumpT:0});
 slowT=0;S.roundTime=0;P.mesh.visible=true;P.body.visible=true;P.body.scale.setScalar(.85);P.mesh.position.set(0,0,0);faceTo(0,1);
 $('warn').textContent=TT.indoor?'👻 망령이 다가온다! 전진하라!':'🐉 용이 다가온다! 전진하라!';
 state='play';show(null);$('hud').classList.remove('hidden');fitCamera();camFollow(0,true);banner('ROUND '+round+' · '+TT.n,TT.tip);updHUD();}
let nextTimer=null;
function roundClear(bb){
 state='clear';sfx('clear');burst(P.x,.6,-P.row,0xf0c84a,24,4);$('bossBar').classList.add('hidden');
 const t=S.roundTime,rb=300*round,tb=Math.max(0,Math.ceil(parOf(round)-t))*20;addScore(rb+tb);S.cleared=round;
 let fb=0;if(round===10){fb=2000+P.lives*500;addScore(fb);}
 $('clT').textContent=round===10?'👑 마왕 토벌 완료!':'ROUND '+round+' CLEAR!';$('clS').textContent=round<10?'다음: '+TH[round+1].n:TT.n;
 const ln=(a,b)=>'<div class="ln"><span>'+a+'</span><span>'+b+'</span></div>';
 $('clBody').innerHTML=ln('라운드 시간',fmtTime(Math.floor(t*100)))+ln('라운드 보너스','+'+rb)+ln('시간 보너스','+'+tb)+(bb?ln('마왕 격파','+'+bb):'')+(fb?ln('완주 + 남은 생명','+'+fb):'')+ln('총점',S.score.toLocaleString());
 $('btnNext').textContent=round===10?'결과 보기':'다음 라운드';
 updHUD();setTimeout(()=>{if(state==='clear')show('scClear');},700);
 clearTimeout(nextTimer);if(round<10)nextTimer=setTimeout(()=>{if(state==='clear')nextRound();},5000);}
function nextRound(){clearTimeout(nextTimer);if(round>=10){gameOver(true);return;}round++;startRound();}
function gameOver(win){
 state='over';$('hud').classList.add('hidden');$('vig').className='';boss.active=false;
 const d={name:playerName,char:CH.name,score:S.score,timeCs:Math.floor(S.time*100),rounds:S.cleared,lives:Math.max(0,P.lives),coins:S.coins,gems:S.gems,smash:S.smash,deaths:S.deaths,date:fmtDate(new Date())};
 d.code=makeCode(d);
 $('ovT').textContent=win?'👑 마왕을 쓰러뜨렸다!':'⚰️ 용사 '+d.name+' 쓰러지다';
 $('ovStats').innerHTML=[['점수',d.score.toLocaleString()],['시간',fmtTime(d.timeCs)],['클리어',d.rounds+'/10'],['남은 생명',d.lives],['코인 · 보석',d.coins+' · '+d.gems],['격파 · 사망',d.smash+' · '+d.deaths]].map(a=>'<div>'+a[0]+'<b>'+a[1]+'</b></div>').join('');
 $('recText').value=['🏰 왕국 횡단 (Kingdom Crossing) 기록','👤 이름: '+d.name,'🛡️ 캐릭터: '+d.char,'🏆 점수: '+d.score,'⏱️ 시간: '+fmtTime(d.timeCs),'🚩 라운드: '+d.rounds+'/10 '+(d.rounds>=10?'완주':'클리어'),'❤️ 남은 생명: '+d.lives,'🪙 코인: '+d.coins+' · 💎 보석: '+d.gems,'💥 격파: '+d.smash+' · 💀 사망: '+d.deaths,'📅 일시: '+d.date,'🔐 검증코드: '+d.code].join('\n');
 $('copyMsg').textContent='';setTimeout(()=>show('scOver'),win?0:600);}

/* 루프 */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;T+=dt;
 if(state==='play'){
  S.time+=dt;S.roundTime+=dt;if(slowT>0)slowT-=dt;const ts=slowT>0?.3:1;
  updLanes(dt,ts);updShots(dt,ts);updBoss(dt,ts);
  if(P.cd>0)P.cd-=dt;if(P.invT>0)P.invT-=dt;if(P.shieldT>0)P.shieldT-=dt;P.shield.visible=P.shieldT>0;if(P.shield.visible)P.shield.scale.setScalar(1+Math.sin(T*10)*.05);
  if(P.dying>0){P.dying-=dt;if(P.dying<=0){if(P.lives<=0)gameOver(false);else respawn();}}
  else if(state==='play'){updPlayer(dt,ts);if(state==='play'){checkHits();
   if(!boss.active&&!boss.dead){P.idle+=dt;if(P.idle>=idleLim()&&P.dying<=0){swoopT=0;sfx('dragon');die('dragon');}}}}
  if(state==='play'||state==='clear')updHUD();
 }else if(state==='clear'||state==='over'){updLanes(dt,.4);updBoss(dt,0);}
 if(state==='title'||state==='select')updShowcase();else if(P.mesh)camFollow(dt,false);
 updFx(dt);renderer.render(scene,camera);}

/* 입력 */
let ps=null;
canvas.addEventListener('pointerdown',e=>{ps={x:e.clientX,y:e.clientY};ac();});
canvas.addEventListener('pointerup',e=>{if(!ps)return;const dx=e.clientX-ps.x,dy=e.clientY-ps.y;ps=null;const ax=Math.abs(dx),ay=Math.abs(dy),th=Math.min(innerWidth,innerHeight)*.04+10;
 if(ax<th&&ay<th)tryMove(0,1);else if(ax>ay)tryMove(dx>0?1:-1,0);else tryMove(0,dy<0?1:-1);});
canvas.addEventListener('pointercancel',()=>ps=null);
$('btnSkill').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useSkill();});
$('btnMute').addEventListener('pointerdown',e=>{e.stopPropagation();muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊';});
addEventListener('keydown',e=>{
 const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'){if(e.code==='Enter'&&e.target.id==='nameIn')$('btnStart').click();return;}
 const c=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
 if(state==='play'){if(e.repeat&&c!=='Space')return;
  if(c==='ArrowUp'||c==='KeyW')tryMove(0,1);else if(c==='ArrowDown'||c==='KeyS')tryMove(0,-1);
  else if(c==='ArrowLeft'||c==='KeyA')tryMove(-1,0);else if(c==='ArrowRight'||c==='KeyD')tryMove(1,0);
  else if(c==='Space'||c==='ShiftLeft'||c==='ShiftRight'||c==='KeyE')useSkill();}
 else if(state==='clear'&&(c==='Enter'||c==='Space')&&!$('scClear').classList.contains('hidden'))nextRound();});

/* UI */
try{const n=localStorage.getItem('kc_name');if(n)$('nameIn').value=n;}catch(e){}
function cleanName(s){return (s||'').replace(/[^\p{L}\p{N} _\-.]/gu,'').replace(/\s+/g,' ').trim().slice(0,12);}
$('btnStart').addEventListener('click',()=>{ac();playerName=cleanName($('nameIn').value)||'용사';$('nameIn').value=playerName;try{localStorage.setItem('kc_name',playerName);}catch(e){}
 state='select';show('scSelect');fitCamera();renderCards();});
function renderCards(){
 $('cards').innerHTML=CHARS.map((c,i)=>'<div class="card'+(i===selIdx?' on':'')+'" data-i="'+i+'"><div class="ic">'+c.ico+'</div><div class="nm">'+c.name+'</div><div class="rl">'+c.role+'</div></div>').join('');
 const c=CHARS[selIdx];$('selInfo').innerHTML='<b>'+c.skill+'</b> (재사용 '+c.cd+'초)<br>'+c.desc;
 $('cards').querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>{selIdx=+el.dataset.i;renderCards();sfx('hop');}));}
$('btnBack').addEventListener('click',()=>{state='title';show('scTitle');fitCamera();});
$('btnGo').addEventListener('click',()=>{CH=CHARS[selIdx];startGame();});
$('btnNext').addEventListener('click',nextRound);
$('btnRetry').addEventListener('click',()=>startGame());
$('btnChar').addEventListener('click',()=>{state='select';buildShowcase();show('scSelect');$('hud').classList.add('hidden');fitCamera();renderCards();});
$('btnCopy').addEventListener('click',async()=>{const t=$('recText').value;let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true;}catch(e){const ta=$('recText');ta.focus();ta.select();ta.setSelectionRange(0,t.length);try{ok=document.execCommand('copy');}catch(_){}}
 $('copyMsg').textContent=ok?'✅ 복사 완료! 블로그 댓글에 붙여넣으세요.':'⚠️ 자동 복사 실패 — 텍스트를 길게 눌러 직접 복사하세요.';});
function onResize(){renderer.setSize(innerWidth,innerHeight,false);fitCamera();}
addEventListener('resize',onResize);
buildShowcase();onResize();show('scTitle');requestAnimationFrame(loop);
})();
</script>
