<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>균열의 30분 · 로웬 서바이버</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23180f;--parch:#f6ead0;--parch2:#e8d4a6;--gold:#e3b54a;--gold-d:#8a5d16;--rift:#6b3fc4;--rift-l:#b48cff;--blood:#b23a2b;--leaf:#4f8f3a;--night:#1c1630}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1c1630;font-family:'Gowun Batang',serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#wrap{position:fixed;inset:0}#wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.02em}
.panel{background:linear-gradient(#fbf1da,#efdcae);border:3px solid #4a2e14;border-radius:14px;box-shadow:0 0 0 2px var(--gold) inset,0 10px 30px #0007}
.btn{border:2px solid #4a2e14;border-radius:10px;background:var(--parch);padding:8px 14px;font-weight:700;box-shadow:0 3px 0 #4a2e14}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2e14}
.btn.gold{background:linear-gradient(#f6d77a,#d9a83a)}.btn.rift{background:linear-gradient(#8a5ae0,#5a2fb0);color:#fff}
.btn:disabled{opacity:.45}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpbar{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 14px);background:#120c22cc;border-bottom:2px solid #000a}
#xpfill{position:absolute;left:0;bottom:0;height:12px;width:0;background:linear-gradient(90deg,#4aa8ff,#9a6aff);transition:width .15s}
#lvl{position:absolute;right:8px;bottom:0;font-size:11px;color:#fff;line-height:12px}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px}
#stats{display:flex;flex-direction:column;gap:2px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000,0 0 4px #000}
#timer{font-size:30px;color:#fff;text-shadow:0 2px 0 #000,0 0 10px #000a;text-align:center;line-height:1}
#timer small{display:block;font-family:'Gowun Batang',serif;font-size:11px;font-weight:700;margin-top:2px}
#topR{display:flex;justify-content:flex-end;gap:6px}
#pauseB{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#23180fcc;color:#fbefd2;font-size:16px}
#pills{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{pointer-events:auto;background:#1c1630d9;color:#f4ecff;border:1.5px solid #8a6ad0;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.env{border-color:#e3b54a;color:#ffe9b0}.pill.warn{border-color:#ff6a5a;color:#ffd0c8}
#slots{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:8px;display:flex;flex-direction:column;gap:3px}
#slots .row{display:flex;gap:3px}
.slot{pointer-events:auto;cursor:help;width:26px;height:26px;border-radius:7px;background:#23180fcc;border:1.5px solid #8a6a3a;display:grid;place-items:center;font-size:14px;position:relative}
.slot b{position:absolute;right:-3px;bottom:-4px;font-size:9px;color:#fff;background:#4a2e14;border-radius:5px;padding:0 3px;line-height:12px;font-family:'Cinzel',serif}
.slot.evo{border-color:var(--gold);box-shadow:0 0 6px var(--gold)}.slot.p{border-radius:50%;width:22px;height:22px;font-size:12px}
#bossBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 128px);left:50%;transform:translateX(-50%);width:min(86vw,460px);text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000}
#bossBar div{height:10px;margin-top:3px;background:#000a;border:1.5px solid #e3b54a;border-radius:6px;overflow:hidden}
#bossFill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c0392b,#ff7a4a)}
#hpbar{position:absolute;left:50%;top:calc(50% + 26px);width:52px;height:7px;transform:translateX(-50%);background:#000b;border:1.5px solid #000;border-radius:4px;overflow:hidden}
#hpfill{display:block;height:100%;width:100%;background:linear-gradient(#ff6a5a,#c0392b)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;opacity:0;transition:opacity .3s;padding:0 12px}
#banner small{display:block;font-size:13px;margin-top:4px}
#banner.on{opacity:1}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 0 #ff2020;transition:box-shadow .2s}
#floats{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fl{position:absolute;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;white-space:nowrap;animation:fl .7s ease-out forwards}
.fl.crit{font-size:17px;color:#ffe066}.fl.rx{font-size:15px;color:#d8b8ff}.fl.heal{color:#8aff8a}
@keyframes fl{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-38px) scale(1)}}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #fff6;background:#ffffff14;pointer-events:none;z-index:7;display:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#ffffff55;border:2px solid #fff9}
/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column}
.modal{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:#0d0818aa;padding:12px}
/* prep */
#sPrep{justify-content:flex-end}
#prepHead{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;color:#fff;pointer-events:none}
#prepHead h1{margin:0;font-size:36px;font-weight:700;letter-spacing:-.01em;text-shadow:0 3px 0 #2a1650,0 0 18px #6b3fc4}
#prepHead p{margin:2px 0 0;font-size:13px;font-family:'Cinzel',serif;letter-spacing:.25em;color:#e3d0ff}
#prepCard{position:absolute;top:calc(env(safe-area-inset-top,0px) + 88px);left:12px;max-width:62vw;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#prepCard b{font-size:19px;display:block}#prepCard span{font-size:12px;opacity:.9}
#sheet{height:min(62vh,600px);display:flex;flex-direction:column;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs{display:flex;gap:4px;padding:8px 8px 0}
.tab{flex:1;border:2px solid #4a2e14;border-bottom:0;border-radius:10px 10px 0 0;background:#e3cf9c;padding:7px 2px;font-size:14px;font-weight:700}
.tab.on{background:#fbf1da}
#tabBody{flex:1;overflow-y:auto;padding:10px;border-top:2px solid #4a2e14;-webkit-overflow-scrolling:touch}
#prepFoot{display:flex;gap:6px;padding:8px;border-top:2px solid #4a2e14;align-items:center;background:#efdcae}
#iName{flex:1;min-width:0;border:2px solid #4a2e14;border-radius:10px;padding:9px 10px;font:inherit;font-weight:700;background:#fffaf0;user-select:text;-webkit-user-select:text}
#goB{font-size:17px;padding:10px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.cc{border:2px solid #b89a60;border-radius:10px;background:#fffaf0;padding:6px 2px 5px;text-align:center;font-size:12px;font-weight:700;line-height:1.2;position:relative}
.cc i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.cc.on{border-color:var(--rift);background:#efe6ff;box-shadow:0 0 0 2px var(--rift-l)}
.cc .u{position:absolute;top:2px;right:4px;font-size:10px;color:var(--gold-d)}
.sec{margin:12px 0 6px;font-size:14px;font-weight:700;color:#5a3a16;border-bottom:1.5px dashed #b89a60;padding-bottom:3px}
.det{background:#fffaf0;border:2px solid #b89a60;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55;margin-top:8px}
.det h3{margin:0 0 2px;font-size:16px}
.mp{display:flex;gap:10px;align-items:flex-start;border:2px solid #b89a60;border-radius:12px;background:#fffaf0;padding:8px;margin-bottom:6px;text-align:left;width:100%}
.mp.on{border-color:var(--rift);background:#efe6ff}
.mp>i{font-style:normal;font-size:28px}.mp b{font-size:15px}.mp small{display:block;font-size:12px;line-height:1.5;color:#4a3a2a}
.mp .mons{font-size:11px;color:#6b4a26;margin-top:2px}
.cs{display:flex;gap:6px;align-items:center;border:2px solid #b89a60;border-radius:10px;background:#fffaf0;padding:6px 8px;text-align:left;font-size:12px;line-height:1.3}
.cs i{font-style:normal;font-size:18px}.cs b{display:block;font-size:13px}.cs em{font-style:normal;margin-left:auto;font-weight:700;color:var(--rift);font-size:12px}
.cs.on{border-color:var(--blood);background:#ffe8e0}.cs.on em{color:var(--blood)}
#csGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
#csHead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
#csHead .big{font-size:22px;color:var(--blood)}
/* level up */
#lvBox{width:min(96vw,460px);padding:12px;max-height:92vh;overflow:auto}
#lvBox h2{margin:0 0 8px;text-align:center;font-size:22px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid #b89a60;border-radius:12px;background:#fffaf0;padding:9px 10px;margin-bottom:7px}
.opt>i{font-style:normal;font-size:28px;width:40px;text-align:center}
.opt b{font-size:15px}.opt small{display:block;font-size:12.5px;line-height:1.45;color:#3a2a1a}
.opt .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:#e8d4a6;margin-left:4px;vertical-align:1px}
.opt .tag.new{background:#d8f0c0}.opt .tag.evo{background:#f6d77a}
.opt:active{background:#efe6ff}
.lvBtns{display:flex;gap:6px;justify-content:center;margin-top:4px}
#chBox{width:min(92vw,380px);padding:14px;text-align:center}
#chBox h2{margin:0 0 8px}#chList div{padding:6px;border-bottom:1px dashed #b89a60;font-size:14px}
/* result */
#resBox{width:min(96vw,500px);max-height:94vh;overflow:auto;padding:14px}
#resBox h2{margin:0;text-align:center;font-size:24px}
#rScore{text-align:center;font-size:40px;color:#7a2a1c;margin:2px 0}
#rSub{text-align:center;font-size:13px;margin-bottom:6px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin:6px 0 10px}
dl.kv dt{color:#6b4a26}dl.kv dd{margin:0;font-weight:700;text-align:right}
#rec{white-space:pre-wrap;font-size:11.5px;background:#fffaf0;border:1.5px dashed #b89a60;border-radius:8px;padding:8px;max-height:150px;overflow:auto;user-select:text;-webkit-user-select:text;font-family:inherit}
.rowB{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* codex */
#cxBox{width:min(96vw,620px);height:min(90vh,760px);display:flex;flex-direction:column;padding:0}
#cxTabs{display:flex;gap:4px;padding:8px;flex-wrap:wrap;border-bottom:2px solid #4a2e14}
#cxTabs .tab{flex:none;border-radius:8px;border-bottom:2px solid #4a2e14;padding:5px 10px;font-size:13px}
#cxBody{flex:1;overflow:auto;padding:10px;font-size:13px;line-height:1.6}
#cxBody h3{margin:12px 0 4px;font-size:15px}
.cx{border-bottom:1px dashed #b89a60;padding:5px 0}.cx .t{font-size:12px;color:#6b4a26}
table.fx{border-collapse:collapse;width:100%;font-size:12.5px}table.fx td,table.fx th{border:1px solid #c8b080;padding:4px 6px;vertical-align:top;text-align:left}
#pauseBox{width:min(90vw,340px);padding:16px;text-align:center}
#pauseBox h2{margin:0 0 10px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:14px;font-weight:700}
#tip{position:fixed;z-index:9;max-width:260px;background:#1c1630f2;color:#f6ecff;border:1.5px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;pointer-events:none;box-shadow:0 6px 18px #0008}
#tip b{color:#ffe9a8;font-size:14px}#tip .tg{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;margin-left:4px;background:#3a2a6a;color:#e0d0ff}
#tip .st{color:#c8d8ff}#tip .ev{color:#ffd88a;margin-top:3px}#tip .ok{color:#8aff9a}#tip .no{color:#ff9a8a}
.chWrap{display:flex;flex-direction:column;height:100%;min-height:0}
.chWrap .det{flex:none;margin:0 0 6px}.chList{flex:1;overflow-y:auto;min-height:0;padding-right:2px;-webkit-overflow-scrolling:touch}
#tabBody.noscroll{overflow:hidden;display:flex;flex-direction:column}
.det .meta{font-size:12px;color:#5a4a36;margin-top:3px}
.opt.new{border-color:#4f8f3a;background:#f2fbe8}.opt.pas{border-color:#4a7ab0;background:#eef5ff}.opt.evo{border-color:#d9a83a;background:linear-gradient(#fff6d8,#ffeab0);box-shadow:0 0 0 2px #f0c860}
.opt .tag.pas{background:#cfe0f8}.opt .tag.go{background:#f6c040;color:#3a2200}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}}
@media (min-width:760px) and (min-height:500px){#sheet{width:min(900px,96vw);margin:0 auto}#prepCard{left:calc(50% - min(450px,48vw))}.chWrap{flex-direction:row;gap:10px}.chWrap .det{width:300px;margin:0;overflow-y:auto}}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="vig"></div>
<div id="floats"></div>
<div id="hud" class="hidden">
 <div id="xpbar"><i id="xpfill"></i><b id="lvl" class="num">Lv 1</b></div>
 <div id="top"><div id="stats"><span id="kills">💀 0</span><span id="gold">🪙 0</span></div><div id="timer" class="num">00:00<small id="timerSub"></small></div><div id="topR"><button id="pauseB" aria-label="일시정지">⏸</button></div></div>
 <div id="slots"><div class="row" id="slotW"></div><div class="row" id="slotP"></div></div>
 <div id="pills"><span class="pill" id="phaseP"></span><span class="pill env hidden" id="envP"></span><span class="pill warn hidden" id="stepP"></span></div>
 <div id="bossBar" class="hidden"><b id="bossName"></b><div><i id="bossFill"></i></div></div>
 <div id="hpbar"><i id="hpfill"></i></div>
 <div id="banner"></div>
</div>
<div id="joy"><i></i></div>
<div id="tip" class="hidden"></div>
<div id="sPrep" class="screen">
 <div id="prepHead"><h1>균열의 30분</h1><p>ROWEN SURVIVORS</p></div>
 <div id="prepCard"><b id="pcName"></b><span id="pcSub"></span></div>
 <div id="sheet" class="panel">
  <div id="tabs"><button class="tab on" data-t="ch">수호자</button><button class="tab" data-t="mp">지형</button><button class="tab" data-t="cs">시련 <span id="csTab" class="num">×1.00</span></button><button class="tab" data-t="cx">도감</button></div>
  <div id="tabBody"></div>
  <div id="prepFoot"><input id="iName" maxlength="12" placeholder="이름 (댓글 기록용)" autocomplete="off"><button id="goB" class="btn rift">출정</button></div>
 </div>
</div>
<div id="sLvl" class="modal hidden"><div id="lvBox" class="panel"><h2>레벨 업! <span id="lvN" class="num"></span></h2><div id="lvOpts"></div><div class="lvBtns"><button class="btn" id="rerollB">새로고침</button><button class="btn" id="skipB">넘기기</button></div></div></div>
<div id="sChest" class="modal hidden"><div id="chBox" class="panel"><h2 id="chT">보물상자</h2><div id="chList"></div><div class="rowB"><button class="btn gold" id="chOk">계속</button></div></div></div>
<div id="sPause" class="modal hidden"><div id="pauseBox" class="panel"><h2>잠시 멈춤</h2>
 <div class="tog">소리<button class="btn" id="sndB">켜짐</button></div><div class="tog">피해 숫자<button class="btn" id="dmgB">켜짐</button></div>
 <div id="pauseInfo" style="font-size:12.5px;text-align:left;line-height:1.5;margin:6px 0"></div>
 <div class="rowB"><button class="btn gold" id="resumeB">계속하기</button><button class="btn" id="cxB2">도감</button><button class="btn" id="quitB">포기하기</button></div></div></div>
<div id="sRes" class="modal hidden"><div id="resBox" class="panel"><h2 id="rTitle"></h2><div id="rScore" class="num"></div><div id="rSub"></div><dl class="kv" id="rDl"></dl><div id="rec"></div>
 <div class="rowB"><button class="btn gold" id="rCopy">기록 복사하기</button><button class="btn rift" id="rRetry">다시 출정</button><button class="btn" id="rHome">준비 화면</button></div></div></div>
<div id="sCodex" class="modal hidden"><div id="cxBox" class="panel"><div id="cxTabs"></div><div id="cxBody"></div><div class="rowB" style="padding:8px;margin:0;border-top:2px solid #4a2e14"><button class="btn" id="cxClose">닫기</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
'use strict';
/* ===== 균열의 30분 · 로웬 서바이버 — data ===== */
const STEP=1/30,FINAL_T=1800,ENRAGE_T=2100,DOOM_T=2400,CYCLE=360;
const EL={phys:{n:'물리',ic:'⚔️'},fire:{n:'화염',ic:'🔥'},frost:{n:'서리',ic:'❄️'},shock:{n:'번개',ic:'⚡'},poison:{n:'독',ic:'☠️'},holy:{n:'신성',ic:'✨'},dark:{n:'암흑',ic:'🌑'}};
const RACES={beast:{n:'야수',ic:'🐺'},bird:{n:'조류',ic:'🦅'},fish:{n:'어류',ic:'🐟'},plant:{n:'식물',ic:'🌿'},human:{n:'인간',ic:'🧑'},undead:{n:'언데드',ic:'💀'},demon:{n:'악마',ic:'😈'},dragon:{n:'드래곤',ic:'🐉'},elem:{n:'정령',ic:'🔥'},insect:{n:'곤충',ic:'🦂'}};
// 종족별 원소 상성 (1=보통)
const AFF={beast:{poison:1.3,frost:1.1},bird:{shock:1.35,phys:1.1},fish:{shock:1.5,frost:.7,fire:.8},plant:{fire:1.5,shock:.7,poison:.6},human:{poison:1.25,dark:1.25},
 undead:{holy:1.6,poison:.3,dark:.5,fire:1.15},demon:{holy:1.6,dark:.5,fire:.7},dragon:{fire:.5,frost:1.3,poison:.8},elem:{poison:.3,phys:.9,shock:1.1},insect:{fire:1.35,frost:1.2,poison:.8}};
const CLASSES={knight:{n:'기사',ic:'⚔️'},rogue:{n:'도적',ic:'🗡️'},archer:{n:'궁수',ic:'🏹'},mage:{n:'법사',ic:'🔮'},shaman:{n:'주술사',ic:'🪶'},priest:{n:'사제',ic:'✨'},monster:{n:'마물',ic:'👹'}};

/* f: a 공중, w 무리, e 정예, r 재생, s 분열, g 원거리, c 돌진, p 유체(물리 반감), x 직접 등장 안 함 */
const MONS=[

function updPick(G,dt){const P=G.p,mr=P.st.magnet;let xpCnt=0;

  case 'mag':for(const o of G.pk)if(!o.dead&&o.k==='xp')o.mag=1;if(G.lostXp>0){G.pk.push({k:'xp',x:P.x+3,z:P.z,v:G.lostXp,mag:1});G.lostXp=0}ev(G,{k:'pick',n:'자석'});break;case 'bell':query(G,P.x,P.z,16,e=>{if(!e.boss&&!e.elite)hitE(G,e,1e7,'holy',{rx:1,noCrit:1})});ev(G,{k:'bell'});break;
  case 'clock':G.freezeT=7;ev(G,{k:'clock'});break;case 'chest':openChest(G,!!k.big);break}}
function openCrate(G,k){const r=G.rng();let it;if(r<.42&&!G.C.hunger)it='meat';else if(r<.68)it='goldbag';else if(r<.8)it='mag';else if(r<.9)it='clock';else it='bell';

function evoReady(G){const P=G.p,r=[];if(G.C.noevo)return r;for(const w of P.w){const D=w.d;if(D.evo_||w.lv<8||!D.evo)continue;if(P.ps.some(p=>p.id===D.evo[0]))r.push(w)}return r}

function rollChoices(G){const P=G.p,pool=[];const ownedW=new Set(P.w.map(w=>w.id)),evoFrom=new Set(P.w.filter(w=>w.d.evo_).map(w=>w.d.from));
 for(const w of P.w)if(w.lv<w.d.max)pool.push({t:'w',id:w.id,wt:3});
 for(const p of P.ps)if(p.lv<p.d.max)pool.push({t:'p',id:p.id,wt:2});
 if(P.w.length<G.maxW){const av=WPN_IDS.filter(id=>!ownedW.has(id)&&!evoFrom.has(id));for(const id of av)pool.push({t:'nw',id,wt:7/av.length})}
 if(P.ps.length<G.maxP){const av=PASSIVES.filter(p=>!P.ps.some(q=>q.id===p.id));for(const p of av)pool.push({t:'np',id:p.id,wt:5/av.length})}

 while(out.length<n&&pool.length){let tot=0;for(const o of pool)tot+=o.wt;let r=G.rng()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].wt;if(r<=0)break}i=Math.min(i,pool.length-1);out.push(pool[i]);pool.splice(i,1)}

function evolve(G,w){const D=WEAPONS[w.id];const nid=D.evo[1];w.id=nid;w.d=EVOS[nid];w.lv=1;G.evos++;G.dirty=true;ev(G,{k:'evolve',id:nid})}

 if(G.sch.length){const now=G.t,keep=[];const due=[];for(const s of G.sch)(s.t<=now?due:keep).push(s);G.sch=keep;for(const s of due)s.fn()}
