<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>로웬 달무티 · 맹약의 서열전</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c37a;--gold2:#b8893e;--ink:#f3e7cf;--sw:66px;--av:34px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050508;color:var(--ink);font-family:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:0;overflow:hidden}
#room{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 45%,#2b2019 0%,#140e0b 42%,#060407 78%,#030204 100%)}
#lamp{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 34% 26% at 50% -4%,rgba(255,226,170,.30),transparent 70%),conic-gradient(from 180deg at 50% -8%,transparent 152deg,rgba(255,214,150,.07) 166deg,rgba(255,214,150,.10) 180deg,rgba(255,214,150,.07) 194deg,transparent 208deg)}
#arena{position:absolute;left:0;right:0;z-index:2}
#table{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#1a7070 0%,#105456 40%,#093637 75%,#052020 100%);box-shadow:0 0 0 3px #c9a35c,0 0 0 9px #4a2c17,0 0 0 12px #7a4e28,0 0 0 14px #2a170c,0 24px 60px rgba(0,0,0,.85),inset 0 0 70px rgba(0,0,0,.75)}
#table.shake{animation:shake .32s}
@keyframes shake{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
#emblem{position:absolute;inset:12%;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.17}
#tableGlow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 60% 55% at 50% 40%,rgba(255,225,170,.16),transparent 70%)}
#turnSpot{position:absolute;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,222,160,.30),rgba(255,210,140,.10) 45%,transparent 70%);transition:left .45s ease,top .45s ease,opacity .3s;opacity:0}
#seats{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.4,0,.2,1),top .8s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;width:var(--sw);z-index:2}
.seat .av{width:var(--av);height:var(--av);border-radius:50%;border:2px solid #6b5333;box-shadow:0 2px 8px rgba(0,0,0,.8);background:#222;position:relative}
.seat .av img{width:100%;height:100%;border-radius:50%;image-rendering:pixelated;display:block}
.seat.turn .av{border-color:#ffd77a;box-shadow:0 0 0 2px rgba(255,215,120,.45),0 0 18px 5px rgba(255,200,100,.6)}
.seat .nm{font-size:11px;font-weight:700;color:#f3e3c3;text-shadow:0 1px 2px #000,0 0 4px #000;margin-top:2px;white-space:nowrap;max-width:110%;overflow:hidden;text-overflow:ellipsis}
.seat.me .nm{color:#a6ece0}
.seat .tt{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(232,195,122,.35);color:#e8c37a;white-space:nowrap;margin-top:1px;min-height:15px}
.seat .cc{position:absolute;top:-5px;right:-12px;min-width:21px;height:19px;border-radius:10px;background:#0f4a4c;border:1px solid #e8c37a;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;color:#fff3d6}
.seat.me .cc{display:none}
.seat .md{position:absolute;left:-12px;top:-6px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c08a2e);color:#3a2206;font-size:11px;font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(255,210,120,.8)}
.seat.out .md{display:flex}
.seat.out .av img{filter:brightness(.75) saturate(.7)}
.seat.lastp .av::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px dashed rgba(255,215,120,.95);animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.seat .lp{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font-size:9.5px;font-weight:900;line-height:1;background:linear-gradient(#ffe39a,#c9922a);color:#2a1806;padding:2px 5px;border-radius:7px;white-space:nowrap;display:none;box-shadow:0 0 8px rgba(255,210,120,.85);z-index:2}
.seat.lastp .lp{display:block}
.seat.lastp .nm{margin-top:8px}
.seat .bub{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%) scale(.6);opacity:0;transition:all .18s;background:#f6ead0;color:#2a1a0c;font-size:11px;font-weight:900;padding:3px 8px;border-radius:10px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:3}
.seat .bub.show{opacity:1;transform:translateX(-50%) scale(1)}
.seat .bub.pass{background:#3a3a44;color:#d8d8e6}
.seat .bub.mini{background:transparent;box-shadow:none;padding:0}
#pile{position:absolute;width:0;height:0;z-index:3}
.layer{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.layer.old{filter:brightness(.5) saturate(.7)}
#pileLabel{position:absolute;transform:translateX(-50%);font-size:12px;color:#f6e2b5;text-shadow:0 1px 3px #000;white-space:nowrap;z-index:3;font-weight:700;text-align:center}
#pileLabel small{display:block;font-size:11px;color:#cdbb98;font-weight:500;margin-top:2px}
#toast{position:absolute;left:50%;transform:translate(-50%,-6px);opacity:0;transition:all .25s;background:rgba(10,6,4,.85);border:1px solid rgba(232,195,122,.55);color:#fbe7bd;padding:6px 14px;border-radius:14px;font-size:12.5px;white-space:nowrap;z-index:6;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ring{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:3px solid rgba(255,220,140,.9);opacity:0;pointer-events:none;z-index:4}
#ring.go{animation:ring .5s ease-out}
@keyframes ring{0%{transform:scale(1);opacity:.95}100%{transform:scale(22);opacity:0}}
#topbar{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:7px;padding:0 10px;z-index:5;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0))}
#topbar .tl{font-weight:900;color:var(--gold);font-size:14px;white-space:nowrap}
#topbar .rd{font-size:12px;color:#d9c59c;white-space:nowrap;padding:2px 7px;border:1px solid rgba(232,195,122,.3);border-radius:9px}
#topbar .sc{margin-left:auto;font-size:12px;color:#f6e2b5;white-space:nowrap;text-align:right;line-height:1.15}
#topbar .sc b{color:#ffe09a;font-size:13px}
.ib{width:31px;height:31px;flex:none;border-radius:50%;border:1px solid rgba(232,195,122,.45);background:rgba(20,14,10,.7);color:#f3e7cf;font-size:14px;display:flex;align-items:center;justify-content:center}
#bar{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;gap:7px;padding:0 10px;height:50px}
#status{flex:1;font-size:12.5px;color:#eadcbd;line-height:1.25;min-width:0;text-shadow:0 1px 2px #000}
#status b{color:#ffe09a}
#timer{position:absolute;left:10px;right:10px;top:-2px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);display:none}
#timer i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#ff6b4a,#ffd27a);width:100%}
.btn{height:38px;padding:0 15px;border-radius:19px;border:1px solid #c9a35c;background:linear-gradient(#3d2a18,#22160c);color:#f7e6c0;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.55);white-space:nowrap}
.btn.gold{background:linear-gradient(#f0cd80,#b98a37);color:#2a1806;border-color:#ffe6aa}
.btn:disabled{opacity:.33;filter:grayscale(.7)}
.btn.sm{height:34px;padding:0 11px;font-size:13px}
#hand{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:4}
#hand .card{transition:transform .16s,filter .2s,box-shadow .2s,left .25s;cursor:pointer}
#hand .card.sel{transform:translateY(-18px)}
#hand .card.glow{box-shadow:0 0 0 2px #ffe08a,0 0 16px 3px rgba(255,205,110,.8);animation:glow 1.3s ease-in-out infinite}
#hand .card.dim{filter:brightness(.45) saturate(.5)}
#hand .card.newc{animation:pop .5s ease-out}
@keyframes glow{50%{box-shadow:0 0 0 2px #fff3c8,0 0 24px 7px rgba(255,218,135,.95)}}
@keyframes pop{0%{transform:translateY(-30px) scale(1.15);filter:brightness(1.8)}100%{transform:none}}
#handMsg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:14px;color:#e8c37a;text-shadow:0 1px 3px #000}
/* cards */
.card{position:absolute;width:var(--w,86px);height:calc(var(--w,86px)*1.42);border-radius:.08em;overflow:hidden;background:#17110c;box-shadow:0 3px 10px rgba(0,0,0,.7);font-size:var(--w,86px);line-height:1}
.card>*{pointer-events:none}
.card .pt{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 38%,transparent 70%,rgba(0,0,0,.25));pointer-events:none}
.card .band{position:absolute;inset:0;border-radius:.08em;border:.045em solid var(--bc);box-shadow:inset 0 0 0 .012em rgba(255,242,205,.9),inset 0 0 .16em rgba(0,0,0,.8)}
.card .rk{position:absolute;left:.035em;top:.035em;font-size:.19em;width:1.36em;height:1.36em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3520,#120b06);border:.07em solid #f0cf86;color:#ffe3a0;font-weight:900;display:flex;align-items:center;justify-content:center;text-shadow:0 0 .2em #000;font-family:Georgia,'Noto Serif KR',serif}
.card .rk.j{font-size:.16em;width:1.62em;height:1.62em}.card .rk.d2{font-size:.15em;width:1.72em;height:1.72em;letter-spacing:-.08em}
.card .tv{position:absolute;left:1.05em;top:3.1em;font-size:.1em;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.05em;color:#fff0c8;font-weight:900;background:rgba(10,6,3,.6);border:.06em solid rgba(240,207,134,.6);padding:.35em .12em;border-radius:.6em;text-shadow:0 0 .2em #000}
.card .nm{position:absolute;left:.04em;right:.04em;bottom:.045em;font-size:.105em;text-align:center;background:linear-gradient(var(--rc),#140a05);color:#fff3d6;padding:.32em .5em .38em;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);border-top:.06em solid rgba(240,207,134,.8)}
.card .nm i{display:block;font-style:normal;font-size:.8em;color:#f0d79c;opacity:.95;white-space:nowrap}
.card .nm b{display:block;font-size:1.28em;font-weight:900;margin-top:.1em;white-space:nowrap;letter-spacing:.04em}
.card .wild{position:absolute;right:.05em;top:.05em;font-size:.075em;background:#7a4c9a;border:.08em solid #e6c9ff;color:#fff;padding:.2em .5em;border-radius:.6em;font-weight:900}
.card.back{background-image:var(--back);background-size:cover}
.card.back::after{display:none}
#fly{position:absolute;inset:0;pointer-events:none;z-index:6}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;z-index:8;pointer-events:none;opacity:0}
#banner.show{animation:ban 1.6s ease-out forwards}
#banner h2{font-size:clamp(26px,7vw,46px);font-weight:900;background:linear-gradient(#fff3c8,#e8b860 55%,#a8721f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.9))}
#banner p{font-size:clamp(13px,3.4vw,17px);color:#f6e2b5;text-shadow:0 2px 4px #000;margin-top:6px}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,240,200,.85),rgba(255,210,120,.25) 50%,transparent 80%);opacity:0}
#flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#modal{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:14px}
#modal.show{display:flex}
.panel{width:min(560px,100%);max-height:calc(100% - 10px);overflow-y:auto;background:linear-gradient(#21160e,#120b07);border:1px solid #c9a35c;border-radius:16px;box-shadow:0 0 0 4px rgba(201,163,92,.15),0 20px 60px rgba(0,0,0,.9);padding:18px 16px;-webkit-overflow-scrolling:touch}
.panel h3{font-size:19px;color:#ffe09a;text-align:center;margin-bottom:10px}
.panel p{font-size:13.5px;line-height:1.6;color:#eadcbd;margin:6px 0}
.panel .mbtns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.panel table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.panel td,.panel th{padding:5px 4px;border-bottom:1px solid rgba(201,163,92,.2);text-align:center;white-space:nowrap}
.panel th{color:#c9a35c;font-weight:700;font-size:11.5px}
.panel tr.me td{color:#a6ece0;font-weight:700;background:rgba(80,200,180,.08)}
.panel .rules li{font-size:13px;line-height:1.6;color:#eadcbd;margin:4px 0 4px 18px}
.panel .rules b{color:#ffe09a}
.pick{position:relative;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.pick .card{position:relative;cursor:pointer;transition:transform .15s}
.pick .card.sel{transform:translateY(-8px);box-shadow:0 0 0 2px #ffe08a,0 0 14px 3px rgba(255,205,110,.8)}
.pick .card.got::before{content:'공물';position:absolute;z-index:2;right:.05em;top:.05em;font-size:.12em;background:#c0392b;color:#fff;padding:.15em .4em;border-radius:.5em;font-weight:900}
.rec{width:100%;min-height:200px;background:#0b0705;color:#f3e7cf;border:1px solid #6b5333;border-radius:10px;padding:10px;font-size:12.5px;line-height:1.55;font-family:inherit;resize:none;white-space:pre-wrap}
.vlink{display:inline-block;margin-top:8px;color:#9fe3d8;font-size:13px}
#title{position:absolute;inset:0;z-index:10;overflow-y:auto;background:radial-gradient(ellipse 80% 55% at 50% 30%,rgba(60,40,22,.55),transparent 70%),radial-gradient(ellipse at 50% 100%,#08201f,#040304 70%);-webkit-overflow-scrolling:touch}
#title .tw{max-width:540px;margin:0 auto;padding:22px 16px 30px}
#title .logo{text-align:center}
#title .sub{font-size:12px;letter-spacing:6px;color:#9fd8cf;font-family:Georgia,serif}
#title h1{font-size:clamp(34px,10vw,52px);font-weight:900;background:linear-gradient(#fff6d2,#e8b860 55%,#9a6a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 8px rgba(0,0,0,.9));margin:4px 0}
#title .sub2{font-size:13px;color:#d9c59c}
#tFan{position:relative;height:170px;margin:12px auto 6px;width:100%}
#title .lb{display:block;font-size:13px;color:#c9a35c;margin:14px 0 6px;font-weight:700}
#nameIn{width:100%;height:42px;border-radius:10px;border:1px solid #8a6a3a;background:#0e0906;color:#fff3d6;font-size:16px;padding:0 12px;outline:none}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lv{border:1px solid #5a4528;background:rgba(25,17,10,.85);border-radius:11px;padding:8px 9px;text-align:left;color:#eadcbd}
.lv b{display:block;font-size:13.5px;color:#f6e2b5}
.lv span{display:block;font-size:11px;color:#b9a78a;margin-top:2px;line-height:1.35}
.lv em{font-style:normal;color:#ffd27a;font-weight:900;font-size:12px}
.lv.on{border-color:#ffd27a;background:linear-gradient(rgba(90,62,22,.85),rgba(40,26,10,.9));box-shadow:0 0 12px rgba(255,200,100,.35)}
.debs{display:flex;flex-direction:column;gap:6px}
.db{display:flex;align-items:center;gap:9px;border:1px solid #4a3a26;background:rgba(20,14,9,.85);border-radius:11px;padding:8px 10px;text-align:left;color:#eadcbd}
.db .ic{font-size:19px;width:26px;text-align:center}
.db .tx{flex:1;font-size:12px;line-height:1.35;color:#b9a78a}
.db .tx b{display:block;font-size:13px;color:#f6e2b5}
.db .pl{font-size:12px;color:#ff9c7a;font-weight:900}
.db.on{border-color:#ff8f6a;background:linear-gradient(rgba(90,30,18,.8),rgba(40,14,8,.9))}
.multi{text-align:center;margin:14px 0 4px;font-size:15px;color:#f6e2b5}
.multi b{font-size:22px;color:#ffd27a}
#title .row{display:flex;gap:8px;justify-content:center;margin-top:12px}
#title .row .btn{height:46px;font-size:15px;padding:0 20px}
.best{text-align:center;font-size:12px;color:#9fd8cf;margin-top:10px}
@media (max-width:440px){#topbar .tl span{display:none}#topbar{gap:5px;padding:0 7px}.ib{width:29px;height:29px;font-size:13px}}
@media (min-width:700px) and (min-height:600px){.seat .nm{font-size:13px}.seat .tt{font-size:11.5px}#status{font-size:14px}#topbar .tl{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <div id="room"></div>
  <div id="lamp"></div>
  <div id="arena">
    <div id="table"><div id="tableGlow"></div><div id="emblem"></div></div>
    <div id="turnSpot"></div>
    <div id="seats"></div>
    <div id="ring"></div>
    <div id="pile"></div>
    <div id="pileLabel"></div>
    <div id="toast"></div>
  </div>
  <div id="topbar">
    <div class="tl">🎭 <span>로웬 달무티</span></div>
    <div class="rd" id="rdInfo">준비</div>
    <div class="sc" id="scInfo"></div>
    <button class="ib" id="bSnd" title="소리">🔊</button>
    <button class="ib" id="bSpd" title="속도">1×</button>
    <button class="ib" id="bHelp" title="게임 방법">📜</button>
    <button class="ib" id="bMenu" title="메뉴">☰</button>
  </div>
  <div id="bar">
    <div id="timer"><i></i></div>
    <button class="btn sm" id="bHint" title="추천 수">💡</button>
    <div id="status">궁정에 들어서는 중…</div>
    <button class="btn" id="bPass" disabled>패스</button>
    <button class="btn gold" id="bPlay" disabled>내기</button>
  </div>
  <div id="hand"></div>
  <div id="fly"></div>
  <canvas id="fx"></canvas>
  <div id="banner"><h2></h2><p></p></div>
  <div id="flash"></div>
  <div id="modal"><div class="panel" id="panel"></div></div>
  <div id="title">
    <div class="tw">
      <div class="logo">
        <div class="sub">ROWEN · DALMUTI</div>
        <h1>맹약의 서열전</h1>
        <div class="sub2">무너진 로웬하임 궁정의 서열을 카드로 다시 세워라</div>
      </div>
      <div id="tFan"></div>
      <label class="lb" for="nameIn">궁정에 올릴 이름</label>
      <input id="nameIn" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off">
      <label class="lb">상대 궁정 (CPU 7명)</label>
      <div class="lvls" id="lvls"></div>
      <label class="lb">디버프 (고를수록 배율 상승)</label>
      <div class="debs" id="debs"></div>
      <div class="multi" id="multi"></div>
      <div class="row"><button class="btn" id="bRules">📜 게임 방법</button><button class="btn gold" id="bStart">🕯️ 착석하기</button></div>
      <div class="best" id="best"></div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const VERIFY_URL='https://chillermaster.github.io/flashgame/rowen-dalmuti-verify.html';
const AUTO=location.hash.indexOf('autotest')>=0;
const $=s=>document.querySelector(s);
const rnd=Math.random;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function tone(f,t0,dur,type,vol,f2){const a=ac();if(!a||muted)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}

function groupsOf(c){let g=0;for(let r=1;r<=12;r++)if(c[r])g++;if(!g&&c[13])g=1;return g;}
function evalHand(c){let G0=0,n=c[13],str=0;for(let r=1;r<=12;r++)if(c[r]){G0++;n+=c[r];str+=c[r]*(13-r);}if(!G0&&!c[13])return 1000;const gr=G0+(G0===0&&c[13]?1:0);return -12*gr-2*n+.8*str+7*c[13];}
function genMoves(hand,trick,sealed){const c=counts(hand),J=c[13],jest=hand.filter(x=>x.r===13),ms=[];
 for(let r=1;r<=12;r++){if(!c[r])continue;const nats=hand.filter(x=>x.r===r);
  if(trick){if(r>=trick.rank)continue;const K=trick.count,n=Math.min(c[r],K),j=K-n;if(j>0&&(sealed||j>J))continue;ms.push({cards:nats.slice(0,n).concat(jest.slice(0,j)),rank:r,count:K,j});}
  else{for(let n=1;n<=c[r];n++)ms.push({cards:nats.slice(0,n),rank:r,count:n,j:0});if(!sealed)for(let j=1;j<=J;j++)ms.push({cards:nats.concat(jest.slice(0,j)),rank:r,count:c[r]+j,j});}}

function unseenFor(p){const own=counts(p.hand),u=[];for(let r=1;r<=13;r++)u[r]=Math.max(0,TOTAL[r]-own[r]-G.played[r]);return u;}
function greedyMove(hand,trick,sealed){const c=counts(hand),J=sealed?0:c[13],jest=hand.filter(x=>x.r===13),nat=r=>hand.filter(x=>x.r===r);let G0=0;for(let r=1;r<=12;r++)if(c[r])G0++;
 if(!trick){for(let r=12;r>=1;r--)if(c[r]){let cs=nat(r);if(G0===1&&J)cs=cs.concat(jest);return cs;}return jest.slice();}
 const K=trick.count;for(let r=trick.rank-1;r>=1;r--)if(c[r]===K)return nat(r);
 for(let r=trick.rank-1;r>=7;r--)if(c[r]>K)return nat(r).slice(0,K);
 if(J&&hand.length<=5)for(let r=trick.rank-1;r>=1;r--)if(c[r]&&c[r]<K&&c[r]+J>=K)return nat(r).concat(jest.slice(0,K-c[r]));
 if(G0<=2)for(let r=trick.rank-1;r>=1;r--)if(c[r]>=K)return nat(r).slice(0,K);
 return null;}
function randomMove(hand,trick){const ms=genMoves(hand,trick,false);if(!ms.length)return null;if(trick&&rnd()<.3)return null;const pool=ms.filter(m=>m.j===0);const arr=pool.length?pool:ms;return arr[Math.floor(rnd()*arr.length)].cards;}
function simAfter(S,me){const n=S.hands.length;for(let gd=0;gd<3000;gd++){if(S.fin>=n-1)break;let active=0;for(let i=0;i<n;i++)if(!S.out[i])active++;const lastA=!S.out[S.last],need=active-(lastA?1:0);
  if(S.trick&&S.passes>=need){S.trick=null;S.passes=0;let idx=S.last;if(!lastA){do{idx=(idx+1)%n;}while(S.out[idx]);}S.turn=idx;}else{do{S.turn=(S.turn+1)%n;}while(S.out[S.turn]);}
  const t=S.turn,h=S.hands[t];let cs=greedyMove(h,S.trick,false);if(!cs&&!S.trick)cs=[h[h.length-1]];
  if(cs){S.hands[t]=h.filter(c=>!cs.includes(c));S.trick=playInfo(cs,false);S.last=t;S.passes=0;if(!S.hands[t].length){S.out[t]=++S.fin;if(t===me)return S.fin;}}else S.passes++;}
 return S.out[me]||n;}
function candMoves(hand,trick){if(trick){const ms=genMoves(hand,trick,false).map(m=>m.cards);ms.push(null);return ms;}
 const c=counts(hand),J=c[13],jest=hand.filter(x=>x.r===13),ms=[];for(let r=1;r<=12;r++)if(c[r]){const nats=hand.filter(x=>x.r===r);ms.push(nats);for(let j=1;j<=J;j++)ms.push(nats.concat(jest.slice(0,j)));if(c[r]>=2)ms.push(nats.slice(0,1));}
 for(let j=1;j<=J;j++)ms.push(jest.slice(0,j));return ms;}
function mcMove(ctx,R){// ctx:{hands:[arrays by seat], out:[], fin, trick, last, passes, me}
 const me=ctx.me,hand=ctx.hands[me];const cands=candMoves(hand,ctx.trick);if(cands.length===1)return cands[0];
 const own=counts(hand),pool=[];let uid=100000;for(let r=1;r<=13;r++){const k=TOTAL[r]-own[r]-G.played[r];for(let i=0;i<k;i++)pool.push({r,id:uid++});}
 const opp=[];let need=0;ctx.hands.forEach((h,i)=>{if(i!==me&&!ctx.out[i]){opp.push(i);need+=h.length;}});if(need!==pool.length)return null;
 const deals=[];for(let k=0;k<R;k++){const pl=shuffle(pool.slice());const hs=ctx.hands.map(h=>[]);let o=0;opp.forEach(i=>{hs[i]=pl.slice(o,o+ctx.hands[i].length);o+=ctx.hands[i].length;sortHand(hs[i]);});deals.push(hs);}
 const gm=greedyMove(hand,ctx.trick,false);let best=null,bv=1e9;
 for(const m of cands){let sum=0;for(let k=0;k<R;k++){const hs=deals[k].map(h=>h.slice());hs[me]=m?hand.filter(c=>!m.includes(c)):hand.slice();const S={hands:hs,out:ctx.out.slice(),fin:ctx.fin,trick:ctx.trick,last:ctx.last,passes:ctx.passes,turn:me};
   if(m){S.trick=playInfo(m,false);S.last=me;S.passes=0;if(!hs[me].length){sum+=ctx.fin+1;continue;}}else S.passes++;
   sum+=simAfter(S,me);}
  let v=sum/R;if(gm&&m&&m.length===gm.length&&m.every((c,i)=>c===gm[i]))v-=.04;if(!gm&&!m)v-=.04;if(v<bv){bv=v;best=m;}}
 return best;}
function cpuDecide(p){const t=G.trick,l=G.lvl;let cs;if(l===1)cs=randomMove(p.hand,t);else if(l===2)cs=greedyMove(p.hand,t,false);else{const st=G.st;cs=mcMove({hands:G.order.map(id=>G.players[id].hand),out:G.order.map(id=>G.players[id].out),fin:G.finish.length,trick:t,last:st.last,passes:st.passes,me:st.turn},l>=4?24:6);if(cs===null&&!t)cs=greedyMove(p.hand,t,false);}
 if(cs){const i=playInfo(cs,false);if(!i||!canBeat(i,t))cs=greedyMove(p.hand,t,false);}
 if(!cs&&!t)cs=[p.hand[p.hand.length-1]];return cs;}
function cpuReturn(p,n){const nat=p.hand.filter(x=>x.r<13);if(G.lvl<3||nat.length>14){return nat.slice().sort((a,b)=>b.r-a.r).slice(0,n);}

function playableSet(){const p=me(),t=G.trick,sealed=!!G.deb.seal,set=new Set();if(!UI.active)return set;if(!t){p.hand.forEach(c=>set.add(c.id));return set;}
 const c=counts(p.hand),J=sealed?0:c[13];let jOk=false;p.hand.forEach(x=>{if(x.r<13&&x.r<t.rank&&c[x.r]+J>=t.count){set.add(x.id);if(t.count>=2&&J)jOk=true;}});if(jOk)p.hand.forEach(x=>{if(x.r===13)set.add(x.id);});return set;}
function renderHand(){const p=me();if(!p)return;handEl.innerHTML='';const g=G.geo,n=p.hand.length;
 if(!n){const m=document.createElement('div');m.id='handMsg';m.textContent=p.out?`서열 확정: ${p.out}위 — ${titleOf(p.out)[1]}`:'';handEl.appendChild(m);return;}
 const W=innerWidth,avail=W-16,cw=g.cw;const step=n>1?Math.min(cw*.66,(avail-cw)/(n-1)):0;const total=cw+step*(n-1);const x0=(W-total)/2;const ps=playableSet();
 p.hand.forEach((c,i)=>{const e=cardEl(c,cw);e.style.left=(x0+i*step)+'px';e.style.top='22px';e.style.zIndex=i+1;if(UI.sel.has(c.id))e.classList.add('sel');if(UI.active){if(ps.has(c.id))e.classList.add('glow');else if(G.trick)e.classList.add('dim');}if(c._new){e.classList.add('newc');delete c._new;}tap(e,()=>onCardTap(c));handEl.appendChild(e);});}
function selCards(){return me().hand.filter(c=>UI.sel.has(c.id));}
function onCardTap(c){if(!UI.active)return;ac();const t=G.trick,sealed=!!G.deb.seal,hand=me().hand;
 if(UI.sel.has(c.id))UI.sel.delete(c.id);
 else if(c.r===13){if(sealed){if(t){toast('🎭 가면 봉인: 변장꾼은 단독으로만 낼 수 있어요');return;}selCards().forEach(x=>{if(x.r<13)UI.sel.delete(x.id);});}UI.sel.add(c.id);}
 else{const sn=selCards().filter(x=>x.r<13);if(sn.length&&sn[0].r!==c.r)sn.forEach(x=>UI.sel.delete(x.id));if(sealed)selCards().forEach(x=>{if(x.r===13)UI.sel.delete(x.id);});
  if(t&&c.r<t.rank&&!selCards().some(x=>x.r===c.r)){UI.sel.clear();const nats=[c].concat(hand.filter(x=>x.r===c.r&&x.id!==c.id));nats.slice(0,t.count).forEach(x=>UI.sel.add(x.id));const need=t.count-Math.min(nats.length,t.count);if(need>0&&!sealed)hand.filter(x=>x.r===13).slice(0,need).forEach(x=>UI.sel.add(x.id));}
  else UI.sel.add(c.id);}
 SND.tick();renderHand();updateButtons();}
function updateButtons(){const t=G.trick;if(!UI.active){bPlay.disabled=true;bPass.disabled=true;bHint.disabled=true;bPlay.textContent='내기';return;}
 const cs=selCards(),info=playInfo(cs,!!G.deb.seal),ok=!!info&&canBeat(info,t);bPlay.disabled=!ok;bPlay.textContent=ok?`내기 · ${info.rank===13?'🎭':info.rank}×${info.count}`:'내기';bPass.disabled=!t;bHint.disabled=false;}
function humanTurn(){return new Promise(res=>{const tok=G.tok;UI.active=true;UI.sel.clear();G.humanRes=v=>{if(tok!==G.tok)return;UI.active=false;UI.sel.clear();clearInterval(G.timerI);$('#timer').style.display='none';G.humanRes=null;renderHand();updateButtons();res(v);};
 const t=G.trick;setStatus(t?`<b>당신의 차례</b> — ${t.count}장으로 <b>${t.rank===13?'변장꾼':t.rank}</b>보다 작은 숫자를 내거나 패스`:'<b>당신이 선(先)</b> — 같은 숫자 카드를 원하는 만큼 내세요');renderHand();updateButtons();
 if(AUTO){setTimeout(()=>G.humanRes&&G.humanRes(greedyMove(me().hand,G.trick,!!G.deb.seal)||(G.trick?null:[me().hand[me().hand.length-1]])),0);return;}
 if(G.deb.glass){const T=12000,st=Date.now();const tb=$('#timer'),ti=tb.querySelector('i');tb.style.display='block';ti.style.width='100%';let lastS=12;G.timerI=setInterval(()=>{const left=T-(Date.now()-st);ti.style.width=Math.max(0,left/T*100)+'%';const s=Math.ceil(left/1000);if(s<=3&&s!==lastS){SND.tick();lastS=s;}if(left<=0){clearInterval(G.timerI);toast('⏳ 모래시계가 다 떨어졌다');G.humanRes&&G.humanRes(G.trick?null:(greedyMove(me().hand,null,!!G.deb.seal)||[me().hand[me().hand.length-1]]));}},100);}});}
tap(bPlay,()=>{if(!G.humanRes||bPlay.disabled)return;const cs=selCards();const info=playInfo(cs,!!G.deb.seal);if(!info||!canBeat(info,G.trick))return;G.humanRes(cs);});
tap(bPass,()=>{if(!G.humanRes||bPass.disabled)return;G.humanRes(null);});
tap(bHint,()=>{if(!UI.active)return;const m=greedyMove(me().hand,G.trick,!!G.deb.seal);UI.sel.clear();if(m)m.forEach(c=>UI.sel.add(c.id));else toast('💡 지금은 패스가 무난해 보여요');renderHand();updateButtons();});

/* ---------- animations ---------- */
async function flyBetween(from,to,cards,face,w,stagger){const els=[];const dur=Math.max(60,Math.round(420/SP()));cards.forEach((c,i)=>{const e=face?cardEl(c,w):backEl(w);e.style.left=(from.x-w/2)+'px';e.style.top=(from.y-w*.71)+'px';e.style.transition=`transform ${dur}ms cubic-bezier(.3,.7,.3,1) ${i*(stagger||60)/SP()}ms, opacity ${dur}ms`;flyEl.appendChild(e);els.push(e);});
 void flyEl.offsetWidth;els.forEach((e,i)=>{e.style.transform=`translate(${to.x-from.x+(i-(els.length-1)/2)*w*.3}px,${to.y-from.y}px) rotate(${(rnd()-.5)*16}deg)`;});
 await wait(420+(cards.length-1)*(stagger||60)+40);els.forEach(e=>e.remove());}
async function showPlay(pid,cards){const g=G.geo,pw=g.pw,ph=g.ph,n=cards.length;const layer=document.createElement('div');layer.className='layer';const maxW=g.rx*1.3;const step=n>1?Math.min(pw*.36,(maxW-pw)/(n-1)):0;
 cards.forEach((c,i)=>{const e=cardEl(c,pw);e.style.left=((i-(n-1)/2)*step-pw/2)+'px';e.style.top=(-ph/2)+'px';e.style.transform=`rotate(${(i-(n-1)/2)*3.5+(rnd()-.5)*3}deg)`;layer.appendChild(e);});
 const s=pid===0?handXY():seatXY(pid),p=pileXY();layer.style.transform=`translate(${s.x-p.x}px,${s.y-p.y}px) scale(.4)`;layer.style.opacity='0';
 const olds=[...pileEl.querySelectorAll('.layer')];olds.forEach((L,i)=>{const depth=olds.length-i;if(depth>2){L.remove();return;}L.classList.add('old');L.style.transition='transform .3s, filter .3s';L.style.transform=`translate(0,${-depth*12}px) scale(${1-depth*.08})`;});
 pileEl.appendChild(layer);void layer.offsetWidth;const d=Math.max(40,Math.round(260/SP()));layer.style.transition=`transform ${d}ms cubic-bezier(.55,0,.8,.2), opacity ${Math.round(d*.5)}ms`;layer.style.transform='translate(0,0) scale(1.16)';layer.style.opacity='1';SND.flick();
 await wait(260);layer.style.transition=`transform ${Math.max(40,Math.round(240/SP()))}ms cubic-bezier(.2,1.7,.4,1)`;layer.style.transform='translate(0,0) scale(1)';
 const info=playInfo(cards,false);const power=clamp((13-info.rank)/12*.65+n*.1,0,1.1);impact(power,info.rank);}
function impact(power,rank){const p=pileXY();tableEl.classList.remove('shake');void tableEl.offsetWidth;tableEl.classList.add('shake');ringEl.classList.remove('go');void ringEl.offsetWidth;ringEl.style.borderColor=rank===13?'rgba(200,140,255,.9)':rank===1?'rgba(255,240,180,1)':'rgba(255,220,140,.9)';ringEl.classList.add('go');
 sparks(p.x,p.y,Math.round(10+power*22),rank===13?['#d8a8ff','#f6e8ff','#9a5ad8']:['#ffd27a','#fff1c0','#e8a23a'],1+power);SND.slam(power);
 if(rank<=1){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');sparks(p.x,p.y,30,['#fff7d6','#ffd27a'],2.2);}}
async function clearTrick(winner){const layers=[...pileEl.querySelectorAll('.layer')];const s=seatXY(winner),p=pileXY();const d=Math.max(40,Math.round(380/SP()));layers.forEach(L=>{L.style.transition=`transform ${d}ms ease-in, opacity ${d}ms ease-in`;L.style.transform=`translate(${s.x-p.x}px,${s.y-p.y}px) scale(.2)`;L.style.opacity='0';});SND.clear();labelEl.textContent='';await wait(400);layers.forEach(L=>L.remove());}
function clearPile(){pileEl.innerHTML='';labelEl.textContent='';}
function unbeatable(info){for(let r=1;r<info.rank;r++){const u=TOTAL[r]-G.played[r],uj=TOTAL[13]-G.played[13];if(u>=1&&u+uj>=info.count)return false;}return true;}
function markLast(id){G.players.forEach(p=>p.el.classList.toggle('lastp',p.id===id));}
function lapLabel(lastId,passes){const P=G.players,t=G.trick;if(!t||lastId==null)return;const active=G.order.filter(id=>!P[id].out).length,need=active-(P[lastId].out?0:1),left=Math.max(0,need-passes);labelEl.innerHTML=`🏁 ${esc(P[lastId].name)} · ${playLabel(t)}<small>${unbeatable(t)?'⚡ 더 이길 패 없음':left?`한 바퀴 끝까지 ${left}명`:''}</small>`;}

/* ---------- modal ---------- */
const modalEl=$('#modal'),panel=$('#panel');
function closeModal(){modalEl.classList.remove('show');}
function modal(html,btns,autoV){return new Promise(res=>{panel.innerHTML=html+'<div class="mbtns"></div>';const box=panel.querySelector('.mbtns');btns.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.gold?' gold':'');e.textContent=b.t;tap(e,()=>{if(b.fn&&b.fn()===false)return;closeModal();res(b.v);});box.appendChild(e);});modalEl.classList.add('show');panel.scrollTop=0;if(AUTO)setTimeout(()=>{closeModal();res(autoV!==undefined?autoV:btns[0].v);},5);});}

/* ---------- round flow ---------- */
function rulesHTML(){return `<h3>📜 맹약의 서열전 — 게임 방법</h3><ul class="rules">
<li><b>목표</b> · 손패를 가장 먼저 비워 높은 서열을 차지하세요. 8명이 7판을 겨룹니다.</li>
<li><b>카드</b> · 숫자가 작을수록 강합니다. 1 태양왕(1장)부터 12 농부(12장)까지, 숫자만큼 장수가 있어요. 🎭 변장꾼 2장은 와일드(다른 카드와 함께 내면 그 숫자로 변장, 단독이면 13).</li>
<li><b>진행</b> · 선(先)은 같은 숫자 카드를 원하는 만큼 냅니다. 다음 사람은 <b>같은 장수</b>로 <b>더 작은 숫자</b>를 내거나 패스. 모두 패스하면 마지막에 낸 사람(🏁 표시)이 새 선이 됩니다. 패스해도 다음 바퀴에 다시 낼 수 있어요. 1 태양왕처럼 <b>더 이길 수 있는 카드가 남아 있지 않은 패</b>를 내면 바로 그 사람이 다시 선을 잡습니다.</li>
<li><b>서열</b> · 먼저 비운 순서대로 👑대영주 · 🎖️소영주 · 🧺평민 · 🥀소작농 · ⛓️농노. 다음 판은 서열 순으로 앉고, 대영주가 첫 선을 잡습니다.</li>
<li><b>공물</b> · 판 시작 때 농노는 가장 좋은 카드 2장을 대영주에게, 소작농은 1장을 소영주에게 바칩니다. 받은 쪽은 아무 카드나 같은 수만큼 돌려줘요. (변장꾼은 공물에서 제외)</li>
<li><b>🎭 가면의 반란</b> · 변장꾼 2장을 모두 받은 사람은 반란을 선언할 수 있어요. 선언하면 이번 판 공물이 없고, 농노가 선언하면 <b>대반란</b>으로 서열이 통째로 뒤집힙니다.</li>
<li><b>점수</b> · 판마다 서열 점수 10·7·5·4·3·2·1·0점. 대영주를 연속으로 지키면 +2·+4·+6…, 지난 판보다 서열이 오르면 오른 계단만큼 보너스. 7판 합계 × 배율(궁정 수준·디버프)이 최종 점수입니다.</li>
<li><b>조작</b> · 카드를 탭해 고르고 [내기]. 따라 낼 때 카드를 탭하면 필요한 장수가 자동으로 골라져요. 💡는 추천 수.</li></ul>`;}
async function seatDraw(){G.showTitles=false;updateSeats();const deck=shuffle(makeDeck());const dr=G.players.map((p,i)=>({id:p.id,c:deck[i],t:rnd()}));
 dr.forEach(d=>{const html=`<span style="display:inline-block;position:relative;width:34px;height:48px"></span>`;bubble(d.id,html,'mini',2200);const b=G.players[d.id].el.querySelector('.bub');const ce=cardEl(d.c,34);ce.style.left='0';ce.style.top='0';b.firstChild.appendChild(ce);});
 SND.flick();toast('🃏 자리 뽑기 — 숫자가 작을수록 높은 자리');await wait(1900);
 dr.sort((a,b)=>a.c.r-b.c.r||a.t-b.t);let ord=dr.map(d=>d.id);if(G.deb.brand){ord=ord.filter(x=>x!==0);ord.push(0);}G.order=ord;}
async function dealAnim(){const g=G.geo,p=pileXY();const w=Math.round(g.pw*.55);for(let wave=0;wave<3;wave++){const ps=[];G.order.forEach((id,i)=>{const to=id===0?handXY():seatXY(id);ps.push(flyBetween(p,to,[null],false,w,0));});SND.flick();await Promise.all(ps);}}
async function revolution(){const holder=G.players.find(p=>p.hand.filter(c=>c.r===13).length===2);if(!holder)return 0;const pos=G.order.indexOf(holder.id)+1;let yes;
 if(holder.human){yes=await modal(`<h3>🎭 변장꾼 두 장이 당신 손에!</h3><p>잿빛 망토의 변장꾼 둘이 귓속말을 건넵니다. <b>가면의 반란</b>을 일으킬까요?</p><p>${pos===NPL?'지금 당신은 <b>농노</b> — 선언하면 <b>대반란</b>! 서열이 통째로 뒤집혀 당신이 대영주가 됩니다.':'선언하면 이번 판의 공물이 모두 사라집니다.'}</p>`,[{t:'🎭 반란을 일으킨다',v:true,gold:1},{t:'조용히 넘어간다',v:false}],true);}
 else{if(pos>=NPL-1)yes=G.lvl===1?rnd()<.75:true;else if(pos<=2)yes=false;else yes=rnd()<.35;}
 if(!yes)return 0;SND.rev();if(pos===NPL){banner('🎭 대반란!',`${holder.name} — 농노가 가면을 벗었다. 서열이 뒤집힌다!`);await wait(1700);return 2;}banner('🎭 가면의 반란',`${holder.name}의 선언 — 이번 판 공물은 없다`);await wait(1600);return 1;}
async function tribute(){const o=G.order,P=G.players,gd=P[o[0]],ld=P[o[1]],lp=P[o[NPL-2]],gp=P[o[NPL-1]];const pairs=[[gp,gd,2],[lp,ld,1]];
 for(const [from,to,base] of pairs){const n=base+(from.human&&G.deb.heavy?1:0);const give=takeBest(from,n);from.hand=from.hand.filter(c=>!give.includes(c));give.forEach(c=>{c._new=to.human;to.hand.push(c);});sortHand(to.hand);
  const face=from.human||to.human;await flyBetween(from.human?handXY():seatXY(from.id),to.human?handXY():seatXY(to.id),give,face,Math.round(G.geo.pw*.7),90);
  toast(`📦 공물 — ${from.name} → ${to.name} (${n}장)${face?': '+give.map(c=>c.r).join(', '):''}`,1900);renderHand();updateSeats();await wait(650);
  let back;if(to.human){back=await askReturn(n,give);}else back=cpuReturn(to,n);to.hand=to.hand.filter(c=>!back.includes(c));back.forEach(c=>{c._new=from.human;from.hand.push(c);});sortHand(from.hand);
  await flyBetween(to.human?handXY():seatXY(to.id),from.human?handXY():seatXY(from.id),back,face,Math.round(G.geo.pw*.7),90);if(face)toast(`🤝 답례 — ${to.name} → ${from.name}: ${back.map(c=>c.r===13?'🎭':c.r).join(', ')}`,1900);renderHand();updateSeats();await wait(500);}}
function askReturn(n,got){return new Promise(res=>{if(AUTO){const b=me().hand.filter(c=>c.r<13).sort((a,b)=>b.r-a.r).slice(0,n);setTimeout(()=>res(b),5);return;}
 const sel=new Set();const w=G.geo.por?Math.min(58,(innerWidth-70)/5):70;panel.innerHTML=`<h3>🤝 공물 답례</h3><p>공물을 받았습니다. 돌려줄 카드 <b>${n}장</b>을 고르세요. (아무 카드나 가능)</p><div class="pick" id="pk"></div><div class="mbtns"><button class="btn" id="rAuto">약한 카드로</button><button class="btn gold" id="rOk" disabled>돌려주기</button></div>`;
 const pk=panel.querySelector('#pk');const ok=panel.querySelector('#rOk');const draw=()=>{pk.innerHTML='';me().hand.forEach(c=>{const e=cardEl(c,w);if(got.includes(c))e.classList.add('got');if(sel.has(c))e.classList.add('sel');tap(e,()=>{if(sel.has(c))sel.delete(c);else if(sel.size<n)sel.add(c);else{sel.delete([...sel][0]);sel.add(c);}draw();});pk.appendChild(e);});ok.disabled=sel.size!==n;ok.textContent=`돌려주기 (${sel.size}/${n})`;};
 tap(panel.querySelector('#rAuto'),()=>{sel.clear();me().hand.filter(c=>c.r<13).sort((a,b)=>b.r-a.r).slice(0,n).forEach(c=>sel.add(c));draw();});tap(ok,()=>{if(sel.size!==n)return;closeModal();res([...sel]);});draw();modalEl.classList.add('show');});}
async function playTricks(){const P=G.players;G.trick=null;let turn=0,lastId=null,passes=0;G.finish=[];
 while(G.finish.length<NPL-1){const pid=G.order[turn],p=P[pid];if(p.out){turn=(turn+1)%NPL;continue;}setTurn(pid);updateSeats();
  let cs;if(p.human){cs=await humanTurn();}else{setStatus(`<b>${esc(p.name)}</b>의 차례…`);await wait(520+rnd()*420);G.st={turn,last:lastId==null?turn:G.order.indexOf(lastId),passes};cs=cpuDecide(p);}
  if(cs&&cs.length){const info=playInfo(cs,p.human&&!!G.deb.seal);if(!info||!canBeat(info,G.trick)){cs=null;}}
  if((!cs||!cs.length)&&!G.trick)cs=[p.hand[p.hand.length-1]];
  let force=false;
  if(cs&&cs.length){const info=playInfo(cs,false);p.hand=p.hand.filter(c=>!cs.includes(c));cs.forEach(c=>G.played[c.r]++);G.trick={rank:info.rank,count:info.count,by:pid};lastId=pid;passes=0;force=unbeatable(info);
   updateSeats();if(p.human)renderHand();await showPlay(pid,cs);markLast(pid);lapLabel(lastId,passes);if(!p.human)bubble(pid,info.rank===13?`🎭×${info.count}`:`${info.rank}×${info.count}`);
   if(!p.hand.length){p.out=G.finish.length+1;G.finish.push(pid);updateSeats();SND.chime();const tt=titleOf(p.out)[1];bubble(pid,`${p.out}위 · ${tt}`,'',2200);if(p.human){G.meOut=true;banner(`${p.out}위!`,`다음 판 서열: ${titleOf(p.out)[0]} ${tt}`);renderHand();}else if(p.out===1)toast(`👑 ${p.name}이(가) 가장 먼저 패를 비웠다!`);await wait(700);}
   await wait(380);}
  else{passes++;bubble(pid,'패스','pass');SND.pass();lapLabel(lastId,passes);await wait(260);}
  if(G.finish.length>=NPL-1)break;
  const active=G.order.filter(id=>!P[id].out).length,lastA=!P[lastId].out,need=active-(lastA?1:0);
  if(G.trick&&(force||passes>=need)){if(force){toast(`⚡ 더 높은 패가 남아 있지 않음 — ${lastA?P[lastId].name+'이(가) 바로 선':'다음 사람이 선'}`,1700);await wait(900);}await wait(300);markLast(null);await clearTrick(lastId);G.trick=null;passes=0;let idx=G.order.indexOf(lastId);if(!lastA){do{idx=(idx+1)%NPL;}while(P[G.order[idx]].out);}turn=idx;const nl=P[G.order[idx]];bubble(nl.id,'선(先)!','',1100);continue;}
  turn=(turn+1)%NPL;}
 const last=G.order.find(id=>!P[id].out);P[last].out=NPL;G.finish.push(last);setTurn(null);markLast(null);updateSeats();await wait(500);clearPile();}
async function playRound(){G.round++;G.played=new Array(14).fill(0);G.meOut=false;hud();clearPile();G.players.forEach(p=>{p.hand=[];p.out=0;});updateSeats();renderHand();
 banner(`제 ${G.round}판`,G.round===ROUNDS?'마지막 연회':G.round===1?'맹약의 연회가 열린다':'');await wait(1300);
 if(G.round===1)await seatDraw();else G.order=G.finish.slice();G.showTitles=true;layoutSeats();updateSeats();await wait(900);
 const deck=shuffle(makeDeck());deck.forEach((c,i)=>G.players[G.order[i%NPL]].hand.push(c));G.players.forEach(p=>sortHand(p.hand));await dealAnim();me().hand.forEach(c=>c._new=1);renderHand();updateSeats();await wait(400);
 const rv=await revolution();if(rv===2){G.order.reverse();layoutSeats();updateSeats();await wait(1000);}
 if(rv===0)await tribute();
 const lead=G.players[G.order[0]];toast(`👑 대영주 ${lead.name}이(가) 첫 선을 잡습니다`);await wait(700);
 await playTricks();
 G.finish.forEach((id,i)=>G.players[id].hist.push(i+1));hud();await roundResult();}
async function roundResult(){const P=G.players;const rows=G.finish.map(id=>{const p=P[id],cb=calcBase(p.hist);return{p,pos:p.out,pts:cb.per[cb.per.length-1],tot:cb.base};});
 const last=G.round===ROUNDS;if(G.finish[0]===0){SND.fan();confetti(80);}
 const html=`<h3>제 ${G.round}판 결과</h3><table><tr><th>순위</th><th>이름</th><th>이번 판</th><th>누적</th><th>다음 신분</th></tr>${rows.map(r=>`<tr class="${r.p.human?'me':''}"><td>${r.pos}</td><td>${esc(r.p.name)}</td><td>+${r.pts}</td><td>${r.tot}</td><td>${last?'-':titleOf(r.pos).join(' ')}</td></tr>`).join('')}</table>`;
 await modal(html,[{t:last?'🏆 최종 결과':'🕯️ 다음 판',v:1,gold:1}]);}
async function finalResult(){const P=G.players,m=me(),cb=calcBase(m.hist);const score=Math.round(cb.base*G.mult/100);const secs=Math.round((Date.now()-G.t0)/1000);
 const totals=P.map(p=>({p,t:calcBase(p.hist).base})).sort((a,b)=>b.t-a.t);const f=1+P.filter(p=>!p.human&&calcBase(p.hist).base>cb.base).length;
 const debs=DEB.filter((d,i)=>G.mask&(1<<i)).map(d=>d.ic+d.name);const tm=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
 const rec={v:1,n:m.name,s:score,b:cb.base,m:G.mult,l:G.lvl,d:G.mask,p:m.hist.join(''),f,t:secs,k:cb.kings,x:cb.maxS,ts:Date.now()};const code=encodeRec(rec);
 const txt=`🎭 로웬 달무티 · 맹약의 서열전\n👤 이름: ${m.name}\n🏆 최종 점수: ${score}점\n🧮 기본 ${cb.base}점 × 배율 ${(G.mult/100).toFixed(2)}\n🏰 상대 궁정: ${LV[G.lvl].name}\n🌑 디버프: ${debs.length?debs.join(', '):'없음'}\n📜 서열 기록: ${m.hist.join('→')} (${ROUNDS}판)\n👑 대영주 ${cb.kings}회 · 최다 연속 ${cb.maxS}회\n🥇 최종 순위: ${NPL}명 중 ${f}위\n⏱️ 플레이 시간: ${tm}\n🔐 검증코드: ${code}`;
 const best=+(store.get('rdm_best')||0);if(score>best)store.set('rdm_best',String(score));window.__RDM={rec,code,txt,score};if(f===1){SND.fan();confetti(140);}
 const html=`<h3>🏆 연회 종료 — 최종 ${f}위</h3><p style="text-align:center;font-size:15px">최종 점수 <b style="font-size:24px;color:#ffd27a">${score}</b>점${score>best?' <span style="color:#9fe3d8">· 최고 기록!</span>':''}</p>
<table><tr><th>순위</th><th>이름</th><th>서열 기록</th><th>합계</th></tr>${totals.map((r,i)=>`<tr class="${r.p.human?'me':''}"><td>${i+1}</td><td>${esc(r.p.name)}</td><td>${r.p.hist.join('·')}</td><td>${r.t}</td></tr>`).join('')}</table>
<p style="margin-top:12px">블로그 댓글에 붙여넣을 기록이에요.</p><textarea class="rec" id="recT" readonly>${esc(txt)}</textarea><div style="text-align:center"><a class="vlink" href="${VERIFY_URL}" target="_blank" rel="noopener">🔍 점수검증기 열기</a></div>`;
 const v=await modal(html,[{t:'📋 기록 복사',v:'copy',gold:1,fn:()=>{copyText(txt);return false;}},{t:'🔁 다시 하기',v:'again'},{t:'🏠 처음으로',v:'home'}],'home');
 if(v==='again')startGame();else showTitle();}
function copyText(t){const done=()=>toast('📋 기록을 복사했어요 — 블로그 댓글에 붙여넣기!');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();function fallback(){const ta=$('#recT')||document.createElement('textarea');if(!ta.parentNode){ta.value=t;document.body.appendChild(ta);}ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,99999);try{document.execCommand('copy');done();}catch(e){toast('복사 실패 — 기록을 길게 눌러 복사해 주세요');}ta.setAttribute('readonly','');}}

/* ---------- game start ---------- */
async function startGame(){G.tok++;closeModal();UI.active=false;UI.sel.clear();G.humanRes=null;clearInterval(G.timerI);$('#timer').style.display='none';$('#title').style.display='none';flyEl.innerHTML='';clearPile();
 const name=($('#nameIn').value||'').trim()||'이름 없는 귀족';store.set('rdm_name',name);store.set('rdm_lvl',String(G.lvl));store.set('rdm_mask',String(G.mask));
 G.deb={};DEB.forEach((d,i)=>{if(G.mask&(1<<i))G.deb[d.k]=1;});G.mult=calcMult(G.lvl,G.mask);G.round=0;G.t0=Date.now();G.meOut=false;G.showTitles=false;
 const names=['카엘','브리엔','오스릭','세라핀','모르탄','리세나','이졸데'];G.players=[{id:0,name,human:true,av:renderAvatar(AVS[0]),hist:[],hand:[]}];names.forEach((n,i)=>G.players.push({id:i+1,name:n,human:false,av:renderAvatar(AVS[i+1]),hist:[],hand:[]}));
 G.order=G.players.map(p=>p.id);buildSeats();layout();updateSeats();hud();setStatus('맹약의 연회장에 들어섭니다…');
 try{for(let r=0;r<ROUNDS;r++){await playRound();}await finalResult();}catch(e){if(e!==CANCEL)console.error(e);}}

/* ---------- title ---------- */
function buildTitle(){const fan=$('#tFan');fan.innerHTML='';const show=[12,6,1,13,3];const w=Math.min(96,innerWidth*.2);show.forEach((r,i)=>{const e=cardEl({r},w);const off=(i-2);e.style.left=`calc(50% - ${w/2}px + ${off*w*.62}px)`;e.style.top=(10+Math.abs(off)*8)+'px';e.style.transform=`rotate(${off*9}deg)`;e.style.zIndex=10-Math.abs(off);fan.appendChild(e);});
 const lv=$('#lvls');lv.innerHTML='';for(let l=1;l<=4;l++){const b=document.createElement('button');b.className='lv'+(G.lvl===l?' on':'');b.innerHTML=`<b>${LV[l].name} <em>×${(LV[l].m/100).toFixed(1)}</em></b><span>${LV[l].desc}</span>`;tap(b,()=>{G.lvl=l;buildTitle();});lv.appendChild(b);}
 const db=$('#debs');db.innerHTML='';DEB.forEach((d,i)=>{const b=document.createElement('button');b.className='db'+(G.mask&(1<<i)?' on':'');b.innerHTML=`<span class="ic">${d.ic}</span><span class="tx"><b>${d.name}</b>${d.desc}</span><span class="pl">+${(d.add/100).toFixed(2)}</span>`;tap(b,()=>{G.mask^=(1<<i);buildTitle();});db.appendChild(b);});
 $('#multi').innerHTML=`최종 배율 <b>×${(calcMult(G.lvl,G.mask)/100).toFixed(2)}</b>`;const best=store.get('rdm_best');$('#best').textContent=best?`🏅 이 기기 최고 기록 ${best}점`:'';}
function showTitle(){G.tok++;closeModal();clearPile();flyEl.innerHTML='';setTurn(null);UI.active=false;$('#title').style.display='block';buildTitle();}

/* ---------- buttons ---------- */
const bSnd=$('#bSnd'),bSpd=$('#bSpd');bSnd.textContent=muted?'🔇':'🔊';
tap(bSnd,()=>{muted=!muted;store.set('rdm_mute',muted?'1':'0');bSnd.textContent=muted?'🔇':'🔊';if(!muted){ac();SND.tick();}});
tap(bSpd,()=>{G.speed=G.speed===1?2:G.speed===2?3:1;bSpd.textContent=G.speed+'×';});
tap($('#bHelp'),()=>{if(modalEl.classList.contains('show'))return;const prev=panel.innerHTML;modal(rulesHTML(),[{t:'닫기',v:1,gold:1}]);});
tap($('#bMenu'),()=>{if(modalEl.classList.contains('show'))return;modal('<h3>☰ 메뉴</h3><p style="text-align:center">진행 중인 연회를 그만두시겠어요?</p>',[{t:'계속하기',v:0,gold:1},{t:'🔁 새로 시작',v:1},{t:'🏠 처음 화면',v:2}]).then(v=>{if(v===1)startGame();else if(v===2)showTitle();});});
tap($('#bRules'),()=>{modal(rulesHTML(),[{t:'닫기',v:1,gold:1}]);});
tap($('#bStart'),()=>{ac();startGame();});
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{layout();if($('#title').style.display!=='none')buildTitle();},120);});

/* ---------- boot ---------- */
initArt();$('#nameIn').value=store.get('rdm_name')||'';G.lvl=+(store.get('rdm_lvl')||2)||2;G.mask=+(store.get('rdm_mask')||0)||0;
G.players=null;G.order=[0,1,2,3,4,5,6,7];G.mult=calcMult(G.lvl,G.mask);layout();buildTitle();fxLoop();
if(location.hash.indexOf('cardsheet')>=0){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99;background:#111;display:flex;flex-wrap:wrap;gap:10px;padding:10px;overflow:auto;align-content:flex-start';for(let r=1;r<=13;r++){const e=cardEl({r},150);e.style.position='relative';d.appendChild(e);}AVS.forEach(o=>{const i=new Image();i.src=renderAvatar(o);i.style.cssText='width:80px;height:80px;image-rendering:pixelated;border-radius:50%';d.appendChild(i);});document.body.appendChild(d);}
if(AUTO){const m=location.hash.match(/lvl(\d)/);if(m)G.lvl=+m[1];const d=location.hash.match(/mask(\d+)/);if(d)G.mask=+d[1];setTimeout(startGame,50);}
})();
</script>
