<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>폰에서 왕까지 · Royal Merge 2048</title>
<!-- Pretendard (SIL Open Font License 1.1) https://github.com/orioncactus/pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--ink:#2f2a26;--wood:#4f6e8c;--wood-d:#334a60;--parch:#fbf3e1;--gold:#f3c95a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,'Malgun Gothic',sans-serif;font-weight:500;letter-spacing:-0.01em;color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 55%,#5cc3b8 0%,rgba(92,195,184,0) 60%),linear-gradient(160deg,#2a8f9f 0%,#3aa8ac 50%,#78c9ae 100%)}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.title{font-size:24px;color:#fff;line-height:1;text-shadow:0 2px 0 #1f5f68,2px 0 0 #1f5f68,-2px 0 0 #1f5f68,0 -2px 0 #1f5f68,0 4px 8px rgba(0,0,0,.2)}
.title small{display:block;font-size:12px;margin-top:3px;letter-spacing:.5px}
.scores{display:flex;gap:6px}
.sbox{background:var(--wood);color:#fff;border:2px solid var(--wood-d);border-radius:10px;padding:3px 9px 4px;text-align:center;min-width:62px;box-shadow:0 3px 0 var(--wood-d)}
.sbox b{display:block;font-size:11px;color:#f6e3b4;font-weight:normal}
.sbox span{font-size:19px;line-height:1.1}
.sbox.top{display:flex;align-items:center;gap:4px;min-width:auto;padding:2px 8px 2px 4px}
.sbox.top img{width:34px;height:34px}
.sbox.top div{text-align:left}
.btns{display:flex;gap:6px;width:100%;justify-content:center}
.btn{background:#fbf3e1;color:var(--ink);border:2px solid var(--wood-d);border-radius:10px;padding:5px 11px;font-family:inherit;font-size:15px;box-shadow:0 3px 0 var(--wood-d);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn.primary{background:var(--gold)}
#hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#eafaf6;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.float{position:fixed;pointer-events:none;font-size:24px;color:#fff;z-index:6;white-space:nowrap;
  text-shadow:0 2px 0 #3e2612,2px 0 0 #3e2612,-2px 0 0 #3e2612,0 -2px 0 #3e2612;animation:up .95s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.combo{position:fixed;left:50%;top:44%;pointer-events:none;z-index:7;font-size:46px;color:#ffe066;white-space:nowrap;
  text-shadow:0 3px 0 #8a2b0e,3px 0 0 #8a2b0e,-3px 0 0 #8a2b0e,0 -3px 0 #8a2b0e,0 6px 12px rgba(0,0,0,.35);animation:combo .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(.9) rotate(-4deg)}}
#unlock{position:fixed;left:50%;top:118px;transform:translate(-50%,-30px);opacity:0;z-index:8;pointer-events:none;
  background:var(--parch);border:3px solid var(--wood);border-radius:14px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 var(--wood-d);transition:all .35s cubic-bezier(.2,1.5,.4,1)}
#unlock.show{opacity:1;transform:translate(-50%,0)}
#unlock img{width:56px;height:56px}
#unlock b{display:block;font-size:12px;color:#4f6e8c;font-weight:normal}
#unlock span{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(10,40,45,.55);display:none;align-items:center;justify-content:center;z-index:20}
.modal.open{display:flex}
.card{background:var(--parch);border:3px solid var(--wood);border-radius:16px;box-shadow:0 8px 0 var(--wood-d);padding:16px 18px;width:min(92vw,380px);max-height:86vh;overflow:auto;text-align:center}
.card h2{margin:0 0 8px;font-weight:normal;font-size:24px}
.card p{margin:6px 0}
.big{font-size:34px;color:#4f6e8c}
.card input{font-family:inherit;font-size:18px;padding:7px 10px;border:2px solid var(--wood);border-radius:10px;width:100%;margin:8px 0;background:#fff;text-align:center;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:5px 4px;border-bottom:1px dashed #d8ccb0;font-weight:normal}
th{color:#4f6e8c;font-size:13px}
td img{width:28px;height:28px;vertical-align:middle}
tr.me{background:#ffe9a8}
.codex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.codex div{background:#fff8e6;border:2px solid #e2c99a;border-radius:10px;padding:4px 2px;font-size:13px}
.codex img{width:72px;height:72px;display:block;margin:0 auto}
.codex .lock img{filter:brightness(0) opacity(.3)}
.codex small{display:block;color:#4f6e8c}
.muted{color:#8a6a4a;font-size:13px}
.title{font-weight:800;letter-spacing:-0.02em}
.title small{font-weight:600;letter-spacing:.06em}
.sbox span{font-weight:800}
.btn,.tab,.diffs button{font-weight:700}
.card h2{font-weight:800!important}
.big{font-weight:800}
.float,.combo{font-weight:900}
#unlock span,#chain{font-weight:700}
#cCopyMsg,#sCopyMsg{margin-top:6px;min-height:1em}
.copyline{margin-top:6px;padding:6px 8px;background:#fff;border:1px dashed var(--wood);border-radius:8px;font-size:12px;color:var(--ink);word-break:break-all;user-select:text;-webkit-user-select:text}
.copybox{width:100%;height:88px;font-family:inherit;font-size:14px;margin-top:6px;border:2px solid var(--wood);border-radius:8px;padding:6px;resize:none;user-select:text;-webkit-user-select:text}
.btns{flex-wrap:wrap}
@media (max-width:699px){.btn{padding:5px 8px;font-size:14px}}
#chain{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) scale(.8);opacity:0;background:#fff3d6;border:2px solid #c0582b;color:#c0582b;border-radius:20px;padding:4px 14px;font-size:16px;white-space:nowrap;transition:opacity .2s,transform .2s;pointer-events:none;z-index:6;box-shadow:0 3px 0 #8a3a18}
#chain.show{opacity:1;transform:translateX(-50%) scale(1)}
#chain.pop{animation:cpop .35s}
@keyframes cpop{0%{transform:translateX(-50%) scale(1.35)}100%{transform:translateX(-50%) scale(1)}}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diffs button{font-family:inherit;background:#fff8e6;border:2px solid #e2c99a;border-radius:12px;padding:8px 6px 10px;cursor:pointer;font-size:19px;color:var(--ink)}
.diffs button.on{border-color:var(--wood);background:#e6f0f7;box-shadow:0 3px 0 var(--wood-d)}
.diffs small{display:block;font-size:12px;color:#4f6e8c}
.mini{display:grid;gap:2px;width:58px;height:58px;margin:4px auto 6px}
.mini i{background:#a6c443;border-radius:2px}
.mini i.rock{background:#8d8d8d}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tab{font-family:inherit;font-size:14px;padding:4px 10px;border-radius:10px;border:2px solid #d8ccb0;background:#fff8e6;cursor:pointer;color:var(--ink)}
.tab.on{border-color:var(--wood);background:var(--wood);color:#fff}
@media (min-width:700px){
  #hud{padding:16px 22px 0;gap:12px}
  .title{font-size:34px}
  .title small{font-size:15px}
  .scores{gap:10px}
  .sbox{min-width:100px;padding:6px 16px 8px;border-width:3px;border-radius:14px;box-shadow:0 4px 0 var(--wood-d)}
  .sbox b{font-size:15px}
  .sbox span{font-size:30px}
  .sbox.top{padding:4px 16px 4px 6px;gap:6px}
  .sbox.top img{width:56px;height:56px}
  #topName{font-size:22px!important}
  .btns{gap:12px;margin-top:2px}
  .btn{font-size:21px;padding:9px 22px;border-width:3px;border-radius:14px;box-shadow:0 4px 0 var(--wood-d)}
  .btn:active{box-shadow:0 1px 0 var(--wood-d)}
  #hint{font-size:16px}
  #unlock{top:180px}
  #chain{font-size:20px;bottom:46px;padding:6px 18px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="title">폰에서 왕까지<small id="sub">ROYAL MERGE 2048</small></div>
  <div class="scores">
    <div class="sbox top"><img id="topImg" alt=""><div><b>최고 병종</b><span id="topName" style="font-size:15px">견습병</span></div></div>
    <div class="sbox"><b>점수</b><span id="score">0</span></div>
    <div class="sbox"><b>최고</b><span id="best">0</span></div>
  </div>
  <div class="btns">
    <button class="btn" id="bDiff">🎚️ 고수</button>
    <button class="btn" id="bNew">⚔️ 새 게임</button>
    <button class="btn" id="bRank">🏆 기록</button>
    <button class="btn" id="bCodex">📖 도감</button>
    <button class="btn" id="bMute">🔊</button>
  </div>
</div>
<div id="chain"></div>
<div id="hint">← ↑ → ↓ / WASD 또는 스와이프로 부대를 움직이세요</div>
<div id="unlock"><img id="unImg" alt=""><div><b id="unSub">새로운 병종 합류!</b><span id="unName"></span></div></div>

<div class="modal" id="mSave"><div class="card">
  <h2 id="saveTitle">전투 종료</h2>
  <p class="big" id="saveScore">0</p>
  <p class="muted" id="saveUnit"></p>
  <input id="nameIn" maxlength="12" placeholder="이름을 입력하세요">
  <div class="row">
    <button class="btn primary" id="sSave">🏆 기록 저장</button>
    <button class="btn" id="sSkip">저장 없이 새 게임</button>
    <button class="btn" id="sCancel">계속 하기</button>
  </div>
  <div class="row"><button class="btn" id="sCopy">📋 기록 복사 (댓글용)</button></div>
  <div class="muted" id="sCopyMsg"></div>
</div></div>

<div class="modal" id="mClear"><div class="card">
  <h2>🎉 클리어했습니다!</h2>
  <img id="clearImg" alt="" style="width:110px;height:110px">
  <p class="muted">왕이 즉위했습니다 · <span id="clearDiff"></span></p>
  <p class="big" id="clearScore">0</p>
  <input id="clearName" maxlength="12" placeholder="이름을 입력하세요">
  <div class="row">
    <button class="btn primary" id="cSave">🏆 점수 기록하고 나가기</button>
    <button class="btn" id="cInf">♾️ 무한모드 이어하기</button>
  </div>
  <div class="row"><button class="btn" id="cCopy">📋 기록 복사 (댓글용)</button></div>
  <div class="muted" id="cCopyMsg"></div>
  <p class="muted" id="cInfNote">무한모드는 판이 막힐 때까지 계속돼요. 끝나면 그때 기록할 수 있어요.</p>
</div></div>

<div class="modal" id="mDiff"><div class="card">
  <h2>🎚️ 난이도 선택</h2>
  <div class="diffs" id="diffGrid"></div>
  <p class="muted">난이도마다 진행 상황과 기록이 따로 저장돼요.</p>
  <div class="row"><button class="btn" data-close>닫기</button></div>
</div></div>

<div class="modal" id="mRank"><div class="card">
  <h2>🏆 명예의 전당</h2>
  <div class="tabs" id="rankTabs"></div>
  <table><thead><tr><th>#</th><th>이름</th><th>병종</th><th>점수</th><th>최대콤보</th><th>날짜</th></tr></thead><tbody id="rankBody"></tbody></table>
  <p class="muted">기록은 이 브라우저에만 저장돼요.<br>방문 기록 삭제, 시크릿 모드, 다른 기기에서는 보이지 않아요.</p>
  <div class="row"><button class="btn primary" data-close>닫기</button></div>
</div></div>

<div class="modal" id="mCodex"><div class="card">
  <h2>📖 병종 도감</h2>
  <div class="codex" id="codexGrid"></div>
  <div class="row"><button class="btn primary" data-close>닫기</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ---------- 저장소 (localStorage, 실패 시 메모리) ---------- */
const NS = 'miloArcade.royalMerge.';
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- 병종 데이터 ---------- */
const UNITS = [
  { n: '견습병', e: 'Recruit' },   { n: '창병', e: 'Spearman' },  { n: '궁수', e: 'Archer' },
  { n: '검사', e: 'Swordsman' },   { n: '기사', e: 'Knight' },    { n: '성직자', e: 'Cleric' },
  { n: '마법사', e: 'Mage' },      { n: '성채', e: 'Fortress' },  { n: '성기사', e: 'Paladin' },
  { n: '여왕', e: 'Queen' },       { n: '왕', e: 'King' },        { n: '황제', e: 'Emperor' }
];
const PL = [0x8d6e63, 0x78909c, 0x558b2f, 0x9e9e9e, 0x3949ab, 0xd7d2c4, 0x5e35b1, 0x616161, 0xffb300, 0xd81b60, 0xffca28, 0x263238];
const uIdx = lv => Math.min(lv, 12) - 1;
const unitOf = lv => UNITS[uIdx(lv)];

/* ---------- 렌더러 / 씬 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const TILT = 54 * Math.PI / 180;
const CAM_BASE = new THREE.Vector3(0, Math.sin(TILT), Math.cos(TILT)).multiplyScalar(40);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x3f7f7a, 0.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 0.62);
sun.position.set(-5, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4.5, right: 4.5, top: 4.5, bottom: -4.5, near: 1, far: 30 });
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ---------- 재질 / 도형 헬퍼 (툰 셰이딩 + 외곽선) ---------- */
const gTex = new THREE.DataTexture(new Uint8Array([150, 150, 150, 255, 210, 210, 210, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
gTex.minFilter = gTex.magFilter = THREE.NearestFilter; gTex.needsUpdate = true;
const toonC = {}, glowC = {};
const toon = c => toonC[c] || (toonC[c] = new THREE.MeshToonMaterial({ color: new THREE.Color(c).offsetHSL(0, -0.1, 0.02), gradientMap: gTex }));
const glowM = c => glowC[c] || (glowC[c] = new THREE.MeshBasicMaterial({ color: c }));
const OUT = new THREE.MeshBasicMaterial({ color: 0x4a3528, side: THREE.BackSide });
const Cyl = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);
const Cone = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
const Sph = (r, w = 10, h = 8) => new THREE.SphereGeometry(r, w, h);
const Hemi = r => new THREE.SphereGeometry(r, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2);
const Box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
// o: 1 = 툰+외곽선, 0 = 툰만, 2 = 발광
function mk(p, geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, o = 1) {
  const m = new THREE.Mesh(geo, o === 2 ? glowM(color) : toon(color));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  if (o !== 2) m.castShadow = true;
  if (o === 1) { const ol = new THREE.Mesh(geo, OUT); ol.scale.setScalar(1.045); m.add(ol); }
  p.add(m); return m;
}
const SKIN = 0xf1c27d;
function head(g, x, y, r = 0.14) {
  mk(g, Sph(r), SKIN, x, y, 0);
  const e = Box(0.028, 0.05, 0.02);
  mk(g, e, 0x1a1a1a, x - 0.05, y + 0.005, r * 0.92, 0, 0, 0, 0);
  mk(g, e, 0x1a1a1a, x + 0.05, y + 0.005, r * 0.92, 0, 0, 0, 0);
}
const hand = (g, x, y, z) => mk(g, Sph(0.05, 6, 5), SKIN, x, y, z);

/* ---------- 병종 모델 (사람 비율: 팔·다리·어깨·머리) ---------- */
const UPV = new THREE.Vector3(0, 1, 0);
function seg(g, a, b, r1, r2, color, o = 1) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = mk(g, Cyl(r2, r1, d.length(), 7), color, 0, 0, 0, 0, 0, 0, o);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UPV, d.normalize());
  return m;
}
const POSE = {
  down:   sx => [[sx * 0.17, 0.6, 0], [sx * 0.18, 0.46, 0.03]],
  hold:   sx => [[sx * 0.19, 0.6, 0.02], [sx * 0.21, 0.55, 0.13]],
  raise:  sx => [[sx * 0.22, 0.78, 0.04], [sx * 0.25, 0.92, 0.1]],
  out:    sx => [[sx * 0.27, 0.72, 0.04], [sx * 0.37, 0.7, 0.08]],
  shield: sx => [[sx * 0.2, 0.6, 0.06], [sx * 0.17, 0.6, 0.15]],
  cast:   sx => [[sx * 0.23, 0.7, 0.08], [sx * 0.25, 0.83, 0.15]]
};
function human(g, o) {
  const robeR = o.robeR || 0.23;
  if (o.robe) {
    mk(g, Cyl(0.12, robeR, 0.5, 10), o.robe, 0, 0.25, 0);
    if (o.trim) mk(g, Cyl(robeR + 0.006, robeR + 0.006, 0.035, 10), o.trim, 0, 0.02, 0);
  } else {
    for (const sx of [-1, 1]) {
      seg(g, [sx * 0.06, 0.07, 0], [sx * 0.065, 0.43, 0], 0.036, 0.048, o.pants);
      mk(g, Box(0.085, 0.08, 0.13), o.boots || 0x5d4037, sx * 0.06, 0.04, 0.02);
    }
  }
  mk(g, Cyl(0.105, 0.1, 0.1, 8), o.robe || o.pants, 0, 0.45, 0);
  mk(g, Cyl(0.13, 0.1, 0.3, 8), o.shirt, 0, 0.62, 0).scale.z = 0.75;
  if (o.armor) mk(g, Cyl(0.138, 0.112, 0.2, 8), o.armor, 0, 0.67, 0).scale.z = 0.8;
  if (o.tabard) mk(g, Box(o.tabardW || 0.15, 0.32, 0.02), o.tabard, 0, 0.52, 0.095, -0.06);
  mk(g, Cyl(0.107, 0.107, 0.035, 8), o.belt || 0x4e342e, 0, 0.48, 0);
  if (o.cape) mk(g, Box(0.3, o.robe ? 0.66 : 0.6, 0.025), o.cape, 0, o.robe ? 0.42 : 0.46, -0.115, 0.1);
  mk(g, Cyl(0.035, 0.04, 0.06, 6), o.skin || SKIN, 0, 0.79, 0, 0, 0, 0, 0);

const RM_KEY = "rm-0BUv3o2c_URi-St009U-u8BhW73uUsok"; // 폰에서 왕까지 전용 서명키 (진위검사기와 동일)
const B32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function rmCode(payload) { // HMAC-SHA256 앞 60비트 → 12자 → RM1-XXXX-XXXX-XXXX
  const h = SIG.hmac(SIG.enc(RM_KEY), SIG.enc(payload));
  let bits = ''; for (let i = 0; i < 8; i++) bits += h[i].toString(2).padStart(8, '0');

function updateChain(pop) {
  const el = $('chain');

    el.classList.add('show');
    if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  } else el.classList.remove('show');
}
function clearBoard() {
  if (grid) each(t => disposeTile(t));
  rockMeshes.forEach(g => { scene.remove(g); g.traverse(o => o.geometry && o.geometry.dispose()); });
  rockMeshes = []; grid = empty();
}
function newGame() {
  clearBoard(); score = 0; gameOver = false; savedThisGame = false; busy = false; queued = null;
  chain = 0; maxCombo = 0; cleared = false; infinite = false; playSecs = 0;
  for (let i = 0; i < DIFFS[diff].rocks; i++) { const cs = emptyCells(); const [r, c] = cs[Math.floor(Math.random() * cs.length)]; placeRock(r, c); }
  spawnRandom(); spawnRandom(); updateHud(); updateChain(); saveState();
}
function restore() {
  const s = store.get(K('state'), null);
  if (!s || !s.g || s.g.length !== N) return false;
  clearBoard(); let n = 0;
  s.g.forEach((row, r) => row.forEach((lv, c) => { if (lv === -1) placeRock(r, c); else if (lv) { place(lv, r, c); n++; } }));
  if (!n) return false;
  score = s.score || 0; savedThisGame = !!s.saved; chain = s.chain || 0; maxCombo = s.maxCombo || chain; cleared = !!s.cleared; infinite = !!s.infinite; playSecs = s.playSecs || 0;
  gameOver = false; updateHud(); updateChain();

}
function switchDiff(d) {
  closeM('mDiff');
  if (d === diff) return;
  if (busy) { setTimeout(() => switchDiff(d), 120); return; }
  clearBoard();
  diff = d; store.set(NS + 'diff', d); N = DIFFS[d].size;
  best = store.get(K('best'), 0);
  buildBoard(); resize();

}

/* ---------- 이동 ---------- */
const DIRS = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };
function move(dir) {
  if (anyModal() || gameOver) return;
  if (busy) { queued = dir; return; }
  const [dr, dc] = DIRS[dir];
  const rows = range(N), cols = range(N);
  if (dr === 1) rows.reverse(); if (dc === 1) cols.reverse();
  const slides = [], merges = [], mergedAt = new Set();
  for (const r of rows) for (const c of cols) {
    const t = grid[r][c]; if (!t || t.rock) continue;
    let pr = r, pc = c, nr = r + dr, nc = c + dc;
    while (inB(nr, nc) && !grid[nr][nc]) { pr = nr; pc = nc; nr += dr; nc += dc; }
    const nx = inB(nr, nc) ? grid[nr][nc] : null;
    if (nx && !nx.rock && nx.level === t.level && !mergedAt.has(nr * N + nc)) {
      grid[r][c] = null;
      const ph = { pending: true, level: t.level + 1, r: nr, c: nc, from: [t, nx] };
      grid[nr][nc] = ph; mergedAt.add(nr * N + nc);
      slides.push({ t, r: nr, c: nc, merge: true }); merges.push(ph);
    } else if (pr !== r || pc !== c) {
      grid[r][c] = null; grid[pr][pc] = t; t.r = pr; t.c = pc;
      slides.push({ t, r: pr, c: pc });
    }
  }
  lastMoveAt = performance.now();
  if (!slides.length) { shake(0.035); sfxBump(); return; }
  busy = true; sfxSlide();
  const lean = 0.38;
  for (const s of slides) { s.from = s.t.grp.position.clone(); s.to = cellPos(s.r, s.c); }
  tween(120, k => {
    for (const s of slides) {
      s.t.grp.position.x = s.from.x + (s.to.x - s.from.x) * k;
      s.t.grp.position.z = s.from.z + (s.to.z - s.from.z) * k;
      const l = lean * Math.sin(Math.min(1, k * 1.6) * Math.PI / 2);
      s.t.body.rotation.z = -dc * l; s.t.body.rotation.x = dr * l;
    }
  }, () => afterSlide(slides, merges, dr, dc), eOutCubic);
}
function afterSlide(slides, merges, dr, dc) {
  for (const s of slides) {
    if (s.merge) continue;
    const t = s.t;
    tween(300, k => { const w = 0.38 * Math.cos(k * Math.PI * 3) * (1 - k); t.body.rotation.x = dr * w; t.body.rotation.z = -dc * w; });
    squash(t, 0.88, 200);
  }
  const combo = merges.length;
  // 콤보: 합체가 일어난 이동마다 그 합체 개수만큼 누적, 합체 없는 이동이면 0으로 초기화
  // 점수 = 합친 값 × (1 + 0.05×(콤보-1)), 최대 ×3
  if (combo) { chain += combo; maxCombo = Math.max(maxCombo, chain); } else chain = 0;
  const mult = combo ? chainMult() : 1;
  let gained = 0, top = 0, justCleared = false;
  for (const ph of merges) {
    disposeTile(ph.from[0]); disposeTile(ph.from[1]);
    const t = place(ph.level, ph.r, ph.c);
    const pts = Math.round(Math.pow(2, ph.level) * mult);
    gained += pts; top = Math.max(top, ph.level);
    impact(t, combo, pts);
  }
  if (combo) {
    score += gained;
    hitStop = Math.min(0.12, 0.045 + top * 0.006) * (combo > 1 ? 1.25 : 1);
    shake((0.05 + top * 0.012) * (combo > 1 ? 1.4 : 1));
    if (navigator.vibrate) try { navigator.vibrate(14 + top * 3); } catch (e) {}
    if (combo >= 2) showCombo(`+${combo} · ${chain} COMBO!`);
    else if (chain >= 10 && chain % 10 === 0) showCombo(`${chain} COMBO!`);
    if (top > unlocked) { unlocked = top; store.set(NS + 'unlocked', unlocked); setTimeout(() => showUnlock(top), 180); }
    if (top >= 11 && !cleared) { cleared = true; justCleared = true; }
  }
  updateHud(); updateChain(combo > 0);
  tween(80, () => {}, () => {
    spawnRandom(); updateHud(); saveState(); busy = false;
    const stuck = !canMove();
    if (justCleared) {
      if (stuck) { gameOver = true; store.del(K('state')); }
      setTimeout(() => openClear(stuck), 1000);
      return;
    }
    if (stuck) { endGame(); return; }
    if (queued) { const q = queued; queued = null; move(q); }
  });
}
function impact(t, combo, pts) {
  const lv = t.level, col = PL[uIdx(lv)], pos = t.grp.position;
  t.grp.scale.setScalar(1.5);
  tween(420, k => t.grp.scale.setScalar(1.5 - 0.5 * k), null, eOutElastic);
  squash(t, 0.55, 420);
  shockwave(pos, col);
  burst(pos, col, Math.min(40, 12 + lv * 2 + combo * 3));
  floatText(pos, '+' + pts.toLocaleString());
  sfxMerge(lv, combo);
}

/* ---------- DOM 연출 ---------- */
const v3 = new THREE.Vector3();
function floatText(pos, txt) {
  v3.set(pos.x, 1.1, pos.z).project(camera);
  const d = document.createElement('div'); d.className = 'float'; d.textContent = txt;
  d.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function showCombo(txt) {

  document.body.appendChild(d); setTimeout(() => d.remove(), 950);
}
let unTimer;

  $('unSub').textContent = lv === 11 ? '👑 왕이 즉위했습니다!' : lv >= 12 ? '🌟 황제 강림!' : '새로운 병종 합류!';

}

/* ---------- 기록 / 모달 ---------- */
const anyModal = () => !!document.querySelector('.modal.open');
const openM = id => $(id).classList.add('open');
const closeM = id => $(id).classList.remove('open');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('open'));
function openSave(mode) {
  const m = maxOnBoard(), u = unitOf(m);
  $('saveTitle').textContent = mode === 'over' ? (infinite ? '♾️ 무한모드 종료' : '⚔️ 전투 종료') : '새 게임을 시작할까요?';
  $('saveScore').textContent = score.toLocaleString() + '점';

  $('saveUnit').append(img, ` 최고 병종: ${u.n} · ${DIFFS[diff].n} · 최대 콤보 ${maxCombo}`);

}
function openClear(stuck) {

  $('clearDiff').textContent = `${DIFFS[diff].n} · 최대 콤보 ${maxCombo}`;
  $('clearName').value = store.get('miloArcade.playerName', '');

  $('cInfNote').style.display = stuck ? 'none' : '';

// 댓글용 기록 (진위검사기: royal_merge_verify.html)
// 인증코드 = HMAC-SHA256(RM_KEY, "RM1|모드|난이도|이름|점수|최고병종|최대콤보|날짜")
function recordText(inputId, mode) {
  const name = ($(inputId).value || '').replace(/[|\n\r🔐]/g, '').trim().slice(0, 12) || '무명용사';
  const D = DIFFS[diff].n, unit = unitOf(maxOnBoard()).n, d = new Date();
  const date = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  const head = mode === 'clear' ? `👑 [폰에서 왕까지] ${D} 클리어!` : mode === 'inf' ? `♾️ [폰에서 왕까지] ${D} 무한모드 결과` : `⚔️ [폰에서 왕까지] ${D} 전투 기록`;
  const code = rmCode(`RM1|${mode}|${D}|${name}|${score}|${unit}|${maxCombo}|${date}`);
  return `${head}\n이름: ${name} | 점수: ${score.toLocaleString()}점 | 최고 병종: ${unit} | 최대 콤보: ${maxCombo}\n(${date})\n🔐 ${code}`;
}
async function copyRecord(inputId, mode, msgId) {
  const txt = recordText(inputId, mode), m = $(msgId);
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) {}

      const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch (e) {}
  }
  m.innerHTML = '';
  if (ok) { m.textContent = '✅ 인증코드가 담긴 기록이 복사됐어요! 블로그 댓글창에 붙여넣기(Ctrl+V) 하세요.'; const pv = document.createElement('div'); pv.className = 'copyline'; pv.textContent = txt; pv.style.whiteSpace = 'pre-line'; m.appendChild(pv); }
  else {

}
function saveScore(inputId, mode) {
  const name = ($(inputId).value || '').trim().slice(0, 12) || '무명용사';
  store.set('miloArcade.playerName', name);
  const list = store.get(K('scores'), []);
  const rec = { name, score, lv: maxOnBoard(), mc: maxCombo, m: mode, date: new Date().toISOString().slice(0, 10), t: Date.now() };
  list.push(rec); list.sort((a, b) => b.score - a.score);

}
function openRank(hi, d = diff) {

    b.onclick = () => openRank(hi, k); tabs.appendChild(b);
  });
  const list = store.get(NS + 'scores.' + d, []), tb = $('rankBody'); tb.innerHTML = '';
  if (!list.length) { const td = tb.insertRow().insertCell(); td.colSpan = 6; td.textContent = '아직 기록이 없어요. 첫 전설이 되어보세요!'; }
  list.forEach((r, i) => {

    tr.insertCell().textContent = i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1;
    tr.insertCell().textContent = (r.m === 'clear' ? '👑 ' : r.m === 'inf' ? '♾️ ' : '') + r.name;
    const ic = tr.insertCell(); const im = new Image(); im.src = thumb(r.lv || 1); im.title = unitOf(r.lv || 1).n; ic.appendChild(im);
    tr.insertCell().textContent = (r.score || 0).toLocaleString();
    tr.insertCell().textContent = r.mc != null ? r.mc : '-';
    tr.insertCell().textContent = (r.date || '').slice(5);

}
function openDiff() {
  const g = $('diffGrid'); g.innerHTML = '';
  DORDER.forEach(k => {
    const D = DIFFS[k], b = document.createElement('button');
    if (k === diff) b.className = 'on';
    const mini = document.createElement('div'); mini.className = 'mini';
    mini.style.gridTemplateColumns = `repeat(${D.size},1fr)`;
    for (let i = 0; i < D.size * D.size; i++) { const c = document.createElement('i'); if (D.rocks && i === 5) c.className = 'rock'; mini.appendChild(c); }
    const s = document.createElement('small'); s.textContent = D.desc;

  });

}
function openCodex() {
  const g = $('codexGrid'); g.innerHTML = '';
  UNITS.forEach((u, i) => {
    const lv = i + 1, d = document.createElement('div'), ok = lv <= unlocked;
    if (!ok) d.className = 'lock';
    const im = new Image(); im.src = thumb(lv); d.appendChild(im);
    d.append(ok ? u.n : '???');

}
function endGame() {
  gameOver = true; sfxOver(); store.del(K('state'));
  setTimeout(() => openSave('over'), 750);
}
$('sSave').onclick = () => { const t = saveScore('nameIn', infinite ? 'inf' : 'normal'); closeM('mSave'); newGame(); openRank(t); };
$('sSkip').onclick = () => { closeM('mSave'); newGame(); };
$('sCancel').onclick = () => closeM('mSave');
$('cCopy').onclick = () => copyRecord('clearName', 'clear', 'cCopyMsg');
$('sCopy').onclick = () => copyRecord('nameIn', infinite ? 'inf' : 'normal', 'sCopyMsg');
$('cSave').onclick = () => { const t = saveScore('clearName', 'clear'); closeM('mClear'); newGame(); openRank(t); };
$('cInf').onclick = () => { infinite = true; saveState(); updateHud(); closeM('mClear'); showCombo('♾️ 무한모드!'); };
$('bNew').onclick = () => { ac(); if (score > 0 && !gameOver) openSave('new'); else newGame(); };
$('bDiff').onclick = () => openDiff();
$('bRank').onclick = () => openRank();
$('bCodex').onclick = () => openCodex();
const setMuteIcon = () => $('bMute').textContent = muted ? '🔇' : '🔊';
$('bMute').onclick = () => { muted = !muted; store.set('miloArcade.muted', muted); setMuteIcon(); };
setMuteIcon();

/* ---------- 입력 ---------- */
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'TEXTAREA') return;
  if (e.target && e.target.tagName === 'INPUT') {
    if (e.key === 'Enter') {
      if (e.target.id === 'clearName') $('cSave').click();
      else if ($('sSave').style.display !== 'none') $('sSave').click();
    }
    return;
  }
  const d = KEYS[e.key]; if (!d) return;
  e.preventDefault(); ac(); move(d);
});
let sx = 0, sy = 0, sOn = false;
window.addEventListener('pointerdown', e => { if (e.target.closest('button,.modal,input')) return; sx = e.clientX; sy = e.clientY; sOn = true; ac(); });
window.addEventListener('pointerup', e => {
  if (!sOn) return; sOn = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
document.addEventListener('touchmove', e => { if (!e.target.closest('.modal')) e.preventDefault(); }, { passive: false });

/* ---------- 화면 크기 ---------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h);
  const asp = w / h, W0 = BW + 0.7, H0 = BW * 1.46;
  let vw, vh; if (asp > W0 / H0) { vh = H0; vw = H0 * asp; } else { vw = W0; vh = W0 / asp; }
  camera.left = -vw / 2; camera.right = vw / 2; const f = asp < 0.8 ? 0.56 : 0.54; camera.top = vh * f; camera.bottom = -vh * (1 - f);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------- 루프 ---------- */
let last = performance.now(), time = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let gdt = dt; if (hitStop > 0) { hitStop -= dt; gdt = 0; }
  if (!gameOver && !anyModal() && document.visibilityState === 'visible' && now - lastMoveAt < 20000) playSecs += dt;
  updateTweens(gdt * 1000); updateFx(gdt); time += gdt;
  each(t => {
    if (t.pending) return;
    t.fig.position.y = 0.025 * Math.sin(time * 2.4 + t.phase);
    for (const p of t.fig.userData.pulse) p.scale.setScalar(1 + 0.18 * Math.sin(time * 5 + t.phase));
    if (t.fig.userData.spin) t.fig.userData.spin.rotation.z += dt * 1.5;
  });
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 14) c.position.x = -14; }
  camera.position.copy(CAM_BASE);
  if (shakeAmp > 0.001) {
    camera.position.x += (Math.random() - 0.5) * 2 * shakeAmp;
    camera.position.y += (Math.random() - 0.5) * 2 * shakeAmp;
    shakeAmp *= Math.exp(-dt * 16);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (!restore()) newGame();
requestAnimationFrame(loop);
// 테스트/디버그용 훅
window.__rm = { move, get grid() { return grid; }, get score() { return score; }, get chain() { return chain; }, get maxCombo() { return maxCombo; }, recordText, set playSecs(v) { playSecs = v; }, place, placeRock, clearBoard, updateHud, switchDiff, openClear, set cleared(v) { cleared = v; } };
})();
