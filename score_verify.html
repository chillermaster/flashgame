<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점수 인증 확인</title>
<!--
  Milo 전용 점수 인증 확인 도구
  - 이 파일은 GitHub나 블로그에 올리지 말고 내 PC에만 두세요.
  - 새 게임을 추가할 때는 아래 GAMES 표에 한 줄만 추가하면 됩니다.
-->
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b1d22; --muted:#666d78; --line:#d9dde3;
  --ok:#1f7a4d; --okbg:#e5f4ec; --bad:#b4232f; --badbg:#fbe9eb; --warn:#8a5a00; --warnbg:#fdf3dc;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#1f2228; --ink:#eceef1; --muted:#9aa1ab; --line:#343841;
    --ok:#6fd3a0; --okbg:#173326; --bad:#ff8a93; --badbg:#3a1c20; --warn:#f2c46b; --warnbg:#3a2e14;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;}
main{max-width:760px;margin:0 auto;padding:28px 18px 48px;}
h1{font-size:1.5rem;font-weight:700;margin:0 0 4px;}
p.sub{margin:0 0 18px;color:var(--muted);}
textarea{width:100%;min-height:170px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;resize:vertical;}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.row{display:flex;gap:10px;margin:12px 0 22px;flex-wrap:wrap;}
button{font:inherit;font-weight:600;padding:9px 18px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
#summary{color:var(--muted);margin-bottom:10px;min-height:1.4em;}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.tag{display:inline-block;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px;margin-right:8px;}
.ok .tag{background:var(--okbg);color:var(--ok);}
.bad .tag{background:var(--badbg);color:var(--bad);}
.warn .tag{background:var(--warnbg);color:var(--warn);}
.who{font-weight:700;}
.why{color:var(--muted);font-size:.92rem;margin-top:4px;}
.raw{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;color:var(--muted);margin-top:6px;word-break:break-all;}
</style>
</head>
<body>
<main>
  <h1>점수 인증 확인</h1>
  <p class="sub">댓글을 여러 개 한꺼번에 붙여넣어도 돼요. 점수 줄을 모두 찾아 하나씩 확인해요.</p>
  <textarea id="input" placeholder="[별사냥꾼] 흔들흔들 균형왕 12,340점 · 2026-10-20 14:32 · 3분 12초 #ABCD-EFGH"></textarea>
  <div class="row">
    <button id="check" type="button">확인하기</button>
    <button id="clear" type="button" class="ghost">지우기</button>
  </div>
  <div id="summary" role="status" aria-live="polite"></div>
  <ul id="list"></ul>
</main>
<script>
(function () {
  'use strict';

  // ===== 게임 목록: 새 게임은 여기에 한 줄 추가 =====
  const GAMES = {
    '흔들흔들 균형왕': { id: 'balance', key: 'B5yrgLfNR8uIStyLMrGO24HAt5PTKXqO', maxPerSec: 190 }
  };
  // ================================================

  // ---------- 점수 인증코드 (HMAC-SHA256, 순수 JS) ----------
  const SC_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function scSha256(bytes){
    const m=Array.from(bytes), l=m.length*8; m.push(0x80);
    while(m.length%64!==56) m.push(0);
    for(let i=7;i>=0;i--) m.push(i>=4?0:(l>>>(i*8))&255);
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const w=new Array(64), r=(x,n)=>(x>>>n)|(x<<(32-n));
    for(let o=0;o<m.length;o+=64){
      for(let i=0;i<16;i++) w[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];
      for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];
        w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0;}
      let [a,b,c,d,e,f,g,h]=H;
      for(let i=0;i<64;i++){
        const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+SC_K[i]+w[i])|0;
        const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
      H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
    }
    const out=[]; H.forEach(x=>out.push((x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255)); return out;
  }
  function scHmac(key,msg){
    const enc=new TextEncoder(); let k=Array.from(enc.encode(key));
    if(k.length>64) k=scSha256(k); while(k.length<64) k.push(0);
    const inner=scSha256(k.map(x=>x^0x36).concat(Array.from(enc.encode(msg))));
    return scSha256(k.map(x=>x^0x5c).concat(inner));
  }
  const SC_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function scCode(key,msg){ return scHmac(key,msg).slice(0,8).map(b=>SC_ABC[b%32]).join(''); }


  const RE = /\[([^\[\]\n|#]{1,10})\] (.+?) ([\d,]+)점 · (\d{4}-\d{2}-\d{2} \d{2}:\d{2}) · (\d+)분 (\d+)초 #([A-Z2-9]{4})-([A-Z2-9]{4})/g;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  function check() {
    const text = $('input').value;
    const found = [...text.matchAll(RE)];
    const list = $('list');
    list.innerHTML = '';
    if (!text.trim()) { $('summary').textContent = '확인할 댓글을 붙여넣어 주세요.'; return; }
    if (!found.length) { $('summary').textContent = '점수 줄을 찾지 못했어요. 복사된 줄이 잘리거나 바뀌지 않았는지 확인해 주세요.'; return; }

    const seen = {};
    let ok = 0, bad = 0, warn = 0;
    found.forEach(m => {
      const [raw, name, title, scoreTxt, stamp, mm, ss, c1, c2] = m;
      const code = c1 + c2, score = parseInt(scoreTxt.replace(/,/g, ''), 10);
      const sec = parseInt(mm, 10) * 60 + parseInt(ss, 10);
      const g = GAMES[title];
      let cls, tag, why;
      if (!g) {
        cls = 'warn'; tag = '모르는 게임'; why = `"${title}"은 목록에 없어요. GAMES 표에 추가했는지 확인해 주세요.`;
      } else if (scCode(g.key, [g.id, name, score, stamp, sec].join('|')) !== code) {
        cls = 'bad'; tag = '가짜'; why = '이름, 점수, 날짜, 시간 중 무언가가 바뀌었어요.';
      } else if (score / Math.max(sec, 1) > g.maxPerSec) {
        cls = 'warn'; tag = '의심'; why = `서명은 맞지만 초당 ${Math.round(score / Math.max(sec, 1))}점으로, 게임에서 나올 수 있는 최대치(${g.maxPerSec}점)를 넘어요.`;
      } else if (seen[code]) {
        cls = 'warn'; tag = '중복'; why = '같은 인증코드가 이미 위에 있어요. 다른 사람 기록을 복사했을 수 있어요.';
      } else {
        cls = 'ok'; tag = '진짜'; why = '서명이 일치해요. 댓글 작성자 이름이 괄호 속 닉네임과 같은지만 확인하세요.';
      }
      seen[code] = true;
      if (cls === 'ok') ok++; else if (cls === 'bad') bad++; else warn++;
      const li = document.createElement('li');
      li.className = cls;
      li.innerHTML = `<span class="tag">${tag}</span><span class="who">${esc(name)}</span> · ${esc(title)} · ${score.toLocaleString('en-US')}점 · ${mm}분 ${ss}초` +
        `<div class="why">${esc(why)}</div><div class="raw">${esc(raw)}</div>`;
      list.appendChild(li);
    });
    $('summary').textContent = `${found.length}개 확인 · 진짜 ${ok} · 가짜 ${bad} · 확인 필요 ${warn}`;
  }

  $('check').addEventListener('click', check);
  $('clear').addEventListener('click', () => { $('input').value = ''; $('list').innerHTML = ''; $('summary').textContent = ''; $('input').focus(); });
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) check(); });
})();
</script>
</body>
</html>
